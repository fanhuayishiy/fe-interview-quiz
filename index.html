t 才能实现"],"a":0,"w":"自动补全的关键是两件事：防抖减少请求量（停止输入 300ms 后再发），取消旧请求解决竞态（AbortController），再配合结果缓存和键盘上下选择。","b":[{"type":"p","text":"前端实现实时自动补全，关键在于平衡响应速度和请求压力。用户每输入一个字符都发请求，不做控制的话，网络开销和后端负载会直接爆炸。"},{"type":"p","text":"1）输入防抖是基本操作。不要用户一敲键盘就发请求，等他停下来 300ms 再触发查询。这个时间足够短，用户感知不到延迟，又能过滤掉大量无效中间状态。"},{"type":"code","text":"let timer;\ninput.addEventListener('input', e => {\n  clearTimeout(timer);\n  timer = setTimeout(() => fetchSuggestions(e.target.value), 300);\n});"},{"type":"p","text":"2）建议维护一个本地缓存映射表。比如用户搜过“react”，再输入“re”时，优先展示历史结果，同时发起新请求更新数据。像 GitHub 搜索、百度框都是这么干的。"},{"type":"p","text":"3）接口设计要支持前缀匹配。后端一般用 Trie 树或倒排索引加速查找，也可以用 Elasticsearch 这类搜索引擎处理模糊匹配。返回结果限制在 10 条以内，避免列表太长影响体验。"},{"type":"p","text":"4）高亮关键词别忽略。前端拿到结果后，把匹配的部分用 <mark> 或 span 包一下，视觉反馈更清晰。"},{"type":"p","text":"如果搜索词频繁变化但数据量小，可以考虑把候选集整个拉到前端，用 Fuse.js 做模糊搜索，完全避开网络请求。"}],"r":["","每个字符都发请求会打爆接口，而且旧请求可能后返回覆盖新结果。","轮询拿不到输入时机，延迟也高。","普通 HTTP 请求加防抖就够，WebSocket 不是必须的。"]},{"id":120,"t":"如何在前端实现国际化，并根据用户设置自动切换语言？","c":"场景设计","o":["多语言包按语言切换，配合懒加载","用 CSS 的 content 属性切换文案","把文案硬编码在组件里，按国家复制多套页面","国际化只能由后端完成，前端无法实现"],"a":0,"w":"用 vue-i18n 或 i18next 维护多语言包，按浏览器语言或用户设置切换，语言包按需懒加载以控制首屏体积；日期和货币再用 Intl 做本地化格式。","b":[{"type":"p","text":"实现前端国际化，关键在于语言包管理、运行时切换和用户偏好识别。主流方案是用 i18next 或 Vue I18n 这类库，它们帮你把文本从代码里抽出来，按语言存成不同的资源文件。"},{"type":"p","text":"比如你有 en.json 和 zh-CN.json ，里面都是键值对，页面上不写死文字，而是用 t('login.title') 去取对应语言的值。加载时根据当前语言环境返回不同内容。"},{"type":"p","text":"自动切换语言，第一步是识别用户偏好。优先读浏览器的 navigator.language ，比如是 zh-CN 就默认切到中文。但这不是最终决定因素，因为用户可能想手动改。"},{"type":"p","text":"第二步是持久化选择。用户一旦手动切换语言，就把这个选择存到 localStorage 里。下次进来先看 localStorage 有没有记录，有就用它，没有再 fallback 到浏览器语言。"},{"type":"p","text":"第三步是动态加载。别一次性把所有语言包全载进来，用 Webpack 的 import() 按需异步加载对应语言资源，减少首屏体积。"},{"type":"p","text":"实际项目里，React 项目常配 i18next + react-i18next，Vue 用 vue-i18n。这些库都支持复数、变量插值、嵌套翻译这些复杂场景。"},{"type":"p","text":"最关键是切换语言时要触发视图刷新。i18next 内部会 emit 事件，绑定到 UI 层就能重新渲染。整个过程不要硬刷新页面。"}],"r":["","CSS 的 content 只能插入固定文本，做不了动态切换和变量插值。","硬编码多套页面维护成本极高，改一处文案要改 N 遍。","国际化完全可以在前端做，后端只负责提供数据。"]},{"id":121,"t":"如何在前端防止表单重复提交，并确保用户只能提交一次？","c":"场景设计","o":["把 button 改成 a 标签即可避免重复提交","提交后禁用按钮，配合幂等 token 与后端校验","用 localStorage 记录提交次数，超过一次就报错","只在前端做表单校验就可以避免重复提交"],"a":1,"w":"防重复提交要前后端配合：前端提交后立刻禁用按钮、加 loading，并对请求做防抖；同时带上幂等 token，后端用唯一约束兜底，才能挡住网络重试和多端操作。","b":[{"type":"p","text":"用户重复提交表单，本质是网络延迟或页面无反馈导致的“以为没发出去”。解决这事得前后端配合，前端拦住大部分误操作，后端兜底保证数据不乱。"},{"type":"p","text":"1）点击提交后立刻禁用按钮，这是最直接的。JS 把按钮设为 disabled，避免连续点击。"},{"type":"code","text":"button.disabled = true;\n// 提交逻辑完成后才恢复"},{"type":"p","text":"2）还可以加一层防抖，比如 2 秒内不允许二次提交。但注意，这只能防手快，挡不住刷新重发或绕过前端的行为。"},{"type":"p","text":"3）更彻底的做法是使用 Token 机制。页面加载时后端下发一个唯一 token（比如 UUID），提交时带上，后端校验通过就标记为已使用（可以用 Redis 存一次，TTL 控制有效期）。前端不能生成这种 token，否则没意义。"},{"type":"p","text":"4）Redirect after Post 模式也管用。提交成功后用 302 跳转到结果页，防止用户刷新当前页重复提交。Spring MVC的 redirect:/success 就是干这个的。"},{"type":"p","text":"说到底，Token 机制和后端幂等设计才是根本解。前端禁用按钮只是提升体验，真正要确保“只提交一次”，后端必须做到同请求不重复处理。像支付宝支付、订单创建这些场景，都是靠分布式锁 + 唯一业务号来实现幂等。"}],"r":["a 标签同样能被连点，反而丢了 button 的禁用能力。","","localStorage 挡不住并发请求，还会误伤正常的多表单提交。","前端校验只保证数据合法，不能阻止用户连点或请求重放。"]},{"id":122,"t":"前端如何判断一个点是否在 Canvas 的图形内？","c":"浏览器","o":["用 getBoundingClientRect 判断","ctx.isPointInPath，或对多边形用射线法","Canvas 无法判断点是否在图形内","只能通过读取该点像素颜色来判断"],"a":1,"w":"Canvas 提供了 ctx.isPointInPath(x, y)，判断坐标是否落在当前路径内；复杂场景也可以自己维护图形数据，用射线法（多边形）或距离公式（圆）计算。","b":[{"type":"p","text":"Canvas 本身不维护图形对象，所有绘制操作都是“画完就丢”，所以判断点是否在图形内不能靠遍历元素，得靠路径重建和检测。"},{"type":"p","text":"1）关键在于 isPointInPath 方法。你得先用 beginPath 重新构建一次目标图形的路径，然后调用"},{"type":"p","text":"ctx.isPointInPath(x, y) ，它会基于当前路径做非零环绕数规则（non-zero winding rule）判断。"},{"type":"p","text":"2）如果是填充区域，还可以用 isPointInStroke 判断点是否在描边线上。这两个方法都依赖当前上下文路径，所以必须重绘路径，但不用真的绘制到屏幕，只是路径重建。"},{"type":"p","text":"3）实际项目里，比如 Fabric.js 这类 Canvas 库，会在每个对象上缓存其几何路径或边界框，鼠标交互时按 Z 轴顺序逆序遍历，重建路径并调用 isPointInPath 做精确命中检测。"},{"type":"p","text":"4）性能敏感场景可以先用 getBoundingClientRect 做粗略的矩形碰撞检测，过滤掉明显不在范围内的点，再对候选图形做精确路径检测，避免频繁路径重建开销。"},{"type":"p","text":"代码示例："},{"type":"code","text":"const canvas = document.getElementById('canvas');\nconst ctx = canvas.getContext('2d');\nfunction isInside(x, y) {\n  ctx.beginPath();"},{"type":"p","text":"ctx.rect(50, 50, 100, 100); // 重建路径"},{"type":"code","text":"  return ctx.isPointInPath(x, y);\n}"},{"type":"p","text":"对于复杂图形，路径重建成本高，所以这类库一般还会结合 空间索引 或 离屏检测 优化。简单应用可以直接用现成库，没必要从零造轮子。"}],"r":["getBoundingClientRect 拿到的是 canvas 元素在页面上的位置，不是图形。","","Canvas 完全能判断，isPointInPath 就是为此设计的。","读像素只能处理纯色图形，遇到透明、描边、重叠就失效了。"]},{"id":123,"t":"如何对每个 JavaScript 函数的执行实现拦截？","c":"场景设计","o":["只能修改函数源码，没有别的办法","用 Proxy 包装目标函数，或重写原型方法","用 Object.freeze 冻结函数","用 try/catch 包裹所有调用点"],"a":1,"w":"拦截的本质是替换调用入口：用 Proxy 包装函数、重写原型方法、或用装饰器做 AOP。前端监控 SDK 常这样统一采集函数耗时和异常。","b":[{"type":"p","text":"JavaScript 里想拦截函数执行，核心思路是“替换”或“代理”。最常用也最灵活的方式是利用高阶函数做包装，或者用现代的 Proxy 。"},{"type":"p","text":"1） 包装函数是最直接的办法。你把原函数传进去，返回一个新函数，在新函数里加逻辑，比如打日志、测耗时、控制是否执行。"},{"type":"code","text":"function intercept(fn, before, after) {\n  return function(...args) {\n    before && before(args);\n    const result = fn.apply(this, args);\n    after && after(result);\n    return result;\n  };\n}"},{"type":"p","text":"像 Lodash 的 _.wrap 就是这么干的。"},{"type":"p","text":"2） 如果要拦截对象上的方法调用，Proxy 更合适。它能监听整个对象的操作，包括方法调用（apply 捕获器）。比如你想监控某个服务的所有方法调用："},{"type":"code","text":"const service = {\n  fetchUser(id) { return { id, name: 'Tom' }; }\n};\nconst proxied = new Proxy(service, {\n  get(target, prop) {\n    const fn = target[prop];\n    if (typeof fn === 'function') {\n      return (...args) => {\n        console.log(`Call start: ${prop}`);\n        const result = fn.apply(target, args);\n        console.log(`Call end: ${prop}`);\n        return result;\n      };\n    }\n    return fn;\n  }\n});"},{"type":"p","text":"注意，Proxy 不能直接代理普通函数，得包一层对象。但结合 Reflect，能做到无损拦截。"},{"type":"p","text":"3） 原型劫持也能实现，比如重写 Function.prototype 上的方法，但这是脏活累活，容易出问题，一般框架不用。"},{"type":"p","text":"总的来说，日常用高阶函数包装就够；要做监控、埋点这类系统级功能，上 Proxy 更优雅。"}],"r":["不改源码也能拦截，代理和重写原型都是常用手段。","","Object.freeze 只是禁止修改函数对象，拦不住调用。","try/catch 只能捕获异常，拿不到正常调用的耗时和参数。"]},{"id":124,"t":"如何实现前端页面第一次加载不触发请求，但后续每次进入页面都触发？","c":"场景设计","o":["第一次请求后立即销毁组件，下次重建","用 setInterval 延时触发，绕开首次加载","只能通过刷新页面来实现这个效果","用 sessionStorage 标记是否首次进入"],"a":3,"w":"核心是找一个“会话级”的标记位：sessionStorage 在标签页关闭后失效，正好符合“本次访问只算第一次”；也可以用路由 meta 或 keep-alive 的 activated 判断。","b":[{"type":"p","text":"页面首次加载不发请求，后续进入才触发，本质是区分“新用户首次访问”和“老用户回访”。关键在于用持久化状态标记访问状态。"},{"type":"p","text":"1）核心思路是利用客户端存储。第一次打开时，检查 localStorage 是否有标记，没有就写入标记且不发请求；之后每次打开，发现已有标记，就正常发请求并刷新数据。"},{"type":"p","text":"2）实现上注意时机。标记的读写要在页面生命周期早期完成，比如 Vue 的 beforeCreate 或 React 的"},{"type":"p","text":"useEffect 里同步操作，避免异步导致判断失效。"},{"type":"p","text":"3）代码逻辑简单："},{"type":"code","text":"const hasVisited = localStorage.getItem('visited');\nif (hasVisited) {"},{"type":"p","text":"fetchData(); // 后续进入才请求"},{"type":"code","text":"} else {\n  localStorage.setItem('visited', 'true');\n}"},{"type":"p","text":"4）边界情况要考虑。比如用户清除本地存储，相当于再次首访；或者多标签页并发打开，可能同时触发多次请求。后者可通过 sessionStorage 配合内存标记缓解。"},{"type":"p","text":"5）如果业务依赖更复杂的状态，比如用户登录后才开始计数，可以用 userId 拼接 key，避免跨账号污染。"},{"type":"p","text":"整个机制不依赖后端，轻量可控，适合做首页曝光统计、引导页控制等场景。Redis 这类中间件完全不用参与，压根不经过服务端。"}],"r":["销毁重建反而会触发更多请求，思路反了。","定时器绕不开“第一次”，只是把请求推迟。","刷新会让页面重新初始化，等于每次都算第一次。",""]},{"id":125,"t":"如何定位到前端页面发生错误的元素？","c":"浏览器","o":["只能靠用户截图反馈","浏览器会自动高亮报错的 DOM 元素","onerror 拿错误信息，配合 sourcemap 定位","用 document.querySelectorAll('*') 遍历查找"],"a":2,"w":"先用 window.onerror 或 error 事件拿到错误信息和堆栈，配合 sourcemap 还原到源码位置，再按堆栈或 DOM 断点定位到具体元素。","b":[{"type":"p","text":"前端页面发生错误时，定位问题元素其实有很清晰的排查路径。关键在于区分错误类型，然后用对应的工具和方法。"},{"type":"p","text":"先看浏览器控制台（Console），这是第一步。JavaScript 运行时错误比如引用未定义变量、语法错误都会直接抛出文件名和行号，点进去就能看到具体代码位置。如果报的是 Uncaught TypeError 或 Cannot read property of undefined ，基本就是 JS 逻辑访问了不存在的 DOM 元素或属性。"},{"type":"p","text":"接着看 Elements 面板。页面结构有没有异常？比如某个按钮没渲染出来，可能是 Vue/React 的条件渲染逻辑没走对，也可能是数据没拿到。你可以手动在 Elements 里搜索类名、id 或标签，确认元素是否存在。如果元素存在但样式错乱，用右边的 Styles 面板逐层查看 CSS 规则，是不是优先级被覆盖或者单位写错了。"},{"type":"p","text":"网络请求问题就去 Network 面板。比如头像不显示，看对应图片请求是否 404 或 500。接口数据没加载，检查 API 请求状态和返回内容。可以过滤 XHR 或 Fetch 请求，看哪个挂了。"},{"type":"p","text":"1）打开 DevTools，优先看 Console 和 Network"},{"type":"p","text":"2）Elements 里确认 DOM 结构是否符合预期"},{"type":"p","text":"3）Sources 打断点调试 JS 逻辑流"},{"type":"p","text":"动态生成的内容容易出问题，比如通过 JavaScript 插入的节点绑定事件失败。这时候可以用 debugger 语句或在事件监听器断点（Event Listener Breakpoints）里设断点。"}],"r":["截图只能看到表象，拿不到堆栈和行号。","浏览器不会自动高亮报错的 DOM，只会在控制台给堆栈。","","遍历所有元素既定位不到错误，性能也扛不住。"]},{"id":126,"t":"在网页中有大量图片时，如何优化图像加载以提高页面加载速度？","c":"性能优化","o":["只用一张超大的雪碧图承载所有图片","懒加载、srcset、WebP/AVIF、压缩与 CDN","把所有图片都转成 base64 内联到 HTML","一次性预加载全部图片，避免滚动时再请求"],"a":1,"w":"图片优化的组合拳：懒加载（进入视口才加载）、响应式图片（srcset/sizes 按 DPR 选图）、现代格式（WebP/AVIF 体积更小）、压缩和 CDN 加速。","b":[{"type":"p","text":"图片多的页面，加载性能很容易崩，关键得从资源体积、加载时机和渲染体验三方面下手。"},{"type":"p","text":"1）优先处理大头——图片本身"},{"type":"p","text":"能用 WebP 就别用 JPG/PNG，同质量下体积小 30% 以上。真要兼容老浏览器，可以用 <picture> 做降级："},{"type":"code","text":"<picture>\n  <source srcset=\"img.webp\" type=\"image/webp\">\n  <img src=\"img.jpg\" alt=\"fallback\">\n<\/picture>"},{"type":"p","text":"另外，SVGO 压缩 SVG，ImageOptim 处理位图，都是脏活累活但值得干。"},{"type":"p","text":"2）懒加载是标配"},{"type":"p","text":"loading=\"lazy\" 一行代码的事，对 below-the-fold 图片立马见效："},{"type":"code","text":"<img src=\"content.jpg\" loading=\"lazy\" alt=\"...\">"},{"type":"p","text":"滚动到附近才发起请求，首屏时间直接降下来。自己实现的话 Intersection Observer API 更精准。"},{"type":"p","text":"3）响应式图片用 srcset + sizes"},{"type":"p","text":"让浏览器根据设备宽度选图，避免手机加载 2K 大图："},{"type":"code","text":"<img srcset=\"small.jpg 480w, medium.jpg 800w, large.jpg 1200w\"\n     sizes=\"(max-width: 600px) 480px, 800px\"\n     src=\"medium.jpg\" alt=\"...\">"},{"type":"p","text":"4）CDN 加持不可少"},{"type":"p","text":"用 Cloudflare 或阿里云 CDN 开启自动格式适配和压缩，用户靠近哪个节点就从哪拉优化后的资源，热图冷图分层存储。"},{"type":"p","text":"5）占位符提升感知速度"},{"type":"p","text":"给图片加个骨架屏或模糊底图，白屏时间短了，用户就觉得“好像已经出来了”。"}],"r":["雪碧图解决的是小图标请求数，不适用于大量内容图。","","base64 会让 HTML 体积暴涨，还无法单独缓存。","一次性预加载会抢带宽，首屏反而更慢。"]},{"id":127,"t":"如何使用节流或防抖技术优化频繁触发请求的搜索输入框？","c":"场景设计","o":["两者完全一样，可以随意替换","防抖是停止输入后请求，节流是固定间隔","用节流就可以完全避免请求竞态","防抖是固定间隔触发，节流是停止输入后触发"],"a":1,"w":"防抖关注“最后一次”：停止输入后才发请求；节流关注“均匀频率”：固定间隔最多触发一次。搜索框用防抖，滚动加载用节流。竞态还要靠取消旧请求解决。","b":[{"type":"p","text":"搜索框频繁请求的优化，关键在于控制函数执行频率。节流和防抖就是干这个的，但它们策略不一样。"},{"type":"p","text":"防抖的意思是，你连续触发时只在最后一次操作后执行一次。比如用户打字没停，就不发请求，等他停下来超过300ms 才发。适合搜索建议这种场景。"},{"type":"code","text":"function debounce(fn, delay) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn.apply(this, args), delay);\n  };\n}\ninput.addEventListener('input', debounce(fetchSuggestion, 300));"},{"type":"p","text":"节流则是不管你怎么连续操作，固定时间段内最多执行一次。比如滚动加载，每 500ms 最多查一次。用在窗口 resize或高频点击还行，但搜索框一般不用它。"},{"type":"code","text":"function throttle(fn, delay) {\n  let flag = true;\n  return (...args) => {\n    if (!flag) return;\n    flag = false;\n    fn.apply(this, args);\n    setTimeout(() => flag = true, delay);\n  };\n}"},{"type":"p","text":"搜索框最常用的是 防抖，延迟时间设 200~500ms 比较合理。太短压不住，太长用户觉得卡。如果后端支持，还可以加个最小字符数过滤，比如输入满 2 个字符才触发。"},{"type":"p","text":"别忘了取消上一次未完成的请求，避免响应乱序。用 AbortController 就能搞定，不然用户输得快，后面的建议可能比前面的先回来。"},{"type":"code","text":"let controller;\nfunction fetchSuggestion(query) {\n  if (controller) controller.abort();\n  controller = new AbortController();\n  fetch(`/api/suggest?q=${query}`, { signal: controller.signal })\n    .then(res => res.json())\n    .then(data => updateList(data));\n}"}],"r":["两者触发时机完全不同，不能替换。","","节流只是降低频率，旧请求仍可能后返回覆盖新结果。","说反了：防抖是停止输入后触发，节流是固定间隔触发。"]},{"id":128,"t":"如何调试和解决跨浏览器兼容性问题？","c":"浏览器","o":["查 Can I use、polyfill、Babel 转译","用 iframe 包一层就能解决所有兼容问题","兼容性问题只能靠用户自己升级浏览器","只支持 Chrome 即可，其他浏览器不用管"],"a":0,"w":"跨浏览器兼容的标准流程：先确定目标浏览器矩阵，用 Can I use 查特性支持，用 Babel 转译语法、core-js 补 API、autoprefixer 补前缀，再做多浏览器测试。","b":[{"type":"p","text":"不同浏览器对 CSS、JavaScript 的实现有差异，尤其是老版本 IE 和现代浏览器之间。解决这类问题不是靠猜，得靠系统性排查和工具辅助。"},{"type":"p","text":"1）先锁定问题范围。是布局错乱、脚本报错还是 API 不支持？比如 flex 在 IE 10 以下压根不经过，就得降级用"},{"type":"p","text":"inline-block 或 float 。JavaScript 里像 Array.from() 、fetch() 这些新 API，在旧环境直接搞不定，得上 polyfill，比如用 core-js 补齐能力。"},{"type":"p","text":"2）用目标浏览器真实测试。光看 Chrome 调试没用，得在 Safari、Firefox、甚至 IE 兼容模式里跑。可以借助BrowserStack 或 Sauce Labs 这类云测平台，覆盖几十种环境，省得自己搭虚拟机。"},{"type":"p","text":"3）CSS 方面优先查 Can I Use 看兼容性数据，配合 Autoprefixer 自动加 -webkit- 、-moz- 前缀。别手写，效率低还容易漏。"},{"type":"p","text":"4）JS 层可以用 babel 把 ES6+ 语法转成 ES5，确保旧引擎能执行。但注意 babel 不处理实例方法，比如"},{"type":"p","text":"arr.includes() ，这种还得单独引入 polyfill。"},{"type":"p","text":"最后留个兜底方案：关键功能做渐进增强，基础体验保底，高级特性可降级。别指望一行代码全端一致，关键是让老环境至少能用。"}],"r":["","iframe 解决不了 API 缺失和 CSS 差异。","要求用户升级浏览器不现实，兼容是开发者要解决的问题。","只支持 Chrome 会丢掉大量用户，也不是兼容方案。"]},{"id":129,"t":"前端如何处理超过 JS 的 Number 最大值的数字？","c":"场景设计","o":["用 BigInt 或字符串，接口也传字符串","用 Number.MAX_VALUE 截断处理","用 parseFloat 转换一下即可","前端无法处理这种数字"],"a":0,"w":"超过 2^53-1 的整数在 Number 里会丢精度，所以要用 BigInt 或字符串处理；后端返回 Long 型 ID 时，通常直接序列化成字符串。","b":[{"type":"p","text":"JavaScript 的 Number 类型基于 IEEE 754 双精度浮点数，安全整数范围是 -2^53 + 1 到 2^53 - 1，也就是 -(9007199254740991) 到 9007199254740991 。超出这个范围，精度会丢失，比如 9007199254740992 和"},{"type":"p","text":"9007199254740993 在 JS 看来可能是一样的。"},{"type":"p","text":"要处理更大的整数，得用 BigInt。它能表示任意大的整数，声明方式是在整数字面量后面加个 n ，比如 123n ，或者用 BigInt() 构造函数。"},{"type":"code","text":"const bigNum = 9007199254740991n;"},{"type":"p","text":"const biggerNum = bigNum + 1n; // 正确运算，不会丢精度"},{"type":"p","text":"注意 BigInt 和普通 Number 不兼容，不能混用。比如 10n + 1 会报错，必须都转成同一类型。做类型判断时，"},{"type":"p","text":"typeof 10n 返回 'bigint' 。"},{"type":"p","text":"实际场景中，像雪花 ID（Snowflake ID）这种 64 位长整型，后端传过来通常是字符串，前端如果直接赋给 number类型，就会变成 9007199254740990 这种被“纠正”过的值，ID 就错了。正确做法是后端传字符串，前端用"},{"type":"p","text":"BigInt(idStr) 处理，或者直接保持为字符串操作。"},{"type":"p","text":"和后端交互时，JSON 不支持 BigInt 原生格式，所以通常还是通过字符串传递，避免解析出错。主流框架如 React、Vue 对 BigInt 没有特殊限制，但状态管理或表单校验库需要注意类型兼容性。"}],"r":["","MAX_VALUE 是浮点上限，用它截断只会得到错误的值。","parseFloat 返回的仍是 Number，精度问题一点没解决。","BigInt 和字符串都能处理，前端完全可以应对。"]},{"id":130,"t":"如何设计一个前端页面，实现 PC 端访问展示 Web 应用，移动端访问展示 H5 应用？","c":"场景设计","o":["前端无法判断设备类型","只能做两套完全独立的域名","用 iframe 根据宽度切换","服务端按 UA 分流，或用响应式布局"],"a":3,"w":"优先用响应式布局一套代码适配；确实要做两套页面时，服务端按 UA 返回不同 HTML 可以避免多一次跳转和白屏，前端也可以判断 UA 后跳转。","b":[{"type":"p","text":"页面访问时的终端类型判断和内容分发，关键在于服务端或前端的 UA 识别与资源路由控制。整个流程其实很简单，核心就是“识别设备 → 匹配模板 → 返回对应页面”。"},{"type":"p","text":"1）最常见做法是在 Nginx 或网关层做 UA 判断，根据请求头里的 User-Agent 决定反向代理到哪个应用。比如 PC 的UA 访问 web.example.com ，移动端则跳转到 m.example.com 或返回 H5 静态资源目录。"},{"type":"code","text":"if ($http_user_agent ~* \"(Mobile|Android|iPhone)\") {\n    rewrite ^/$ /h5/index.html break;\n}"},{"type":"p","text":"2）另一种方案是服务端渲染（SSR）时动态返回不同 HTML 模板。像 Spring Boot 项目可以在 Controller 中通过"},{"type":"p","text":"HttpServletRequest 获取 UA，然后决定返回 Web 页面还是重定向到 H5 入口。"},{"type":"p","text":"3）纯前端也可以实现，但体验稍差。首屏加载一个轻量 JS 脚本判断 navigator.userAgent ，再跳转。这种方式会有白屏时间，不推荐对性能敏感的场景。"},{"type":"p","text":"这种架构在早期中后台系统很常见，比如用 Vue/React 做 PC 管理后台，同时用 Vant 开发 H5 客户端。现在更多团队倾向于用响应式设计统一一套 UI，但如果功能差异大、交互模式完全不同，比如后台管理 vs 用户下单页，那分开维护反而更灵活。"}],"r":["UA、屏幕宽度都能判断设备类型，说无法判断是错的。","两套域名不是必须的，同域名也能分流。","iframe 会带来滚动、通信、SEO 一堆新问题。",""]},{"id":131,"t":"如何在前端实现网页截图功能？可以将某部分或整个页面的内容保存为图片","c":"浏览器","o":["用 canvas 的 drawImage 直接截取整个页面","html2canvas 把 DOM 绘制到 canvas 再导出","浏览器提供了原生 API 可以截取任意区域","必须安装浏览器插件才能实现"],"a":1,"w":"前端截图靠 html2canvas 或 dom-to-image 把 DOM 的计算样式重绘到 canvas，再 toDataURL 导出；也可以把 DOM 塞进 SVG 的 foreignObject 再绘制。跨域图片、iframe、特殊字体会失真。","b":[{"type":"p","text":"前端实现网页截图，本质是把 DOM 元素转成图像数据。现在主流方案基本都靠 html2canvas 或 Canvas 2D +Range API，更现代的可以用 Chrome 的 CaptureController（还在实验阶段）。"},{"type":"p","text":"1）最常用的是 html2canvas，它遍历目标 DOM 节点，用 Canvas 一步步重绘样式、文本、图片等。比如你想截取"},{"type":"p","text":".content-area 这个 div："},{"type":"code","text":"import html2canvas from 'html2canvas';\nhtml2canvas(document.querySelector('.content-area')).then(canvas => {"},{"type":"p","text":"document.body.appendChild(canvas); // canvas 就是截图结果const imgData = canvas.toDataURL('image/png'); // 可导出 base64 图片"},{"type":"code","text":"});"},{"type":"p","text":"注意：svg、跨域图片、字体加载容易出问题，得提前处理 CORS 和字体内联。"},{"type":"p","text":"2）如果只支持现代浏览器，可以用 dom-to-image 库，底层基于 SVG foreignObject，对 flex 布局兼容更好，但复杂样式也可能失真。"},{"type":"p","text":"3）真正想做到高保真，尤其是视频、WebGL 这类内容，得靠 Headless Chrome 配合 Puppeteer 在服务端截图。比如用 Node.js 起个无头浏览器实例："},{"type":"code","text":"const browser = await puppeteer.launch();\nconst page = await browser.newPage();\nawait page.goto('http://example.com', { waitUntil: 'networkidle0' });\nawait page.screenshot({ path: 'page.png', fullPage: true });"},{"type":"p","text":"这种方式能 100% 还原页面渲染结果，适合生成海报、PDF 导出这类要求高的场景。"},{"type":"p","text":"整个流程其实就三步：渲染完成 → 捕获像素 → 编码输出。选择哪种方式，关键看你对清晰度、兼容性和性能的要求。小范围局部截图用 html2canvas 就够了，要整页高质量输出，还是得走服务端。"}],"r":["drawImage 只能绘制图片或 canvas，没法把整个页面 DOM 画进去。","","浏览器没有提供“截取任意区域”的原生 API（除非走录屏授权）。","纯前端库就能实现，不需要插件。"]},{"id":132,"t":"如何实现网站一键切换主题的功能？","c":"场景设计","o":["CSS 变量 + data-theme 切换并持久化","准备多套 CSS 文件，切换时整页刷新一次加载","用 JS 遍历页面元素，逐个修改它们的颜色样式","主题切换必须由后端渲染，前端只能切换图片"],"a":0,"w":"用 CSS 变量定义颜色、圆角等主题令牌，切换根节点的 data-theme 或 class 即可整体换肤，配合 localStorage 持久化，还能跟随 prefers-color-scheme。","b":[{"type":"p","text":"主题切换本质是动态改变页面的视觉样式，关键在于样式的组织和运行时替换。前端实现上，一般用 CSS 变量配合JavaScript 控制。"},{"type":"p","text":"把所有和主题相关的颜色、字体等抽成 CSS 自定义属性，写在 :root 或独立的 class 里。比如："},{"type":"code","text":":root {\n  --primary-color: #007bff;\n  --bg-color: #ffffff;\n}\n.dark-theme {\n  --primary-color: #0056b3;\n  --bg-color: #1a1a1a;\n}"},{"type":"p","text":"页面加载时，通过 JS 读取用户偏好（localStorage 或系统设置），给 <html> 或 <body> 添加对应的 theme class。切换时只改 class，CSS 变量自动生效。"},{"type":"code","text":"// 切换到深色\ndocument.documentElement.className = 'dark-theme';\n// 记住选择\nlocalStorage.setItem('theme', 'dark');"},{"type":"p","text":"组件库像 Ant Design、Element Plus 都内置了这类机制。服务端渲染场景可以用 Next.js 的 next-themes ，它会在首屏直出正确 class，避免闪屏。"},{"type":"p","text":"实际项目中，主题包可以按需加载，减少初始体积。比如用 webpack 的 import() 动态引入不同 theme.css。"},{"type":"p","text":"整个过程压根不经过后端，纯前端运行时决策。核心就是 CSS 变量 + class 切换 + 状态持久化，三者缺一不可。"}],"r":["","整页刷新会丢失页面状态，体验很差。","逐个改元素既慢又容易漏，还会触发大量重排。","主题切换完全可以在前端完成。"]},{"id":133,"t":"前端如何给网页增加水印？并且如何防止水印被移除？","c":"浏览器","o":["水印只能用图片编辑软件提前添加到素材里","canvas 生成平铺背景，MutationObserver 防删除","用 CSS 的 color 属性把文字直接写在页面上，简单可靠","水印加上后就无法被移除，不需要额外做防护"],"a":1,"w":"用 canvas 生成带文字的水印图片作为平铺背景，或用 DOM 覆盖层；再用 MutationObserver 监听节点被删除或样式被改，及时恢复。前端水印只能提高删除成本，核心数据仍要靠后端权限。","b":[{"type":"p","text":"网页水印本质是在页面上叠加一层难以忽略的视觉标记，通常用透明度较低的文字或图案覆盖在内容之上。前端实现简单，但防删除是难点。"},{"type":"p","text":"1）常见做法是动态生成一个 div 层，用绝对定位铺满整个视口，z-index 拉高，里面通过 JavaScript 循环插入水印文本。字体、颜色、旋转角度都可以随机化，让截图留痕。"},{"type":"p","text":"2）为了防止被轻易删掉，得搞点反制手段。比如监听 DOM 变化，一旦发现水印节点被移除或样式被改，立马重新插入。可以用 MutationObserver 监听 body 的子元素变动。"},{"type":"p","text":"3）更狠一点的做法是定时检测，每隔 200ms 检查一次水印是否存在，没了就补上。还可以把这段逻辑打包成 IIFE（立即执行函数），混淆压缩后注入页面，增加阅读难度。"},{"type":"p","text":"4）进阶方案是结合 Canvas 绘制水印，把文字画在 canvas 上，再把这个 canvas 设为背景图。这样开发者工具里看不到具体文本节点，截图依然带水印，但直接删元素无效。"},{"type":"p","text":"不过说到底，前端水印更多是“声明归属”和“溯源追责”，真想完全防删不可能。用户禁用 JS 就直接失效，或者用浏览器插件也能绕。所以这类功能一般配合后端日志审计一起用，比如记录操作人、时间、IP，出问题时能对上号。"},{"type":"p","text":"核心在于持续存在感和低可操作性，让用户觉得删起来太麻烦，不如不用截图。"}],"r":["水印是运行时生成的，不需要提前做进素材。","","直接写文字很容易被删掉或改样式，也挡不住复制。","前端水印总能被绕过，说“无法移除”不成立。"]},{"id":134,"t":"如何对前端应用中静态资源加载失败的场景进行降级处理？","c":"浏览器","o":["用 try/catch 包裹 script 标签即可捕获","onerror 切备用 CDN，SW 兜底","静态资源不会加载失败，无需额外处理","资源加载失败时只能刷新页面重新请求"],"a":1,"w":"静态资源降级：script/link 上加 onerror 切到备用 CDN 或本地资源；也可以用 Service Worker 缓存兜底。注意 script 的加载错误不会冒泡到 try/catch。","b":[{"type":"p","text":"静态资源加载失败，比如 JS、CSS 或图片无法获取，常见于 CDN 故障、网络抖动或资源被误删。关键思路是提前预判、及时拦截、有备选方案。"},{"type":"p","text":"1）对于 JS 文件，可以用 script 标签的 onerror 回调做降级。一旦主资源加载失败，立刻切换到备用 CDN 或兜底逻辑。"},{"type":"code","text":"<script src=\"https://cdn-a.example.com/app.js\"\n        onerror=\"this.src='https://cdn-b.example.com/app.js';\n                 this.onerror=null;\">\n<\/script>"},{"type":"p","text":"2）CSS 也可以类似处理，但要注意样式丢失可能导致页面错乱。可以在内联 <style> 中写最低限度的排版样式，保证结构可读。"},{"type":"p","text":"3）图片加载失败直接绑定 onerror ："},{"type":"code","text":"<img src=\"avatar.png\" onerror=\"this.src='/default-avatar.png'\">"},{"type":"p","text":"4）更进一步的做法是用 Service Worker 拦截所有静态资源请求，发现失败后自动走缓存或备源，适合 PWA 应用。"},{"type":"p","text":"5）构建阶段可以结合 Webpack 或 Vite 插件，把核心 JS 打包成多份，发布时同步推送到不同域名源站，提升冗余度。"},{"type":"p","text":"整个过程要配合监控上报，一旦触发降级就记录日志，方便后续分析是局部问题还是大面积故障。"},{"type":"p","text":"注意别滥用降级。非核心资源比如埋点脚本，可以直接容错忽略；但主应用 JS 必须确保至少有一个可用路径能加载执行，否则页面直接白屏，用户完全搞不定。"}],"r":["script 的加载错误不会冒泡，try/catch 捕获不到。","","CDN 抖动、网络异常都会导致资源加载失败。","刷新只能碰运气，不能保证下次就能加载成功。"]},{"id":135,"t":"前端页面白屏的原因可能是什么，如何排查？","c":"浏览器","o":["看 Network 404、Console 报错、入口是否执行","白屏无法定位原因，只能让用户清缓存后重新进入","白屏一定是业务代码写错了，先回滚最近一次上线","白屏只可能是网络问题，检查服务器带宽是否被打满"],"a":0,"w":"白屏排查有固定顺序：先看 Network 是否有资源 404、再看 Console 有没有 JS 报错、然后确认入口 JS 是否执行、根节点是否挂载成功，最后看路由模式和接口。","b":[{"type":"p","text":"前端页面白屏，说白了就是浏览器啥都没渲染出来，或者关键资源卡住了。常见原因其实就几类，顺着请求和执行流程一步步推就行。"},{"type":"p","text":"1）资源加载失败最常见。比如 CDN 挂了，JS 或 CSS 文件 404 或者 500，这时候页面骨架都出不来。打开 Network面板一看就知道，红色的请求一目了然。特别是打包后的 app.js、vendor.js 这种大文件，一个挂了全页瘫。"},{"type":"p","text":"2）JavaScript 执行报错导致渲染中断。比如 React 或 Vue 刚启动就抛异常，没做错误边界处理，整个应用直接停摆。看 Console 就能发现报错堆栈，常见的有变量未定义、API 返回结构变了、第三方 SDK 兼容问题。"},{"type":"p","text":"3）首屏数据阻塞。页面依赖接口返回的数据才能渲染，但接口超时或返回空，比如用户信息拿不到，React 组件一直卡在 loading 状态。用 Network 查对应 API 请求，看是慢还是错了。"},{"type":"p","text":"4）服务端渲染（SSR）出问题。像 Next.js 或 Nuxt 项目，如果服务端吐出来的 HTML 是空的或者结构不对，客户端又没法接续，那就白屏到底。这时候要查服务端日志，看有没有模板编译错误或数据查询失败。"},{"type":"p","text":"5）缓存问题。用户浏览器拿着过期的 JS 文件，新旧版本不兼容，代码执行到一半崩掉。可以尝试无痕模式访问，或者清缓存重试。"},{"type":"p","text":"排查顺序建议： 先刷页面，开 DevTools 看 Network 和 Console； 再检查关键资源和接口状态码、耗时； 最后看是否有 JS 异常打断执行流。"}],"r":["","白屏原因很多，说无法定位不成立，控制台基本都能给出线索。","代码写错只是原因之一，资源失败同样会导致白屏。","网络只是其中一类原因，还有兼容、路由、构建配置等。"]},{"id":136,"t":"什么是单点登录，前端如何实现单点登录？","c":"场景设计","o":["每个系统各自登录一次，只是用同一个账号密码","用 localStorage 共享 token 就能实现跨域单点登录","共用认证中心颁发票据，各系统校验建会话","单点登录只能用 OAuth 实现"],"a":2,"w":"单点登录的核心是“共用认证中心”：用户在认证中心登录一次拿到票据（ticket/token），各子系统拿票据去校验，通过后建立本地会话。CAS、OAuth2、SAML 都是它的实现方式。","b":[{"type":"p","text":"单点登录（SSO）解决的是用户在多个应用系统间只需登录一次，就能访问所有相互信任的系统。关键在于身份信息的共享与传递。"},{"type":"p","text":"实现 SSO，核心是建立一个独立的认证中心。用户首次访问应用时，如果未登录，会被重定向到认证中心。认证中心完成登录后，会生成一个全局有效的 token，并通过回调把 token 带回原应用。这个 token 一般存到浏览器的 Cookie或 LocalStorage。"},{"type":"p","text":"这里有个前提：多个系统的主域名得相同，比如 a.example.com 和 b.example.com ，这样它们才能共享"},{"type":"p","text":"example.com 的 Cookie。如果域名完全不同，就得靠前端在每次跳转时手动带上 token，比如拼在 URL 参数里。"},{"type":"p","text":"典型流程像这样："},{"type":"p","text":"前端实现上，常用方案有基于 OAuth2 的隐式模式或 PKCE，或者直接对接企业级 SSO 服务，比如用 Keycloak、Auth0 或钉钉/企业微信的登录 SDK。这些工具帮你处理了跳转、token 获取和刷新的脏活累活。"},{"type":"p","text":"注意一点，token 的安全性必须保障，避免 XSS 泄露。一般来说用 HttpOnly Cookie 存更安全，但跨域场景下可能得妥协用 LocalStorage，这时候就得加强前端防护。"}],"r":["每个系统各登一次就是多套账号体系，不叫单点登录。","localStorage 受同源策略限制，跨域根本读不到。","","OAuth2 只是其中一种实现，CAS、SAML 同样可以做 SSO。"]},{"id":137,"t":"如何禁止别人调试前端页面代码？","c":"浏览器","o":["只能提高成本，无法真正阻止调试","可以用 JS 彻底禁止用户打开控制台","写几行 CSS 就能禁止调试","把 JS 加密后用户就无法查看"],"a":0,"w":"前端代码最终要在用户机器上执行，任何手段都只能提高调试成本：禁用右键和 F12、代码混淆、检测 devtools 打开。真正敏感的逻辑必须放到服务端。","b":[{"type":"p","text":"前端代码运行在用户浏览器里，本身就无法彻底禁止调试。所有前端逻辑和代码都是公开的，所谓的“防调试”只是增加逆向成本，拦一拦普通用户，对专业攻击者基本没用。"},{"type":"p","text":"常见的手段其实就几类："},{"type":"p","text":"1）混淆压缩代码，把变量名全改成 a、b、c，逻辑打散。像 Webpack 打包后默认带的 Terser 就能做这个。虽然不能阻止断点，但读起来费劲多了。"},{"type":"p","text":"2）反调试技巧，比如在控制台输出干扰信息："},{"type":"code","text":"setInterval(() => {\n  debugger;\n}, 1000);"},{"type":"p","text":"这段代码会让开发者工具卡住，每秒自动断一次。但用户关掉 DevTools 再开就能绕过。"},{"type":"p","text":"3）检测 window.devtools 是否打开，通过监听 resize 或网络请求延迟来判断。有些库比如 react-devtools-detector 就干这事，发现就弹警告或停止功能。"},{"type":"p","text":"4）关键逻辑下沉到后端，别在前端写核心算法或校验逻辑。比如鉴权交给服务端 JWT 校验，敏感计算用WebAssembly 跑，至少没法一眼看懂。"},{"type":"p","text":"真正有效的防护是：核心不暴露。前端只做交互壳子，重逻辑走 API。像字节的抖音、腾讯的微前端架构，大量策略都在 BFF 层控制，前端页面压根不经过敏感路径。"},{"type":"p","text":"说白了，防调试是场猫鼠游戏，投入产出比很低。真要搞，不如把时间花在加固后端和监控异常行为上。"}],"r":["","控制台可以通过菜单、快捷键、远程调试等多种方式打开，禁不干净。","CSS 管不了开发者工具。","加密后的代码仍要在浏览器里解密执行，抓得到明文。"]},{"id":138,"t":"你会如何设计前端日志埋点 SDK？","c":"场景设计","o":["把所有日志存进 localStorage 永不发送","上报队列、批量发送、失败重试、sendBeacon","每次点击都同步发一个请求","埋点只能由后端实现"],"a":1,"w":"埋点 SDK 的核心是“不拖慢业务、不丢数据”：用队列攒批、异步批量上报、失败重试、采样和脱敏，页面卸载时用 sendBeacon 兜底发送。","b":[{"type":"p","text":"设计前端日志埋点 SDK，关键是平衡灵活性、性能和稳定性。你得让业务方能快速接入，又不能因为埋点拖垮页面。"},{"type":"p","text":"SDK 核心要解决三件事：数据采集、生命周期管理、上报控制。数据采集分自动和手动，自动采集比如 PV、UV、页面停留时长，手动就是业务打点，像按钮点击。你可以用 DOM 事件代理捕获用户行为，结合路由变化监听记录页面流转。"},{"type":"p","text":"上报不能盲目发请求，否则网络队列会堆积。一般采用批量+节流策略，比如攒够 10 条或每 30 秒上报一次。遇到关键事件（如支付完成），支持立即上报。还要加失败重试，最多 3 次，避免临时网络问题丢数据。"},{"type":"p","text":"为了不影响主流程，所有脏活累活都放微任务里做，比如格式化日志、补全上下文（设备、IP、UA）。可以用"},{"type":"p","text":"Promise.resolve().then() 推入队列，不阻塞渲染。"},{"type":"p","text":"代码结构上，暴露一个 track(event, payload) 方法就够了。内部用单例模式维护配置和状态，支持初始化时传入 appKey、上报地址、采样率等。"},{"type":"code","text":"Track.init({ appKey: 'abc', url: '/log', sampleRate: 0.1 })\nTrack.track('click-button', { id: 'submit' })"},{"type":"p","text":"采样率设为 0.1 就是只收集 10% 的流量，大厂常用这招扛住高并发写入。"},{"type":"p","text":"最后留个调试模式，打开后能看到日志预览，方便 QA 验证埋点是否准确。"}],"r":["只存不发等于没有埋点，数据永远到不了服务端。","","同步请求会阻塞主线程，点击多时页面直接卡住。","埋点数据主要靠前端采集，后端拿不到交互细节。"]},{"id":139,"t":"如何解决前端 SPA 应用首屏加载速度慢的问题？","c":"性能优化","o":["关闭所有缓存以保证最新","增加更多动画提升体验","路由懒加载、SSR、CDN、骨架屏","把整个应用打包成一个文件以减少请求"],"a":2,"w":"SPA 首屏慢通常卡在“下载大包加等接口”：路由懒加载和代码分割减小首包，SSR/预渲染让首屏直接有内容，CDN 和骨架屏改善等待体验。","b":[{"type":"p","text":"首屏加载慢，关键得看资源从哪来、怎么来。现代前端打包后动辄几 MB 的 JS，浏览器下载解析就得两三秒，用户看到的白屏时间自然就长了。"},{"type":"p","text":"1）服务端渲染（SSR）是最直接的解法。把页面在服务器上先拼成 HTML 返回，用户请求进来直接能看到内容，不用等前端 JS 下载执行。像 Next.js、Nuxt.js 都是这类方案的代表，首屏性能能从 3s+ 压到 1s 内。"},{"type":"p","text":"2）静态站点生成（SSG）更适合内容不常变的场景。构建时就把页面生成好，扔 CDN 上，用户请求直接拿静态HTML，连服务端计算都省了。比如文档站、博客用 Gatsby 或 VitePress 就很合适。"},{"type":"p","text":"3）代码分割必须做。别让一个 bundle.js 包打天下，按路由拆分，用动态 import() 懒加载非首屏模块。webpack 默认支持，配置 splitChunks 就能把公共库和业务代码分开。"},{"type":"p","text":"4）资源优化不能少。JS 压缩用 Terser，图片转 WebP，字体用 subsetting。HTTP/2 下多文件请求成本低，可以适当多拆几个 chunk，但单个控制在 50-100KB 以内最理想。"},{"type":"p","text":"5）预加载提示也有效。<link rel=\"preload\"> 提前拉高优先级资源，<link rel=\"prefetch\"> 空闲时预载下一页资源，用户体验会更顺滑。"}],"r":["关缓存会让每次访问都重新下载，首屏更慢。","动画只能改善感知，不会让内容更早出现。","","打成一个文件会让首包更大，首屏更慢。"]},{"id":140,"t":"前端项目中，如何优化首屏渲染时间？","c":"性能优化","o":["把所有 CSS 都内联进 HTML","关键 CSS 内联、JS 延迟、图片懒加载","增加 DOM 层级让结构更清晰","首屏渲染由网络决定，前端无法优化"],"a":1,"w":"首屏优化的目标是缩短关键渲染路径：关键 CSS 内联、非关键 JS 延迟或异步、图片懒加载、对首屏关键资源做 preload/preconnect，必要时上 SSR 或预渲染。","b":[{"type":"p","text":"首屏渲染时间直接影响用户体验，优化得当能让页面秒开。关键在于减少资源加载量和执行耗时。"},{"type":"p","text":"1）资源层面优先做代码分割。把打包后的 JS 拆成小块，路由懒加载配合 React.lazy + Suspense ，只加载当前视图需要的代码。Webpack 的 splitChunks 也能自动提取公共模块，避免重复下载。"},{"type":"p","text":"2）服务端渲染（SSR）或同构渲染是硬核方案。用 Next.js 这类框架，HTML 在服务器端提前生成，浏览器拿到的就是完整结构，不用等 JS 下载执行后再渲染。对 SEO 友好，首屏速度快一个量级。"},{"type":"p","text":"3）静态资源加 CDN 和强缓存。JS、CSS、图片走 CDN 加速，配合 Cache-Control: max-age=31536000 ，用户二次访问直接从本地加载。字体文件特别容易卡渲染，可以 font-display: swap 避免阻塞。"},{"type":"p","text":"4）关键 CSS 内联，非核心 CSS 异步加载。把首屏用到的样式直接写进 <head> ，避免额外请求。剩余 CSS 用"},{"type":"p","text":"link[rel=\"stylesheet\"] 异步加载，不阻塞解析。"},{"type":"p","text":"5）图片懒加载 + 渐进式加载。首屏图片用 loading=\"lazy\" ，优先加载低清占位图，再在后台加载高清版本，视觉上更流畅。"}],"r":["全量内联会让 HTML 变大且无法缓存，只该内联关键 CSS。","","DOM 层级越深，样式计算和布局越慢。","首屏渲染完全可以优化，减少阻塞资源就是最直接的手段。"]},{"id":141,"t":"什么是 Webpack 的 bundle、chunk 和 module？分别有什么作用？","c":"工程化","o":["module 是源码，chunk 是代码块，bundle 是产物","chunk 只能由 entry 生成，其余情况不会产生","三者是同一个概念的不同叫法，可以互换","bundle 指源码模块，module 指输出文件"],"a":0,"w":"module 是源码里的一个模块文件；chunk 是打包过程中按依赖和分包策略生成的代码块；bundle 是 chunk 经过处理最终写出的文件。一个 entry 可以产出多个 chunk。","b":[{"type":"p","text":"Webpack 处理项目时，会把所有资源看作 module。JS 文件、CSS、图片、字体，统统都是 module。每个被import 或 require 的文件，都会变成一个 module。"},{"type":"p","text":"多个 module 之间有依赖关系，Webpack 根据入口文件（entry）从头开始递归分析，生成依赖图。在这个过程中，一组 module 会被合并成一个代码块，也就是 chunk。chunk 是逻辑上的分组，比如你配置了动态导入"},{"type":"p","text":"import() ，Webpack 就会为这个异步加载的部分单独生成一个 chunk，实现按需加载。"},{"type":"p","text":"最后，这些 chunk 会被输出为物理文件，也就是 bundle。bundle 是打包后的结果文件，直接交给浏览器使用。一个chunk 对应一个 bundle，但也可以通过配置生成多个或合并成一个。"},{"type":"p","text":"举个例子：你有个主入口和一个懒加载的路由组件。主入口生成 main.chunk.js，对应 main.bundle.js；懒加载部分生成 async.chunk.js，对应 async.bundle.js。前者是首屏加载，后者等用到才拉取。"},{"type":"p","text":"作用上，module 是最小单位，负责组织代码结构；chunk 是构建时的分块策略，影响加载性能；bundle 是最终交付物，由 chunk 输出而来。合理拆分 chunk 能减少首屏体积，利用浏览器缓存。"}],"r":["","动态 import、splitChunks 都会产生 chunk，不只 entry。","三者是不同层级的概念，不能互换。","说反了：module 是源码，bundle 是产物。"]},{"id":142,"t":"同一前端页面的 3 个组件请求同一个 API 并发送了 3 次请求，如何优化？","c":"工程化","o":["提升到公共父组件或状态管理，并做请求缓存","让三个组件分别加防抖","改用 WebSocket 就不会重复请求","用 setTimeout 把请求错开发送"],"a":0,"w":"本质是让同一份数据只有一个数据源：把请求提到公共父组件或用状态管理共享，再配合请求缓存和并发去重（相同 URL 复用同一个 Promise）。","b":[{"type":"p","text":"这类问题本质是解决重复请求带来的资源浪费和接口压力。核心思路是去重合并，让相同请求在合理范围内只发一次。"},{"type":"p","text":"1） 前端缓存响应结果 请求发出后把 URL + 参数作为 key，Promise 存入全局缓存。后续相同请求直接复用这个Promise，避免重复调用。30 秒内相同查询完全无感。"},{"type":"code","text":"const requestCache = new Map();\nfunction fetchApi(url, params) {\n  const key = `${url}?${new URLSearchParams(params)}`;\n  if (!requestCache.has(key)) {\n    requestCache.set(key, fetch(key).finally(() => setTimeout(() =>\nrequestCache.delete(key), 30000)));\n  }\n  return requestCache.get(key);\n}"},{"type":"p","text":"2） 后端做请求合并（Batching） 如果前端无法控制，可以用中间件聚合短时间内的相同请求。比如 10ms 内收到的同 API 请求合并成一次后端调用，响应广播给所有客户端。Netty 或 Spring WebFlux 都能实现这种模式。"},{"type":"p","text":"3） 使用 GraphQL 或 tRPC 等协议层方案 多个组件需要的数据可以一次性声明，减少冗余字段和请求次数。尤其适合微前端或复杂页面场景。"},{"type":"p","text":"注意别过度优化。如果三个请求参数不完全一样，或者有强实时要求，就不能简单合并。缓存有效期、错误重试策略也得设计好，不然会出诡异问题。"}],"r":["","防抖只能减少频率，三个组件仍会各发一次。","换成 WebSocket 只是换通道，重复请求的问题还在。","错开发送只是把 3 次请求拉开，总量没变。"]},{"id":143,"t":"Webpack 中的 bundle、chunk 和 module 是什么？请分别介绍","c":"工程化","o":["module 是最终产物，bundle 才是源码文件","三者完全等价，只是不同团队的习惯叫法","bundle 是入口配置项的名称，与产物无关","module 源文件、chunk 模块集合、bundle 产物"],"a":3,"w":"module 是源文件，chunk 是若干 module 的集合（按分包策略生成），bundle 是最终输出的文件。理解这条链路，才看得懂 splitChunks 的配置和产物分析。","b":[{"type":"p","text":"webpack 打包时这几个概念经常被混用，其实它们是不同粒度的代码单元。"},{"type":"p","text":"module 就是你写的单个文件，比如一个 .js 或 .css 文件。每个 import 或 require 的目标都是一个 module。webpack 从入口文件开始，把所有依赖的 module 都收集起来，形成依赖树。"},{"type":"p","text":"chunk 是 webpack 在打包过程中生成的代码块，它是 module 的集合。一个 chunk 可能包含多个 module，比如你用了代码分割（code splitting），webpack 会根据配置把 module 分到不同的 chunk 里。动态导入 import() 会产生新的 chunk，SplitChunksPlugin 也会把公共模块抽成独立 chunk。"},{"type":"p","text":"bundle 是最终输出的文件，一般对应一个 chunk。但一个 bundle 不一定只包含一个 chunk，比如 dev server 下可能有 runtime 加载逻辑。反过来，一个 chunk 也可能生成多个 bundle，比如使用了 source map 或 asset modules。"},{"type":"p","text":"举个例子：你有两个页面 entryA 和 entryB，都引用了 lodash。默认情况下，每个 entry 会生成一个 bundle，里面各自包含 lodash 的代码。通过 SplitChunksPlugin 配置，可以把 lodash 抽成单独的 chunk，最终输出三个 bundle：entryA.js、entryB.js 和 vendors~common.js。"},{"type":"p","text":"简单记：module 是输入单位，chunk 是打包过程中的逻辑分组，bundle 是最终落地的物理文件。"}],"r":["说反了：module 是源码，bundle 是产物。","三者层级不同，不是叫法差异。","bundle 是产物文件，不是配置项。",""]},{"id":144,"t":"Core Web Vitals 是什么？它包括哪些指标？","c":"性能优化","o":["LCP、INP、CLS","FCP、TTI、TBT","DNS、TCP、TLS 三个耗时指标","只包含首屏加载时间一个指标"],"a":0,"w":"Core Web Vitals 关注三项真实体验：LCP 衡量加载速度（最大内容绘制）、INP 衡量交互响应（2024 年起取代 FID）、CLS 衡量视觉稳定性（累积布局偏移）。","b":[{"type":"p","text":"Core Web Vitals 是 Google 提出的一套衡量网页用户体验的核心指标，主要从加载、交互和视觉稳定性三个维度评估页面质量。这套指标会被纳入 Google 搜索排名算法，直接影响 SEO。"},{"type":"p","text":"1）Largest Contentful Paint (LCP)记录页面中最大内容元素（比如图片、标题）渲染完成的时间。核心目标是 2.5 秒内完成加载。超过 4 秒算很差。常见优化手段包括服务端渲染、资源预加载、CDN 加速等。"},{"type":"p","text":"2）First Input Delay (FID)"},{"type":"p","text":"测量用户首次与页面交互（如点击按钮）到浏览器实际响应之间的延迟。目标是低于 100 毫秒。高 FID 通常是因为主线程被大量 JS 阻塞，可以通过代码分割、懒加载、Web Worker 缓解。"},{"type":"p","text":"3）Cumulative Layout Shift (CLS)累计布局偏移分数，反映页面内容意外移动的程度。比如图片没设尺寸导致加载后突然撑开页面。目标是小于 0.1。避免方式包括给图片和广告预留空间、不在顶部插入动态内容。"},{"type":"p","text":"这些指标可以通过 Chrome DevTools、PageSpeed Insights 或 Lighthouse 直接测量。Next.js、Gatsby 等现代框架都内置了对 Core Web Vitals 的支持和优化建议。"}],"r":["","FCP/TTI/TBT 是 Lighthouse 里的其他指标，不属于核心三项。","DNS/TCP/TLS 是网络阶段耗时，不是用户体验指标。","它包含三个维度：加载、交互、视觉稳定性。"]},{"id":145,"t":"使用 Import 时，Webpack 如何处理 node_modules 中的依赖？","c":"工程化","o":["按 mainFields 解析入口，sideEffects 摇树","直接把 node_modules 整个复制到输出目录","只能通过 CDN 引入第三方依赖","完全忽略 node_modules，不做任何处理"],"a":0,"w":"Webpack 按 resolve.modules 和 mainFields 解析包的入口（优先 module 字段），结合 package.json 的 sideEffects 判断能否安全摇树，解析结果会缓存复用。","b":[{"type":"p","text":"当你在代码里写 import React from 'react' ，Webpack 的处理流程其实很直接，关键在于 resolve 和module resolution rules。"},{"type":"p","text":"1）首先 Webpack 会从当前文件向上找 node_modules ，遵循 Node.js 的模块解析机制。比如你在"},{"type":"p","text":"src/components/Button.js 里 import，它会先看同级有没有 node_modules/react ，没有就往上级目录找，一直到项目根目录。"},{"type":"p","text":"2）找到 node_modules/react 后，Webpack 会读它的 package.json ，然后根据字段决定入口文件。优先级一般是：browser > module > main 。比如 React 的 main 指向的是 index.js ，而实际是 CJS 模块，所以最终打包时不会被 tree-shake 掉。"},{"type":"p","text":"3）如果是 ESM 格式（比如很多现代库同时提供 .mjs 或 exports 字段），Webpack 能识别并支持静态分析，这时候 tree shaking 才能生效。像 Vite 或 Rollup 默认更激进地利用这点。"},{"type":"code","text":"// webpack.config.js\nmodule.exports = {\n  resolve: {"},{"type":"p","text":"mainFields: ['browser', 'module', 'main'], // 控制查找顺序"},{"type":"code","text":"  },\n};"},{"type":"p","text":"4）所有 node_modules 里的依赖默认被视为 external to your application logic，也就是说 Webpack 不会对它们做 babel-loader 等编译处理，除非你显式配置。这也是为什么有时候需要额外处理某些库的源码。"}],"r":["","直接复制 node_modules 会把没用的代码全打进产物。","CDN 是引入方式之一，本地依赖同样会被正常解析打包。","忽略 node_modules 会导致依赖找不到。"]},{"id":146,"t":"如何优化 Webpack 的打包速度？","c":"工程化","o":["关闭 source map 并删除所有插件来提速","持久化缓存、thread-loader、exclude 依赖","打包速度只取决于电脑配置，与配置无关","增加更多 loader，让每个模块都处理得更充分"],"a":1,"w":"提速优先做三件事：开启持久化缓存（二次构建最快）、用 thread-loader 多线程转译、把 node_modules 排除在 loader 处理之外；再配合缩小 resolve 范围和合理分包。","b":[{"type":"p","text":"Webpack 打包慢通常卡在文件解析、模块编译和重复构建上。想提速，得从“减少工作量”和“并行处理”两个方向下手。"},{"type":"p","text":"1）用 ThreadLoader 把 babel-loader 放到子进程跑，CPU 密集的 JS 转译就能并行化。注意它只适合耗时长的loader，简单转换加了反而 overhead 更大。"},{"type":"p","text":"2）合理配置 include 和 exclude ，比如 node_modules 里大部分文件不用走 babel，直接排除，能省下几千个文件的遍历。"},{"type":"p","text":"3）开启持久化缓存，webpack 5 的 cache.type = 'filesystem' 可以把模块解析结果存磁盘。下次启动直接读，冷启动时间从几十秒压到几秒。"},{"type":"p","text":"4）第三方库尽量不打包，用 externals 配合 CDN 引入，比如 React、Vue 这些大厂维护的包，构建时直接跳过。"},{"type":"p","text":"5）避免全量构建 sourcemap，开发环境用 cheap-module-source-map ，生产需要精准定位再上 source-map 。"},{"type":"p","text":"6）升级到最新版 webpack 和 loader，新版本默认做了不少优化，比如更智能的 tree-shaking 和 module federation支持。"},{"type":"p","text":"别迷信单一方案，实际项目要结合体积分析工具 webpack-bundle-analyzer 定位瓶颈，先看哪个环节最拖后腿。"}],"r":["删插件会丢功能；关 source map 虽能省一点构建时间，但只有在生产环境用才合理，不是主要优化手段。","","配置对构建速度的影响往往比硬件更大。","loader 越多越慢，这是在反向优化。"]},{"id":147,"t":"前端项目中如何配置 HTTP 缓存机制？","c":"性能优化","o":["缓存策略只能由浏览器自动决定","所有资源都设置 Cache-Control: no-store","HTML 短缓存，静态资源 hash 加长缓存","所有资源都缓存一年且文件名保持不变"],"a":2,"w":"入口 HTML 用 no-cache 或短缓存，保证发版后能拿到新的资源引用；带 hash 的静态资源设长缓存（immutable），再配合 ETag/Last-Modified 做协商缓存。","b":[{"type":"p","text":"HTTP 缓存其实是浏览器和服务器之间的一种“约定”，前端项目要控制它，得靠服务端响应头的设置，而不是前端代码直接操作。"},{"type":"p","text":"1）强缓存靠 Cache-Control 和 Expires 。现在基本都用 Cache-Control ，比如设成 max-age=3600 ，意味着资源在 1 小时内完全从本地磁盘或内存读，压根不经过网络请求。开发时常见的问题是打包文件没加 hash，导致用户更新版本后还拿旧缓存。"},{"type":"p","text":"2）协商缓存看 ETag 和 Last-Modified 。当强缓存失效后，浏览器会带着 If-None-Match 或 If-Modified-Since 去问服务器资源有没有变。如果没变，服务器返回 304，节省传输成本。像 Nginx 这类静态服务器默认会对静态资源生成 ETag。"},{"type":"p","text":"3）实际项目里，构建工具比如 Webpack、Vite 会在输出文件名里加 hash，比如 app.abc123.js ，这样文件一改名字就变，URL 不同自然绕过旧缓存，这是最稳妥的策略。而 HTML 文件一般不缓存或者设很短的 max-age，避免页面结构更新了用户却打不开。"},{"type":"p","text":"静态资源走 CDN 的时候，也要注意配置对应的 Cache-Control 策略，不然可能缓存层级混乱。简单说，不变的资源上长缓存，变动频繁的（比如 HTML）就别乱缓存。"}],"r":["缓存策略由响应头决定，不是浏览器自动决定的。","no-store 完全不缓存，每次都要重新下载。","","文件名不变还缓存一年，发版后用户永远拿不到新代码。"]},{"id":148,"t":"有哪些前端网站性能优化的关键点？","c":"性能优化","o":["性能优化就是减少代码行数","只需要压缩图片就够了","网络、渲染、运行时三层分别优化","只需要升级服务器配置"],"a":2,"w":"性能优化要分层看：网络层（CDN、压缩、缓存、HTTP/2）、渲染层（关键 CSS、懒加载）、运行时（长任务拆分、虚拟列表），三层各自有对应的手段。","b":[{"type":"p","text":"前端性能优化不是堆技巧，而是系统性地减少用户从请求到可交互的耗时。关键在于控制资源加载节奏、减小传输体积、提升渲染效率。"},{"type":"p","text":"1）资源加载优先级要理清楚。首屏用的 CSS 可以内联，JS 能 async 或 defer 就别阻塞解析。图片懒加载很常见，像 Vue 项目里用 v-lazy 或 React 中配合 IntersectionObserver 做可视区加载，避免一次性拉几十张图拖慢页面。"},{"type":"p","text":"2）资源体积得压到极致。代码层面开启 Gzip/Brotli，Webpack/Vite 都支持。静态资源加 hash 上 CDN，让浏览器就近取。图片用 WebP 格式，比 JPG 小 30% 以上，现代框架如 Next.js 默认支持自动转换。"},{"type":"p","text":"3）渲染性能不能卡在主线程。长列表用虚拟滚动，比如 react-window 渲染几千条数据也不卡。避免强制同步布局，别写 offsetHeight 后立刻改样式这种操作。CSS 动画尽量用 transform 和 opacity ，触发 GPU 加速。"},{"type":"p","text":"4）利用缓存机制减少重复请求。HTTP 协议层用 Cache-Control 控制强缓存，协商缓存靠 ETag 。前端还能用localStorage 缓存静态配置，但注意存储上限，一般也就 5-10MB。"}],"r":["代码行数与性能没有直接关系。","图片只是资源的一部分，JS 和接口同样是大头。","","服务器配置只影响后端，前端渲染和下载同样关键。"]},{"id":149,"t":"有哪些常用的前端性能分析工具？","c":"性能优化","o":["Photoshop、Figma，主要用来切图和还原设计稿","Lighthouse、Performance 面板、WebPageTest","Postman、Fiddler，主要用来抓包、改包和调试后端接口","Git、Jenkins，主要用来做版本管理和持续集成流水线"],"a":1,"w":"前端性能分析常用 Lighthouse（综合评分）、Chrome DevTools 的 Performance 面板（火焰图、长任务）、WebPageTest（多地域真机），线上再用 PerformanceObserver 做 RUM 监控。","b":[{"type":"p","text":"前端性能分析工具主要分两类，一类是浏览器内置的，另一类是第三方集成方案。开发阶段最常用的还是 Chrome DevTools，它能直接看页面加载的 Waterfall 图，每个资源的 DNS、TCP、传输时间都清清楚楚，Lighthouse 也是它家的，跑一次就能给性能打分，还能提优化建议，比如懒加载图片、减少未使用代码。"},{"type":"p","text":"线上监控一般用 Web Vitals 结合 Google Analytics 或 Sentry 这类平台。Web Vitals 提供三个关键指标：FP（首次绘制）、FCP（首次内容绘制）、LCP（最大内容渲染），都是真实用户视角的体验数据。Sentry 不光抓错误，也能采集页面性能数据，特别是首屏加载慢的请求链路。"},{"type":"p","text":"如果要做自动化压测或 CI 集成，可以用 Puppeteer + Lighthouse 脚本，在无头浏览器里跑核心路径，生成报告。Webpack Bundle Analyzer 则专门看打包体积，帮你发现哪个依赖包突然涨到 1MB，拖慢了首屏。"},{"type":"p","text":"代码层面可以手动打点："},{"type":"code","text":"const start = performance.now();\n// 渲染逻辑"},{"type":"p","text":"console.log('渲染耗时:', performance.now() - start);"},{"type":"p","text":"但别滥用，重点监控核心交互就行。"}],"r":["Figma/Photoshop 是设计工具。","","Postman/Fiddler 用来调试接口，不测页面性能。","Git/Jenkins 是版本管理和 CI 工具。"]},{"id":150,"t":"如何优化 Webpack 打包后文件的体积？","c":"性能优化","o":["把所有依赖都打进一个 vendor 文件","只删除 source map 就能显著减小运行体积","代码分割、摇树、压缩、按需引入","增加更多 polyfill 来兼容旧浏览器"],"a":2,"w":"减小体积的顺序：先用分析工具找到占比最大的包，再做代码分割、tree-shaking、压缩混淆、按需引入（如 lodash-es）、提取公共依赖。","b":[{"type":"p","text":"打包体积直接影响首屏加载速度，尤其在弱网环境下特别明显。优化的核心思路是“减少资源总量”和“提升压缩效率”。"},{"type":"p","text":"1）代码分割（Code Splitting）是最有效的手段之一。把 vendor、runtime 和业务代码拆开，避免第三方库变动导致缓存失效。比如用 SplitChunksPlugin 抽出 node_modules 里的依赖。"},{"type":"p","text":"2）开启生产环境的 Tree Shaking。确保使用 ES Module 语法，这样 webpack 能静态分析并移除未引用的导出。注意副作用文件要正确标注 \"sideEffects\": false 。"},{"type":"p","text":"3）压缩方案要拉满。JS 用 TerserPlugin，CSS 用 CssMinimizerWebpackPlugin。还可以引入 Brotli 或 Gzip 压缩，Nginx 配置响应时自动解压，通常能再压掉 60%~70% 体积。"},{"type":"p","text":"4）图片和静态资源别忽略。小图转 base64，大图走 WebP + 懒加载。字体文件按需提取子集，比如只打包中文首屏用到的字。"},{"type":"p","text":"5）检查是否有重复打包。有时候多个版本的 lodash 同时打进去了，用 webpack-bundle-analyzer 可视化分析包内容，一眼就能看出问题。"},{"type":"p","text":"最后提醒一点，source map 在生产环境建议用 source-map 或 hidden-source-map ，别用 eval 类型，既安全又不影响体积太多。"}],"r":["所有依赖打成一个 vendor 会让首包更大、缓存粒度更差。","source map 不参与运行，删了不影响运行体积。","","polyfill 是加体积的，不是减体积的。"]},{"id":151,"t":"前端项目中资源的缓存配置策略有哪些？","c":"性能优化","o":["完全不使用缓存，保证用户拿到最新内容","强缓存加协商缓存，按资源分级配置","只使用协商缓存，每次都向服务端确认","只使用强缓存，不配置任何协商缓存"],"a":1,"w":"强缓存（Cache-Control/Expires）命中时不发请求，协商缓存（ETag/Last-Modified）会发请求但可返回 304。按资源类型分级：HTML 短缓存，hash 资源长缓存。","b":[{"type":"p","text":"前端资源缓存的核心是合理利用 HTTP 缓存机制，让静态资源既能快速加载，又能及时更新。"},{"type":"p","text":"1）强缓存通过 Cache-Control 和 Expires 响应头控制。浏览器不发请求直接使用本地副本。比如设置 max-age=31536000 ，一年内都从内存或磁盘读取。适用于带哈希指纹的 JS、CSS 文件，像 Webpack 打包出的 app.[hash].js ，这类文件内容不变，可以放心长期缓存。"},{"type":"p","text":"2）协商缓存在强缓存失效后触发，服务器通过 ETag 或 Last-Modified 判断资源是否变更。如果没变，返回304，节省传输成本。适合没有哈希的资源或动态页面，比如 index.html 。一般给 HTML 设置 Cache-Control:no-cache ，每次校验 ETag。"},{"type":"p","text":"3）缓存策略要分资源类型配置。CDN 上，对 .js/.css/.png 等走强缓存，index.html 走协商缓存。Nginx 配置示例："},{"type":"code","text":"location ~* \\.(js|css|png|jpg)$ {\n    expires 1y;\n    add_header Cache-Control \"public, immutable\";\n}\nlocation = /index.html {\n    add_header Cache-Control \"no-cache\";\n}"},{"type":"p","text":"immutable 指示资源永不变化，避免用户操作导致的重新验证。注意：HTML 不要设长缓存，否则用户可能一直卡在旧版本。"}],"r":["完全不用缓存等于每次全量下载。","","只用协商缓存每次都要发请求确认，浪费往返。","只用强缓存会导致资源更新后用户拿不到新版本。"]},{"id":152,"t":"如何在 Webpack 中实现条件组件的按需打包？","c":"工程化","o":["用 if 语句包住静态 import 语句，构建时自动剔除","只能打两个包，让用户在页面上手动切换","Webpack 本身无法实现，必须改用 Rollup","动态 import 加条件判断，配合 tree-shaking"],"a":3,"w":"静态 import 会被构建工具无条件分析打包，写在 if 里也没用；要实现条件打包，得用动态 import() 配合条件判断，或 DefinePlugin 注入环境变量后靠 tree-shaking 剔除死代码。","b":[{"type":"p","text":"要实现条件组件的按需打包，关键在于让 Webpack 能识别出哪些代码是动态引入的，并通过代码分割和树摇来剔除未使用的部分。"},{"type":"p","text":"1）使用动态 import() 语法配合 Promise 加载组件。Webpack 会自动将这些模块拆分成独立 chunk，在运行时按需下载。比如根据用户权限加载不同管理后台组件："},{"type":"code","text":"if (user.role === 'admin') {\n  import('./AdminPanel').then(mod => render(mod.default))\n}"},{"type":"p","text":"2）结合 React.lazy 和 Suspense 实现路由级按需加载，这是最常见的场景。框架如 Next.js 就是基于这种机制做页面分割。"},{"type":"p","text":"3）利用 webpackIgnorePlugin 或自定义条件判断，排除特定环境下不需要的模块。例如针对移动端打包时移除PC 端专属组件。"},{"type":"p","text":"注意：静态分析依赖 ES Module 的静态结构，所以必须确保导出是静态声明的，否则树摇会失效。CommonJS 的"},{"type":"p","text":"require 是动态的，会导致这部分代码被整体保留。"},{"type":"p","text":"动态导入的模块路径尽量避免完全动态拼接，像 import( ./${module}.js ) 这种写法会让 Webpack 预加载整个目录下所有可能的文件。如果真要这么做，得配合 webpackMode: 'lazy' 控制加载策略。"}],"r":["静态 import 是编译期分析，写在 if 里照样会被打包。","不必打两个包，动态 import 会自动分包。","Webpack 完全支持，动态 import 就是标准做法。",""]},{"id":153,"t":"前端如何使用 Webpack 进行高效分包优化？","c":"工程化","o":["把所有代码打成一个文件最省事，请求数最少","分包只能靠 CDN 实现，Webpack 本身不支持","每个模块都单独打一个文件，粒度越细越好","splitChunks 拆 vendor，配合路由级懒加载"],"a":3,"w":"分包的两个维度：splitChunks 把第三方库和公共模块拆出来（利于缓存），动态 import 做路由级懒加载。chunk 不是越细越好，太多会增加请求和缓存失效。","b":[{"type":"p","text":"前端项目一到几百 KB，首屏加载就得卡成 PPT。Webpack 分包不是选修课，是保命刚需。"},{"type":"p","text":"分包的核心逻辑就两条：按需加载、缓存复用。把不相关的代码拆开，公共部分单独打一个包，更新时用户不用重复下载。"},{"type":"p","text":"1）入口级拆分靠 entry 配置，比如把管理后台和用户中心完全分开，各走各的 JS 主线。 2）第三方库用"},{"type":"p","text":"SplitChunksPlugin 单独抽出来，像 React、Lodash 这种基本不变的代码，打包成 vendor.js ，浏览器能长"},{"type":"p","text":"期缓存。 3）路由级异步组件配合 import() 动态导入，Webpack 会自动给你切成 chunk，进页面时只拉首页需要的 JS。"},{"type":"code","text":"// webpack.config.js 片段\noptimization: {\n  splitChunks: {\n    chunks: 'all',\n    cacheGroups: {\n      vendor: {\n        test: /[\\\\/]node_modules[\\\\/]/,\n        name: 'vendors',\n        priority: 10\n      }\n    }\n  }\n}"},{"type":"p","text":"别小看 priority 字段，它决定哪个 chunk 先被抽出。比如你有多个 cacheGroup，优先级低的可能啥都分不到。"},{"type":"p","text":"还有一点容易忽略：给 chunk 打上内容哈希名。[contenthash:8] 能保证文件内容变了才换名字，不然缓存白搭。"}],"r":["打成一个文件会让首包过大，改一行代码整包缓存失效。","Webpack 的 splitChunks 就是专门做分包的。","粒度太细会产生大量小请求，反而更慢。",""]},{"id":154,"t":"前端开发中的 Live-Reload 自动刷新与 HMR 热模块替换有什么区别？","c":"工程化","o":["Live-Reload 整页刷新，HMR 只换模块","HMR 会整页刷新，Live-Reload 只替换模块","HMR 只能用于 CSS，JS 无法热替换","两者完全一样，只是不同框架的叫法"],"a":0,"w":"Live-Reload 是文件变化后整页刷新，页面状态（表单、滚动位置）会丢；HMR 只替换变更的模块，并保留应用状态，开发体验更好，但需要 loader/plugin 支持。","b":[{"type":"p","text":"前端构建工具里的刷新机制，Live-Reload 和 HMR 看着效果差不多，实际完全是两码事。"},{"type":"p","text":"Live-Reload 是页面级的刷新。只要文件一变，整个浏览器就强制 reload 一次。你正在填的表单、展开的折叠面板，全都会清掉。因为它压根不经过状态保留这一步，就是简单粗暴地重载页面。适合静态页面开发，比如用 webpack-dev-server 跑一个纯 HTML 页面时默认行为。"},{"type":"p","text":"HMR 则是模块级别的替换。它通过 WebSocket 监听文件变化，只把变更的模块推送到浏览器，然后在运行时替换掉老模块，关键是可以保持应用当前状态。比如你在调试 React 组件，改了样式或逻辑，组件重新渲染，但路由状态、输入框内容、甚至组件实例都不会丢失。React Hot Loader、Vue 的 HMR 都是基于这个能力实现的。"},{"type":"p","text":"1） Live-Reload 触发整页刷新，状态全丢"},{"type":"p","text":"2） HMR 只更新变更的模块，状态保留"},{"type":"p","text":"3） HMR 需要框架配合支持，不是所有场景都能用"},{"type":"p","text":"代码层面，webpack 的 hot: true 开启 HMR，再配合插件如 HotModuleReplacementPlugin ，模块里还要写 module.hot.accept() 指定处理逻辑。"},{"type":"p","text":"HMR 的代价是复杂度高，搞不定时还不如直接刷页面。简单项目用 Live-Reload 完全够用，中大型 SPA 才真正需要HMR 提升开发体验。"}],"r":["","说反了：整页刷新的是 Live-Reload。","JS 也能热替换，只是需要框架或 loader 实现 accept 逻辑。","两者机制不同，HMR 是 Live-Reload 的升级版。"]},{"id":155,"t":"Webpack 和 Rollup、Parcel 构建工具有什么区别？各自的优缺点是什么？","c":"工程化","o":["三者完全一样，只是配置文件的写法略有不同","Parcel 必须手写配置文件，否则无法启动构建","Rollup 只能打包 CSS，无法处理 JS 模块","Webpack 全能、Rollup 适合库、Parcel 零配置"],"a":3,"w":"Webpack 生态最全、适合大型应用（loader/plugin 丰富）；Rollup 产物更干净（ESM 友好），适合打包类库；Parcel 零配置，适合快速原型和中小项目。","b":[{"type":"p","text":"Webpack 更像是一个功能完备的工厂流水线，适合复杂应用。它基于配置，能处理各种资源模块，比如 CSS、图片，还能做代码分割、热更新。生态特别强，React、Vue 项目基本都靠它撑着。但配置复杂，新手容易搞不定。"},{"type":"p","text":"Rollup 则专注 ES 模块打包，设计目标是生成更干净、更小的库代码。Tree-shaking 效果比 Webpack 更彻底，输出的代码冗余少。如果你在开发一个 UI 组件库或者工具库，比如 Lodash 或 D3，用 Rollup 几乎是标准选择。但它对非JS 资源支持弱，不适合直接构建 SPA。"},{"type":"p","text":"Parcel 主打零配置，开箱即用。你写个 HTML 文件，它能自动识别依赖，JS、CSS、图片全都能处理，适合快速原型或小型项目。不过因为自动化程度高，出问题时调试成本也高，定制能力差，大型项目基本不会选它。"},{"type":"p","text":"1）Webpack：配置重，功能全，适合大型 SPA"},{"type":"p","text":"2）Rollup：输出精简，适合类库打包"},{"type":"p","text":"3）Parcel：零配置启动快，但扩展性弱"},{"type":"p","text":"简单说，Webpack 是全能选手，Rollup 是代码洁癖者的利器，Parcel 是快速启动的玩具。选哪个，看你要建的是工厂还是工具箱。"}],"r":["三者的设计目标和产物差异明显。","Parcel 主打零配置，开箱即用。","Rollup 正是为打包 JS 库而生的。",""]},{"id":156,"t":"如何使用 Webpack 处理内联 CSS？","c":"工程化","o":["用 file-loader 输出 CSS 文件","style-loader 注入 style，或 ?inline 引入","用 MiniCssExtractPlugin 把 CSS 提取成独立文件","Webpack 不支持内联 CSS"],"a":1,"w":"开发环境用 style-loader 把 CSS 以 style 标签注入页面；也可以用 css-loader 的 ?inline 或 raw-loader 拿到 CSS 字符串自行处理。生产环境则用 MiniCssExtractPlugin 抽成独立文件。","b":[{"type":"p","text":"处理内联 CSS 其实不是 Webpack 的默认强项，它更擅长把资源模块化。想把 CSS 内联到 HTML 或 JS 中，得靠插件和加载器组合来搞。"},{"type":"p","text":"1）用 css-loader 和 style-loader 是最常见的方式。css-loader 负责解析 CSS 文件里的 @import 和"},{"type":"p","text":"url() ，style-loader 则会把解析后的 CSS 通过 <style> 标签插入页面。这种方式本质就是动态内联。"},{"type":"code","text":"module.exports = {\n  module: {\n    rules: [\n      {\n        test: /\\.css$/,\n        use: ['style-loader', 'css-loader']\n      }\n    ]\n  }\n};"},{"type":"p","text":"2）如果想在构建时就把 CSS 直接塞进 HTML 的 <style> 里，可以用 html-inline-css-webpack-plugin 。它会在 HTMLWebpackPlugin 生成文件后，把指定的 CSS 内容提取并注入到 <head> 中，适合做 SSR 或需要关键路径 CSS 内联的场景。"},{"type":"p","text":"3）另一种思路是手动 import CSS 字符串。配合 raw-loader 读取 CSS 文件内容为字符串，然后在 JS 里动态创建style 标签插入。这种适合局部、小量的样式内联。"},{"type":"code","text":"import cssContent from './styles.css?raw';\nconst style = document.createElement('style');\nstyle.textContent = cssContent;\ndocument.head.appendChild(style);"},{"type":"p","text":"注意点：内联会增加 HTML 或 JS 体积，影响缓存。一般只建议把首屏关键 CSS 内联，其余走外链。Webpack 本身不直接支持“自动内联”，全靠 loader 链控制输出形式。"}],"r":["file-loader 输出的是文件，不是内联。","","MiniCssExtractPlugin 是抽离成独立文件，正好相反。","Webpack 完全支持内联，style-loader 就是干这个的。"]},{"id":157,"t":"如何使用 Webpack 解决开发环境中的跨域问题？","c":"工程化","o":["devServer.proxy 代理转发，或后端加 CORS","关闭浏览器的安全策略，让请求不受同源限制","把前端代码里的接口域名改成同源地址就行","用 iframe 嵌套目标页面就能绕过跨域限制"],"a":0,"w":"开发阶段最省事的是 devServer.proxy：把 /api 转发到后端，浏览器看到的是同源请求；生产环境则要靠后端配置 CORS 或同源部署。","b":[{"type":"p","text":"开发时前端和后端服务通常不在同一个域名下，浏览器的同源策略就会拦请求。Webpack 提供了"},{"type":"p","text":"devServer.proxy 配置，能让你在本地开发时把 API 请求代理到后端服务，跨域问题就压根不经过浏览器。"},{"type":"p","text":"比如你前端跑在 http://localhost:3000 ，后端接口在 http://localhost:8080 ，直接发请求会跨域。你在 webpack.config.js 里加个代理："},{"type":"code","text":"module.exports = {\n  devServer: {\n    proxy: {\n      '/api': {\n        target: 'http://localhost:8080',\n        changeOrigin: true,\n        pathRewrite: { '^/api': '' }\n      }\n    }\n  }\n}"},{"type":"p","text":"这样所有 /api 开头的请求，都会被转发到 http://localhost:8080 ，路径里的 /api 前缀也会被去掉。比如你发 fetch('/api/users') ，实际请求的是 http://localhost:8080/users ，而浏览器看到的还是向"},{"type":"p","text":"3000 端口发起的请求，自然没跨域。"},{"type":"p","text":"这个机制只在开发环境生效，靠的是 Webpack Dev Server 起的一个中间层，生产环境得靠 Nginx 或后端加 CORS头。"},{"type":"p","text":"1）target 指定后端地址"},{"type":"p","text":"2）changeOrigin 解决主机头不匹配问题，尤其是后端做了 host 校验"},{"type":"p","text":"3）pathRewrite 重写路径，去掉代理前缀"},{"type":"p","text":"注意，如果后端接口没有统一前缀，可以用 context 匹配多个路径，或者用函数动态判断。但更推荐让接口有规范前缀，方便管理。"}],"r":["","浏览器安全策略无法在前端关闭，也不该关。","接口域名由后端决定，前端改成同源也请求不到。","iframe 受同源策略约束，绕不过去。"]},{"id":158,"t":"前端开发中如何优化网络请求和资源加载？具体怎么实现？","c":"性能优化","o":["把所有请求改成同步请求，避免并发问题","统一改成 POST 请求，减少参数拼接","增加请求次数，让资源并行加载","合并请求、HTTP/2、缓存、CDN、压缩"],"a":3,"w":"网络层优化的组合：合并小请求、启用 HTTP/2 多路复用、合理缓存、CDN 加速、gzip/brotli 压缩、preload 关键资源、减少重定向。","b":[{"type":"p","text":"网络请求和资源加载的优化，关键在于减少请求数量、减小传输体积、提升加载并发和利用缓存。前端性能瓶颈很多时候就卡在资源等加载上，这几个点打好了能扛住大部分场景。"},{"type":"p","text":"1）合并与压缩资源。多个小 JS/CSS 文件可以打包成 chunk，用 Webpack 或 Vite 构建时开启代码分割和 minify。gzip 或 Brotli 压缩也能让文本类资源体积压下来 70% 以上，Nginx 配置里打开 gzip on 就行。"},{"type":"p","text":"2）图片按需加载。大图用懒加载，用户滚动到视口再 load。响应式图片用 <picture> + srcset ，适配不同设备分辨率，避免手机加载桌面级大图。WebP 格式比 JPEG/PNG 小 30% 左右，兼容性现在也够用了。"},{"type":"p","text":"3）HTTP 缓存策略要分层用。静态资源加 hash 摘要（比如 main.a1b2c3.js），走 Cache-Control: max-age=31536000 ，浏览器直接读本地缓存。HTML 文件不缓存或短缓存，用协商缓存 ETag 控制更新。"},{"type":"p","text":"4）预加载关键资源。<link rel=\"preload\"> 提前拉字体或首屏 JS，rel=\"prefetch\" 预取下一页可能用到的资源，浏览器空闲时加载，不抢主流程带宽。"},{"type":"p","text":"5）接口层面做请求合并和防抖。比如多个组件同时要用户信息，用 Promise cache 避免重复请求。搜索框输入触发的请求加防抖，300ms 内只发一次，减少无效调用。"},{"type":"p","text":"这些手段组合起来，首屏加载时间通常能从 3s+ 压到 1s 内，Lighthouse 分数也能提一大截。"}],"r":["同步请求会阻塞页面，是最差的选择。","GET/POST 与性能无关，统一 POST 还会失去缓存能力。","请求越多，往返开销越大。",""]},{"id":159,"t":"如何使用 Webpack 优化产出代码？","c":"工程化","o":["只保留 development 模式","多写注释以提升可维护性","关闭所有优化以保留可读性","压缩混淆、摇树、分包、提取 CSS"],"a":3,"w":"production 模式下 Webpack 会自动做压缩混淆、tree-shaking、Scope Hoisting，人工需要干预的主要是分包策略、CSS 提取和 polyfill 范围。","b":[{"type":"p","text":"代码体积直接影响加载速度，Webpack 的优化核心是减少资源大小和提升加载效率。"},{"type":"p","text":"1）先做代码分割。别一股脑打包成一个 bundle.js，用 SplitChunksPlugin 把第三方库（比如 react、lodash）和业务代码拆开。公共模块单独抽离，多个页面能缓存复用。"},{"type":"code","text":"// webpack.config.js\noptimization: {\n  splitChunks: {\n    chunks: 'all',\n    cacheGroups: {\n      vendor: {\n        test: /[\\\\/]node_modules[\\\\/]/,\n        name: 'vendors',\n        chunks: 'all'\n      }\n    }\n  }\n}"},{"type":"p","text":"2）开启生产模式压缩。mode: 'production' 自动启用 TerserPlugin，去掉注释、空格，混淆变量名，JS 体积通常能压掉 40% 以上。"},{"type":"p","text":"3）用 Tree Shaking 剔除无用代码。确保 ES Module 语法（import/export），配置 sideEffects: false 或数组，帮助 Webpack 标记可删的死代码。像 lodash 这种老派库得配合 babel-plugin-lodash 按需引入。"},{"type":"p","text":"4）图片和静态资源也不能放过。image-webpack-loader 压图，或者直接上 asset/resource 类型自动base64 内联小文件，减少请求数。"},{"type":"p","text":"5）最后上 Gzip。虽然不是 Webpack 直接干的活，但配 CompressionPlugin 输出 .gz 文件，Nginx 开启gzip_static，传输时能压到原大小的 1/10。"},{"type":"p","text":"整个链路下来，首屏资源从几百 KB 控制到 100KB 内很常见。关键就是：拆得合理、删得干净、传得高效。"}],"r":["development 模式不压缩不摇树，产物体积最大。","注释在压缩阶段会被去掉，多写没有收益。","关闭优化等于放弃体积和速度。",""]},{"id":160,"t":"如何使用 Webpack 和 LocalStorage 实现静态资源的离线缓存？","c":"工程化","o":["用 cookie 缓存静态资源，请求时自动带上","Service Worker 缓存，构建时生成 precache","用 localStorage 缓存所有 JS 和 CSS 文件，读取同步","Webpack 打包后会自动支持离线访问，无需额外配置"],"a":1,"w":"真正的离线能力靠 Service Worker：拦截请求、返回缓存。用 Workbox 配合构建插件生成 precache manifest，打包产物一变就会更新缓存版本。localStorage 容量小且要手动读写，不适合缓存静态资源。","b":[{"type":"p","text":"利用 Webpack 打包时生成带 hash 的文件名，结合 LocalStorage 存储资源内容或 URL，可以让页面在离线时直接读取缓存资源。"},{"type":"p","text":"1）Webpack 构建阶段通过 [contenthash] 确保每个静态资源（JS、CSS）有唯一标识。只要文件内容不变，hash 就不变，适合做缓存键。"},{"type":"p","text":"2）在页面加载时，先检查 LocalStorage 是否存在对应 hash 的资源。如果存在且版本匹配，直接读取并注入到页面中。比如 JS 脚本可以创建 script 标签并内联代码。"},{"type":"p","text":"3）首次加载或资源更新时，从网络获取资源，执行正常渲染，并将响应体存入 LocalStorage。注意资源大小限制，LocalStorage 一般只有 5~10MB，不适合存大文件。"},{"type":"p","text":"4）配合 Service Worker 效果更好，但仅用 LocalStorage 也能实现简易离线访问。例如维护一个 manifest.json 记录当前版本的资源映射，启动时比对版本决定是否拉新资源。"},{"type":"code","text":"// 简化示例：加载缓存脚本\nfunction loadScriptFromCache(hash, src) {\n  const cached = localStorage.getItem(hash);\n  if (cached) {"},{"type":"p","text":"eval(cached); // 或创建 blob URL"},{"type":"code","text":"    return;\n  }\n  fetch(src)\n    .then(res => res.text())\n    .then(code => {\n      localStorage.setItem(hash, code);\n      eval(code);\n    });\n}"},{"type":"p","text":"这种方式适合小型应用或文档站，搞不定大型 SPA 的依赖管理。真正要扛住复杂场景，还是得上 PWA + Cache API。"}],"r":["cookie 有 4KB 限制，根本放不下 JS/CSS。","","localStorage 容量只有几 MB，且无法拦截请求。","Webpack 本身不提供离线能力，需要插件和 Service Worker。"]},{"id":161,"t":"如何使用 Webpack 进行前端性能优化？","c":"工程化","o":["压缩、摇树、分包、按需加载、CDN 缓存","增加更多 polyfill 来兼容旧环境","把图片全部转成 base64 内联","关闭所有插件以减少开销"],"a":0,"w":"用 Webpack 做性能优化，本质是优化产物和加载：压缩、tree-shaking、splitChunks 分包、按需加载（动态 import）、CDN 加长效缓存。","b":[{"type":"p","text":"前端性能优化这事，Webpack 能干的活不少，关键得知道它在构建阶段能做哪些事来减少资源体积、加快加载速度。"},{"type":"p","text":"1）代码分割是基本操作。别一股脑打包成一个 bundle.js，用 SplitChunksPlugin 把公共依赖比如 React、Lodash 单独抽出来，不同页面按需加载。路由级异步组件配合动态 import()，webpack 自动做 code splitting。"},{"type":"p","text":"2）Tree Shaking 得靠 ES Module 静态结构。只保留用到的导出，没引用的函数或类在生产构建直接删掉。前提是代码别乱用 require，保持 import/export 的静态性。"},{"type":"p","text":"3）压缩和混淆不能少。TerserWebpackPlugin 压缩 JS，CSS 用 CssMinimizerWebpackPlugin 。开启Gzip？配 CompressionPlugin ，生成 .gz 文件给 Nginx 启用 gzip_static。"},{"type":"p","text":"4）长期缓存靠文件名哈希。[contenthash:8] 确保内容变了 hash 才变，静态资源走强缓存，提升二次访问体验。"},{"type":"p","text":"5）开发环境也得注意。关掉 source map 生产构建或者用 source-map 替代 inline 模式，避免包体暴增。分析构建体积可以用 webpack-bundle-analyzer ，一眼看出谁占了大头。"},{"type":"p","text":"说白了，目标就三个：加载快、执行快、缓存友好。Webpack 配置得当，能帮你把这三件事都扛住。"}],"r":["","polyfill 是加体积的，只在必要时按需引入。","base64 会撑大 HTML 且无法单独缓存。","插件负责能力（如提取 CSS、生成 HTML），关掉会丢功能。"]},{"id":162,"t":"如何解决⻚⾯请求接⼝⼤规模并发问题","c":"场景设计","o":["并发控制、批量合并、缓存、优先级队列","把所有请求改成同步请求","一次性全部发出，浏览器会自动排队","只能靠增加服务器带宽解决"],"a":0,"w":"大规模并发要主动做“限流 + 合并 + 缓存”：用并发池限制同时请求数，能合并的接口合并，结果做缓存，按优先级排队，失败时重试和降级。","b":[{"type":"p","text":"系统面对页面请求接口的大规模并发，本质是抗住瞬间流量洪峰，避免服务雪崩。关键在于分层削峰、隔离风险和合理利用缓存。"},{"type":"p","text":"前端能做的其实不少。比如按钮防抖，避免用户重复提交；接口请求合并，把多个读请求攒批处理。这些小细节在秒杀场景下特别管用。"},{"type":"p","text":"1）静态资源走 CDN，把图片、JS、CSS 这些压根不经过应用服务器，直接由边缘节点返回。"},{"type":"p","text":"2）动态接口加 本地缓存 + Redis 缓存，像商品详情这种读多写少的数据，先查缓存，击穿了再打到底层数据库。"},{"type":"p","text":"3）热点数据识别很重要，配合本地缓存做二级缓存，防止 Redis 成为瓶颈。可以参考 Redis + Caffeine 的组合。"},{"type":"p","text":"如果流量实在太大，就得上 限流 和 降级。限流常用令牌桶或漏桶算法，Guava 的 RateLimiter 或 Sentinel 都能搞定。比如限制单机 QPS 不超过 500，超出的请求直接拒绝。"},{"type":"p","text":"降级策略要提前设计好，比如评论功能不可用时，直接返回空列表而不是卡住主流程。Hystrix 虽然老了，但熔断思想依然适用。"},{"type":"p","text":"最后是异步化。把非核心逻辑扔进消息队列，比如发通知、记录日志，用 Kafka 或 RocketMQ 做解耦，让主链路快速响应。"},{"type":"p","text":"数据库层面还得配合读写分离、分库分表，不然光靠缓存撑不了。TDDL、ShardingSphere 在这类架构里就是干这个的。"}],"r":["","同步请求会串行阻塞，比并发更慢。","浏览器对同域名并发数有限制，全发只会让请求排队，还可能打垮后端。","加带宽解决不了浏览器并发限制和后端压力。"]},{"id":163,"t":"什么是非阻塞 I/O？Node.js 如何实现非阻塞 I/O？","c":"Node.js","o":["非阻塞 I/O 只能用于网络请求","用多线程执行所有 JS 代码","把 I/O 改成同步调用以避免阻塞","发起 I/O 不等待，libuv 线程池加事件循环"],"a":3,"w":"非阻塞 I/O 是“发起后不等待”：调用立刻返回，数据就绪后通过回调通知。Node 用 libuv 的线程池执行真正的 I/O，再用事件循环把回调送回主线程。","b":[{"type":"p","text":"非阻塞 I/O 的关键在于，当程序发起一个 I/O 请求，比如读文件或网络请求，它不会傻等结果回来，而是立刻返回去做别的事。等数据真准备好了，系统会通知它来处理。这种方式特别适合高并发场景，毕竟线程资源宝贵，不能老是被I/O 操作占着。"},{"type":"p","text":"Node.js 实现非阻塞 I/O 靠的是 事件循环 和底层的异步 I/O 库（比如 Linux 上的 epoll）。所有 I/O 操作都交给底层系统或 libuv 去处理，Node.js 主线程只负责调度和执行回调。比如发一个 HTTP 请求："},{"type":"code","text":"http.get('http://example.com', (res) => {\n  res.on('data', (chunk) => console.log(chunk));\n});"},{"type":"p","text":"console.log('这行会先打印');"},{"type":"p","text":"这里的 http.get 立刻返回，不会阻塞后续代码执行。数据到达后，事件循环会在合适的时机触发 data 回调。"},{"type":"p","text":"整个模型是单线程事件驱动的，没有多线程上下文切换开销，但要注意 CPU 密集任务会卡住事件循环，得拆分或用Worker Threads。"},{"type":"p","text":"这种设计让 Node.js 用很少的资源就能扛住上万并发连接，像 Nginx、Redis 其实也用了类似的思路。"}],"r":["文件读写、DNS 查询同样是异步的，不限于网络。","JS 逻辑始终在主线程执行，线程池只处理 I/O。","改成同步反而会阻塞，方向反了。",""]},{"id":164,"t":"Node.js 中的回调、Promise 和 async/await 有什么区别？","c":"Node.js","o":["三者性能差异巨大，async/await 最快","Promise 无法处理错误","async/await 与 Promise 没有任何关系","回调易嵌套，Promise 链式，async 是语法糖"],"a":3,"w":"回调是最早的异步写法，多层嵌套会形成回调地狱；Promise 支持链式调用和统一的 catch 错误处理；async/await 是 Promise 的语法糖，用同步写法表达异步。","b":[{"type":"p","text":"回调、Promise 和 async/await 其实是 JavaScript 异步编程的三个演进阶段，解决的是“怎么写异步代码更清晰”的问题。"},{"type":"p","text":"1）回调是最原始的方式，把函数作为参数传给异步操作，等结果回来再执行。但问题在于嵌套深了会形成“回调地狱”，代码一层套一层，逻辑难理清。"},{"type":"p","text":"2）Promise 出现后，异步任务有了统一的状态管理：pending、fulfilled、rejected。它把异步操作的控制权收归自身，通过 then/catch 链式调用，避免了深层嵌套。比如读文件用 fs.promises.readFile().then(...)，错误也能集中处理。"},{"type":"p","text":"3）async/await 是 Promise 的语法糖，让异步代码看起来像同步。函数前加 async，内部用 await 等待 Promise 结果，写起来更线性，也更容易用 try/catch 捕获异常。"},{"type":"p","text":"实际开发中，Node.js 自 8.x 起就推荐使用 async/await。像 Koa 框架的中间件就直接支持 async 函数，Express 也完全兼容。老项目可能还用回调，但新代码基本都用 async/await 了，可读性和维护性高太多。"}],"r":["三者性能差异可以忽略，差别在写法和错误处理。","Promise 有 catch 和 then 的第二个参数，能处理错误。","async 函数返回的就是 Promise，await 等价于 then。",""]},{"id":165,"t":"什么是 Node.js 中的事件循环？","c":"Node.js","o":["每个请求都开一个新线程执行","Node 是多线程执行 JS 的","单线程 + libuv + 事件循环调度回调","事件循环就是 setInterval 的别名"],"a":2,"w":"Node 用单线程执行 JS，把 I/O 交给 libuv，事件循环按 timers、poll、check 等阶段调度回调，因此少量线程就能撑住大量并发连接。","b":[{"type":"p","text":"Node.js 的事件循环不是 JS 引擎自带的，而是由 libuv 这个 C++ 库实现的。它让 Node 能用单线程处理成千上万的并发 I/O 操作，靠的就是这个机制。"},{"type":"p","text":"你写代码时发起一个文件读取或网络请求，这些操作不会卡住主线程。Node 把它们交给底层系统处理，自己继续执行后面的代码。等操作系统完成了任务，结果就通过事件循环推回给 JS 主线程。"},{"type":"p","text":"事件循环其实是个持续运行的“检查器”，它不断轮询各个阶段，看有没有待处理的回调要执行。每个阶段都有自己的回调队列："},{"type":"p","text":"1）定时器阶段：执行 setTimeout 和 setInterval 到时的回调"},{"type":"p","text":"2）I/O 回调：处理像网络错误这类系统事件"},{"type":"p","text":"3）空闲、准备阶段：内部使用"},{"type":"p","text":"4）轮询阶段：这是核心，拉取新的 I/O 事件，执行 I/O 回调"},{"type":"p","text":"5）检测阶段：执行 setImmediate 的回调"},{"type":"p","text":"6）关闭回调：比如 socket.on('close', ...)"},{"type":"p","text":"注意，process.nextTick 虽然不属于上述任何阶段，但它会在每个阶段切换前清空队列，优先级最高。"},{"type":"p","text":"举个例子，用 Koa 或 Express 写接口，每个请求进来都不阻塞，靠事件循环调度异步逻辑，才能扛住高并发。"}],"r":["每请求一线程是传统阻塞式服务器的模型，Node 不是。","JS 执行始终是单线程的，多线程只用于 I/O 和 Worker。","","事件循环是调度机制，setInterval 只是往 timers 阶段放一个定时任务。"]},{"id":166,"t":"DIFF 算法的原理是什么？","c":"React","o":["只比较文本内容，不比较结构","递归比较整棵树的所有层级，求最小编辑距离","同层比较，用 key 判断复用，减少节点移动","直接删除整棵旧树重新创建"],"a":2,"w":"React/Vue 的 diff 采用同层比较：先比类型，类型不同直接替换；类型相同则用 key 判断能否复用，再递归比较属性和子节点。同层策略把复杂度从 O(n³) 降到 O(n)。","b":[{"type":"p","text":"DIFF 算法的核心是高效找出两个树结构之间的差异，特别是在前端框架里用来更新视图。React 和 Vue 都用了它，但实现思路有共性。"},{"type":"p","text":"它们不直接对比整个 DOM 树，那太慢了，复杂度会到 O(n³)。取而代之的是基于几个现实假设做优化："},{"type":"p","text":"1）同层级比较：只在同一层的节点之间比，跨层级移动就视为删除重建。 2）类型决定更新：如果元素类型变了，比如 div 变 span，直接替换整棵子树。 3）靠 key 识别列表：列表项用 key 来判断是否复用，不然就靠索引，默认不移位。"},{"type":"p","text":"这样能把复杂度降到 O(n)，实际更新时生成一个补丁集，再批量应用到真实 DOM 上。"},{"type":"p","text":"举个例子，React 的 reconciler 阶段就是在跑 DIFF，找哪些组件需要重渲染。Vue 3 的 patch 过程也类似，type 不同就 unmount 再 mount。"},{"type":"p","text":"重点是别自己实现全量对比，现代框架都靠 fiber 或 effect 做增量更新，靠的是 分层比对 和 key 驱动 的粒度控制。"}],"r":["文本只是节点的一部分，结构和属性同样要比较。","跨层级比较的复杂度是 O(n³)，实际框架不会这么做。","","整树重建代价极大，正是 diff 要避免的做法。"]},{"id":167,"t":"你会如何从零构建一个 Vue 项目？要经历哪些步骤？目录结构如何设计？使用哪些库或插件？","c":"Vue","o":["只需要创建一个 index.html 文件","直接引入 CDN 上的 vue.js 就足够了，不需要工程化","必须手写 webpack 配置，不能用脚手架","脚手架初始化，规划目录并配置路由与规范"],"a":3,"w":"从零构建 Vue 项目的常规路径：用 Vite 或 Vue CLI 初始化，规划 api/router/store/components/views 目录，配置路由、状态管理、UI 库、ESLint 和环境变量。","b":[{"type":"p","text":"初始化一个 Vue 项目，一般直接用官方脚手架工具 create-vue 或 vue-cli 。现在主流是 create-vue ，它基于 Vite，启动和热更新快得多。"},{"type":"p","text":"1）执行 npm create vue@latest ，命令行会问你是否需要 TypeScript、JSX、Vue Router、Pinia、测试工具等，按项目需求选。比如管理后台基本要 Vue Router 和 Pinia。"},{"type":"p","text":"2）生成的目录结构很清晰："},{"type":"p","text":"src/ 下有 components/ 、views/ 、router/ 、stores/ （Pinia）、assets/main.ts 是入口，挂载 App 实例根目录有 vite.config.ts 、tsconfig.json 、.env 文件"},{"type":"p","text":"Vite 配置可以加代理解决跨域，比如本地开发连后端服务："},{"type":"code","text":"export default defineConfig({\n  server: {\n    proxy: {\n      '/api': 'http://localhost:3000'\n    }\n  }\n})"},{"type":"p","text":"状态管理首选 Pinia，没有 mutations 和 modules 的复杂概念，API 简洁。路由用 Vue Router，支持懒加载："},{"type":"code","text":"{ path: '/user', component: () => import('@/views/User.vue') }"},{"type":"p","text":"UI 库看团队选择，Element Plus、Naive UI 都常用。构建部署前，确保 .env.production 里的 API 地址正确，然后 npm run build 输出到 dist/ 。"},{"type":"p","text":"整个流程下来，Vite 提供了现代前端开发的核心体验——快。项目结构按功能划分，维护起来不费劲。"}],"r":["只有 HTML 无法做组件化、路由和构建优化。","CDN 引入适合演示，做工程化项目会缺模块化和构建能力。","脚手架就是为了免去手写构建配置，说必须手写反而倒退了。",""]},{"id":168,"t":"如何实现 Vuex 中 store 的插件？","c":"Vue","o":["插件必须是一个 Vue 组件，通过 props 接收 store","函数接收 store，用 subscribe 监听 mutation","插件通过修改 getters 的返回值来影响组件渲染","Vuex 不支持插件机制，只能手写中间件"],"a":1,"w":"Vuex 插件是一个函数，接收 store 作为参数，通常用 store.subscribe 监听 mutation 来做持久化、日志、埋点。vuex-persistedstate 就是典型例子。","b":[{"type":"p","text":"Vuex 插件本质是一个函数，接收 store 实例作为唯一参数，在插件内部可以订阅 store 的 mutation 变化，做额外处理。这种机制适合实现日志记录、持久化、异步同步等副作用逻辑。"},{"type":"p","text":"1）插件函数在调用时立即执行，你可以在这里订阅事件。比如想实现一个简单的日志插件，打印每次 mutation 的类型和最新的 state。"},{"type":"code","text":"const loggerPlugin = store => {\n  store.subscribe((mutation, state) => {\n    console.log('mutation:', mutation.type)\n    console.log('state: ', state)\n  })\n}"},{"type":"p","text":"2）如果要做状态持久化，比如把 state 存到 localStorage，也可以在这个回调里操作。像 vuex-persistedstate这个库就是基于这个原理，页面刷新后从 localStorage 恢复数据。"},{"type":"p","text":"3）注册插件时通过 plugins 数组传入，多个插件各自独立运行。"},{"type":"code","text":"const store = new Vuex.Store({\n  plugins: [loggerPlugin, persistedStatePlugin]\n})"},{"type":"p","text":"注意插件不会改变 mutation 或 action 的执行流程，它只是“监听者”。如果你需要拦截或改写行为，得在 action 内部处理，或者结合模块的 getter 做封装。"}],"r":["插件是普通函数，不是组件。","","getters 是派生数据，插件不改它，改的是对 mutation 的监听。","Vuex 有完整的插件机制，createStore 的 plugins 选项就是入口。"]},{"id":169,"t":"如何在 Vue 3 中实现一个复杂的表单验证和提交逻辑？","c":"Vue","o":["reactive 管数据，规则校验，统一处理提交","只要用了 v-model 就自动具备校验能力","必须把表单数据放进 Vuex","表单校验只能由后端完成"],"a":0,"w":"复杂表单拆成四件事：reactive 管数据、规则对象管校验（可用 async-validator 或 UI 库的 Form 校验）、提交时统一校验、loading 和错误状态单独管理。","b":[{"type":"p","text":"表单验证和提交在 Vue 3 里其实可以很清爽，关键在于把逻辑分层，别全塞在组件里。"},{"type":"p","text":"1）用 ref 或 reactive 管理表单数据，配合 v-model 双向绑定。比如用户信息表单，字段一多就得用"},{"type":"p","text":"reactive 包一层，结构清晰。"},{"type":"p","text":"2）验证逻辑建议抽离成独立函数或使用现成方案。组合式函数（composables） 是解耦利器。你可以写个"},{"type":"p","text":"useFormValidation ，接收表单对象，返回错误信息和校验方法。比如对接 VeeValidate，它支持基于规则的异步校验，还能和 <Field> 、<Form> 组件配合，模板代码少一半。"},{"type":"p","text":"3）提交时别忘了防抖和 loading 状态。点击提交先 await validate() ，失败就高亮错误字段，成功再发请求。Axios 拦截器可以统一处理 400 错误回填到对应字段。"},{"type":"p","text":"4）复杂场景比如动态增减表单项，用 v-for 渲染数组时记得加 key ，最好用每项的唯一 ID，避免 DOM 复用导致输入错乱。"},{"type":"code","text":"const form = reactive({ name: '', email: '' })\nconst errors = ref({})\nconst validate = () => {"},{"type":"p","text":"if (!form.name) errors.value.name = '姓名必填'if (!/^\\S+@\\S+$/.test(form.email)) errors.value.email = '邮箱格式不对'"},{"type":"code","text":"  return Object.keys(errors.value).length === 0\n}\nconst submit = async () => {\n  errors.value = {}\n  if (!validate()) return\n  try {\n    await api.submitForm(form)"},{"type":"p","text":"alert('提交成功')"},{"type":"code","text":"  } catch (err) {"},{"type":"p","text":"errors.value.global = '网络出问题了'"},{"type":"code","text":"  }\n}"},{"type":"p","text":"流程上就是：用户操作 → 数据更新 → 提交触发 → 校验驱动 → 结果反馈。"}],"r":["","v-model 只做双向绑定，校验要自己写规则。","表单数据属于组件内部状态，放进 Vuex 反而增加耦合。","前端校验负责即时反馈，后端校验负责安全，两者都要有。"]},{"id":170,"t":"如果要实现一个 Vue3 的弹窗组件，你会如何设计？","c":"Vue","o":["Teleport 挂到 body，props 控制显隐","在组件内部写 position: fixed 就行，不用考虑层级","弹窗无法封装成组件","弹窗必须用 iframe 实现"],"a":0,"w":"弹窗组件要解决四个问题：挂载位置（Teleport 到 body，避免父级 overflow/transform 影响）、显隐控制（props 加 emit）、层级与遮罩、焦点管理（ESC 关闭、焦点锁定）。","b":[{"type":"p","text":"弹窗组件的关键是解耦和灵活性，既要控制显隐，又得让内容自由定义。"},{"type":"p","text":"用 v-model 管理显示状态最自然，父组件绑定一个 visible 变量就行。子组件通过"},{"type":"p","text":"emit('update:visible', false) 来关闭自己，双向同步就起来了。别用 $refs 手动控制，维护成本高。"},{"type":"p","text":"内容部分交给插槽，尤其是具名插槽。比如 header 放标题，footer 放按钮，default 是主体内容。这样用户塞什么都能接住，通用性拉满。"},{"type":"code","text":"<template>\n  <teleport to=\"body\">\n    <div v-show=\"visible\" class=\"modal\">\n      <div class=\"modal-content\">\n        <slot name=\"header\"><\/slot>\n        <slot><\/slot>\n        <slot name=\"footer\"><\/slot>\n      <\/div>\n    <\/div>\n  <\/teleport>\n<\/template>"},{"type":"p","text":"Teleport 很重要，把弹窗扔到 body 下，避免父级 overflow: hidden 截掉内容，也防止样式污染。"},{"type":"p","text":"事件处理要干净。点击遮罩关闭可以加个 @click.self ，只有点击背景才触发。键盘 esc 关闭监听 keydown 事件，挂载时绑定，卸载时清理，别留垃圾。"},{"type":"p","text":"如果要做全局调用模式，像 Modal.confirm() 这种，可以用 render 函数动态创建 vnode，挂到 body 上。参考 Element Plus 的实现方式，用服务的方式注入，但注意内存泄漏。"},{"type":"p","text":"1）支持 v-model 双向绑定"},{"type":"p","text":"2）使用 <slot> 提供内容定制"},{"type":"p","text":"3）通过 Teleport 脱离当前 DOM 结构"},{"type":"p","text":"4）提供 props 控制行为（如 closeOnClickModal ）"},{"type":"p","text":"5）emit 显式抛出事件供外部响应"},{"type":"p","text":"这种设计能覆盖大部分场景，从简单提示到复杂表单都能装。"}],"r":["","父级有 overflow:hidden 或 transform 时，fixed 会失效或层级错乱。","弹窗完全可以封装成组件，这是最常见的组件之一。","iframe 会带来通信和样式隔离的新问题，不是必需。"]},{"id":171,"t":"如何在 Vue 中实现权限管理？如何控制权限到按钮级别？","c":"Vue","o":["权限只能在后端模板里控制","只在 CSS 里把按钮隐藏起来就能保证安全","路由守卫 + 动态路由，按钮用自定义指令","前端做了权限控制就可以不做后端校验"],"a":2,"w":"页面级权限用路由守卫加动态路由（登录后按角色生成可访问路由），按钮级用自定义指令 v-permission 或权限判断函数控制显隐。但前端只是体验层，接口鉴权必须由后端做。","b":[{"type":"p","text":"权限管理在 Vue 项目里，一般通过路由守卫和动态组件渲染来实现。核心是把用户的权限信息和页面、操作做映射。"},{"type":"p","text":"1）路由级别的控制最常见。用户登录后拿到角色或权限列表，比如 ['admin', 'editor'] ，再通过"},{"type":"p","text":"router.beforeEach 拦截导航，判断目标路由是否需要权限，以及当前用户有没有对应权限。没有就重定向到403 或登录页。"},{"type":"code","text":"router.beforeEach((to, from, next) => {\n  const requiresAuth = to.matched.some(record => record.meta.requiresAuth)\n  const userRoles = store.state.user.roles\n  if (requiresAuth && !userRoles.includes('admin')) {\n    next('/forbidden')\n  } else {\n    next()\n  }\n})"},{"type":"p","text":"2）按钮级别控制更细粒度。可以在全局注册一个指令 v-permission ，根据用户权限决定是否渲染按钮。"},{"type":"code","text":"Vue.directive('permission', {\n  inserted(el, binding) {\n    const { value } = binding\n    const userPermissions = store.state.user.permissions\n    if (value && !userPermissions.includes(value)) {\n      el.parentNode.removeChild(el)\n    }\n  }\n})"},{"type":"p","text":"使用时直接写 <button v-permission=\"'delete'\">删除<\/button> 就行。"},{"type":"p","text":"这种方案在中后台系统像 Ant Design Pro 或 Element Admin 里很常见。关键是把权限字段设计清楚，后端返回的权限最好是扁平化的字符串数组，前端匹配起来简单高效。"},{"type":"p","text":"整个过程其实就两步：路由守卫拦大头，自定义指令切细节。只要权限数据结构定好了，剩下的都是模板代码。"}],"r":["后端控制的是数据，前端的页面和按钮同样需要控制。","CSS 隐藏只是看不见，接口照样能调，等于没做权限。","","隐藏按钮不等于禁止调用接口，后端鉴权才是安全底线。"]},{"id":172,"t":"使用 Vue 渲染大量数据时，如何进行优化？","c":"性能优化","o":["直接 v-for 渲染全部，浏览器会自动优化","增加更多计算属性","虚拟列表、冻结非响应式数据、分批渲染","用 v-html 拼接字符串一定更快"],"a":2,"w":"大量数据渲染的瓶颈在 DOM 数量和响应式劫持开销：虚拟列表只渲染可视区、Object.freeze 冻结不需要响应式的数据、分批异步渲染避免长时间占用主线程。","b":[{"type":"p","text":"长列表滚动卡顿，本质是 DOM 元素太多导致内存占用高、渲染和重排压力大。Vue 本身响应式系统也会对每个节点做依赖追踪，数据量大了初始化就慢。"},{"type":"p","text":"1）虚拟滚动是这类问题的标准解法。只渲染视口内及附近的数据，比如用 vue-virtual-scroller 或"},{"type":"p","text":"element-plus 的 el-virtual-scroll 。假设你有 10 万条数据，每条占 50px，总高度 500 万像素，但视口只有 500px 高，实际只需要渲染 10~20 个元素，滚动时动态更新内容。"},{"type":"code","text":"<template>\n  <RecycleScroller :items=\"bigList\" :item-size=\"50\">\n    <template #default=\"{ item }\">\n      <div>{{ item.name }}<\/div>\n    <\/template>\n  <\/RecycleScroller>\n<\/template>"},{"type":"p","text":"2）避免在 v-for 里用复杂计算或函数调用，这些会在每次渲染执行。computed 和方法调用要区分清楚。"},{"type":"p","text":"3）合理使用 key ，但别用 index。用唯一 id 能让 Vue 的 diff 更准，减少不必要的重新创建。"},{"type":"p","text":"4）数据分片加载，比如结合 IntersectionObserver 实现懒加载，或者直接用分页降低单次渲染量。"},{"type":"p","text":"5）组件层级太深会加重复建开销，能扁平就扁平。另外，v-if 和 v-show 选对场景，频繁切换用 v-show。"},{"type":"p","text":"6）如果数据是静态的，可以用 Object.freeze() 包一层，让 Vue 跳过响应式处理，提升解析速度。"},{"type":"code","text":"this.bigList = Object.freeze(largeData)"},{"type":"p","text":"这种组合拳下来，万级数据也能流畅滚动。"}],"r":["浏览器不会自动优化上万条 DOM，反而会卡死。","计算属性解决的是派生数据，不减少节点数量。","","v-html 省掉了组件开销，但一次性插入十万节点同样会卡，还丢失事件和响应式。"]},{"id":173,"t":"Vue 2 和 Vue 3 有哪些区别？Vue 3 有哪些更新？","c":"Vue","o":["Proxy 响应式、组合式 API、更好的 TS","Vue3 只是改了版本号，API 完全一致","Vue3 不再支持组件化开发","Vue3 移除了虚拟 DOM"],"a":0,"w":"Vue 3 的主要变化：响应式改用 Proxy、新增组合式 API（setup/ref/reactive）、支持 Fragment/Teleport/Suspense、TypeScript 支持更好、编译期优化更多。","b":[{"type":"p","text":"Vue 3 相比 Vue 2 是一次全方位的升级，不只是 API 变了，底层架构也重构了。"},{"type":"p","text":"响应式系统改用 Proxy，不再依赖 defineProperty。这就让 Vue 3 能监听动态属性添加、数组下标修改这些以前压根不经过 getter 的操作。而且 Proxy 拦截的是整个对象，初始化时不用递归遍历所有属性，性能更好，内存占用更低。"},{"type":"p","text":"组件写法上多了 Composition API，可以把逻辑按功能组织，而不是散在 data、methods、computed 里。大组件维护起来更清晰，逻辑复用也方便，类似 React Hooks 的思路。setup 函数是入口，配合 ref、reactive、watch 等函数使用。"},{"type":"p","text":"模板方面支持多个根节点，不用非得包一层 div。编译器做了优化，会静态提升不变的节点，打上 patchFlag 标记动态内容，运行时 diff 更快。Tree-shaking 支持也更好，没用的模块不会被打包进去。"},{"type":"p","text":"生态层面，Vue Router 4 和 Pinia 都是为 Vue 3 设计的。尤其是 Pinia，取代 Vuex 成为官方推荐状态库，API 更简洁，类型推导也更强。"},{"type":"p","text":"旧项目如果用了大量 Vue 2 插件或依赖 defineProperty 的逻辑，迁移要小心。但新项目直接上 Vue 3，开发体验和运行效率都更稳。"}],"r":["","Vue 3 有大量破坏性变更，API 并不完全一致。","组件化是 Vue 的核心，Vue 3 只是换了写法（组合式 API）。","虚拟 DOM 仍在，只是 diff 更精准。"]},{"id":174,"t":"如何解决 Vue 打包时 vendor 文件过大的问题？","c":"Vue","o":["vendor 体积不影响加载速度","把 vendor 拆成多个小文件即可，不需要分析","删除 node_modules 重新安装","splitChunks 拆分、按需引入、CDN 外链"],"a":3,"w":"vendor 大通常是全量引入了 UI 库或工具库：用 splitChunks 拆分、按需引入组件、把大依赖外链到 CDN、用分析工具定位最大的包，必要时换更轻的替代库。","b":[{"type":"p","text":"vendor 包过大，本质是把所有第三方依赖全塞进一个文件里了。首屏加载得等它下完才能动，体验直接崩掉。"},{"type":"p","text":"1）先用 webpack-bundle-analyzer 把 vendor 撬开看看，谁占的体积最大。常见大头比如 lodash、moment、echarts，这些往往是“被全量引入”的。"},{"type":"p","text":"2）针对性拆解。像 lodash 这种，别 import * from 'lodash'，改用按需引入 import debounce from'lodash/debounce' ，或者上 babel-plugin-lodash 帮你自动做这事儿。"},{"type":"p","text":"3）moment 也一样，全量引入带一堆语言包，用 import 'moment/locale/zh-cn' 配合 Webpack 的IgnorePlugin 干掉不需要的 locale。"},{"type":"p","text":"4）代码分割才是正道。Webpack 的 splitChunks 配置可以把 node_modules 里不同的库拆成独立 chunk，比如把 vue、vue-router、axios 各自分开，让浏览器能并行下载，还能利用缓存。"},{"type":"code","text":"// webpack.config.js\noptimization: {\n  splitChunks: {\n    chunks: 'all',\n    cacheGroups: {\n      vendor: {\n        test: /[\\\\/]node_modules[\\\\/]/,\n        name: 'vendor',\n        chunks: 'all',\n        enforce: true\n      }\n    }\n  }\n}"},{"type":"p","text":"5）更狠一点，把特别大的包外链引入，比如从 CDN 加载 vue.min.js，然后在 webpack 里用 externals 排除它，不打进去。"},{"type":"p","text":"最简单的优化就是先分析，再按需引入，最后拆包。三步下来，vendor 从几 MB 干到几百 KB 很正常。"}],"r":["vendor 直接决定首屏下载量，影响很大。","不分析就拆，只是把一个大文件切成几个，总量没变。","重装依赖不会改变引入方式，体积一样。",""]},{"id":175,"t":"如何设计实现一款 Vue 的组件库？","c":"Vue","o":["组件库不需要文档","组件库只能用 JS 编写，不能用 TS","统一规范、按需加载、类型声明、文档测试","把所有组件写在一个文件里方便维护"],"a":2,"w":"组件库的工程化要素：统一的设计规范和主题变量、支持按需加载、完整的 TS 类型声明、文档与示例、单元测试和语义化版本管理。","b":[{"type":"p","text":"设计实现 Vue 组件库，第一步是明确边界和规范。你得先定一套代码风格、目录结构和构建流程，一般用 Vite 搭配TypeScript，支持按需引入和 tree-shaking。"},{"type":"p","text":"组件设计上，基础组件像 Button、Input 这些要拆成原子级，通过 props 控制变体，样式隔离用 scoped CSS 或 CSS Modules。复杂组件比如 Table，内部可以组合多个子组件，但对外暴露简洁 API。"},{"type":"p","text":"1）每个组件都要有独立的单元测试，用 Vitest 跑断言，确保逻辑正确"},{"type":"p","text":"2）文档不能少，用 VitePress 搭建示例站，实时展示用法和交互效果"},{"type":"p","text":"3）打包时生成 d.ts 类型声明文件，保证使用者在 IDE 里能获得完整提示"},{"type":"p","text":"公共逻辑抽离成 hooks 或工具函数，比如表单校验、事件总线。主题定制通过 CSS 变量实现，用户改几个颜色变量就能换肤。"},{"type":"p","text":"版本管理用 semantic-release，结合 commit 规范自动发版。NPM 发包前压缩产物，分 esm 和 cjs 两套输出，适配不同环境。"},{"type":"p","text":"别一上来就造轮子，参考 Element Plus 和 Naive UI 的架构设计，尤其是它们怎么处理全局配置和国际化。真正难的是长期维护和 API 兼容性，不是写几个组件那么简单。"}],"r":["文档是组件库的入口，没有文档没人敢用。","Vue 3 的组件库普遍用 TS 编写，类型提示是核心竞争力。","","所有组件写一个文件无法按需加载，也无法维护。"]},{"id":176,"t":"如何自主设计实现一个 Vue 路由系统？","c":"Vue","o":["路由只能由浏览器原生实现","直接用 a 标签跳转即可，不需要路由","监听 URL 变化，路由表匹配后渲染组件","路由必须依赖 Vuex"],"a":2,"w":"前端路由的本质是“URL 到组件的映射”：监听 history 的 pushState/popstate 或 hashchange，匹配路由表后渲染对应组件，同时维护历史栈和守卫。","b":[{"type":"p","text":"实现一个简易的 Vue 路由系统，关键在于监听 URL 变化、维护路由映射、动态渲染对应组件。整个过程不依赖 Vue Router，而是用原生 JS 和 Vue 的响应性机制来驱动。"},{"type":"p","text":"首先得明白前端路由的本质：URL 改变时不发请求，但要更新视图。我们靠 history.pushState 和 popstate来拦截前进后退，避免页面刷新。"},{"type":"p","text":"1）定义一个路由表，把路径和组件关联起来"},{"type":"code","text":"const routes = {\n  '/': HomePage,\n  '/about': AboutPage\n}"},{"type":"p","text":"2）创建一个响应式的当前路径变量，Vue 模板里用它决定渲染谁"},{"type":"code","text":"const router = Vue.reactive({ current: window.location.pathname })"},{"type":"p","text":"3）监听浏览器动作，比如点击返回键"},{"type":"code","text":"window.addEventListener('popstate', () => {\n  router.current = window.location.pathname\n})"},{"type":"p","text":"4）提供跳转方法，替换 URL 且不刷新"},{"type":"code","text":"function navigateTo(path) {\n  window.history.pushState({}, '', path)\n  router.current = path\n}"},{"type":"p","text":"5）写个 <router-view> 组件，根据 current 渲染对应的组件"},{"type":"code","text":"const RouterView = {\n  render() {\n    const Component = routes[router.current] || NotFound\n    return h(Component)\n  }\n}"},{"type":"p","text":"6）初始化时处理首次加载路径，可能需要 fallback"},{"type":"p","text":"整个流程走下来，核心其实是 路径与组件的映射 + history API 控制导航 + 响应式驱动视图更新。Vue Router 还处理了嵌套路由、守卫、懒加载这些复杂场景，但自主实现的话，抓住这三点就能跑通基础流程。"}],"r":["浏览器只提供 history/hash 的 API，路由表匹配要自己实现。","a 标签会整页刷新，SPA 需要的是无刷新跳转。","","路由和状态管理是两件事，不需要互相依赖。"]},{"id":177,"t":"如何解决 SPA 单页应用首屏加载速度慢的问题？","c":"性能优化","o":["把所有页面打包进一个文件","改用 hash 路由就能解决","加一个 loading 动画就能解决","代码分割、SSR、骨架屏、资源压缩"],"a":3,"w":"SPA 首屏要等 JS 下载、解析、执行完才有内容，所以优化方向是：代码分割减小首包、SSR/预渲染直接返回 HTML、骨架屏改善等待感知、资源压缩和 CDN。","b":[{"type":"p","text":"首屏加载慢，本质是资源下载和执行耗时叠加导致的白屏。解决思路围绕“减体积、提速度、早展示”展开。"},{"type":"p","text":"1）关键路径资源做代码分割，用 Webpack 的 splitChunks 把框架、业务、第三方库拆成独立 chunk。路由级懒加载按需加载，首屏只拉必要 JS。"},{"type":"p","text":"2）开启 Gzip 或 Brotli 压缩，文本类资源体积能压到 30% 以下。配合 CDN 边缘节点缓存，缩短传输距离。"},{"type":"p","text":"3）服务端渲染（SSR）直接输出 HTML 内容，用户请求进来，服务器把 Vue/React 组件渲染成带数据的 HTML 返回，避免客户端空容器挂载。Next.js、Nuxt.js 就是典型实现。"},{"type":"p","text":"4）静态资源加 hash 并开启 long-term caching，JS/CSS 文件名带版本，浏览器可长期缓存，更新时通过 manifest匹配。"},{"type":"p","text":"5）预加载提示，用 <link rel=\"preload\"> 提前拉高优先级资源，比如首屏依赖的字体或关键 JS。"},{"type":"p","text":"6）骨架屏替代白屏，比 loading 文字更友好。在 SSR 或客户端 hydration 前，先展示结构化占位图。"},{"type":"p","text":"纯 CSR 项目改 SSR 收益最大，但运维复杂度上升。如果搞不定服务端部署，优先做压缩 + 路由懒加载 + 骨架屏，三招能扛住大部分场景。"}],"r":["打成一个文件会让首包更大，首屏更慢。","hash 与 history 只影响 URL 形式，不影响加载速度。","loading 只是遮住白屏，内容并没有更早出现。",""]},{"id":178,"t":"Vuex 的实现原理是什么？","c":"Vue","o":["用 Object.defineProperty 监听所有属性","通过轮询检测状态变化","基于 localStorage 实现响应式","本质是借助 Vue 的响应式实现"],"a":3,"w":"Vuex 本质是把 state 放进 Vue 的响应式系统：Vuex 3 用 new Vue({data: state})，Vuex 4 用 reactive()。因此组件读取 state 会自动收集依赖，修改时自动更新视图。","b":[{"type":"p","text":"Vuex 的本质是把组件的共享状态抽出来，用一个全局的 store 管理。组件想改数据，必须走规定的流程，不能私自修改，这样状态变化就可预测、可追踪。"},{"type":"p","text":"store 其实就是一个 JavaScript 对象，里面存着 state，所有组件都能访问。但关键在于，它利用 Vue 的响应式机制，让 state 被监听。一旦 state 变了，依赖它的组件自动更新，这一步靠的就是 Vue 的 reactive 或 ref 那套系统。"},{"type":"p","text":"改变 state 不能直接操作，得通过 mutation。每个 mutation 是个同步函数，名字你定义，比如叫 INCREMENT ，调用时传参数。store 提供 commit 方法来触发 mutation。同步是为了 devtools 能记录每次状态变更前后的快照。"},{"type":"p","text":"如果要处理异步，比如接口请求，就得用 action。action 可以包含异步操作，最后通过 commit 去触发mutation。组件里不用 commit ，而是用 dispatch 来调 action。"},{"type":"code","text":"// 简化版伪代码\nconst store = {\n  state: reactive({ count: 0 }),\n  mutations: {\n    INCREMENT(state) {\n      state.count++\n    }\n  },\n  commit(type, payload) {\n    this.mutations[type](this.state, payload)\n  }\n}"},{"type":"p","text":"整个流程就是：组件 dispatch action → action 做异步 → commit mutation → mutation 同步改 state → Vue 响应式更新视图。"}],"r":["defineProperty 是 Vue 2 组件响应式的实现，Vuex 3 是借 new Vue 复用整套机制。","Vuex 是响应式的，不需要轮询。","localStorage 不参与响应式，Vuex 也不基于它。",""]},{"id":179,"t":"Vue 如何优化网站首页的加载速度？","c":"性能优化","o":["增加更多全局样式，让页面视觉更统一","懒加载、按需引入、CDN、SSR、减少接口","关闭路由懒加载，让所有页面一次性加载完","把所有组件都改成全局注册，减少注册开销"],"a":1,"w":"首页优化：路由懒加载和组件按需引入减小首包、图片懒加载、CDN 加速、SSR 或预渲染、减少首屏接口数量并做缓存。","b":[{"type":"p","text":"首页加载速度直接影响用户留存，Vue 项目可以从构建、传输、渲染三个环节下手优化。"},{"type":"p","text":"1）构建阶段做代码分割。用动态 import() 拆分路由组件，避免首屏加载所有 JS。公共依赖抽到 vendor，配合Webpack 的 SplitChunksPlugin 控制 chunk 大小，一般单个不超过 100KB。"},{"type":"p","text":"2）开启 Gzip 或 Brotli 压缩。静态资源体积能压到原来的 30% 左右，Nginx 配一下 gzip on 就行。顺便开 HTTP/2，多资源并行加载更高效。"},{"type":"p","text":"3）服务端渲染（SSR）或者预渲染。对 SEO 敏感的页面，用 Nuxt.js 做 SSR，首屏直接吐 HTML。如果是营销页这类静态内容，prerender-spa-plugin 在构建时生成快照，省去客户端 hydration 时间。"},{"type":"p","text":"4）资源加载优先级调整。关键 CSS 内联，非核心 JS 加 defer 或 async。图片懒加载用 vue-lazyload，首屏只载可视区内容。"},{"type":"p","text":"5）利用浏览器缓存。JS/CSS 文件名加 hash，设置 long-term cache headers，二次访问基本不走网络。"},{"type":"p","text":"CDN 也是标配，把静态资源推到离用户最近的节点。像阿里云 CDN、Cloudflare 都能显著降低首字节时间。"}],"r":["全局样式越多，样式计算越慢，还会互相覆盖。","","关掉懒加载会让首包变大，首屏更慢。","全局注册会让所有组件都进主包，无法摇树。"]},{"id":180,"t":"如何优化 Webpack 打包 Vue 应用的速度？","c":"Vue","o":["把 Vue 换成 jQuery","增加更多 source map 类型","关闭 tree-shaking 以加快构建","开缓存、多线程、排除 node_modules"],"a":3,"w":"打包提速的常规手段：开启持久化缓存、thread-loader 多线程、排除 node_modules、减少不必要的 loader、把大依赖外链到 CDN。","b":[{"type":"p","text":"打包速度慢直接拖垮开发体验，尤其在大型 Vue 项目里。优化得从 资源消耗大头 下手，先搞清楚 Webpack 哪些环节最耗时。"},{"type":"p","text":"1）减少模块解析和编译时间"},{"type":"p","text":"Babel 转译是重灾区，尤其是 node_modules 。用 include 或 exclude 明确范围，比如只处理 src 目录。"},{"type":"code","text":"module: {\n  rules: [\n    {\n      test: /\\.js$/,\n      loader: 'babel-loader',"},{"type":"p","text":"exclude: /node_modules/ // 关键，第三方包一般不用转"},{"type":"code","text":"    }\n  ]\n}"},{"type":"p","text":"2）提升查找效率"},{"type":"p","text":"Webpack 查找模块时会尝试各种后缀和目录。缩小搜索范围能省不少时间。"},{"type":"code","text":"resolve: {\n  extensions: ['.vue', '.js', '.ts'],\n  alias: {\n    '@': path.resolve(__dirname, 'src')\n  },"},{"type":"p","text":"modules: [path.resolve(__dirname, 'node_modules')] // 避免层层往上找"},{"type":"code","text":"}"},{"type":"p","text":"3）缓存中间结果"},{"type":"p","text":"cache: { type: 'filesystem' } 开启文件级缓存，二次构建直接复用上次结果。Babel、TypeScript 都能受益。"},{"type":"p","text":"4）多进程并行处理"},{"type":"p","text":"thread-loader 放在 babel-loader 前面，开启多线程跑转译。注意启动开销，小项目可能不划算。"},{"type":"p","text":"5）用更优的工具链替代"},{"type":"p","text":"直接上 Vite 。它基于 ES Modules + 原生浏览器支持，启动靠 esbuild 预构建，热更新秒级响应。开发环境体验碾压 Webpack。"},{"type":"p","text":"6）按需加载路由和组件"},{"type":"p","text":"配合 import() 动态导入，拆分 chunk，首次加载只拿必要代码。既能提速也能减小主包体积。"}],"r":["换框架解决不了构建速度问题。","source map 越详细，构建越慢。","关掉 tree-shaking 只会让产物更大，构建也不会更快。",""]},{"id":181,"t":"在 Vue 开发过程中需要同时与多个后端人员联调接口时，你会怎么做？","c":"Vue","o":["开多个浏览器分别联调","统一请求层加环境变量配多套 baseURL","必须等后端全部完成才能开始联调","每次联调都改代码里的域名并提交"],"a":1,"w":"多后端联调的关键是“配置化”：统一请求层，用环境变量或代理配置多套 baseURL，配合 mock 和接口文档，让不同后端地址可以随时切换而不改代码。","b":[{"type":"p","text":"前端和后端并行开发时，接口联调容易因为依赖不同步卡住进度。关键不是等后端给接口，而是自己先把“假数据”跑起来。"},{"type":"p","text":"用本地 Mock 是最直接的方案。比如在 Vue 项目里集成 vite-plugin-mock，路由一配，不用改一行业务代码就能拦截请求返回模拟数据。后端没给接口？自己写个 JSON 模拟响应结构就行，字段类型和真实接口对齐，前端功能照常开发。"},{"type":"p","text":"但多人协作时更怕的是接口定义不一致。光靠口头约定字段名很容易出错。这时候得靠契约驱动，比如用 Swagger（OpenAPI）定义接口规范。前后端先对好 YAML 文件，后端按契约实现，前端也能用这个文件生成 Mock 规则或TypeScript 类型。Apifox 或 YApi 这类工具能同步维护文档和 Mock，团队成员都能看，减少沟通偏差。"},{"type":"p","text":"如果后端已经部分可用，可以用代理分流。Vite 的 server.proxy 配置把 /api/user 转到测试环境，而"},{"type":"p","text":"/api/order 还走本地 Mock，混合联调，灵活过渡。"}],"r":["开多个浏览器解决不了接口地址冲突。","","联调可以在接口定义确定后就并行开始，不必等全部完成。","把域名写死再提交，会让其他人的环境直接崩掉。"]},{"id":182,"t":"v-if 和 v-for 在 Vue 中的优先级是什么？如果它们同时出现，应该如何优化以获得更好的性能？","c":"Vue","o":["Vue 3 中两者优先级相同","v-if 优先级更高，先判断再循环，因此性能最优","v-for 先执行，边遍历边判断，浪费渲染","两者同时出现时，Vue 会自动把 v-if 提到外层，无需手动优化"],"a":2,"w":"Vue 2 中 v-for 优先级高于 v-if，会先遍历再逐项判断，列表大时白白浪费渲染；Vue 3 反过来，v-if 优先级更高，会因访问不到循环变量而报错。两个版本的正确做法都是不要写在一起。","b":[{"type":"p","text":"v-if 和 v-for 的优先级问题，其实是个典型的性能陷阱。Vue 2 和 Vue 3 的处理方式还不一样，得分开看。"},{"type":"p","text":"在 Vue 2 中，v-for 的优先级更高，这意味着它会先遍历列表，再对每一项执行 v-if 判断。比如你写 <li v-for=\"item in items\" v-if=\"item.active\"> ，即使 item 不 active，也会被纳入循环创建虚拟 DOM 节点，最后才过滤掉。这明显浪费计算资源，尤其是列表长的时候，渲染1000个节点只显示10个，性能直接拉胯。"},{"type":"p","text":"Vue 3 做了改进，v-if 现在拥有更高优先级。但注意，这只是语法层面的提升，如果你还是把它们写在同一个元素上，Vue 3 编译器会报警告，因为它知道这种写法容易出事。"},{"type":"p","text":"最优解是别让它们出现在同一个标签上。常见做法是用 <template> 包一层。先把条件判断提到外层，比如："},{"type":"code","text":"<template v-if=\"items.length\">\n  <li v-for=\"item in items\" :key=\"item.id\">\n    {{ item.name }}\n  <\/li>\n<\/template>"},{"type":"p","text":"或者更进一步，在 v-for 内部避免使用可能被频繁过滤的逻辑，把过滤提前到 computed 上："},{"type":"code","text":"computed: {\n  activeItems() {\n    return this.items.filter(item => item.active)\n  }\n}"},{"type":"p","text":"然后模板里只用 v-for=\"item in activeItems\" ，根本不需要 v-if。这样数据源本身就干净了，渲染效率最高。"}],"r":["Vue 3 中 v-if 优先级高于 v-for，并不相同。","Vue 2 中优先级更高的是 v-for；Vue 3 中 v-if 先执行会直接报错。","","Vue 不会自动优化结构，仍然要手动把 v-if 提到外层。"]},{"id":183,"t":"使用 Vue 开发一个任务列表应用，你会怎么设计实现？","c":"Vue","o":["必须使用 Vuex 才能实现","把所有逻辑写在一个 HTML 文件里","任务列表必须依赖后端存储","数组维护任务，拆组件，computed 过滤"],"a":3,"w":"任务列表的核心是“数据驱动视图”：用数组维护任务（id、内容、状态），拆成输入框、列表、列表项组件，用 computed 做过滤统计，需要时持久化到 localStorage。","b":[{"type":"p","text":"用 Vue 做任务列表，重点是把状态管理和交互逻辑理清楚。先从最小可用单元入手，一个任务项无非是标题、完成状态、删除和编辑功能。"},{"type":"p","text":"数据结构上，每个任务对象至少包含 id、title、completed 三个字段。状态集中放在 store 里管理，小项目直接用组合式 API 的 ref 或 reactive 就够了，比如用 const tasks = ref([]) 存所有任务。"},{"type":"p","text":"核心操作就几个：增、删、改、过滤。添加任务注意输入防抖，避免空内容提交；删除用 splice 或 filter 都行，建议加个二次确认；修改支持双击编辑或内联输入框；过滤可以通过 computed 动态生成 active/done/all 列表。"},{"type":"code","text":"const filteredTasks = computed(() => {\n  if (filter.value === 'active') return tasks.value.filter(t => !t.completed)\n  if (filter.value === 'done') return tasks.value.filter(t => t.completed)\n  return tasks.value\n})"},{"type":"p","text":"组件拆分按职责来。App 根组件管状态和路由，TaskList 负责渲染列表，TaskItem 处理单个任务的交互。如果任务复杂，可以抽一个 TaskForm 专门处理新增和编辑。"},{"type":"p","text":"样式交互方面，Vue 的 transition 对列表很友好，v-for 配合 v-if 实现条件渲染，key 一定要用唯一 id。本地持久化直接 localStorage 挂 onMounted 和 onUpdated 钩子同步数据，简单可靠。"},{"type":"p","text":"这类应用本质是 CRUD + 状态同步，只要数据流清晰，DOM 更新自然就对了。Vuex 或 Pinia 可以等需求变复杂再引入，初期别搞得太重。"}],"r":["小应用用组件内 state 就够，Vuex 反而增加复杂度。","单文件写法无法复用和测试，稍微复杂就失控。","localStorage 就能满足本地任务列表，不必依赖后端。",""]},{"id":184,"t":"有哪些 Vue 性能优化的方法？","c":"性能优化","o":["合理用 v-if/v-show、computed、虚拟列表","把所有数据都设为响应式，方便统一管理","尽量用 watch 替代 computed，逻辑更直观","尽量增加组件嵌套层级，便于职责拆分"],"a":0,"w":"Vue 性能优化分三层：渲染层（v-if/v-show 合理选择、v-for 稳定 key、虚拟列表）、数据层（computed 缓存、避免大对象深度响应式）、加载层（路由懒加载、按需引入）。","b":[{"type":"p","text":"组件懒加载很常见，把组件按路由或功能拆成 chunk，用 import() 动态引入，首屏只加载必要代码。比如管理后台每个子模块都可以单独打包，进页面才拉对应资源。"},{"type":"p","text":"列表渲染别用 index 当 key，得用唯一 id。用 index 会导致更新错乱，尤其是增删元素时，diff 算法会误判节点状态，可能引发不必要的重新渲染和事件绑定错误。"},{"type":"p","text":"v-if 和 v-show 要分场景用。v-if 是条件销毁，切换开销大但初始不渲染省资源；v-show 是切 display，适合频繁切换。比如弹窗出现次数多，就用 v-show 更合适。"},{"type":"p","text":"计算属性尽量不用在模板里直接写复杂表达式，容易重复执行。computed 有缓存，依赖不变就不会重算。比如过滤列表这种，用 computed 包一层，比 methods 性能好得多。"},{"type":"p","text":"监听器注意及时销毁，特别是全局事件或定时器。组件内用 $on 的话，记得在
