beforeDestroy 解绑，否则可能内存泄漏。Vue 3 的 setup 语法糖配合 onUnmounted 更方便。"},{"type":"p","text":"大数据量列表要用虚拟滚动，只渲染可视区域。比如渲染上万条数据，全塞 DOM 浏览器直接卡死。可以用第三方库如vue-virtual-scroller，维持固定数量的 dom 元素滚动复用。"},{"type":"p","text":"keep-alive 缓存组件状态，避免重复创建销毁。比如表单页来回切换，包一层 keep-alive 能保留输入内容和滚动位置，体验更好，也减少重渲染开销。"}],"r":["","所有数据都设为响应式会带来大量 watcher 开销。","watch 不会缓存，computed 才有缓存，方向反了。","嵌套越深，更新时的依赖追踪和 diff 成本越高。"]},{"id":185,"t":"前端如何实现基于 WebSocket 的实时聊天功能，支持多用户在线聊天并展示消息通知？","c":"场景设计","o":["聊天功能必须基于 HTTP/2 实现","用轮询接口实现实时聊天更优","WebSocket 无法在浏览器中使用","WebSocket 长连接推送，配心跳与重连"],"a":3,"w":"WebSocket 建立全双工长连接，服务端可以主动推送。工程上还要配心跳保活、断线重连、消息去重与排序、未读数和浏览器通知。","b":[{"type":"p","text":"WebSocket 不是简单的请求响应模型，它建立的是全双工通信通道，客户端和服务端都能主动推消息。实现多用户聊天的核心在于连接管理与消息路由。"},{"type":"p","text":"连接建立后，服务端需要维护用户连接的会话池，通常用 ConcurrentHashMap 存储 userId 到 WebSocketSession 的映射。新消息到来时，根据目标用户或群组找到对应 session，直接 writeAndFlush 推送。Spring WebFlux 或 Netty都能胜任这类场景，Netty 在百万级并发下更轻量。"},{"type":"p","text":"消息通知的未读数更新，可以在推送时一并携带，前端通过 DOM 操作实时刷新角标。关键状态比如“正在输入”，可以用心跳机制维持连接活跃，每 30 秒一次 ping/pong 防断连。"},{"type":"p","text":"1）用户登录后发起 ws://chat.example.com/connect 建立长连接"},{"type":"p","text":"2）服务端认证成功，将 session 缓存到会话管理器"},{"type":"p","text":"3）发送私聊消息时，后端查表定位接收方 session 并转发"},{"type":"p","text":"4）群聊则遍历群成员 session 批量推送"},{"type":"p","text":"5）前端监听 onmessage 事件，解析数据后渲染消息气泡"},{"type":"p","text":"前端用原生 WebSocket API 即可，new WebSocket('ws://...') 后监听 open、message、close 事件。断网重连策略建议指数退避，比如 1s、2s、4s 递增重试。历史消息应由 HTTP 接口单独拉取，避免首次加载过慢。"}],"r":["HTTP/2 的服务端推送已被废弃，实时聊天用 WebSocket 更合适。","轮询延迟高、请求量大，实时性不如长连接。","所有现代浏览器都支持 WebSocket。",""]},{"id":186,"t":"如何在前端实现文件的断点续传，并确保大文件安全可靠上传？","c":"场景设计","o":["分片加 hash，只传缺失分片后合并校验","断点续传只能由后端实现","一次性上传整个文件，失败后重传全部","把文件转成 base64 后上传"],"a":0,"w":"断点续传的核心是分片加 hash：上传前先问服务端哪些分片已经有了，只传缺失的，最后合并并校验完整性。相同 hash 还能实现秒传。","b":[{"type":"p","text":"文件切片和上传状态管理是断点续传的关键。前端需要把大文件拆成固定大小的块，比如每块 5MB，这样即使中途失败也只用重传一个分片，而不是整个文件。"},{"type":"p","text":"1）先对文件做 哈希值 计算，通常用 SparkMD5 或类似库在 Web Worker 里处理，避免阻塞 UI。这个哈希作为文件唯一标识，下次上传时先请求服务端查询是否已有该文件或已上传的分片，实现秒传和断点续传。"},{"type":"p","text":"2）切片后按顺序或并发上传，每个分片带上文件 hash、分片序号、总片数等元信息。服务端根据这些信息落地临时文件，全部接收完成后合并。上传过程要记录本地状态，可以用 IndexedDB 存储进度，防止页面刷新丢失。"},{"type":"p","text":"3）网络异常时通过轮询或重试机制补传失败分片，一般加个指数退避策略，比如最多重试 3 次。最后所有分片传完，发合并请求，服务端校验完整性再正式入库。"},{"type":"p","text":"安全性方面，所有请求走 HTTPS，上传前校验文件类型和大小，配合后端签名 URL 鉴权，像七牛云、腾讯云 COS 的前端直传方案就是这么干的，避免越权访问。"},{"type":"p","text":"这种模式能有效扛住弱网环境，百万级用户用蓝湖、语雀传设计稿或文档，背后都是这套逻辑在跑。"}],"r":["","前端负责切片和并发控制，后端负责存储和合并，两边都要做。","一次传整个，失败就得从头再来，正是要解决的问题。","base64 会让体积增大约三分之一，还更占内存。"]},{"id":187,"t":"如何在前端页面无限滚动加载内容时自动回收上面的内容？","c":"场景设计","o":["用 display:none 隐藏旧节点","一直往 DOM 里追加节点，不做任何处理","虚拟列表只渲染可视区，滚动时替换节点","用 iframe 分批加载内容"],"a":2,"w":"无限滚动的内存问题是 DOM 越堆越多。虚拟列表只渲染可视区加缓冲区的节点，滚动时替换数据、回收旧节点，DOM 数量始终保持在几十个。","b":[{"type":"p","text":"前端实现无限滚动加载时，如果不对已滚出视口的内容进行回收，页面 DOM 节点会持续增长，导致内存占用飙升、滚动卡顿甚至页面崩溃。想搞不定性能问题，关键得从 虚拟列表 入手。"},{"type":"p","text":"虚拟列表的核心思路是：只渲染当前可视区域附近的那一小部分数据，而不是把所有加载过的内容都保留在 DOM 中。比如你有 1 万条聊天记录，但屏幕只能显示 20 条，那就只渲染这 20 条，上下预留少量缓冲项即可。"},{"type":"p","text":"实现上一般通过监听滚动事件，计算当前可视范围的起始索引和结束索引，然后动态更新渲染列表。每个 item 的高度需要预估或动态测量，这样才能准确计算位置。"},{"type":"p","text":"const itemHeight = 50 // 假设每项固定高度 50px"},{"type":"code","text":"const visibleCount = Math.ceil(window.innerHeight / itemHeight)"},{"type":"p","text":"const startIndex = Math.max(0, scrollOffset - 5) // 加 5 条缓冲"},{"type":"code","text":"const endIndex = Math.min(data.length, startIndex + visibleCount + 10)\nconst visibleData = data.slice(startIndex, endIndex)"},{"type":"p","text":"实际项目中可以直接用成熟的库，比如 React 可以用 react-window 或 react-virtualized ，Vue 有 vue-virtual-scroller 。这些库已经处理了滚动定位、动态高度、item 缓存等脏活累活。"}],"r":["display:none 的节点仍在 DOM 里，内存和重排开销一点没少。","只追加不回收，滚动越久越卡。","","iframe 反而增加资源开销，解决不了节点堆积。"]},{"id":188,"t":"如何设计和优化秒杀系统的前端？","c":"场景设计","o":["防重复点击、服务器时间倒计时、削峰","用 localStorage 记录库存","增加更多动画提升体验","前端直接扣减库存以保证准确"],"a":0,"w":"秒杀前端做三件事：防重复点击和请求削峰、倒计时以服务器时间为准（本地时间可能被改）、结果用轮询或推送获取。库存扣减必须在服务端完成。","b":[{"type":"p","text":"秒杀系统的前端不是简单做页面，它得和后端、网络、缓存打配合战。前端要是没压住，后面的系统再强也扛不住。"},{"type":"p","text":"1）页面静态化是第一步。商品信息、倒计时这些能静态的全走 CDN，HTML、JS、CSS 预加载到离用户最近的节点。用户点开页面基本不打你应用服务器，减少 90% 无效请求。"},{"type":"p","text":"2）按钮防重复点击必须前端控。一上来就置灰，倒计时结束才能点，点一次就锁住。别指望后端帮你拦，网络延迟下可能同一用户发出多个请求。"},{"type":"p","text":"3）抢购接口要动态拼接 Token。页面加载时从后端拿一个一次性令牌，提交订单时带上。没有令牌直接前端拦截，避免恶意脚本刷接口。"},{"type":"p","text":"4）降级策略要前置。比如库存为 0 就直接展示“已售罄”，连按钮都不渲染。或者服务忙时，前端直接弹提示不发请求，减轻后端压力。"},{"type":"p","text":"5）资源懒加载。秒杀开始前，不加载支付、订单详情这些后续模块。等抢购成功再动态引入，降低首屏负载。"},{"type":"p","text":"其实前端在秒杀里干的都是“过滤”和“缓冲”的脏活累活，目标就是让无效请求压根不经过后端。做得好，系统能扛住百万并发；搞不定，服务器直接被打穿。"}],"r":["","localStorage 是本地数据，随时可改，不能作为库存依据。","动画只影响观感，解决不了瞬时高并发。","前端扣库存等于把库存交给用户，必然超卖。"]},{"id":189,"t":"如何设计一款能够统计前端页面请求耗时的工具？","c":"场景设计","o":["用 setInterval 定时轮询请求状态","用 console.time 手动记录每个请求的耗时","Performance API 或拦截 fetch/XHR 采集","只能由后端统计请求耗时，前端无法采集"],"a":2,"w":"前端采集请求耗时有两个入口：Performance API（performance.now、PerformanceObserver 的 resource 条目）拿各阶段耗时，或统一拦截 fetch/XHR 记录起止时间并关联业务上下文。","b":[{"type":"p","text":"前端性能监控的关键在于精准采集和低侵入上报。整个流程其实就三步：埋点采集、数据聚合、上报分析。"},{"type":"p","text":"1） 页面加载和接口请求的耗时，浏览器本身提供了现成的 API。用 PerformanceObserver 监听"},{"type":"p","text":"navigationTiming 和 resourceTiming ，能拿到页面白屏、首屏、资源加载这些关键节点的时间。比如页面首次渲染时间 first-contentful-paint ，或者某个接口从发起到收到响应的全过程。"},{"type":"p","text":"2） 采集到的数据不能立刻上报，否则可能压垮服务端。一般会做批量聚合，比如每 30 条记录或每 5 秒上报一次。上报用 navigator.sendBeacon 最稳，即使页面关闭也能发出去，比 fetch 可靠得多。"},{"type":"p","text":"3） 前端 SDK 要轻量，初始化代码压缩后最好控制在 1KB 以内。可以参考 Sentry 或阿里云 ARMS 的设计，通过配置项控制采样率，避免全量上报拖慢用户页面。"},{"type":"p","text":"代码示例只保留核心逻辑："},{"type":"code","text":"new PerformanceObserver((list) => {\n  list.getEntries().forEach(entry => {\n    if (entry.entryType === 'navigation') {\n      // 记录 FCP、LCP 等\n      report({ type: 'page', ...entry });\n    }\n  });\n}).observe({ entryTypes: ['navigation', 'resource'] });"},{"type":"p","text":"上报结构建议包含：页面 URL、用户设备、地理位置（IP 归属地）、时间戳、性能指标。后端可以用 Kafka 接入，Flink 实时聚合，存入 ClickHouse 查询。"}],"r":["轮询拿不到请求本身的耗时。","console.time 只能手动埋点，无法覆盖所有请求。","","前端完全能采集，而且能看到用户侧的真实耗时。"]},{"id":190,"t":"前端如何实现扫码登录功能？","c":"场景设计","o":["生成唯一标识二维码，轮询等待手机确认","把用户密码直接编码进二维码","扫码登录只能用 App 原生实现","手机扫描后直接把密码发送给网页"],"a":0,"w":"扫码登录：网页生成带唯一标识的二维码并轮询或长连接等待；已登录的手机端扫码确认后，服务端把该标识标记为已授权，网页端拿到结果完成登录。二维码里只有临时票据，没有密码。","b":[{"type":"p","text":"前端实现扫码登录，本质是让两个设备（比如手机和电脑）通过扫码完成身份同步。整个过程不靠输入密码，而是利用二维码的“单向通信”能力把登录态从移动端传递到 PC 端。"},{"type":"p","text":"流程一般是这样：PC 端打开登录页，后端生成一个临时唯一 token，前端用它请求生成二维码。这个二维码内容通常是一个 URL，带上 token，比如 https://login.example.com/token=abc123 。这时候前端开始轮询后端接口，查这个 token 是否已被认证。"},{"type":"p","text":"用户拿已登录的手机扫这个码，解析出 URL，访问该地址并携带自己的登录凭证（比如 cookie 或 access token）。服务端收到后，把手机的登录状态和这个 token 绑定，并标记为“已授权”。"},{"type":"p","text":"PC 端轮询接口发现状态变为“已登录”，就拉取用户信息，完成自动登录。整个过程 PC 端压根不经过密码校验，全靠token 状态变更驱动。"},{"type":"p","text":"1）二维码只是一次性信道，不包含敏感信息"},{"type":"p","text":"2）轮询间隔一般 1-2 秒，超时时间设 3-5 分钟"},{"type":"p","text":"3）安全上要防重放，token 必须一次性且带过期时间"},{"type":"p","text":"典型应用像微信网页登录、钉钉扫码登，都是这套逻辑。前端脏活在轮询管理、状态提示和超时处理，核心其实是前后端配合的状态同步机制。"}],"r":["","二维码里绝不能放密码，泄露即失守。","Web 页面同样能实现扫码登录，不需要原生能力。","手机只负责确认授权，密码不会离开认证服务。"]},{"id":191,"t":"如何在浏览器中执行 100 万个任务，并保证页面不卡顿？","c":"场景设计","o":["requestIdleCallback 分片或 Worker","用 for 循环一次性执行完，速度最快","用 setTimeout(fn, 0) 递归调用会更快","用 Promise.all 一次性并发执行所有任务"],"a":0,"w":"100 万个任务的关键是别让主线程长时间被占：用 requestIdleCallback 或 setTimeout 分片执行，把纯计算任务丢进 Web Worker，主线程只负责调度和渲染。","b":[{"type":"p","text":"浏览器的事件循环机制决定了所有 JavaScript 代码都在主线程上执行。一次性运行 100 万个任务，压根不经过任何调度，页面肯定直接卡死。"},{"type":"p","text":"关键在于分片执行，把大任务拆成小块，让出主线程控制权，给 UI 更新和用户交互留出时间。"},{"type":"p","text":"1）使用 requestIdleCallback ，它会在浏览器空闲时执行回调。你可以每次处理几千个任务，检查是否超时，没完成就继续注册下一轮。"},{"type":"code","text":"let tasks = Array(1000000).fill(() => {});\nfunction processChunk(deadline) {\n    while (tasks.length > 0 && deadline.timeRemaining() > 1) {\n        const task = tasks.pop();\n        task();\n    }\n    if (tasks.length > 0) {\n        requestIdleCallback(processChunk);\n    }\n}\nrequestIdleCallback(processChunk);"},{"type":"p","text":"2）也可以用 setTimeout 或 requestAnimationFrame 实现类似效果，比如每帧只处理一部分，保证动画流畅。"},{"type":"p","text":"React 的 Fiber 架构就是这个思路的典型应用。它把渲染任务拆成可中断的单元，在每一帧中执行一部分，避免长时间占用主线程。"},{"type":"p","text":"这种模式适合数据处理、模板渲染、日志上报等非实时任务。但对强同步逻辑，比如事务性计算，就不适用了。"}],"r":["","一次跑完会长时间占用主线程，页面直接卡死。","setTimeout 递归只是把任务拆开，并不会更快，反而有调度开销。","Promise.all 是并发发起，微任务依然会挤满主线程。"]},{"id":192,"t":"如何在页面内一次性渲染 10 万条数据，并保证页面不卡顿？","c":"场景设计","o":["虚拟列表或分页，只渲染可视区","增加 CSS 动画让渲染更平滑","用 document.write 输出","一次性用 innerHTML 拼接全部数据"],"a":0,"w":"10 万条数据的瓶颈是 DOM 数量：虚拟列表只渲染可视区、分页按需加载、时间分片把渲染拆成小批次，避免一次性阻塞主线程。","b":[{"type":"p","text":"直接渲染 10 万条 DOM 节点，浏览器压根扛不住。内存占用会飙到几百 MB，主线程卡死，用户操作完全无响应。关键在于减少 DOM 数量和分片处理。"},{"type":"p","text":"1）虚拟滚动是首选方案。只渲染可视区域内的元素，比如屏幕只能显示 50 条，那就只生成这 50 个 DOM，滚动时动态更新内容。配合 IntersectionObserver 或 requestAnimationFrame 控制更新节奏。React 里可以用"},{"type":"p","text":"react-window ，Vue 用 vue-virtual-scroller ，原理都一样。"},{"type":"p","text":"2）时间分片（Time Slicing）也能缓解。利用 requestIdleCallback 或 setTimeout 把渲染任务拆成每帧处理 100~200 条，让出主线程给用户交互。虽然总耗时更长，但页面不会冻结。"},{"type":"p","text":"3）服务端渲染 + 懒加载也行。先返回前 1000 条 HTML，再通过接口补全数据，前端用虚拟列表承接后续内容。"},{"type":"code","text":"// 简化版时间分片\nconst renderLargeList = (data, chunkSize = 100) => {\n  let index = 0;\n  const renderChunk = () => {\n    const end = Math.min(index + chunkSize, data.length);\n    for (let i = index; i < end; i++) {\n      const div = document.createElement('div');\n      div.textContent = data[i];\n      container.appendChild(div);\n    }\n    index = end;\n    if (index < data.length) {"},{"type":"p","text":"setTimeout(renderChunk, 0); // 释放主线程"},{"type":"code","text":"    }\n  };\n  renderChunk();\n};"},{"type":"p","text":"真正的大数据场景，比如监控日志、金融行情，一般前端只展示采样或聚合结果，原始数据靠下钻查询，不会一次性拉 10 万条。"}],"r":["","动画只会让卡顿更明显。","document.write 会重写整个文档，性能更差。","一次性拼 10 万条 DOM，页面会直接卡死。"]},{"id":193,"t":"前端如何处理后端接口一次性返回的超大树形结构数据？","c":"场景设计","o":["一次性递归渲染整棵树，交给浏览器去优化","用 JSON.stringify 直接展示原始数据","只能让后端改成分页返回，前端没有别的办法","展开懒加载、虚拟滚动、扁平化、Worker 解析"],"a":3,"w":"超大树形数据的处理思路：展开时才请求子节点（懒加载）、用虚拟滚动控制渲染量、把树扁平化成 map 便于查找、必要时用 Web Worker 解析，避免深层递归爆栈。","b":[{"type":"p","text":"一次性拿到几万节点的树形数据，前端直接渲染肯定卡死。关键思路是分层加载和按需展开，把压力拆开。"},{"type":"p","text":"1）后端接口别一股脑返回全部层级，约定只返回根节点或前两层。用户点击展开某个父节点时，再发请求查它的子节点。像 Ant Design 的 Tree 组件就支持 onLoad 回调，点到哪层才去拉那层的数据，整棵树可以无限深，但单次请求量控制在几百条以内。"},{"type":"p","text":"2）如果业务硬性要求全量数据必须一次返回（比如离线分析），那就不能直接用递归渲染。可以用 扁平化结构 + 内存构建树 的方式优化解析过程。后端返回带 parent_id 的数组，前端用哈希表建立索引，O(n) 时间构树，避免递归爆栈。"},{"type":"code","text":"const map = {};\nconst roots = [];\ndata.forEach(item => {\n  map[item.id] = { ...item, children: [] };\n});\ndata.forEach(item => {\n  if (item.parentId === null) {\n    roots.push(map[item.id]);\n  } else {\n    map[item.parentId]?.children.push(map[item.id]);\n  }\n});"},{"type":"p","text":"3）真实场景里，Elasticsearch 的索引管理、K8s 的资源拓扑视图都是这么干的。用户看不到全貌，也不需要看全貌，点到哪才加载哪。"},{"type":"p","text":"4）最后加个虚拟滚动，比如 react-window 配合 Tree，只渲染可视区域内的节点，几千个节点也能滑得动。"}],"r":["一次性递归渲染会卡死，深树还可能爆栈。","JSON.stringify 只是把数据转成字符串，没有任何结构优化。","后端分页是可选方案，前端同样能做懒加载和虚拟滚动。",""]},{"id":194,"t":"从网络角度来看，用户从输入网址到网页显示，期间发生了什么？","c":"网络","o":["DNS → 握手 → 请求 → 响应 → 解析渲染","先执行 JS 再请求 HTML","浏览器直接从本地读取，无需网络","直接向服务器请求 HTML 并渲染，没有其他步骤"],"a":0,"w":"完整链路：DNS 解析、TCP/TLS 握手、发送 HTTP 请求、服务端响应、解析 HTML 构建 DOM/CSSOM、布局与绘制、加载子资源并执行 JS。每一环都有对应的优化手段。","b":[{"type":"p","text":"用户敲下回车后，浏览器要先拿到服务器 IP 地址。本地查 hosts 文件，没找到就发 DNS 查询请求。这个请求通常先到本地 DNS 服务器，它会递归或迭代查询根域名、顶级域、权威域名服务器，最终拿到 A 记录。"},{"type":"p","text":"有了 IP，浏览器发起 TCP 连接，三次握手建立连接。如果走 HTTPS，接着进行 TLS 握手，协商加密套件、交换密钥，确保后续通信安全。"},{"type":"p","text":"TCP 连接建立后，浏览器开始发 HTTP 请求。比如 GET /index.html，携带 Host、User-Agent 等头信息。请求通过操作系统网络栈，经过路由器层层转发，最终到达目标服务器。"},{"type":"p","text":"服务器收到请求，应用层如 Nginx 或 Tomcat 处理，可能访问数据库、缓存，生成响应内容。响应包含状态码、响应头和 HTML 内容，通过已建立的 TCP 连接返回。"},{"type":"p","text":"浏览器收到响应，解析 HTML，遇到 CSS、JS、图片等资源，再发起多个并行请求。这些请求可能复用现有 TCP 连接（HTTP Keep-Alive），减少握手开销。"},{"type":"p","text":"页面渲染同时进行，构建 DOM 树、CSSOM，生成渲染树，布局绘制。JS 执行可能阻塞解析，所以一般建议异步加载。"},{"type":"p","text":"整个过程涉及多层协议协作。DNS 查询可能耗时几百毫秒，CDN 和 DNS 缓存能显著降低延迟。现代浏览器对同域名并发连接数限制在 6 个左右，超出的请求排队。"},{"type":"p","text":"整个链路中任意环节超时或失败都会导致页面加载异常，比如 DNS 污染、TCP 重传、TLS 协商失败、后端服务无响应等。"}],"r":["","JS 要等 HTML 解析到 script 标签才会执行，顺序说反了。","首次访问必须走网络，只有命中缓存才可能从本地读。","这条链路上还有 DNS、握手、解析、渲染等多个阶段。"]},{"id":195,"t":"Webpack 插件底层的实现原理是什么？","c":"工程化","o":["apply(compiler) 中订阅 hooks 操作 compilation","插件通过在 webpack.config.js 里新增字段生效，运行时不介入","插件就是 loader 的另一种叫法，两者都只负责转换单个模块","插件只能处理 CSS 和图片资源，无法介入编译和产出阶段"],"a":0,"w":"插件是一个带 apply(compiler) 方法的对象，通过 compiler.hooks 订阅构建生命周期钩子（如 emit、done），在对应阶段读取或修改 compilation。Webpack 底层用 Tapable 实现发布订阅。","b":[{"type":"p","text":"Webpack 插件的本质是基于 发布-订阅 模式，通过在编译生命周期中挂载钩子函数来干预构建流程。整个过程由"},{"type":"p","text":"Tapable 这个库驱动，它提供了丰富的钩子类型，比如同步、异步、串行、并行等。"},{"type":"p","text":"插件需要实现一个 apply 方法，接收 compiler 实例。在这个方法里，你可以监听 Webpack 内部的事件钩子，比如"},{"type":"p","text":"compile 、compilation 、emit 等。以生成资源文件为例，监听 emit 阶段就能在输出前写入自定义文件。"},{"type":"p","text":"1）插件注册时调用 apply(compiler)"},{"type":"p","text":"2）在 apply 中通过 compiler.hooks.xxx.tap() 注册逻辑"},{"type":"p","text":"3）Webpack 执行到对应生命周期时触发钩子，执行插件逻辑"},{"type":"p","text":"举个简单例子：想在打包后自动创建一个 filelist.md ，直接监听 emit 钩子就行："},{"type":"code","text":"class FileListPlugin {\n  apply(compiler) {\n    compiler.hooks.emit.tap('FileListPlugin', (compilation) => {\n      const fileNames = Object.keys(compilation.assets);"},{"type":"p","text":"const content = '## 文件列表\\n' + fileNames.join('\\n');"},{"type":"code","text":"      compilation.assets['filelist.md'] = {\n        source: () => content,\n        size: () => content.length\n      };\n    });\n  }\n}"},{"type":"p","text":"常见的如 HtmlWebpackPlugin 、MiniCssExtractPlugin 都是在特定阶段修改 compilation.assets 来注入资源。整个机制灵活但要求你清楚生命周期节点，否则容易搞不定执行顺序或拿不到预期数据。"}],"r":["","插件是在构建过程中运行的代码，不是配置文件字段。","插件和 loader 职责不同：loader 转换单个模块，插件干预整个构建流程。","插件可以介入编译、优化、产出各个阶段，不限于资源类型。"]},{"id":196,"t":"如何在 Node.js 中进行高效的日志处理，避免影响性能？","c":"Node.js","o":["所有日志都用 console.log 同步输出","用 pino/winston 异步批量写入，避免阻塞","把日志先写进内存数组，进程退出时再落盘","日志越多越好，不需要做任何采样和控制"],"a":1,"w":"日志要异步、分级、可控：用 pino/winston 做异步批量写入，按级别和采样率控制量，配合日志切割和落盘策略，避免同步写阻塞事件循环。","b":[{"type":"p","text":"日志处理不能阻塞主线程，Node.js 是单线程事件循环，一旦同步写日志卡住，整个服务就卡住了。核心思路是把日志的写入变成异步非阻塞操作，并控制输出频率和量级。"},{"type":"p","text":"1）使用异步写入而非 console.log 直接打屏。console.log 看似简单，但其实是同步操作，尤其在容器环境重定向到 stdout 时会压垮事件循环。应该用 fs.createWriteStream 写文件，或者用成熟的日志库如 winston或 pino。"},{"type":"p","text":"2）采用日志分级和采样。生产环境只记录 warn 及以上级别，调试日志关掉。高频接口可以按比例采样，比如每 100条 log 只写 1 条，避免磁盘被打满。"},{"type":"p","text":"3）批量写入减少 I/O 次数。把多条日志攒成一批再刷到磁盘或发送到日志系统，pino 配合 pino-pretty 或直接输出JSON 到 file 就支持这种模式。"},{"type":"p","text":"4）关键点：不要让日志系统依赖网络可用性。如果往 ELK 推日志，中间加一层 Filebeat 这类 agent，应用只负责写本地文件，后续转发由独立进程处理，这样即使网络抖动也不影响服务。"},{"type":"p","text":"代码示例："},{"type":"code","text":"const logger = require('pino')({\n  level: 'info',"},{"type":"p","text":"sync: false // 启用异步写入"},{"type":"code","text":"})"},{"type":"p","text":"logger.info('User login successful') // 非阻塞"},{"type":"p","text":"推荐更多免费学编程资源："},{"type":"p","text":"1. 编程导航学习网站：学编程、做项目、拿 Offer！2. 企业高频面试题库：开始刷题，面试遇原题！3. 精选简历模板大全：1 分钟搞定简历！4. AI 资源导航网站：获取最新 AI 黑科技！5. 1 对 1 模拟面试：随时随地提升面试能力"}],"r":["console.log 是同步写，高并发下会直接拖慢吞吐。","","内存数组会持续增长，进程崩了日志也一起没了。","日志不加控制会拖慢性能，还会淹没真正有用的信息。"]}];
</script>
<script>
/* ---------- 图标 ---------- */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l13 8-13 8V4z"/></svg>',
  dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 10l6.1-.9L12 3.5z"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------- 存储 ---------- */
const KEY = 'fe_quiz_mcq_v1';
const DEFAULT_DB = {wrong:{}, fav:[], seen:{}, rounds:[], session:null, settings:{count:10, catCount:{}}};
let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_DB));
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_DB)), JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_DB)); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

const QMAP = {};
QUESTIONS.forEach(q => QMAP[q.id] = q);
const CAT_ORDER = ['JavaScript','Vue','React','网络','CSS','HTML','浏览器','性能优化','工程化','Node.js','场景设计','TypeScript','设计模式'];
const CATS = [];
QUESTIONS.forEach(q => { if(!CATS.includes(q.c)) CATS.push(q.c); });
CATS.sort((a,b)=>{
  const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
  return (ia<0?99:ia) - (ib<0?99:ib);
});
const LTR = ['A','B','C','D'];

function resolveCount(cat){
  const st = DB.settings || {count:10, catCount:{}};
  if(cat && cat !== '全部' && st.catCount[cat]) return Math.min(st.catCount[cat], catCount(cat));
  return Math.min(st.count, QUESTIONS.length);
}

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
function fmtTime(ms){ const s = Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function catCount(c){ return QUESTIONS.filter(q=>q.c===c).length; }
function catDone(c){ let n=0; QUESTIONS.forEach(q=>{ if(q.c===c && DB.seen[q.id]) n++; }); return n; }
function uniqueSeen(){ return Object.keys(DB.seen).length; }
function accuracy(){
  let r=0,w=0; Object.values(DB.seen).forEach(s=>{ r+=s.r||0; w+=s.w||0; });
  return (r+w) ? Math.round(r/(r+w)*100) : 0;
}
function pickWeighted(pool, n){
  const weighted = pool.map(q=>{
    const s = DB.seen[q.id];
    let w = 1;
    if(!s) w = 4; else if(s.w > 0) w = 2.5;
    return {q, w: w * (0.6 + Math.random())};
  });
  weighted.sort((a,b)=>b.w-a.w);
  return weighted.slice(0, n).map(x=>x.q);
}

/* ---------- 渲染答案正文 ---------- */
function renderBody(q){
  return (q.b||[]).map(p=>{
    if(p.type === 'code') return '<pre><code>' + esc(p.text) + '</code></pre>';
    const t = esc(p.text);
    if(p.text.length <= 26 && /^\d+[）)]/.test(p.text)) return '<p class="sub">' + t + '</p>';
    if(/^\d+[）)]/.test(p.text)) return '<p>' + t + '</p>';
    return '<p>' + t + '</p>';
  }).join('');
}

/* ---------- 选项渲染 ---------- */
function renderOpts(q, picked, answered){
  return '<div class="opts' + (answered ? ' done' : '') + '">' + q.o.map((text, i)=>{
    let cls = 'opt';
    if(answered){
      if(i === q.a) cls += ' correct';
      else if(i === picked) cls += ' wrong';
      else if(picked !== null && picked !== undefined) cls += ' dim';
    }
    let mark = '';
    if(answered){
      if(i === q.a) mark = '<span class="mark">正确答案</span>';
      else if(i === picked) mark = '<span class="mark">你的选择</span>';
    }
    const why = (answered && q.r && q.r[i]) ? '<span class="reason">' + esc(q.r[i]) + '</span>' : '';
    return '<button class="'+cls+'" '+(answered?'disabled':'')+' data-action="pick" data-i="'+i+'">'+
      '<span class="ltr">'+LTR[i]+'</span><span class="txt">'+esc(text)+why+'</span>'+mark+'</button>';
  }).join('') + '</div>';
}

/* ---------- 导航 ---------- */
const NAV = [
  ['home','首页',ICON.home],
  ['practice','开始刷题',ICON.play],
  ['random','随机一题',ICON.dice],
  ['wrong','错题本',ICON.book],
  ['fav','我的收藏',ICON.star],
  ['bank','全部题库',ICON.layers]
];
const state = {view:'home', session:null, filter:'全部', search:'', open:null, randomId:null, randomPick:null, showSettings:false};

function paintNav(){
  NAV.forEach(([k,label,icon])=>{
    const el = $('#nav-'+k);
    let badge = '';
    if(k === 'wrong' && Object.keys(DB.wrong).length) badge = '<span class="badge">'+Object.keys(DB.wrong).length+'</span>';
    if(k === 'fav' && DB.fav.length) badge = '<span class="badge">'+DB.fav.length+'</span>';
    el.innerHTML = icon + '<span>'+label+'</span>' + badge;
    el.classList.toggle('active', state.view === k);
  });
}
function go(view){
  state.view = view;
  if(view === 'practice'){
    if(!state.session && DB.session && !DB.session.done && DB.session.idx < DB.session.ids.length) state.session = DB.session;
    const s = state.session;
    if(!s || s.done || s.idx >= s.ids.length) startSession();
  }
  if(view === 'random'){ state.randomPick = null; }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function startSession(opts){
  opts = opts || {};
  let pool;
  if(opts.ids) pool = opts.ids.map(id=>QMAP[id]).filter(Boolean);
  else if(opts.cat && opts.cat !== '全部') pool = QUESTIONS.filter(q=>q.c===opts.cat);
  else pool = QUESTIONS;
  const n = Math.min(opts.count || resolveCount(opts.cat), pool.length);
  const picked = pickWeighted(pool, n);
  state.session = {
    ids: picked.map(q=>q.id), idx: 0, picks: {},
    startAt: Date.now(), cat: opts.cat || '全部', mode: opts.mode || 'normal'
  };
  DB.session = state.session; save();
  state.view = 'practice';
  render();
  window.scrollTo({top:0});
}

/* ---------- 渲染 ---------- */
function render(){
  paintNav();
  const v = $('#view');
  switch(state.view){
    case 'practice': v.innerHTML = viewPractice(); break;
    case 'random': v.innerHTML = viewRandom(); break;
    case 'wrong': v.innerHTML = viewWrong(); break;
    case 'fav': v.innerHTML = viewFav(); break;
    case 'bank': v.innerHTML = viewBank(); break;
    default: v.innerHTML = viewHome();
  }
  if(state.view === 'practice') startTimer(); else stopTimer();
  if(state.view === 'bank'){
    const si = $('#search');
    if(si) si.addEventListener('input', e=>{
      state.search = e.target.value; render();
      const el = $('#search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
    const cs = $('#catSel');
    if(cs) cs.addEventListener('change', e=>{ state.filter = e.target.value; state.open=null; render(); });
  }
}
function renderKeepScroll(){
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

/* ---------- 计时 ---------- */
let timerId = null;
function startTimer(){
  stopTimer();
  const tick = ()=>{
    const el = $('#timer');
    if(!el || !state.session) return;
    el.textContent = fmtTime(Date.now() - state.session.startAt);
  };
  tick(); timerId = setInterval(tick, 1000);
}
function stopTimer(){ if(timerId) clearInterval(timerId); timerId = null; }

/* ---------- 判题 ---------- */
function pickOption(i){
  const s = state.session;
  if(!s) return;
  const q = QMAP[s.ids[s.idx]];
  if(s.picks[q.id] !== undefined && s.picks[q.id] !== null) return; // 已答过
  s.picks[q.id] = i;
  const ok = i === q.a;

  const seen = DB.seen[q.id] || {r:0, w:0};
  if(ok) seen.r++; else seen.w++;
  DB.seen[q.id] = seen;

  if(ok){
    if(DB.wrong[q.id]){
      const w = DB.wrong[q.id];
      w.streak = (w.streak||0) + 1;
      if(w.streak >= 2){ delete DB.wrong[q.id]; toast('连续答对 2 次，已移出错题本'); }
    }
  }else{
    const w = DB.wrong[q.id] || {count:0, streak:0, ts:0};
    w.count++; w.streak = 0; w.ts = Date.now(); w.lastPick = i;
    DB.wrong[q.id] = w;
  }
  DB.session = s; save();
  renderKeepScroll();
}

function nextQuestion(){
  const s = state.session;
  if(!s) return;
  s.idx++;
  if(s.idx >= s.ids.length) finishSession();
  DB.session = s; save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function finishSession(){
  const s = state.session;
  let right = 0;
  s.ids.forEach(id=>{ if(s.picks[id] === QMAP[id].a) right++; });
  DB.rounds.push({ts: Date.now(), total: s.ids.length, correct: right, cat: s.cat, mode: s.mode});
  if(DB.rounds.length > 50) DB.rounds = DB.rounds.slice(-50);
  s.done = true;
  DB.session = s; save();
}

function pickRandom(i){
  if(state.randomPick !== null && state.randomPick !== undefined) return;
  state.randomPick = i;
  const q = QMAP[state.randomId];
  const seen = DB.seen[q.id] || {r:0,w:0};
  const ok = i === q.a;
  if(ok) seen.r++; else seen.w++;
  DB.seen[q.id] = seen;
  if(ok){
    if(DB.wrong[q.id]){
      const w = DB.wrong[q.id];
      w.streak = (w.streak||0) + 1;
      if(w.streak >= 2){ delete DB.wrong[q.id]; toast('连续答对 2 次，已移出错题本'); }
    }
  }else{
    const w = DB.wrong[q.id] || {count:0, streak:0, ts:0};
    w.count++; w.streak = 0; w.ts = Date.now(); w.lastPick = i;
    DB.wrong[q.id] = w;
  }
  save(); renderKeepScroll();
}

/* ---------- 交互 ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action],[data-nav]');
  if(!el) return;
  if(el.dataset.nav){ go(el.dataset.nav); return; }
  if(el.classList.contains('mask') && e.target.closest('.modal')) return;
  const a = el.dataset.action;
  const id = Number(el.dataset.id);

  switch(a){
    case 'start': startSession(); break;
    case 'settings': state.showSettings = true; render(); break;
    case 'close-modal': state.showSettings = false; render(); break;
    case 'pick-count': DB.settings.count = Number(el.dataset.v); save(); render(); break;
    case 'cat-count': {
      const c = el.dataset.cat, d = Number(el.dataset.d), tot = catCount(c);
      let n = (DB.settings.catCount[c] || DB.settings.count) + d;
      DB.settings.catCount[c] = Math.max(1, Math.min(tot, n));
      save(); render(); break;
    }
    case 'reset-cat-count': DB.settings.catCount = {}; save(); render(); break;
    case 'resume': state.session = DB.session; state.view='practice'; render(); break;
    case 'go': go(el.dataset.view); break;
    case 'cat': startSession({cat: el.dataset.cat}); break;
    case 'pick':
      if(state.view === 'random'){
        pickRandom(Number(el.dataset.i));
      }else{
        pickOption(Number(el.dataset.i));
      }
      break;
    case 'next': nextQuestion(); break;
    case 'quit': state.session = null; go('home'); break;
    case 'fav': {
      const i = DB.fav.indexOf(id);
      if(i >= 0){ DB.fav.splice(i,1); toast('已取消收藏'); } else { DB.fav.push(id); toast('已加入收藏'); }
      save(); render(); break;
    }
    case 'wrong-add': {
      const w = DB.wrong[id] || {count:0, streak:0, ts:0};
      w.count = Math.max(1, w.count); w.ts = Date.now(); w.streak = 0;
      DB.wrong[id] = w; save(); toast('已加入错题本'); render(); break;
    }
    case 'master': delete DB.wrong[id]; save(); toast('已移出错题本'); render(); break;
    case 'practice-wrong': {
      const ids = Object.keys(DB.wrong).map(Number);
      startSession({ids: shuffle(ids).slice(0,10), mode:'wrong', cat:'错题'});
      break;
    }
    case 'practice-fav':
      startSession({ids: shuffle(DB.fav.slice()).slice(0,10), mode:'fav', cat:'收藏'});
      break;
    case 'toggle': state.open = state.open === id ? null : id; render(); break;
    case 'filter': state.filter = el.dataset.cat; state.open = null; render(); break;
    case 'next-random':
      state.randomPick = null;
      const pool = QUESTIONS.filter(q=>q.id !== state.randomId);
      state.randomId = pool[Math.random()*pool.length|0].id;
      render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'reset':
      if(confirm('确定清空所有学习记录（错题本、收藏、统计）？此操作不可恢复。')){
        DB = JSON.parse(JSON.stringify(DEFAULT_DB)); save(); state.session=null; go('home'); toast('已清空');
      }
      break;
  }
});

document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(e.key === 'Escape' && state.showSettings){ state.showSettings = false; render(); return; }
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;

  if(state.view === 'practice'){
    const s = state.session; if(!s) return;
    const q = QMAP[s.ids[s.idx]];
    const answered = s.picks[q.id] !== undefined && s.picks[q.id] !== null;
    if(!answered){
      const k = e.key.toUpperCase();
      let idx = LTR.indexOf(k);
      if(idx < 0 && /^[1-4]$/.test(e.key)) idx = Number(e.key) - 1;
      if(idx >= 0 && idx < 4){ e.preventDefault(); pickOption(idx); }
    }else if(e.key === 'Enter' || e.code === 'Space'){
      e.preventDefault(); nextQuestion();
    }
  }
  if(state.view === 'random'){
    const q = QMAP[state.randomId];
    const answered = state.randomPick !== null && state.randomPick !== undefined;
    if(!answered){
      const k = e.key.toUpperCase();
      let idx = LTR.indexOf(k);
      if(idx < 0 && /^[1-4]$/.test(e.key)) idx = Number(e.key) - 1;
      if(idx >= 0 && idx < 4){
        e.preventDefault();
        pickRandom(idx);
      }
    }else if(e.key.toLowerCase() === 'r'){
      state.randomPick = null;
      const pool = QUESTIONS.filter(x=>x.id !== state.randomId);
      state.randomId = pool[Math.random()*pool.length|0].id;
      render();
    }
  }
});

render();
</script>
