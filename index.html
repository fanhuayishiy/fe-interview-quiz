<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端面试刷题 · 选择题版</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e9ebef; --line-2:#f0f2f5;
  --text:#14171c; --text-2:#4a5260; --muted:#8a919e;
  --primary:#4f46e5; --primary-soft:#eef2ff; --primary-line:#dcd9fd;
  --green:#12805c; --green-soft:#e8f6f0; --red:#c8374a; --red-soft:#fdeef0;
  --amber:#b45309; --amber-soft:#fef4e6;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:#dcd9fd}

/* 布局 */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;background:#fff;border-right:1px solid var(--line);
  padding:18px 12px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.logo{width:28px;height:28px;border-radius:9px;flex:0 0 28px;background:linear-gradient(140deg,#4f46e5,#8b5cf6);
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(79,70,229,.28)}
.brand-t{font-size:14px;font-weight:650;letter-spacing:.2px;line-height:1.3}
.brand-s{font-size:11px;color:var(--muted);letter-spacing:.3px}
.nav-label{font-size:11px;color:#a3a9b4;padding:12px 10px 5px;letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--text-2);
  font-size:13.5px;transition:.14s;width:100%;text-align:left}
.nav-item:hover{background:#f5f6f8;color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:#4338ca;font-weight:600}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:600;min-width:19px;height:19px;padding:0 5px;
  border-radius:9px;background:#eef0f3;color:#6b7280;display:grid;place-items:center;line-height:1}
.nav-item.active .badge{background:#ded9fd;color:#4338ca}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line-2)}
.mini-link{font-size:12px;color:var(--muted);padding:6px 2px;display:block;text-align:left}
.mini-link:hover{color:var(--red)}
main{flex:1;min-width:0;padding:34px 40px 90px}
.wrap{max-width:860px;margin:0 auto}
.wrap.wide{max-width:1000px}

/* 通用 */
.page-head{margin-bottom:22px}
.page-head h1{font-size:22px;margin:0 0 6px;letter-spacing:-.2px;font-weight:680}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:10px;
  font-size:13.5px;font-weight:600;background:#f2f3f6;color:var(--text-2);transition:.15s;white-space:nowrap}
.btn:hover{background:#e9ebef}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.24)}
.btn.primary:hover{background:#4338ca}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text-2)}
.btn.ghost:hover{background:#fafbfc;border-color:#dcdfe5}
.btn.green{background:var(--green-soft);color:var(--green)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;
  font-size:11.5px;font-weight:600;background:#f2f3f6;color:#5b6270;letter-spacing:.2px}
.muted{color:var(--muted)}
.kbd{font-size:10.5px;opacity:.55;border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:14px;margin-left:2px}

/* 首页 */
.hero{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 55%,#4c1d95 100%);border-radius:18px;padding:26px 28px;
  color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px rgba(49,46,129,.55)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.55),transparent 65%)}
.hero h2{margin:0 0 8px;font-size:20px;font-weight:680;letter-spacing:-.2px}
.hero p{margin:0 0 18px;color:#c7c6f0;font-size:13px;max-width:540px}
.hero .btn.primary{background:#fff;color:#3730a3;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hero .btn.primary:hover{background:#f3f2ff}
.hero .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#e7e6ff}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 26px}
.stat{padding:15px 16px}
.stat .k{font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.stat .v{font-size:24px;font-weight:680;letter-spacing:-.5px;line-height:1.1}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec-title h3{font-size:14.5px;margin:0;font-weight:650}
.sec-title span{font-size:12px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{text-align:left;padding:13px 14px;border-radius:11px;background:#fff;border:1px solid var(--line);
  transition:.15s;box-shadow:var(--shadow)}
.cat:hover{border-color:var(--primary-line);transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.09)}
.cat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cat-name{font-size:13px;font-weight:620}
.cat-num{font-size:11.5px;color:var(--muted)}
.bar{height:4px;border-radius:3px;background:#f0f1f4;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .4s}

/* 刷题 */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar .grow{flex:1;min-width:0}
.progress{height:5px;background:#e9ebef;border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#8b5cf6);transition:width .35s;border-radius:4px}
.counter{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:#fff;
  border:1px solid var(--line);padding:4px 9px;border-radius:7px}
.qcard{padding:26px 28px 22px}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.qtitle{font-size:20px;line-height:1.55;font-weight:660;margin:0 0 20px;letter-spacing:-.2px}

/* 选项 */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;
  border:1px solid var(--line);border-radius:11px;background:#fff;transition:.14s;font-size:14px;line-height:1.65}
.opt:hover{border-color:#c9cdf5;background:#fbfbff}
.opt .ltr{width:22px;height:22px;border-radius:6px;background:#f2f3f6;color:#6b7280;display:grid;place-items:center;
  font-size:12px;font-weight:700;flex:0 0 22px;margin-top:2px;transition:.14s}
.opt .txt{flex:1}
.opt .mark{font-size:12px;font-weight:600;white-space:nowrap;margin-top:2px;opacity:0}
.opt.correct{border-color:#9ad9c0;background:#f3fbf7}
.opt.correct .ltr{background:var(--green);color:#fff}
.opt.correct .mark{opacity:1;color:var(--green)}
.opt.wrong{border-color:#f0b7c0;background:#fdf3f5}
.opt.wrong .ltr{background:var(--red);color:#fff}
.opt.wrong .mark{opacity:1;color:var(--red)}
.opt.dim{opacity:.7}
.opts.done .opt{cursor:default}
.opts.done .opt:hover{border-color:var(--line);background:#fff}
.opts.done .opt.correct:hover{border-color:#9ad9c0;background:#f3fbf7}
.opts.done .opt.wrong:hover{border-color:#f0b7c0;background:#fdf3f5}
.opt .reason{display:block;margin-top:5px;font-size:12.5px;line-height:1.65;color:#8a919e;font-weight:400}
.opt.correct .reason{color:#3f7a63}
.opt.wrong .reason{color:#a8495c}
.opt.dim .reason{color:#a9aeb8}

/* 解析 */
.explain{margin-top:20px;border-top:1px solid var(--line-2);padding-top:16px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;margin-bottom:10px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.verdict .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff}
.verdict.ok .dot{background:var(--green)}
.verdict.no .dot{background:var(--red)}
.why{font-size:14px;line-height:1.85;color:#2b303a;margin:0 0 14px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--muted);outline:none;user-select:none}
details.more summary:hover{color:var(--primary)}
details.more[open] summary{margin-bottom:14px}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:"▸ ";font-size:10px}
details.more[open] summary:before{content:"▾ "}
.answer-body p{margin:0 0 11px;color:#2b303a;font-size:13.8px;line-height:1.85}
.answer-body p.sub{font-weight:640;color:#14171c;margin-top:14px;margin-bottom:5px}
.answer-body pre{margin:0 0 12px;padding:13px 15px;background:#1b1e26;color:#e6e8ef;border-radius:10px;
  overflow-x:auto;font-size:12.5px;line-height:1.65;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
.answer-body pre code{font-family:inherit;white-space:pre}
.qfoot{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.qfoot .grow{flex:1}

/* 结果 */
.result{padding:32px 28px;text-align:center}
.ring{position:relative;width:132px;height:132px;margin:0 auto 16px}
.ring svg{transform:rotate(-90deg)}
.ring .inner{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct{font-size:29px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.ring .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.result h2{margin:0 0 6px;font-size:19px;font-weight:680}
.result .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
.rstats{display:flex;justify-content:center;gap:34px;margin:0 0 24px;flex-wrap:wrap}
.rstat .v{font-size:19px;font-weight:670;font-variant-numeric:tabular-nums}
.rstat .k{font-size:11.5px;color:var(--muted);margin-top:1px}
.review{text-align:left;margin-top:26px;border-top:1px solid var(--line-2);padding-top:18px}
.review-h{font-size:12px;font-weight:650;color:var(--primary);letter-spacing:.4px;margin-bottom:6px}
.rev{padding:13px 0;border-bottom:1px solid var(--line-2)}
.rev:last-child{border-bottom:none}
.rev .t{font-size:13.5px;font-weight:560;line-height:1.6;margin-bottom:5px}
.rev .a{font-size:12.5px;color:var(--green);line-height:1.6}
.rev .a b{font-weight:600}
.rev .yours{font-size:12.5px;color:var(--red);line-height:1.6;margin-bottom:3px}

/* 列表 */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
  padding:0 12px 0 34px;font-size:13.5px;outline:none;color:var(--text);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238a919e' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-3.5-3.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:11px center}
.search:focus{border-color:var(--primary-line);box-shadow:0 0 0 3px rgba(79,70,229,.07)}
select{height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 10px;
  font-size:13px;color:var(--text-2);outline:none;font-family:inherit}
.list{overflow:hidden}
.row{border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row-h{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;cursor:pointer;transition:.12s}
.row-h:hover{background:#fafbfc}
.row-h .idx{font-size:11.5px;color:#b0b6c1;width:26px;flex:0 0 26px;padding-top:3px;font-variant-numeric:tabular-nums}
.row-h .body{flex:1;min-width:0}
.row-h .t{font-size:13.8px;font-weight:560;line-height:1.6;color:var(--text)}
.row-h .meta{display:flex;gap:7px;align-items:center;margin-top:6px;flex-wrap:wrap}
.row-h .chev{width:16px;height:16px;flex:0 0 16px;margin-top:5px;color:#c3c8d1;transition:.2s}
.row.open .chev{transform:rotate(180deg)}
.row-body{display:none;padding:2px 18px 20px 56px}
.row.open .row-body{display:block;animation:fade .2s ease}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600;letter-spacing:.2px}
.tag.c{background:#f2f3f6;color:#6b7280}
.tag.w{background:var(--red-soft);color:var(--red)}
.tag.f{background:var(--amber-soft);color:var(--amber)}
.tag.d{background:var(--green-soft);color:var(--green)}
.row-body .opt{font-size:13.5px;padding:10px 13px;margin-bottom:7px}
.row-body .opt:hover{border-color:var(--line);background:#fff}
.row-body .opt.correct:hover{border-color:#9ad9c0;background:#f3fbf7}
.row-body .opt.wrong:hover{border-color:#f0b7c0;background:#fdf3f5}
.row-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:32px;margin-bottom:10px;opacity:.35}
.empty p{margin:0 0 16px;font-size:13.5px;line-height:1.8}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.fchip{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;color:var(--text-2);background:#fff;
  border:1px solid var(--line);transition:.14s;font-weight:500}
.fchip:hover{border-color:#d5d8de}
.fchip.on{background:#14171c;color:#fff;border-color:#14171c;font-weight:600}
.mask{position:fixed;inset:0;background:rgba(20,23,28,.42);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:84vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-h{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}
.modal-h h3{margin:0;font-size:16px;font-weight:660}
.modal-b{padding:14px 20px 20px}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:14px}
.x:hover{background:#f2f3f6}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.steprow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-2)}
.steprow:last-child{border-bottom:none}
.catn{font-size:13px;font-weight:560}
.catn em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--muted);margin-left:8px}
.step{display:flex;align-items:center;gap:8px}
.sbtn{width:26px;height:26px;border-radius:8px;background:#f2f3f6;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--text-2)}
.sbtn:hover:not(:disabled){background:#e9ebef}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.sv{min-width:30px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums;font-size:13.5px}
.cat-sub{font-size:11.5px;color:var(--muted);margin-top:8px}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;background:#14171c;color:#fff;
  font-size:13px;padding:10px 18px;border-radius:10px;pointer-events:none;transition:.24s;z-index:99;
  box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .cats{grid-template-columns:repeat(2,1fr)}
  main{padding:24px 18px 90px}
}
@media(max-width:680px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:fixed;bottom:0;left:0;top:auto;z-index:50;
    flex-direction:row;padding:6px;border-right:none;border-top:1px solid var(--line);overflow-x:auto;gap:2px}
  .brand,.nav-label,.side-foot{display:none}
  .nav-item{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;min-width:56px;text-align:center;position:relative}
  .nav-item .badge{position:absolute;transform:translate(14px,-4px);margin:0}
  .cats{grid-template-columns:1fr}
  .qcard{padding:20px 18px}
  .qtitle{font-size:17.5px}
  .row-body{padding-left:18px}
  .qfoot{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">FE</div>
      <div>
        <div class="brand-t">前端面试刷题</div>
        <div class="brand-s">选择题 · 196 题</div>
      </div>
    </div>
    <div class="nav-label">练习</div>
    <button class="nav-item" data-nav="home" id="nav-home"></button>
    <button class="nav-item" data-nav="practice" id="nav-practice"></button>
    <button class="nav-item" data-nav="random" id="nav-random"></button>
    <div class="nav-label">复习</div>
    <button class="nav-item" data-nav="wrong" id="nav-wrong"></button>
    <button class="nav-item" data-nav="fav" id="nav-fav"></button>
    <div class="nav-label">资料</div>
    <button class="nav-item" data-nav="bank" id="nav-bank"></button>
    <div class="side-foot">
      <button class="mini-link" data-action="reset">清空学习记录</button>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="toast"></div>

<script>
const QUESTIONS = [{"id":1,"t":"常见的登录鉴权方式有哪些？各自的优缺点是？","c":"网络","o":["Session 天然支持分布式部署，多台机器之间无需共享存储","Session 方式无法实现主动登出，只能等用户关闭浏览器","JWT 无状态，但签发后难以主动失效","JWT 必须存在服务端内存里，否则服务端无法完成验签"],"a":2,"w":"JWT 把用户信息签名后交给客户端保存，服务端只验签、不存状态，所以天生适合分布式；代价是签发后无法中途撤销，要撤销只能维护黑名单。Session 正好相反：能随时删，但服务端必须存。","b":[{"type":"p","text":"登录鉴权这事，说白了就是确认“你是你”的过程。现在主流的几种方式，基本都围绕着怎么安全又高效地维持这个身份状态。"},{"type":"p","text":"1）Session-Cookie"},{"type":"p","text":"用户登录后，服务端生成一个 Session 存在内存或 Redis 里，把 sessionId 写进 Cookie 返回浏览器。后续请求自动带上 Cookie，服务端靠它查状态。优点是逻辑清晰，支持主动登出。但问题是服务端要存状态，横向扩容时得搞 Session 共享，比如用 Redis 集中存储，否则负载均衡到不同机器就认不出来了。"},{"type":"p","text":"2）Token（如 JWT）"},{"type":"p","text":"登录成功后，服务端把用户信息签成一个 Token 发回去，客户端自己存，每次请求放 Header 带上。服务端收到后通过密钥验签，不依赖本地存储。好处是无状态，适合分布式系统，像 Spring Cloud、Kubernetes 这种架构下很轻便。但 Token 一旦签发，无法中途撤销，除非加黑名单机制，反而变重了。而且别把敏感信息直接塞进 Payload。"},{"type":"p","text":"3）OAuth 2.0 / OpenID Connect不是直接做登录，而是授权框架。比如用微信登录第三方网站，你不用给密码，微信只返回一个 access token。OpenID Connect 在 OAuth 基础上加了 identity 层，真正实现“登录”。适合开放平台和单点登录（SSO），像钉钉、GitHub 登录都能这么搞。但流程复杂，一般小项目没必要。"},{"type":"p","text":"4）SAML"},{"type":"p","text":"老一点的企业级 SSO 方案，基于 XML，配置繁琐，但现在很多传统公司还在用，比如和 AD FS 对接。"}],"r":["Session 是服务端存状态，多机部署恰恰需要共享存储（如 Redis），说反了。","Session 可以在服务端销毁，主动登出反而是它的优点。","","JWT 是自包含的，服务端只需用密钥验签，不需要存储。"]},{"id":2,"t":"到底什么是 TCP 连接？","c":"网络","o":["内核中维护的一对状态，如序列号与窗口","TCP 连接一旦建立就会一直保持，即使网络中断也不会失效","TCP 连接是一条独占的物理链路，通信期间其他进程无法复用","TCP 连接只存在于应用层，与操作系统内核无关"],"a":0,"w":"TCP 连接不是一条真实的线，而是双方内核里的一对状态：序列号、窗口大小、缓冲区、定时器。网络中断或超时后状态对不上，连接就失效了。","b":[{"type":"p","text":"TCP 连接本质上是通信双方维护的一对状态，不是物理线路。建立连接靠三次握手，客户端和服务器交换各自的初始序列号（ISN），确认彼此的收发能力。"},{"type":"p","text":"1）第一次：客户端发 SYN=1, seq=x 给服务器"},{"type":"p","text":"2）第二次：服务器回 SYN=1, ack=x+1, seq=y"},{"type":"p","text":"3）第三次：客户端再发 ACK=1, ack=y+1"},{"type":"p","text":"握手完成后，双方内核里的 TCP 状态机都进入 ESTABLISHED，开始传输数据。断开连接则是四次挥手，因为 TCP 是双工的，读写通道要分别关闭。"},{"type":"p","text":"很多人以为连接是“通路”，其实它只是操作系统里两个 socket 对象在内核中保存的状态信息，比如缓冲区、窗口大小、序列号等。网络中断或超时，状态不一致，连接就失效了。"},{"type":"p","text":"像 Nginx、Redis 这类高并发服务，最怕 TIME_WAIT 太多或者文件描述符耗尽，本质都是连接资源没释放。所以得调优内核参数，比如开启 SO_REUSEADDR 或调整 tcp_tw_reuse 。"},{"type":"p","text":"状态同步 和 可靠传输 才是 TCP 连接的核心目标，它通过序列号、确认应答、超时重传来保证数据不丢、不乱序。连接本身，不过是实现这个目标的上下文容器。"}],"r":["","连接是状态，网络中断或超时就会失效，不存在“永远保持”。","连接不独占物理链路，同一条链路可以承载成千上万个 TCP 连接。","连接由操作系统内核维护，应用层只是通过 socket 使用它。"]},{"id":3,"t":"TCP 是用来解决什么问题？","c":"网络","o":["为应用提供加密传输，防止数据被窃听和篡改","把 IP 地址解析成域名，方便用户记忆和访问","解决网络带宽不足的问题，通过压缩提高传输速度","在不可靠网络上提供可靠的字节流"],"a":3,"w":"TCP 只解决一件事：在会丢包、会乱序的网络上，把数据完整有序地送到对端。加密是 TLS 的事，域名解析是 DNS 的事。","b":[{"type":"p","text":"TCP 的本质是解决不可靠网络下的可靠传输问题。现实中的网络会丢包、乱序、重复，甚至中断，而 TCP 就是在这种环境下，让数据像“流水”一样完整、有序地从一端送到另一端。"},{"type":"p","text":"它不关心你传的是网页、文件还是视频，只保证：你说要发 10000 字节，对方就得收到完整的 10000 字节，少一个都不行。"},{"type":"p","text":"实现靠的是几个关键机制："},{"type":"p","text":"1）序列号和确认应答。每个字节都编了号，接收方回个 ACK 告诉发方“我收到到第多少了”。没收到确认？定时器一到就重发，确保不丢。"},{"type":"p","text":"2）滑动窗口。不是发一个等一个 ACK，那样太慢。TCP 允许连续发一批，只要在窗口范围内，对方处理得过来就行，效率高。"},{"type":"p","text":"3）流量控制和拥塞控制。接收方通过窗口字段告诉发送方“我现在只能收这么多”，避免被压垮；网络堵了就主动降速，比如用 Reno 或 Cubic 算法调整发送节奏。"},{"type":"p","text":"4）连接管理。三次握手建立连接，双方同步初始序列号，避免历史连接干扰；四次挥手确保双方都确认关闭。"},{"type":"p","text":"典型场景比如 HTTP 协议跑在 TCP 上，浏览器加载页面不能丢包，否则 HTML 解析就错了。而像音视频通话这种实时性要求高、能容忍少量丢失的，则更倾向用 UDP。"},{"type":"p","text":"所以，TCP 的价值就是为上层屏蔽底层网络的复杂性，提供一条“可靠的字节流管道”。"}],"r":["加密是 TLS/HTTPS 的职责，TCP 本身不加密。","把 IP 解析成域名是 DNS 的工作。","TCP 不做压缩，它优化的是可靠性而不是带宽。",""]},{"id":4,"t":"TCP 和 UDP 有什么区别？","c":"网络","o":["TCP 头部只有 8 字节，UDP 头部至少 20 字节","TCP 无连接、开销小；UDP 面向连接、可靠性高","TCP 可靠有序，UDP 不保证可靠但延迟低","UDP 支持重传和流量控制，因此更适合文件传输"],"a":2,"w":"TCP 面向连接、保证可靠有序，代价是开销大、延迟高；UDP 无连接、不保证送达，但头部只有 8 字节、也没有重传等待，所以延迟低，适合音视频。","b":[{"type":"p","text":"TCP 和 UDP 的本质区别在于，一个追求可靠交付，一个追求极致效率。"},{"type":"p","text":"TCP 会建立连接，通过三次握手确认双方收发能力没问题，数据包丢了会重传，顺序乱了会重新排序，保证你收到的数据和发送的一致。像 HTTP、数据库连接这些不能出错的场景都用它，背后是 可靠性 在撑腰。"},{"type":"p","text":"UDP 完全不握手，发出去就完事，不管对方听没听到。没有重传、没有流量控制，但正因为没这么多约束，性能高、延迟低。音视频通话用 UDP 多，比如 WebRTC，偶尔丢个包顶多画面卡一下，总比延迟高强。"},{"type":"p","text":"1）TCP 有连接状态，维护成本高，并发百万连接对服务器资源消耗大"},{"type":"p","text":"2）UDP 无状态，每个包独立处理，天生适合做广播、组播，像 DNS 查询、DHCP 分配 IP 都靠它"},{"type":"p","text":"3）TCP 头部至少 20 字节，UDP 只有 8 字节，头部开销小一半以上"},{"type":"p","text":"代码上看也很直观："},{"type":"code","text":"// UDP 发送片段\nDatagramSocket socket = new DatagramSocket();\nbyte[] data = \"hello\".getBytes();\nInetAddress addr = InetAddress.getByName(\"127.0.0.1\");\nDatagramPacket packet = new DatagramPacket(data, data.length, addr, 8080);"},{"type":"p","text":"socket.send(packet); // 扔出去就不管了"},{"type":"code","text":"// TCP 发送片段\nSocket socket = new Socket(\"127.0.0.1\", 8080);\nOutputStream out = socket.getOutputStream();"},{"type":"p","text":"out.write(\"hello\".getBytes()); // 写完也不一定立刻发，内核会缓冲"},{"type":"p","text":"简单说，要准确就选 TCP，要快就选 UDP。没有谁更好，只有合不合适。"}],"r":["头部长度说反了：TCP 至少 20 字节，UDP 只有 8 字节。","特性完全说反了，面向连接、可靠的是 TCP。","","重传和流量控制是 TCP 的能力，UDP 没有这些机制。"]},{"id":5,"t":"说说 TCP 的三次握手？","c":"网络","o":["两次握手其实已经足够，第三次只是为兼容老设备","协商加密密钥，握手完成后才开始加密传输数据","同步双方初始序列号，确认收发能力","第三次握手由服务端发起，客户端只负责回复一个 ACK"],"a":2,"w":"三次握手的核心是同步双方初始序列号、确认彼此都能收能发。只握两次的话，服务端无法确认客户端能收到自己的报文，历史连接也可能混进来。","b":[{"type":"p","text":"TCP 三次握手是建立连接的必经之路，主要目的是同步双方的初始序列号，确保通信能正常开始。"},{"type":"p","text":"客户端先发一个 SYN 包，带上自己的初始序列号 seq=x。这个包就像敲门说“我想连你”。服务器收到后，得回应一个ACK=x+1 表示确认收到，同时再发一个 SYN=y 告诉客户端“我也想连你”，这就是 SYN+ACK 包。最后客户端再回一个 ACK=y+1，表示你也收到了。这时候连接才算真正建立起来。"},{"type":"p","text":"整个过程涉及的状态变化要清楚。客户端从 SYN_SENT 到 ESTABLISHED，服务器从 LISTEN 进入 SYN_RCVD，最后双方都到 ESTABLISHED。如果中途丢包，比如第一个 SYN 没到，客户端会超时重传，一般重试 5 次，间隔从 1 秒开始指数增长。"},{"type":"p","text":"为啥不能两次？因为两次无法保证双向通道都通。客户端发了 SYN，服务器回 ACK，但这个 ACK 可能丢失，客户端不知道服务器是否准备好了，直接发数据就可能白发。三次能确保两边都能收也能发。"},{"type":"p","text":"现实里像 Nginx、Redis 这些服务启动后就在 listen，等着客户端来握手。高并发场景下可能出现半连接队列（SYN 队列）满的情况，这时候新的连接请求会被丢弃，得调大 somaxconn 和 tcp_max_syn_backlog。"},{"type":"p","text":"最后一次 ACK 如果丢了，服务器会重发 SYN+ACK，客户端收到后会重新回复 ACK，避免连接卡住。"}],"r":["两次握手无法确认客户端的接收能力，也可能被历史连接干扰。","握手不负责加密，密钥协商是 TLS 握手的事。","","第三次 ACK 由客户端发出，服务端只是接收。"]},{"id":6,"t":"说说 TCP 的四次挥手？","c":"网络","o":["服务端收到 FIN 后一定马上回 FIN，所以实际只需要三次","主动关闭方收到 FIN 后必须立即关闭，否则连接一定会泄漏","全双工，两个方向需要各自独立关闭","四次挥手是为了重传丢失的数据，与关闭方向无关"],"a":2,"w":"TCP 是全双工，两个方向要各自关闭：一方发 FIN 只表示“我不发了”，对方还可以继续发数据，所以 ACK 和 FIN 往往分两次发，一共四次。","b":[{"type":"p","text":"TCP 四次挥手是连接释放的标准流程，确保双方都能可靠地关闭数据传输。"},{"type":"p","text":"客户端发送 FIN 报文，表示自己不再发数据了。服务端收到后回复 ACK，这个阶段叫半关闭，服务端还能继续发数据。"},{"type":"p","text":"等服务端也准备好关闭时，会发自己的 FIN 报文。客户端收到后回复最后一个 ACK，等待 2MSL 时间后彻底关闭连接。"},{"type":"p","text":"整个过程需要四次交互，主要是因为 TCP 是全双工通信，两端必须独立关闭。如果任意一端不确认对方的 FIN，连接就不能安全释放。"},{"type":"p","text":"1）客户端发 FIN"},{"type":"p","text":"2）服务端回 ACK（此时客户端进入 FIN_WAIT_2，服务端进入 CLOSE_WAIT）"},{"type":"p","text":"3）服务端发 FIN"},{"type":"p","text":"4）客户端回 ACK（进入 TIME_WAIT，服务端收到后连接关闭）"},{"type":"p","text":"TIME_WAIT 状态很关键，它防止最后一个 ACK 丢包导致服务端重传 FIN 失败。客户端要等够 2 倍的最大报文生存时间，确保网络中残留的该连接报文都消失。"},{"type":"p","text":"常见问题是在高并发短连接场景下，客户端大量处于 TIME_WAIT 状态，占用端口资源。可以通过开启"},{"type":"p","text":"SO_REUSEADDR 或调整内核参数来缓解。"}],"r":["服务端收到 FIN 后可能还有数据要发，ACK 和 FIN 不能合并，所以通常是四次。","收到 FIN 只是半关闭，主动关闭方还要等对方也关闭，不会立刻释放。","","四次挥手是为了分别关闭两个方向，与重传无关。"]},{"id":7,"t":"TCP 超时重传机制是为了解决什么问题？","c":"网络","o":["解决局域网内 IP 地址冲突的问题","解决接收方缓冲区不足导致的数据丢失","数据包丢失、迟迟收不到 ACK 时重传","解决网络拥塞时多条连接的带宽公平分配问题"],"a":2,"w":"超时重传是 TCP 可靠性的兜底：每个已发送的报文都有定时器，超时还没收到 ACK 就重发，用来对付丢包和 ACK 丢失。","b":[{"type":"p","text":"网络传输不是理想环境，数据包可能在路上丢了，或者回执丢了。TCP 作为可靠的传输协议，必须能发现这种情况并补救，不然应用层就收不到完整数据。"},{"type":"p","text":"超时重传解决的就是丢包问题。发送方发出去一个报文段后，会启动一个定时器。如果在规定时间内没收到对方的ACK 确认，就认为这个包丢了，于是重新发一次。整个过程对上层应用透明。"},{"type":"p","text":"这个“规定时间”叫 RTO（Retransmission Timeout），它不是固定值。TCP 会根据当前网络的实际往返时间 RTT 动态计算 RTO。比如刚开始估计是 200ms，后来发现网络变慢了，RTT 升到 500ms，RTO 也会跟着调整，避免误判重传。"},{"type":"p","text":"1）每次发数据都会启动定时器"},{"type":"p","text":"2）ACK 到了就清除对应定时器"},{"type":"p","text":"3）超时未到 ACK 就重发并加倍等待时间（指数退避）"},{"type":"p","text":"这样既能应对暂时的网络波动，又不会在网络彻底卡住时疯狂重试。"},{"type":"p","text":"如果连续重传几次（一般是 15 次）还是没响应，TCP 连接就会被断开。这种机制让 TCP 能在不可靠的 IP 层之上，建立起可靠的数据通道。"}],"r":["IP 地址冲突由 ARP 和网络配置处理，和重传无关。","接收方缓冲区不足靠流量控制（窗口）解决，不是重传。","","带宽公平是拥塞控制要解决的问题，不是重传。"]},{"id":8,"t":"TCP/IP 四层模型是什么？","c":"网络","o":["应用层、传输层、网络层、网络接口层","物理层、数据链路层、网络层、传输层","应用层、传输层、网络层、物理层","应用层、表示层、会话层、传输层"],"a":0,"w":"TCP/IP 四层是：应用层、传输层、网络层、网络接口层。它把 OSI 的会话层、表示层并入应用层，把数据链路层和物理层并入网络接口层。","b":[{"type":"p","text":"TCP/IP 不是死记硬背的四层，而是为了解决网络通信问题演化出来的分层设计。每一层各司其职，把复杂的联网拆解成可管理的部分。"},{"type":"p","text":"1）链路层"},{"type":"p","text":"负责物理传输，比如以太网、Wi-Fi 这一层处理 MAC 地址和帧的收发。交换机工作在这里，数据包压根不经过 IP，直接靠 MAC 转发。"},{"type":"p","text":"2）网络层"},{"type":"p","text":"核心是 IP 协议，负责主机到主机的寻址和路由。路由器根据 IP 地址转发数据包，中间可能经过十几个节点。ICMP、ARP 也归这一层管。"},{"type":"p","text":"3）传输层"},{"type":"p","text":"提供端到端的通信能力。TCP 保证可靠、有序、重传，适合 HTTP、数据库连接；UDP 不保证送达，但快，音视频通话、DNS 查询就用它。"},{"type":"p","text":"4）应用层"},{"type":"p","text":"所有协议都为具体应用服务。HTTP、HTTPS、FTP、SMTP 都属于这层。你的程序代码最常接触的就是这一层接口。"},{"type":"p","text":"实际抓包时你会发现，一个 HTTP 请求背后是四层协议层层封装：应用数据加上 TCP 头，再加 IP 头，最后套上以太网帧头，发出去。"}],"r":["","这是 OSI 的下四层，缺少应用层，也不是 TCP/IP 的分法。","最后一层写成了物理层，TCP/IP 里叫网络接口层。","这是 OSI 的上四层，不是 TCP/IP 四层模型。"]},{"id":9,"t":"请描述简单工厂模式的工作原理。","c":"设计模式","o":["新增产品时只需新增产品类，工厂类完全不用改动","每种产品都必须自己实现一个工厂类，客户端 new 对应的工厂","传参给工厂类，由它决定创建哪种产品","工厂类负责实现产品的业务方法，产品类只保留数据字段"],"a":2,"w":"简单工厂把“创建哪种产品”的判断集中在一个工厂类里，客户端只传参数。缺点也在这里：新增产品必须改工厂里的 if/switch，违反开闭原则。","b":[{"type":"p","text":"简单工厂模式的核心是把对象的创建过程集中到一个“工厂”类里，客户端不用关心具体怎么创建实例，只要告诉工厂想要什么类型就行。"},{"type":"p","text":"1） 工厂类内部通常有一个静态方法，接收一个参数比如类型标识，通过 if-else 或 switch 判断该返回哪个具体实现。比如传入 \"mysql\" 就返回 MySqlDriver ，传入 \"redis\" 就返回 RedisClient 。"},{"type":"p","text":"2） 客户端代码只需要依赖抽象接口或父类，不直接调用 new。这样新增产品时，理论上只需修改工厂逻辑，而不必改动所有使用方。"},{"type":"p","text":"3） 这种模式其实违背了开闭原则，每加一种新产品就得改工厂方法。所以适合产品种类固定、变化少的场景，比如配置解析器，支持 JSON 和 XML 两种格式就够了。"},{"type":"p","text":"代码示例如下："},{"type":"code","text":"public class ParserFactory {\n    public static Parser create(String type) {\n        if (\"json\".equals(type)) return new JsonParser();\n        if (\"xml\".equals(type)) return new XmlParser();\n        throw new IllegalArgumentException(\"Unknown type\");\n    }\n}"},{"type":"p","text":"说白了，它就是个封装了 new 的工具类，让调用方更干净，但扩展性有限。真要搞灵活，还是得上 工厂方法模式 或抽象工厂。"}],"r":["新增产品必须修改工厂类的判断分支，恰恰违反了开闭原则。","这是工厂方法模式的做法，每种产品配一个工厂。","","工厂只负责创建，业务方法仍在产品类里。"]},{"id":10,"t":"什么是原型模式？一般用在什么场景？","c":"设计模式","o":["把实例化延迟到子类，由子类决定创建哪个类","通过继承父类并重写方法创建对象，子类决定具体行为","复制已有实例创建新对象，适合高成本对象","用一个全局单例对象保存所有需要复用的实例"],"a":2,"w":"原型模式通过 clone 已有实例来创建新对象，跳过昂贵的初始化过程，适合创建成本高、结构复杂的对象。关键是分清深拷贝和浅拷贝。","b":[{"type":"p","text":"原型模式就是通过拷贝一个已有对象来创建新对象，而不是走构造函数那套流程。关键在于实现 Cloneable 接口并重写 clone() 方法，让对象能自己复制自己。"},{"type":"p","text":"1）当你发现创建对象的过程特别重，比如要查数据库、读文件、网络请求，这时候用原型模式缓存一个“样板”对象，后续直接克隆，性能提升非常明显。像 Spring 框架里的 prototype 作用域，每次 getBean() 都返回一个新实例，底层就是靠克隆机制实现的。"},{"type":"p","text":"2）在某些配置中心场景里，比如你有一个默认配置对象，每次新增一个服务实例时只需要微调几个字段，其他都一样，这时候基于默认配置 clone 一份再改，比重新 new 一套要安全又高效。"},{"type":"p","text":"3）注意浅拷贝和深拷贝的问题。Object.clone() 默认是浅拷贝，如果对象里有引用类型，克隆后的对象还是指向同一个引用，改一个另一个也跟着变。真要隔离就得自己实现深拷贝，比如通过序列化反序列化，或者递归拷贝成员对象。"},{"type":"code","text":"public class Config implements Cloneable {\n    private String name;\n    private Map<String, String> settings;\n    @Override\n    public Config clone() {\n        try {\n            Config cloned = (Config) super.clone();\n            // 手动深拷贝引用类型\n            cloned.settings = new HashMap<>(this.settings);\n            return cloned;\n        } catch (CloneNotSupportedException e) {\n            throw new RuntimeException(e);\n        }\n    }\n}"},{"type":"p","text":"这种模式适合那种“创建成本高、结构复杂但差异小”的对象创建场景，属于典型的以空间换时间。"}],"r":["把实例化延迟到子类是工厂方法模式。","靠继承和重写创建对象，不是原型模式。","","全局保存一份实例是单例模式。"]},{"id":11,"t":"什么是模板方法模式？一般用在什么场景？","c":"设计模式","o":["父类定义算法骨架，子类实现具体步骤","为其他对象提供一种代理，以控制对它的访问","通过组合把整个算法完全委托给另一个对象执行","子类定义算法骨架，父类负责填充每一个具体步骤"],"a":0,"w":"模板方法在父类里固定算法骨架（步骤顺序），把变化的步骤留成抽象方法或钩子交给子类实现。框架的生命周期钩子就是典型应用。","b":[{"type":"p","text":"模板方法模式说白了就是把一个算法的流程固定下来，把不变的部分在抽象类里写死，变的部分交给子类去实现。父类控制整体步骤，子类只负责具体细节。"},{"type":"p","text":"1） 定义了一个算法骨架，比如处理请求的流程是：校验 -> 处理 -> 记录日志。这个流程不能改。"},{"type":"p","text":"2） 把校验、处理这些步骤声明成抽象方法，子类根据业务实现自己的逻辑。比如支付流程里，微信支付和支付宝支付的处理方式不同，但整体流程一致。"},{"type":"p","text":"3） 钩子方法可以用来做条件分支，父类通过 isDebug() 这样的默认返回值控制是否打印日志，子类可选择性覆盖。"},{"type":"p","text":"这种模式在框架设计里特别常见。Spring 的 JdbcTemplate 就是个典型例子，你写 SQL，它帮你搞定连接管理、异常转换、资源释放这些脏活累活。还有像 AbstractList 里的 addAll 方法，底层调用 add ，而 add 是抽象的，留给具体集合实现。"},{"type":"p","text":"代码长这样："},{"type":"code","text":"abstract class ProcessTemplate {\n    public final void execute() {\n        validate();\n        process();\n        log();\n    }\n    abstract void validate();\n    abstract void process();\n    void log() { System.out.println(\"default log\"); }\n}\nclass MyProcess extends ProcessTemplate {"},{"type":"p","text":"void validate() { /* 自定义校验 */ }void process() { /* 业务处理 */ }"},{"type":"code","text":"}"},{"type":"p","text":"适合用在多个子类有相同工作流程，只是细节不同的场景。要是每个子类流程都不一样，硬套模板反而更麻烦。"}],"r":["","为其他对象提供代理是代理模式。","把算法整体委托出去是策略/组合的做法，模板方法强调的是“骨架固定、步骤可变”。","父子职责说反了：骨架在父类，具体步骤在子类。"]},{"id":12,"t":"什么是策略模式？一般用在什么场景？","c":"设计模式","o":["定义一对多依赖，一个对象状态变化时通知所有依赖者","把算法封装成可互换的类，避免大量 if-else","让一个对象在运行期改变自己的类，看起来像换了类型","保证一个类只有一个实例，并提供全局访问点"],"a":1,"w":"策略模式把一组可互换的算法各自封装成类，运行时按需切换，用来消除大段 if-else。它和状态模式的区别是：策略由外部选择，状态由内部流转。","b":[{"type":"p","text":"策略模式解决的是“一堆 if-else 或 switch 分支里塞不同算法”的问题。你想啊，比如做支付功能，微信支付、支付宝、银联，每种逻辑完全不同，要是全写在一个方法里，代码立马爆炸，维护起来根本搞不定。"},{"type":"p","text":"它的核心是把每个算法封装成独立的类，都实现同一个接口。运行时根据条件选一个具体实现来用。这样新增支付方式不用改老代码，符合开闭原则。"},{"type":"p","text":"一般在这些场景特别好使： 1）有明显的行为分支，比如计算运费，按城市、重量、会员等级有不同算价规则 2）需要动态切换算法，像导出报表支持 CSV、Excel、PDF 三种格式 3）避免重复的条件判断，像促销活动满减、打折、返券"},{"type":"p","text":"举个例子，Spring 的 Resource 接口就是典型，ClassPathResource 、FileSystemResource 、"},{"type":"p","text":"UrlResource 各自处理不同路径类型的资源加载，调用方压根不经过具体实现。"},{"type":"code","text":"public interface Strategy {\n    void execute();\n}\npublic class Context {\n    private Strategy strategy;\n    public void setStrategy(Strategy strategy) {\n        this.strategy = strategy;\n    }\n    public void run() {\n        strategy.execute();\n    }\n}"},{"type":"p","text":"实际项目里，配合 Spring 的 IoC，直接把所有策略实现注入进来，用 map 存好，key 是策略名，取的时候"},{"type":"p","text":"strategies.get(\"alipay\").execute() 就行，干净利落。"}],"r":["一对多依赖、状态变化通知，是观察者模式。","","运行期改变自身行为、看起来像换了类，是状态模式。","保证唯一实例是单例模式。"]},{"id":13,"t":"请用一句话概括，什么是设计模式？为什么要用？","c":"设计模式","o":["专门用于提升程序运行速度的算法集合","对反复出现的设计问题的可复用解决方案","一种编程语言的语法规范，写代码时必须严格遵守","一套固定的代码模板，遇到问题直接复制粘贴即可"],"a":1,"w":"设计模式是对反复出现的设计问题的可复用解决方案，描述的是“问题—方案—取舍”，不是可以直接抄的代码模板，也不是性能优化算法。","b":[{"type":"p","text":"设计模式是前人总结的、针对特定软件设计问题的经典解决方案模板，它让开发者能快速复用经过验证的设计思路，避免重复造轮子。"},{"type":"p","text":"比如你写一个数据库连接池，直接上手搞可能线程安全、资源回收都容易出问题。但如果你用了单例模式保证实例唯一，配合对象池模式管理连接生命周期，代码结构清晰，稳定性也高得多。"},{"type":"p","text":"这些模式在 Spring、Netty 这些主流框架里到处都是。像 Spring 的 Bean 默认就是单例模式，Netty 的事件循环组也是典型的对象池实现。"},{"type":"p","text":"用模式不是为了炫技，而是为了解决“类之间怎么协作”、“对象怎么创建”、“状态怎么管理”这类高频难题。不用的话，小项目还能靠经验顶一顶，项目一复杂就容易架构混乱，后期维护成本翻倍。"},{"type":"p","text":"1）创建型模式解决对象怎么生出来，比如工厂模式把创建逻辑封装掉"},{"type":"p","text":"2）结构型模式解决类和对象怎么组合，比如代理模式可以在不改原逻辑的前提下加日志、事务"},{"type":"p","text":"3）行为型模式解决对象间怎么通信，比如观察者模式解耦事件发布与监听"}],"r":["设计模式不是算法，它解决结构问题而不是计算问题。","","设计模式与具体语言语法无关，任何语言都能用。","模式要结合场景调整，照抄模板反而会造成过度设计。"]},{"id":14,"t":"HTML 的 src 和 href 属性有什么区别？","c":"HTML","o":["href 会阻塞页面解析，src 不会","src 只能用于图片，href 只能用于超链接","src 引入并替换元素内容，href 只建立关联","两者没有本质区别，在任何标签上都可以互换"],"a":2,"w":"src 是“引入并替换”：浏览器下载资源并嵌入当前位置（script、img、iframe）。href 是“建立关联”：只告诉浏览器存在这个外部资源（link、a），不会替换元素内容。","b":[{"type":"p","text":"src 和 href 都是 HTML 中用来引入外部资源的属性，但它们的语义和浏览器处理方式完全不同。"},{"type":"p","text":"src 是 替换 行为。比如 <script src=\"...\"> 或 <img src=\"...\"> ，浏览器会去加载这个资源，并把它“放”到当前标签的位置上。你可以理解成：这个标签的内容就是由 src 指向的资源决定的，原始标签内容会被完全替换。"},{"type":"p","text":"而 href 是 链接 行为，通常用在 <link> 或 <a> 标签里。它不会替换当前元素，而是建立一个关联。比如"},{"type":"p","text":"<link href=\"style.css\" rel=\"stylesheet\"> ，是告诉浏览器：“去加载这个 CSS 文件，然后应用到当前页面”，但它自己不展示内容。<a href=\"...\"> 则是可点击的导航链接。"},{"type":"p","text":"关键区别在于文档流的参与方式："},{"type":"p","text":"1）src 引入的资源会阻塞渲染（比如 JS），被视为页面的一部分，直接嵌入文档树。 2）href 更多是建立关联，比如样式表、图标、跳转链接，不一定会嵌入内容主体。"},{"type":"p","text":"代码示例："},{"type":"p","text":"<img src=\"photo.jpg\"> <!-- 替换为图片 --><link href=\"theme.css\" rel=\"stylesheet\"> <!-- 关联样式，不替换 --><a href=\"/home\">首页<\/a> <!-- 导航，用户触发 -->"},{"type":"p","text":"简单记：src 是“拿来用”，href 是“挂个钩”。"}],"r":["link 阻塞的是渲染、script 的 src 阻塞解析，这里把两者的阻塞行为说反了。","src 也用于 script、iframe、video，href 也用于 link，不限于超链接。","","两者语义不同，换用会导致资源加载失败或行为异常。"]},{"id":15,"t":"DOCTYPE（文档类型）的作用是什么？","c":"HTML","o":["指定页面引用的 CSS 版本号","引入外部 DTD 文件，缺失会导致页面完全无法渲染","声明文档类型，让浏览器用标准模式解析","声明页面使用的字符编码，避免中文乱码"],"a":2,"w":"DOCTYPE 只做一件事：告诉浏览器用标准模式还是怪异模式解析。HTML5 写 <!DOCTYPE html> 即可；缺失时浏览器退回怪异模式，盒模型等表现会不一致。","b":[{"type":"p","text":"DOCTYPE 的作用是告诉浏览器当前 HTML 文档使用哪个版本的 HTML 标准来解析页面。没有它，浏览器可能会进入“怪异模式”，渲染行为就跟标准不一致了。"},{"type":"p","text":"现代网页基本都用 <!DOCTYPE html> ，这行代码最顶上，一个字母都不能错。它不是 HTML 标签，浏览器看到它就知道接下来要用 HTML5 的规则处理文档。"},{"type":"p","text":"比如你写个简单的页面："},{"type":"code","text":"<!DOCTYPE html>\n<html>\n<head>"},{"type":"p","text":"<title>示例<\/title>"},{"type":"code","text":"<\/head>\n<body>\n  <h1>Hello<\/h1>\n<\/body>\n<\/html>"},{"type":"p","text":"只要这一行在，浏览器就按标准模式布局、盒模型、CSS 解析全都走统一规则。不然像 IE6/7 那种老时代，没DOCTYPE 就直接怪异模式，宽度计算都能差几十像素，页面直接错乱。"},{"type":"p","text":"现在主流框架如 React、Vue 生成的模板都默认带上这行，开发时几乎不会踩这个坑。但如果是手写静态页或者服务端直出 HTML，漏写 DOCTYPE 可能会让样式表现和预期对不上，尤其在一些嵌入式 WebKit 内核里更容易出问题。"},{"type":"p","text":"简单说，这行就是让浏览器“规矩”干活的起点，压根不经过猜测，直接进标准模式。"}],"r":["CSS 版本由浏览器能力决定，DOCTYPE 不声明 CSS 版本。","缺失 DOCTYPE 页面仍能渲染，只是进入怪异模式，不是无法渲染。","","字符编码由 meta charset 声明，与 DOCTYPE 无关。"]},{"id":16,"t":"HTML 的 script 标签中 defer 和 async 有什么区别？","c":"HTML","o":["两者都会阻塞 HTML 解析，只是阻塞时机不同","都异步下载；defer 保序，async 不保序","defer 是下载完立即执行，async 保证按文档顺序执行","defer 只对外部脚本有效，async 只能用于内联脚本"],"a":1,"w":"defer 和 async 都不阻塞解析、都异步下载。区别在执行时机：defer 等文档解析完、按顺序在 DOMContentLoaded 前执行；async 下载完就执行，顺序不可控。","b":[{"type":"p","text":"script 标签的 defer 和 async 都能异步加载脚本，避免阻塞页面解析，但执行时机完全不同。"},{"type":"p","text":"async 加载完就执行，不保证顺序，跟 script 的位置没关系。比如你写了两个 async 脚本，先写的可能后执行，完全看谁先下载完。这种适合独立脚本，像 Google Analytics 这类埋点代码，不依赖其他脚本，也不被别人依赖。"},{"type":"p","text":"defer 则不同，它是等到 HTML 文档解析完了，DOMContentLoaded 事件触发之前按顺序执行。多个 defer 脚本会严格按照它们在文档中出现的顺序执行，适合需要操作 DOM 或有依赖关系的场景。"},{"type":"p","text":"如果把两个都设上，现代浏览器会优先遵循标准行为：支持 defer 的情况下，async 会被忽略，表现得像只有 defer。所以别同时写，容易自己搞混。"},{"type":"p","text":"没有 defer 或 async 的 script 会阻塞 HTML 解析，一旦遇到就停下等脚本下载执行完再继续，这也是为什么老式代码常放在 body 底部。"},{"type":"p","text":"1）async：下载不阻塞解析，下载完成立刻执行，执行时会阻塞解析"},{"type":"p","text":"2）defer：下载不阻塞解析，等到解析完成后、DOMContentLoaded 前按序执行"}],"r":["两者都不阻塞 HTML 解析，这正是它们存在的意义。","","说反了：defer 才保证顺序，async 是下载完立即执行。","这两个属性都只对外部脚本生效，内联脚本上无效。"]},{"id":17,"t":"常用的 HTML meta 标签有哪些？","c":"HTML","o":["charset、viewport、description 等","class、id、style、data-* 等用来标识元素的属性","src、href、alt、title 等用来引用资源的标签属性","async、defer、crossorigin 等控制脚本加载的属性"],"a":0,"w":"meta 描述的是文档级元信息：字符编码、视口、SEO 描述关键词，以及用 http-equiv 模拟响应头。其余选项列的都是写在元素上的标签属性。","b":[{"type":"p","text":"meta 标签是 HTML 中用于提供页面元信息的手段，不直接显示，但影响浏览器行为或被搜索引擎读取。"},{"type":"p","text":"1）字符集声明"},{"type":"p","text":"指定文档编码，避免乱码。现代项目基本都用 UTF-8。"},{"type":"code","text":"<meta charset=\"UTF-8\">"},{"type":"p","text":"2）视口控制（viewport）"},{"type":"p","text":"移动端适配关键，控制布局宽度和缩放。"},{"type":"code","text":"<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">"},{"type":"p","text":"没有它，移动端页面会按桌面宽度渲染，字体小得看不清。"},{"type":"p","text":"3）页面描述与 SEO"},{"type":"p","text":"description 被搜索引擎用作结果摘要，影响点击率。"},{"type":"p","text":"<meta name=\"description\" content=\"这是页面的简要说明\">"},{"type":"p","text":"keywords 已被主流引擎弃用，不用写。"},{"type":"p","text":"4）HTTP 头模拟"},{"type":"p","text":"可模拟 HTTP 响应头，比如设置刷新或缓存指令。"},{"type":"code","text":"<meta http-equiv=\"refresh\" content=\"5;url=https://example.com\">"},{"type":"p","text":"现在这类操作更多由服务端控制，前端少用。"},{"type":"p","text":"5）Open Graph 与社交分享"},{"type":"p","text":"让页面在微信、微博、Facebook 等平台分享时展示标题、图片等。"},{"type":"p","text":"<meta property=\"og:title\" content=\"分享标题\">"},{"type":"code","text":"<meta property=\"og:image\" content=\"https://example.com/image.png\">"},{"type":"p","text":"Twitter 也有类似 meta，前缀是 twitter: 。"},{"type":"p","text":"6）应用模式（iOS Safari）"},{"type":"p","text":"让页面以全屏应用形式打开，隐藏浏览器 UI。"},{"type":"code","text":"<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">"},{"type":"p","text":"这些标签看似简单，但在 SEO、移动端体验、社交传播上起着基础作用，尤其 viewport 和 og 标签，在现代网页开发中几乎是标配。"}],"r":["","class/id/style/data-* 是写在元素上的属性，不是 meta 标签。","src/href/alt/title 是资源引用类的标签属性。","async/defer/crossorigin 是 script 标签的属性。"]},{"id":18,"t":"HTML5 相比于 HTML 有哪些更新？","c":"HTML","o":["主要是把 CSS3 的全部特性纳入了 HTML 规范","只是增加了若干新标签，API 层面没有任何变化","语义化标签、表单增强、多媒体、本地存储","主要是新增了 table 布局和 frameset 框架能力"],"a":2,"w":"HTML5 是一次体系升级：语义化标签（header/nav/article）、表单新类型与校验、Canvas 与音视频、本地存储与离线能力等，不只是加了几个标签。","b":[{"type":"p","text":"HTML5 不是简单地在 HTML 上修修补补，而是重构了整个 Web 应用的开发模型。它让浏览器能原生支持更多功能，减少对插件的依赖。"},{"type":"p","text":"语义化标签是重点。以前一个页面全是 div，现在可以用 header、nav、section、article、aside、footer 这些标签，结构清晰，对 SEO 和可访问性帮助很大。"},{"type":"p","text":"多媒体支持直接内置。audio 和 video 标签出来后，不用再靠 Flash 播放音视频，像 YouTube 早期就重度依赖Flash，现在完全可以通过原生标签加载。"},{"type":"p","text":"表单能力增强不少。新增了 email、url、number、range、date 等输入类型，自带校验逻辑，移动端还能自动切换键盘类型，用户体验提升明显。"},{"type":"p","text":"本地存储方案升级。localStorage 和 sessionStorage 替代了部分 cookie 的角色，能存 5MB 左右的数据，且不会随请求发给服务器，减轻网络负担。"},{"type":"p","text":"离线能力通过 Application Cache 和后来的 Service Worker 推动，配合 manifest 文件或 PWA，实现离线访问和后台同步。"},{"type":"p","text":"Canvas 和 SVG 让前端可以做图形渲染，比如数据可视化库 D3.js 就基于 SVG，游戏或图表可以直接在页面绘制。"},{"type":"p","text":"WebSocket 实现全双工通信，和传统的轮询比，延迟更低，适合实时应用，比如聊天室用 WebSocket 能做到秒级消息到达。"}],"r":["CSS3 是另一套规范，并没有被并入 HTML。","HTML5 新增了大量 API：存储、地理定位、拖拽、Web Worker 等。","","table 布局和 frameset 是旧时代产物，HTML5 反而废弃了 frameset。"]},{"id":19,"t":"HTML 中，img 标签 srcset 属性的作用是什么？","c":"HTML","o":["为同一张图片设置多套 alt 文案，便于无障碍访问","提供多尺寸图片，浏览器按 DPR 自动选择","一次性加载多张图片，用于实现图片轮播","指定图片懒加载的优先级顺序"],"a":1,"w":"srcset 提供同一张图的多尺寸或多倍图候选，浏览器结合 sizes 和设备的 DPR、视口宽度自动挑最合适的一张，避免小屏加载大图。","b":[{"type":"p","text":"srcset 属性让浏览器根据设备的屏幕密度或视口宽度，自动选择最合适的图像资源。"},{"type":"p","text":"1）针对不同 DPR（设备像素比），可以用 x 描述符。比如普通屏用 1x，Retina 屏用 2x 或 3x 图。"},{"type":"code","text":"<img src=\"logo.png\"\n     srcset=\"logo-2x.png 2x, logo-3x.png 3x\"\n     alt=\"Logo\">"},{"type":"p","text":"这种情况下，1x 的图会由 src 提供兜底，高 DPR 设备自动选更高清的版本。"},{"type":"p","text":"2）针对不同视口宽度，用 w 描述符配合 sizes 使用。它告诉浏览器每个候选图片适用于多宽的显示场景。"},{"type":"code","text":"<img src=\"small.jpg\"\n     srcset=\"small.jpg 480w,\n             medium.jpg 800w,\n             large.jpg 1200w\"\n     sizes=\"(max-width: 600px) 480px,\n            (max-width: 1000px) 800px,\n            1200px\"\n     alt=\"Content photo\">"},{"type":"p","text":"浏览器先根据当前布局算出图片的渲染宽度，再从 srcset 里挑最接近且大于该宽度的图。"},{"type":"p","text":"其实这就是响应式图片的核心机制，能显著减少移动设备上的流量消耗，同时保证高清屏的显示质量。"},{"type":"p","text":"如果原题解中的某句话使用了超链接，不要对这句话做任何改动。"}],"r":["多套 alt 文案不是 srcset 的作用。","","srcset 不是轮播，一次只选一张图加载。","懒加载由 loading=\"lazy\" 或 IntersectionObserver 控制，与 srcset 无关。"]},{"id":20,"t":"HTML 行内元素有哪些？块级元素有哪些？空（void）元素有哪些？","c":"HTML","o":["行内：span、div；块级：p、img；空元素：ul、li","行内：div、p；块级：span、a；空元素：section、article","所有元素都能互相嵌套，行内与块级没有区别","行内 span/a，块级 div/p，空元素 br/img"],"a":3,"w":"行内元素不独占一行（span、a、img），块级元素独占一行（div、p、ul），空元素没有闭合标签也不能包含内容（br、hr、img、input）。","b":[{"type":"p","text":"行内元素和块级元素的区别，关键看它怎么参与页面布局。块级元素默认独占一行，能设置宽高，比如 div、p、h1 到h6 这些都是典型的块级元素。浏览器渲染时会给它们生成一个块框，从上到下排列。"},{"type":"p","text":"行内元素不换行，多个可以并排显示，宽高由内容决定，典型代表有 span、a、strong、em、img。你给它设 width或 height，压根不生效，得转成 inline-block 才行。"},{"type":"p","text":"空元素也叫自闭合元素，没有闭合标签，内容为空。常见的像 br、hr、img、input、meta、link。这些标签直接结束，不能嵌套子元素。"},{"type":"p","text":"举个实际场景：写表单时 input 是空元素，不用写 <\/input> ；换行用 br 而不是多个 p 去撑间距，这就是合理利用元素特性。"},{"type":"p","text":"面试常问“img 是行内还是空元素”，其实它两个都是。分类维度不同，不互斥。记住这个点，基本就能答全了。"}],"r":["div 是块级、img 是行内替换元素，这里全说错了。","div/p 是块级，span/a 是行内，也写反了。","行内与块级在布局行为上差别很大，不能混为一谈。",""]},{"id":21,"t":"HTML 中，title 与 h1 标签的区别是什么？","c":"HTML","o":["title 是页面上可见的大标题，h1 显示在浏览器标签页上","title 是文档标题，h1 是内容最高级标题","两者完全等价，位置和 SEO 权重都相同","h1 只能写在 head 标签里，title 必须写在 body 里"],"a":1,"w":"title 是文档标题，显示在标签页和搜索结果里，整个文档只应有一个；h1 是页面内容的一级标题，属于 body 里的结构，可以有多个。","b":[{"type":"p","text":"title 是网页的元信息，属于文档的一部分，不会直接显示在页面可视区域内。它主要出现在浏览器标签页标题、收藏夹名称或搜索引擎结果的标题位置。比如你在百度搜索一个页面，结果中显示的大标题就是来自这个页面的 title 内容。"},{"type":"p","text":"h1 是 HTML 文档中的结构化内容标签，是页面内真正展示给用户看的一级标题，通常表现为页面中最醒目的文字标题，一个页面一般建议只有一个 h1 来突出主要内容主题。"},{"type":"p","text":"两者语义层级不同，作用场景也不一样。SEO 优化时，搜索引擎会同时关注 title 和 h1 的匹配度，但权重最高的还是title。如果这两个标签表达的主题不一致，可能会影响关键词排名。"},{"type":"p","text":"代码上写法也不同："},{"type":"code","text":"<!DOCTYPE html>\n<html>\n<head>"},{"type":"p","text":"<title>这是网页标题<\/title>"},{"type":"code","text":"<\/head>\n<body>"},{"type":"p","text":"<h1>这是一级标题<\/h1>"},{"type":"code","text":"<\/body>\n<\/html>"},{"type":"p","text":"简单说，title 是给浏览器和搜索引擎看的，而 h1 是给访问者看的。别把它们混用，尤其别为了 SEO 堆关键词在 h1里，反而破坏了页面结构清晰性。"}],"r":["说反了：title 不显示在页面里，h1 才是页面上可见的大标题。","","两者位置、作用和 SEO 权重都不同，不能等价。","title 只能写在 head 里，h1 只能写在 body 里，正好说反了。"]},{"id":22,"t":"有哪些 CSS 选择器？请分别介绍","c":"CSS","o":["通配、标签、类、ID、属性、伪类等可组合","只有标签选择器、类选择器和 ID 选择器三种","包括 calc()、var()、rgba() 这类函数式选择器","选择器不能组合使用，只能单独书写"],"a":0,"w":"CSS 选择器分基础（通配、标签、类、ID、属性）、伪类/伪元素和组合选择器（后代、子代、兄弟），可以组合使用来精确匹配。calc()、var() 是函数值，不是选择器。","b":[{"type":"p","text":"CSS 选择器的本质是“找元素”，不同的场景需要定位不同节点，掌握它们的匹配逻辑和优先级很关键。"},{"type":"p","text":"基本选择器分好几类。标签选择器像 div 、p ，直接按标签名选，范围太广，一般不单独用。类选择器 .item 最常用，复用性强，性能也好，适合做样式复用单元。ID 选择器 #header 按唯一 ID 匹配，权重高但别滥用，毕竟 ID"},{"type":"p","text":"应该唯一。通配符 * 能选所有元素，常用于重置样式，但别在复杂页面乱用，影响性能。"},{"type":"p","text":"属性选择器 [type=\"text\"] 按属性值匹配，特别适合表单控制。比如选所有密码输入框，直接写"},{"type":"p","text":"[type=\"password\"] 就行。它还支持模糊匹配，像 [class*=\"btn\"] 能命中包含 btn 的 class。"},{"type":"p","text":"结构化选择器能减少 HTML 冗余。:hover 、:focus 这些伪类控制交互状态。:nth-child(2n) 选偶数子元素，做表格隔行变色不用写额外 class。:not(.active) 排除某个状态，很实用。"},{"type":"p","text":"组合选择器用来描述关系。.list > li 只选直系子元素，避免层层嵌套污染。.title + p 选紧跟其后的兄弟节点，适合排版控制。.nav a 这种后代选择器最常见，但也容易过度匹配。"},{"type":"p","text":"优先级规则得记牢：内联样式 > ID > 类/属性/伪类 > 标签 > 继承。遇到样式不生效，八成是优先级被盖了。"}],"r":["","除了这三种，还有属性选择器、伪类、伪元素和组合选择器。","calc()/var()/rgba() 是属性值里的函数，不是选择器。","选择器恰恰可以组合，比如 .nav > li:first-child。"]},{"id":23,"t":"使用 link 和 @import 引用 CSS 的区别","c":"CSS","o":["link 并行加载，@import 串行且可控性差","link 只能引入 CSS，@import 还能引入 JS","两者都要等页面 CSS 解析完成后才发起请求","@import 会并行加载，link 反而要等 CSS 解析完才发起请求"],"a":0,"w":"link 是 HTML 标签，解析到就发起请求，可与页面并行加载；@import 写在 CSS 里，必须等所在样式表下载解析完才开始加载，容易串行阻塞。","b":[{"type":"p","text":"link 是 HTML 标签，能引入 CSS 文件，也能做预加载、加载字体等事。@import 是 CSS 提供的规则，只能在样式表里导入其他 CSS。"},{"type":"p","text":"浏览器解析时，link 引入的 CSS 会和页面其他资源并行下载，尽早触发渲染。@import 写在 CSS 文件里，得先下载主CSS，再解析到 import 才发起下一级请求，容易造成页面渲染延迟。"},{"type":"p","text":"1）link 支持 media 查询，可以按设备条件加载不同样式 2）@import 在 IE5+ 才支持，老版本有兼容问题 3）JavaScript 能直接操作 DOM 来增删改 link 标签，但没法控制 @import"},{"type":"p","text":"用 JavaScript 动态加载主题或异步加载非关键 CSS 时，基本都选 link。比如用"},{"type":"p","text":"document.createElement('link') 插入新样式。"},{"type":"p","text":"代码上也很直观："},{"type":"p","text":"<!-- 推荐方式 -->"},{"type":"code","text":"<link rel=\"stylesheet\" href=\"style.css\">\n<style>"},{"type":"p","text":"/* 不推荐嵌套加载 */"},{"type":"code","text":"  @import url(\"theme.css\");\n<\/style>"},{"type":"p","text":"大型项目像 Ant Design 或 Bootstrap 都用构建工具把 CSS 打包，避免运行时 import 带来的网络瀑布流。现代开发中，@import 更多出现在 SCSS 这类预处理器里，编译阶段就合并了文件，不会带到浏览器运行。"}],"r":["","@import 只能引入 CSS，引入 JS 要用 script。","link 在 HTML 解析阶段就发起请求，不需要等 CSS 解析完。","说反了：并行的是 link，串行的是 @import。"]},{"id":24,"t":"为什么有时候用 translate 来改变位置而不是定位？","c":"CSS","o":["两者都会触发整页重排，性能没有区别","transform 不触发重排重绘，交给合成器","translate 会改变文档流，定位不会","定位会创建新的合成层，因此性能一定优于 translate"],"a":1,"w":"transform 的 translate 只影响合成阶段，不触发布局和重绘，通常由 GPU 合成器处理，所以做位移和动画更流畅；改 top/left 会触发重排，代价高得多。","b":[{"type":"p","text":"用 translate 而不是 position 来改变元素位置，关键在于性能和渲染效率。"},{"type":"p","text":"浏览器渲染页面时，会把元素分成多个图层。如果你用 top/left 这种定位方式去动一个元素，它每次移动都会触发布局（layout）重排，整个文档流都得重新计算，代价很高。而 translate 属于 CSS3 的 transform，走的是"},{"type":"p","text":"GPU 加速通道，压根不经过 layout 和 paint 阶段，只影响 composite（合成），动画丝滑还省资源。"},{"type":"p","text":"举个例子，你在写一个拖拽交互或者轮播图动画，每秒要更新几十次位置。用 left: 100px 每次都在改几何属性，页面容易卡顿；换成 transform: translateX(100px) ，浏览器可以直接在合成层移动纹理，用户感知就是流畅。"},{"type":"p","text":"而且 translate 是相对于自身原点偏移，不会影响其他元素布局。比如你把一个按钮 translate 下移 50px，文档流里它还是待在原来的位置，后面的元素不会被“挤下去”。这在做过渡动画时特别有用，不需要额外占位或预留空间。"},{"type":"p","text":"常见场景像 Vue 的 <transition> 组件、Swiper 轮播、抽屉弹窗滑入，底层都是靠 translate 做位移。就连 React Spring、Framer Motion 这类动画库，默认也优先使用 transform 来驱动。"}],"r":["两者代价差很多：transform 不重排，改 top/left 会重排。","","translate 是视觉位移，不改变文档流，也不影响周围元素布局。","定位会触发布局计算，性能通常不如 transform。"]},{"id":25,"t":"使用 let 全局声明变量，能通过 window 对象取到吗？","c":"JavaScript","o":["能取到，效果和 var 完全一样","能取到，但只能读取不能修改","取不到，let/const 不会挂到 window 上","能取到，因为 let 声明在全局作用域，等同于 window 上的属性"],"a":2,"w":"var 在全局声明的变量会成为 window 的属性；let/const 声明在全局词法环境里，不属于 window，所以 window.xxx 取不到（但在控制台直接写变量名仍能访问）。","b":[{"type":"p","text":"let 声明的变量不会挂载到 window 对象上，和 var 完全不同。"},{"type":"p","text":"用 var 声明的变量会成为全局对象（浏览器中是 window ）的属性，但 let 、const 、class 声明的全局绑定不会。这是 ES6 模块化设计的一部分，目的是避免全局命名空间污染。"},{"type":"p","text":"举个例子："},{"type":"code","text":"var a = 1;\nlet b = 2;\nconsole.log(window.a); // 1\nconsole.log(window.b); // undefined"},{"type":"p","text":"虽然 b 在全局作用域声明，但压根不经过 window ，你没法通过 window.b 访问到它。它存在于一个叫“全局词法环境”的独立结构里，和 window 是分开的。"},{"type":"p","text":"这在实际开发中很重要。比如你在用 Webpack 打包的项目里，多个模块都用 let 声明同名变量，完全不会冲突，因为它们都不往 window 上挂。换成 var 就容易搞出覆盖问题。"},{"type":"p","text":"所以记住：全局变量 ≠ window 属性，只要用了 let 或 const ，就不再属于 window 。"}],"r":["var 才会挂到 window 上，let 不会。","不是“只能读不能改”，而是根本不在 window 上。","","let 在全局作用域，但全局词法环境和 window 属性是两回事。"]},{"id":26,"t":"如何判断 JavaScript 变量是数组？","c":"JavaScript","o":["Array.isArray 最可靠，不受跨 realm 影响","arr instanceof Array 在任何场景下都可靠","Object.prototype.toString 无法用来判断数组","typeof arr === 'array' 是最标准的判断方式"],"a":0,"w":"Array.isArray 内部判断对象的内部类型标记，跨 iframe、跨 realm 都可靠；instanceof 依赖原型链，不同窗口的 Array 构造函数不同，会误判。","b":[{"type":"p","text":"判断 JavaScript 变量是否为数组，不能简单用 typeof ，因为 typeof [] 返回的是 \"object\" ，这会和其他对象混淆。"},{"type":"p","text":"1）最靠谱的方式是 Array.isArray() 。这个方法专门用来检测数组，不管是字面量创建的数组，还是通过 new Array() 创建的，都能准确识别。它还能正确处理跨 iframe 场景下的数组判断，不存在 instanceof 的问题。"},{"type":"code","text":"Array.isArray([1, 2, 3]) // true\nArray.isArray({})         // false"},{"type":"p","text":"2）用 instanceof 看似可行，但在多全局环境（比如多个 window）下会出问题。因为不同上下文中的 Array 构造函数不一样，arr instanceof Array 可能返回 false，即使它确实是数组。"},{"type":"p","text":"3）Object.prototype.toString.call() 也能判断。对任何值调用它，都会返回 [object Type] 格式的字符串。数组会返回 [object Array] ，所以可以据此判断。"},{"type":"code","text":"Object.prototype.toString.call([1, 2]) === '[object Array]' // true"},{"type":"p","text":"但其实没必要手写这么长，除非环境不支持 Array.isArray() 。现代开发直接用 Array.isArray() 就行，语义清晰，行为可靠。"},{"type":"p","text":"总的来说，Array.isArray 是首选方案，兼容性好，语义明确，是标准做法。其他方式了解即可，应对老环境或面试追问。"}],"r":["","跨 iframe 时原型链对不上，instanceof 会返回 false。","Object.prototype.toString.call 返回 [object Array]，是可靠的兼容方案。","typeof 数组返回的是 'object'，根本没有 'array' 这个值。"]},{"id":27,"t":"typeof null 的结果是什么？为什么？","c":"JavaScript","o":["返回 'object'，是早期实现遗留的 bug","直接抛出 TypeError","返回 'undefined'，因为 null 表示没有值","返回 'null'，表示这是一个空值类型"],"a":0,"w":"typeof null === 'object' 是 JS 最早实现留下的 bug：当时用低位标记类型，null 的标记恰好和对象相同。修复会破坏大量老代码，所以一直保留。判断 null 要用 === null。","b":[{"type":"p","text":"这个问题其实是个经典陷阱，typeof null 的结果是 \"object\" ，不是 \"null\" 。"},{"type":"p","text":"原因得翻 JavaScript 的历史账本。早期的 JavaScript 实现中，每个值的类型信息都存在一个低级别的位标记里。"},{"type":"p","text":"null 被表示为全 0 的机器码，而对象的类型标记恰好被判定为一组特定的位模式，全 0 被误判成了对象的标志。这个 bug 从一开始就没被修复，因为太多现有代码已经依赖这个“特性”了，改了反而会搞崩生态。"},{"type":"p","text":"所以你记住一点：这是语言层面的一个历史性 bug，而不是设计本意。null 明明是一个原始值，代表“空指针”，但 typeof 对它失效。"},{"type":"p","text":"实际编码时要注意，判断 null 不能靠 typeof ，得用严格等于："},{"type":"code","text":"value === null"},{"type":"p","text":"需要同时判断 null 和 undefined 的话，可以用 == null ，这在处理可选参数或 DOM 查询结果时很常见。"}],"r":["","typeof 对任何值都不会抛错，包括 null。","null 表示“空值”，和“未定义”是两回事，typeof 也不返回 undefined。","typeof 永远返回小写字符串，'null' 不在其中。"]},{"id":28,"t":"如果 React 组件的属性没有传值，它的默认值是什么？","c":"React","o":["null，React 会主动把空值统一成 null","直接抛出错误，必须显式声明每一个属性","undefined，可用 defaultProps 设默认值","空字符串，未传值时框架会自动兜底"],"a":2,"w":"React 不会给没传的 props 补默认值，读到的就是 undefined。类组件用 defaultProps，函数组件用参数解构默认值来兜底。","b":[{"type":"p","text":"React 组件的属性如果没有传值，它的默认值是 undefined 。"},{"type":"p","text":"组件在调用时，JSX 会转成 React.createElement 调用，没传的 prop 就不会出现在 props 对象里。但 ES6 解构的默认值机制和 React 自身的 defaultProps 都能补上这个空缺。"},{"type":"p","text":"1）如果用了解构赋值加默认参数，函数组件可以这样写："},{"type":"code","text":"function Button({ size = 'small', enabled = true }) {\n  return <button className={size}>{enabled ? 'On' : 'Off'}<\/button>;\n}"},{"type":"p","text":"这里 size 和 enabled 没传就是 undefined ，触发了解构的默认值。"},{"type":"p","text":"2）类组件或老写法可以用 defaultProps ："},{"type":"code","text":"class Alert extends Component {\n  render() {\n    return <div className={this.props.type}>{this.props.children}<\/div>;\n  }\n}\nAlert.defaultProps = { type: 'info' };"},{"type":"p","text":"defaultProps 是 React 在实例化时做的兜底，传了就覆盖，不传就用它。"},{"type":"p","text":"注意 defaultProps 在现代 React 中逐渐被解构默认值替代，因为后者更直观、可 tree-shake，而且 TypeScript友好。但老项目里还能见到。"},{"type":"p","text":"undefined 的判断时机很关键。只要属性没传或者显式传了 undefined ，都会触发默认逻辑；但如果传了null ，就不会走默认值，得自己在组件内部处理。"}],"r":["React 不会把 undefined 转成 null。","缺少 props 不会报错，只会读到 undefined。","","空字符串是具体的值，不是默认填充。"]},{"id":29,"t":"React 中除了在构造函数中绑定 this，还有其他绑定 this 的方式么？","c":"React","o":["在 JSX 中调用 call/apply 来绑定","箭头函数、class fields、render 中 bind","必须借助高阶组件才能完成绑定","只能在构造函数里 bind，其他方式都不可行"],"a":1,"w":"类组件里常见四种写法：构造函数 bind、render 里 bind、class fields 箭头函数、以及用箭头函数包一层；函数组件本身没有 this 问题。","b":[{"type":"p","text":"类组件里处理 this 绑定，构造函数只是其中一种方式。其实更常见的写法是用属性初始化器语法，也就是在定义方法时直接写成箭头函数形式。"},{"type":"p","text":"1）类字段 + 箭头函数"},{"type":"p","text":"直接把事件处理函数定义成类的实例属性，利用箭头函数自动绑定当前实例的 this。"},{"type":"code","text":"class MyComponent extends React.Component {\n  handleClick = () => {"},{"type":"p","text":"console.log(this); // 指向组件实例，不用手动绑定"},{"type":"code","text":"  };\n  render() {"},{"type":"p","text":"return <button onClick={this.handleClick}>点击<\/button>;"},{"type":"code","text":"  }\n}"},{"type":"p","text":"2）在 JSX 中内联绑定"},{"type":"p","text":"可以在传递回调的时候直接用 .bind 或箭头函数包裹。"},{"type":"p","text":"<button onClick={this.handleClick.bind(this)}>点击<\/button>"},{"type":"p","text":"或者"},{"type":"p","text":"<button onClick={() => this.handleClick()}>点击<\/button>"},{"type":"p","text":"但这种写法有个问题，每次渲染都会创建新函数，如果这个 prop 传给子组件，容易导致子组件不必要的重渲染，性能上不太友好。"},{"type":"p","text":"3）使用 hooks 的函数组件"},{"type":"p","text":"现在大多数新项目都用函数组件了，根本不用操心 this 绑定的问题。通过 useCallback 缓存函数引用，配合依赖数组控制执行时机。"},{"type":"code","text":"function MyComponent() {\n  const handleClick = useCallback(() => {\n    // 处理逻辑\n  }, []);"},{"type":"p","text":"return <button onClick={handleClick}>点击<\/button>;"},{"type":"code","text":"}"},{"type":"p","text":"现在的主流做法基本是函数组件 + hooks，this 绑定这事儿自然就消失了。老项目维护时才会频繁遇到构造函数绑定或者类字段写法。"}],"r":["JSX 里不能直接调用 call/apply，属性值只能是表达式结果。","","高阶组件解决的是逻辑复用，和 this 绑定无关。","箭头函数和 class fields 都能解决，不是只能构造函数。"]},{"id":30,"t":"为什么在 React 中遍历时不建议使用索引作为唯一的 key 值？","c":"React","o":["用索引作 key 会让 React 直接抛错","顺序变化时索引错位，导致组件状态错乱","索引是唯一合法的 key 类型","用索引作 key 会让 diff 复杂度退化成 O(n²)"],"a":1,"w":"key 是元素的身份标识。用索引当 key，插入或删除后同一索引会指向不同数据，React 会复用错的组件实例，导致输入框内容、勾选状态错乱。","b":[{"type":"p","text":"用索引当 key 看着省事，但会埋坑，尤其在列表有插入、删除或排序操作时。"},{"type":"p","text":"React 的 diff 算法靠 key 来识别元素身份。如果用 index 作为 key，比如渲染一个数组，删掉第一个元素后，后面所有项的 index 都变了。React 以为是后面的每一项都“变”了，于是重新创建所有组件实例，触发不必要的 re-render 和DOM 重建。更糟的是，如果有内部状态（比如 input 输入框），这些状态也会跟着错位。"},{"type":"code","text":"// 危险做法\nlist.map((item, index) => <div key={index}>{item.name}<\/div>)"},{"type":"p","text":"比如原来 [A, B, C]，A 对应 index=0，删掉 A 后变成 [B, C]，B 变成了 index=0。React 认为原来的第一个节点内容从 A变成了 B，第二个从 B 变成 C，第三个被删了——它不会复用节点，而是打补丁式更新，性能差还可能出 bug。"},{"type":"p","text":"正确的做法是用每条数据的唯一标识，比如 id："},{"type":"code","text":"list.map(item => <div key={item.id}>{item.name}<\/div>)"},{"type":"p","text":"只要这个 id 是稳定且唯一的，React 就能准确判断哪个元素被添加、移动或删除，实现高效的节点复用。"},{"type":"p","text":"1）列表顺序可能变化时不要用 index"},{"type":"p","text":"2）数据没有唯一 id 时可以考虑生成一个（比如用 uuid 或组合字段）"},{"type":"p","text":"3）静态列表、纯展示且无增删改场景下，用 index 问题不大"}],"r":["索引作 key 不会报错，只会让复用逻辑出错。","","key 可以是字符串或数字，索引只是其中一种，且不推荐。","diff 的复杂度与 key 的类型无关，用索引不会变成 O(n²)。"]},{"id":31,"t":"React Router 中的 Router 组件有几种类型？","c":"React","o":["BrowserRouter、VueRouter、MemoryRouter","Router 只是配置对象，并不是组件","BrowserRouter、HashRouter、MemoryRouter","只有 HashRouter 一种，其余在 v4 已废弃"],"a":2,"w":"React Router 提供多种 Router：BrowserRouter 用 History API（路径干净，需服务端配置）、HashRouter 用 #（兼容性好）、MemoryRouter 把历史存在内存里（React Native、测试）。","b":[{"type":"p","text":"React Router 的路由能力依赖不同的 Router 实现，根据运行环境和需求来选型。"},{"type":"p","text":"1）BrowserRouter 利用浏览器的 History API 管理路由，URL 形如 /users/123 ，刷新页面不丢失状态，适合现代单页应用，比如用在 Create React App 或 Vite 构建的项目里。"},{"type":"p","text":"2）HashRouter 通过 URL 的 hash 部分（即 # 后的内容）切换视图，形如 /index.html#/home 。它不向服务器发请求，兼容老浏览器，适合静态站点托管场景，比如 GitHub Pages。"},{"type":"p","text":"3）MemoryRouter 把路由状态存在内存中，没有 UI 变化，常用于测试或 React Native 这类非浏览器环境。"},{"type":"p","text":"4）StaticRouter 服务端渲染（SSR）时用，根据传入的 location 决定初始路由，Next.js 自己封装了这类逻辑，一般不用直接写。"},{"type":"p","text":"选哪种，其实就看运行环境。浏览器环境优先用 BrowserRouter，部署受限就上 HashRouter，做单元测试直接套MemoryRouter。"}],"r":["VueRouter 是 Vue 的，不是 React Router 的组件。","Router 是实实在在的组件，负责提供路由上下文。","","除 HashRouter 外，BrowserRouter 和 MemoryRouter 都在用。"]},{"id":32,"t":"在 React 的 render 函数中，是否可以直接写 if else 判断？为什么？","c":"React","o":["不能，React 完全不允许条件渲染","可以，JSX 内部支持任意 JS 语句","可以，但只允许使用 switch","不能，JSX 是表达式，只能用三元或提前 return"],"a":3,"w":"JSX 会被编译成函数调用的参数，参数位置只能放表达式，所以 if/else、for 这些语句不能直接写；要用三元、逻辑与、提前 return 或抽成函数。","b":[{"type":"p","text":"React 的 render 函数里不能直接写 if else 语句来控制 JSX 的渲染，因为 JSX 是表达式，而 if else 是语句，它没法直接嵌入到 JSX 结构里。"},{"type":"p","text":"你可以这么想，render 返回的是一个 UI 结构树，这个树得由可计算的表达式组成。if else 本身不返回值，所以压根不经过 JSX 的拼装流程。"},{"type":"p","text":"但实际开发中肯定要条件渲染，常见的做法是用三元运算符或者逻辑与（&& ）来替代："},{"type":"code","text":"return (\n  <div>"},{"type":"p","text":"{isLogin ? <span>欢迎回来<\/span> : <button onClick={login}>登录<\/button>}"},{"type":"code","text":"    {hasNewMessage && <Notice />}\n  <\/div>\n);"},{"type":"p","text":"如果逻辑复杂，也可以提前在函数内部用 if else 处理数据或决定返回哪个组件，最后再把结果塞进 JSX："},{"type":"code","text":"let content;\nif (loading) {\n  content = <Spinner />;\n} else if (error) {\n  content = <ErrorTip />;\n} else {\n  content = <List data={data} />;\n}\nreturn <div>{content}<\/div>;"},{"type":"p","text":"这种写法既合法又清晰，把判断逻辑和渲染结构分开，维护起来也方便。总的来说，关键点在于 JSX 需要表达式，而不是语句。"}],"r":["React 支持条件渲染，只是写法受限。","JSX 的 {} 里放的是表达式，不是语句块。","switch 也是语句，同样不能直接写在 JSX 里。",""]},{"id":33,"t":"如何在 React 项目中引入图片？哪种方式更好？","c":"React","o":["直接写字符串路径性能更好，因为不经过打包处理","用 import 引入，交给构建工具处理","必须把图片放到 CDN，否则无法打包","只能用 require，import 不支持图片"],"a":1,"w":"用 import 引入图片，图片会进入构建流程：得到带 hash 的文件名（便于长缓存）、可被压缩、小图自动转 base64，还能做按需加载。","b":[{"type":"p","text":"在 React 项目里引入图片，主要看你的构建工具和图片用途。常见方式就两种：静态资源路径引用和模块导入。"},{"type":"p","text":"1）如果用的是 Create React App 或类似的 Webpack 配置，可以把图片放在 src 目录下，然后像导入模块一样使用。"},{"type":"code","text":"import logo from './logo.png';\nfunction Header() {\n  return <img src={logo} alt=\"Logo\" />;\n}"},{"type":"p","text":"这种方式好就好在，Webpack 会处理这张图，根据大小决定是转成 base64 内嵌，还是单独打包成文件。小图内联减少请求，大图独立加载，很省心。"},{"type":"p","text":"2）另一种是把图片放进 public 目录，直接通过 / 路径引用。"},{"type":"code","text":"<img src=\"/images/logo.png\" alt=\"Logo\" />"},{"type":"p","text":"这适合那种你压根不希望构建工具插手的资源，比如 favicon.ico 或配置文件指定的路径。但缺点也明显，没法做哈希指纹，缓存控制弱，更新容易出问题。"},{"type":"p","text":"一般推荐用第一种。构建工具能帮你做优化，比如文件哈希、CDN 拆分、按需加载。尤其是组件级的图片，跟代码一起走模块系统，维护起来更干净。"}],"r":["写死路径不经过构建，拿不到 hash 和压缩优化，发版还容易命中旧缓存。","","放 CDN 是部署选择，不是打包的前提。","import 完全支持图片，Webpack 和 Vite 都内置了处理规则。"]},{"id":34,"t":"什么是 React 中的受控组件？它的应用场景是什么？","c":"React","o":["表单值由 DOM 自己管理，React 只负责读取","值由 state 控制，通过 value + onChange 同步","只能用于 input[type=file] 这类特殊控件","受控组件不需要 onChange，React 会自动同步"],"a":1,"w":"受控组件的值始终来自 state，用户输入触发 onChange 更新 state，再由 value 回填，形成单一数据源，方便校验、联动和重置。","b":[{"type":"p","text":"受控组件指的是那些将表单元素的值交给 React 组件状态（state）来管理的组件。页面上输入框长什么样，完全由state 决定，用户的每一次输入都会触发回调函数，比如 onChange，然后更新 state，再驱动视图刷新。"},{"type":"p","text":"这种模式下，React 的 state 是唯一数据源。比如一个输入框，你不能直接去修改它的内容而不经过 setState 或useState 的 setter 方法。这跟原生 DOM 操作很不一样，原生可以随意用 input.value = 'xxx' 改变，但在受控组件里，这种操作会被 React 的渲染机制覆盖掉。"},{"type":"p","text":"常见应用场景包括登录表单、搜索框、配置项编辑等需要实时校验或联动的场景。比如用 useState 存储输入值，在 onChange 里做防抖处理发请求，或者根据输入长度动态提示密码强度。"},{"type":"code","text":"function NameInput() {\n  const [name, setName] = useState('');\n  return (\n    <input\n      value={name}\n      onChange={(e) => setName(e.target.value)}\n    />\n  );\n}"},{"type":"p","text":"和它相对的是非受控组件，用 ref 直接访问 DOM 获取值，适合文件上传、第三方富文本编辑器这类不需要频繁交互控制的场景。"},{"type":"p","text":"要不要用受控组件，关键看是否需要精确控制输入行为和状态同步。一旦用了，就必须维护好 state，否则输入会变成只读。对于复杂表单，配合 useReducer 或像 react-hook-form 这样的库能减轻样板代码的负担。"}],"r":["这是非受控组件（用 ref 读 DOM）的做法。","","file 类型的值只能由用户设置，恰恰是典型的非受控场景。","没有 onChange，输入框会变成只读，用户根本打不了字。"]},{"id":35,"t":"Vue 计算属性的函数名和 data 中的属性可以同名吗？为什么？","c":"Vue","o":["可以，data 中的属性优先级更高","可以，计算属性优先级更高","可以，Vue 会自动把两者合并成一个","不可以，两者都会挂到实例上，会冲突"],"a":3,"w":"computed 和 data 最终都会代理到同一个组件实例上，同名就会冲突：后初始化的覆盖前面的，Vue 会给出重复 key 的警告。","b":[{"type":"p","text":"不能同名，Vue 内部会把计算属性和 data 中的属性都挂载到同一个响应式对象上，同名会产生冲突。"},{"type":"p","text":"1）计算属性本质上是通过 Object.defineProperty 定义的 getter，它最终会和 data 里的属性一起被收集到组件的 _data 对象中。如果名字重复，后面的定义会覆盖前面的，导致行为异常或警告。"},{"type":"p","text":"2）Vue 在初始化时会对 key 做校验，一旦发现 computed 和 data 存在同名属性，会在开发环境直接抛出警告，提示\"The computed property 'xxx' is already defined in data\"，阻止这种不合理的定义。"},{"type":"p","text":"3）即便你强行绕过，比如用字符串拼接等方式隐藏命名冲突，也会导致响应式系统追踪错乱。比如模板中引用这个属性时，可能拿到的是 data 的初始值，而不是计算属性的动态结果，数据更新就压根不经过计算属性的逻辑。"},{"type":"p","text":"举个例子，你写了个 data() { return { price: 10 } } ，又写了个 computed: { price() { return this.price * 2 } } ，这明显形成递归调用，浏览器直接栈溢出报错。"},{"type":"p","text":"所以别折腾，命名保持唯一，让 data、computed、props 各司其职，Vue 才能正常追踪依赖和更新视图。"}],"r":["同名时不是谁优先，而是直接冲突。","同上，不会按优先级取某一个。","Vue 不会自动合并两个同名的属性。",""]},{"id":36,"t":"Vue 的 v-show 和 v-if 有什么区别？使用场景分别是什么？","c":"Vue","o":["v-if 不支持用在 template 元素上","v-if 不渲染 DOM，v-show 只切换 display","v-show 会销毁 DOM，v-if 只是修改 display","两者的编译结果完全一致，可以随意替换"],"a":1,"w":"v-if 是真正的条件渲染，条件为假时元素不在 DOM 里，切换有销毁重建成本；v-show 只是切换 display，元素一直在 DOM 中，切换开销小。","b":[{"type":"p","text":"v-show 和 v-if 都是用来控制元素显示隐藏的指令，但实现方式完全不同。"},{"type":"p","text":"v-if 是“真正”的条件渲染，它会根据表达式真假决定是否创建或销毁 DOM 节点。比如 v-if=\"visible\" 为 false时，元素压根不经过渲染，DOM 树里根本不存在这个节点，切换时要重新执行组件的挂载或销毁流程。"},{"type":"p","text":"v-show 则简单粗暴得多，不管条件如何，元素始终会被渲染到 DOM 中，只是通过 CSS 的 display: none 来控制视觉上的显隐。所以它的初始渲染开销更大一点，但切换成本极低，没有 DOM 重建过程。"},{"type":"p","text":"1）v-if 适合场景：切换不频繁、初始化性能要求高。比如用户权限不同展示完全不同的模块，用 v-if 可以避免无用的DOM 占用内存。"},{"type":"p","text":"2）v-show 适合场景：需要频繁切换显示状态。比如一个常驻的弹窗或标签页，反复开关时用 v-show 能避免重复渲染，性能更好。"},{"type":"p","text":"注意，v-show 不支持 <template> 标签，也不能和 v-else 搭配使用，这是语法限制。"},{"type":"p","text":"如果用在组件上，v-if 会触发整个子组件的卸载与重建，而 v-show 只是传个 prop 控制内部 display，渲染机制的不同决定了它们的适用边界。"}],"r":["v-if 可以写在 template 上，用来控制一组元素，这正是推荐用法。","","说反了：销毁重建的是 v-if，改 display 的是 v-show。","两者编译结果完全不同，不能互换。"]},{"id":37,"t":"在 Vue 组件中写 name 选项有什么作用？","c":"Vue","o":["用于配置路由跳转的路径、参数和标题","只在 Vue 2 中有效，Vue 3 已经移除该选项","递归调用自身、调试、keep-alive 匹配","用于定义组件的 CSS 类名和作用域样式"],"a":2,"w":"name 是组件的身份标识：递归组件要靠它引用自己，devtools 里显示的名字来自它，keep-alive 的 include/exclude 也按它匹配。","b":[{"type":"p","text":"组件的 name 选项不只是为了标识，它在几个关键场景里起着实际作用。"},{"type":"p","text":"递归组件调用时，必须通过 name 来实现自引用。比如一个树形结构组件 TreeNode，它要在模板里调用自己，就得靠 name: 'TreeNode' 才能识别。"},{"type":"code","text":"<template>\n  <div>\n    <TreeNode v-for=\"child in children\" :key=\"child.id\" />\n  <\/div>\n<\/template>\n<script>\nexport default {\n  name: 'TreeNode',\n  props: ['children']\n}\n<\/script>"},{"type":"p","text":"热重载也依赖 name 。开发环境下修改组件代码，Vue 通过这个名字判断是否是同一个组件，保持状态不丢失。没有"},{"type":"p","text":"name ，每次保存都会重新渲染，体验很差。"},{"type":"p","text":"路由跳转时也有用。Vue Router 支持基于组件名称的导航守卫匹配，比如 beforeRouteLeave 或 router-view的 include/exclude 缓存控制，都是拿 name 当标识。"},{"type":"p","text":"单文件组件虽然可以通过文件名推断 name ，但显式声明更可靠。特别是经过构建工具处理后，文件名可能被压缩或改变，直接定义最保险。"},{"type":"p","text":"1）递归组件需要自引用"},{"type":"p","text":"2）HMR 热更新靠它维持状态"},{"type":"p","text":"3）路由和缓存机制依赖名称匹配"}],"r":["路由路径由 router 配置的 path 决定，与 name 无关。","Vue 3 依然支持 name，只是推荐用 defineOptions 声明。","","样式作用域靠 scoped 和 class，不靠 name。"]},{"id":38,"t":"为什么不建议在 Vue 中同时使用 v-if 和 v-for？","c":"Vue","o":["Vue 中禁止同时使用，写了会直接报错","两者优先级相同，同时使用没有任何影响","v-if 优先级更高，先判断再循环，因此没有性能问题","v-for 先执行，会边遍历边判断，浪费渲染"],"a":3,"w":"Vue 2 中 v-for 优先级更高，会先遍历再对每一项做 v-if 判断，列表大时白白浪费渲染；正确做法是在外层 template 上加 v-if，或用计算属性先过滤数据。","b":[{"type":"p","text":"Vue 在处理指令时会按照优先级顺序解析，v-for 的优先级高于 v-if。这意味着即使你把两个指令写在同一个元素上，Vue 也会先执行 v-for 进行列表渲染，然后再对每一项单独判断 v-if 的条件。"},{"type":"p","text":"这就带来两个明显问题。第一，性能浪费。v-if 是基于条件控制显示或隐藏，但如果它和 v-for 一起用，即便某项数据不符合 v-if 条件、最终不会显示，它依然会被遍历、创建虚拟 DOM、执行判断逻辑。比如有 100 条数据，只有 10 条满足条件，那剩下的 90 项压根不经过渲染，但它们的循环开销是实打实存在的。"},{"type":"p","text":"第二，代码可读性差。这种写法容易让人误解为“只遍历符合条件的项”，但实际上它是“遍历所有项再逐个过滤”，语义不清晰，后期维护容易出错。"},{"type":"p","text":"正确的做法是，把 v-if 写在外层包裹元素上，控制整个列表区域的显隐。如果需要条件性渲染部分数据，应该在computed 中预先过滤好数据源，让 v-for 只处理精简后的数组。"},{"type":"code","text":"// 推荐：计算属性预处理\ncomputed: {\n  activeItems() {\n    return this.items.filter(item => !item.isInactive)\n  }\n}"},{"type":"p","text":"或者结构拆分："},{"type":"code","text":"<ul v-if=\"items.length\">\n  <li v-for=\"item in items\" :key=\"item.id\">{{ item.name }}<\/li>\n<\/ul>"},{"type":"p","text":"<p v-else>暂无数据<\/p>"}],"r":["同时使用不会报错，只是性能差、可读性差。","优先级不同，影响很实际：会边遍历边判断。","Vue 2 中优先级更高的是 v-for，不是 v-if。",""]},{"id":39,"t":"在 Vue 渲染模板时，如何保留模板中的 HTML 注释？","c":"Vue","o":["只有用 pre 标签包裹起来的内容才会保留注释","注释在浏览器解析 HTML 的阶段就被丢弃，前端无法保留","默认移除；用 compilerOptions.comments 保留","默认就会完整保留注释，不需要任何额外配置"],"a":2,"w":"模板编译默认会丢掉注释以减小产物体积。要保留可以配置 compilerOptions.comments（Vue 3 的编译选项），或用 v-html 直接插入原始 HTML。","b":[{"type":"p","text":"Vue 默认在生产环境下会移除模板中的 HTML 注释，但在某些场景下我们可能需要保留它们，比如用于标记位置、调试或配合一些依赖注释的第三方库。"},{"type":"p","text":"控制这个行为的关键是 comments 选项。在创建 Vue 应用实例时，可以通过配置 comments: true 来强制保留模板中的注释。"},{"type":"code","text":"const app = createApp(App)"},{"type":"p","text":"app.mount('#app', true) // 第二个参数是 `hydrate`，和注释无关"},{"type":"code","text":"// 想要保留注释，需要在挂载时传入配置\napp.mount('#app', {\n  comments: true\n})"},{"type":"p","text":"这个 comments 配置只在使用完整版 Vue（包含模板编译器）时才生效。如果你用的是 runtime-only 版本，模板已经在构建阶段编译成 render 函数，那这个选项就不起作用了。"},{"type":"p","text":"开发环境下一般问题不大，但生产环境为了性能，默认会把注释干掉。毕竟 DOM 节点越多，内存开销越大。保留注释意味着每个 <!-- --> 都会变成一个真实的 Text Node，浏览器得为它分配内存。"},{"type":"p","text":"所以要不要保留，得权衡清楚。像 v-if 的边界、v-for 的锚点这些，Vue 内部其实是用注释节点做标记的，但那是框架自己用的，和我们写的模板注释不是一回事。"},{"type":"p","text":"一般来说，除非有明确需求，比如静态站点生成器需要保留特定标记，或者你在做 SSR 并依赖注释做 hydration 定位，否则没必要开启。"}],"r":["pre 只保留空白和换行，不会让编译保留注释。","注释是在模板编译阶段被移除的，配置后就能保留。","","默认是不保留的，需要显式配置。"]},{"id":40,"t":"为什么 Vue 中的 data 属性是一个函数而不是一个对象？","c":"Vue","o":["根实例也必须用函数，否则会直接报错","因为普通对象无法被 Vue 做响应式处理","因为函数形式的执行速度更快","组件有多个实例，函数能保证 data 独立"],"a":3,"w":"组件会被复用出多个实例。如果 data 是对象，所有实例共享同一个引用，改一个全都变；写成函数，每次创建实例都调用一次，返回全新对象，数据天然隔离。","b":[{"type":"p","text":"Vue 组件可能被多次复用，每次复用都应该拥有自己独立的数据副本。如果 data 是一个对象，那所有组件实例都会共享这同一个对象的引用。"},{"type":"p","text":"想象一下，10 个相同的组件都指向同一个 data 对象，其中一个改了数据，其他 9 个全跟着变，这显然不是我们想要的。"},{"type":"p","text":"所以 Vue 要求 data 必须是一个函数，每次创建实例时，都通过调用这个函数返回一个全新的对象，这样每个实例就有了独立的 data 空间，互不干扰。"},{"type":"code","text":"// 正确写法：data 是函数，返回新对象\ndata() {\n  return {\n    count: 0,\n    list: []\n  }\n}"},{"type":"p","text":"你可能会在根实例里看到直接用对象形式的 data，比如 new Vue({ data: {} })，那是因为根实例只存在一个，不存在复用和数据污染问题，属于特例。"},{"type":"p","text":"至于组件选项中的其他属性，比如 methods、computed，它们本身是方法或访问器，天然按实例绑定，不存在状态共享的问题，所以不需要用函数返回。"}],"r":["根实例可以用对象，只有组件必须用函数。","对象完全可以被响应式处理，问题出在共享引用。","与执行速度无关，是作用域隔离的需要。",""]},{"id":41,"t":"Vue 的 template 标签有什么用？","c":"Vue","o":["不渲染的包裹元素，配合 v-if/v-for 使用","用于引入外部的 HTML 模板文件","用于定义组件的根元素，必须渲染成真实 DOM 节点","等价于 div，只是名字不同而已"],"a":0,"w":"template 是编译期的占位容器，本身不会渲染成 DOM 节点，常用来包裹一组元素配合 v-if/v-for，或作为组件的模板出口。","b":[{"type":"p","text":"template 标签在 Vue 里不是用来直接渲染的，它本身不会出现在最终的 DOM 结构里。它的作用是定义一块内容模板，这块模板什么时候渲染、怎么渲染，由其他指令来控制。"},{"type":"p","text":"比如用 v-if 或 v-for 的时候，你可能需要包裹多个元素，又不想额外加一个 div 影响结构。这时候就把这些元素包在 <template> 里，Vue 会解析里面的内容，但不会把它自己渲染成一个节点。"},{"type":"code","text":"<template v-if=\"show\">"},{"type":"p","text":"<h1>标题<\/h1><p>一段说明<\/p><button>操作<\/button>"},{"type":"code","text":"<\/template>"},{"type":"p","text":"上面这段代码，如果 show 为 true，三个子元素都会插入 DOM，但压根不经过 <template> 节点。"},{"type":"p","text":"另一个常见场景是配合 v-slot 使用，定义插槽内容。父组件传过来的模板片段，就是通过 <template> 包裹并指定作用域的。"},{"type":"code","text":"<MyComponent>\n  <template #header=\"slotProps\">\n    <h2>{{ slotProps.title }}<\/h2>\n  <\/template>\n<\/MyComponent>"},{"type":"p","text":"这里 #header 定义了一个具名插槽，template 提供了作用域变量的接收位置。组件内部用 slotProps 把数据传出来，外面就能用了。"},{"type":"p","text":"总的来说，template 就是个逻辑容器，干的是脏活累活，自己却隐身不见。没有它，很多结构控制和插槽机制都搞不定。"}],"r":["","外部模板通常由构建工具或异步请求加载，template 标签本身不做文件引入。","组件根元素必须渲染成真实节点，只写 template 会报“无根节点”的错误。","template 不产生节点，和 div 的渲染行为完全不同。"]},{"id":42,"t":"Vue Router 如何配置 404 页面？","c":"Vue","o":["最后加 /:pathMatch(.*)* 兜底路由指向 404","在 main.js 里监听 window.onerror 后跳转","Vue Router 自带 404 页面，不需要额外配置","配置 path: '*' 并把它放在路由表最前面"],"a":0,"w":"路由按注册顺序匹配，兜底规则必须放最后。Vue Router 4 用 /:pathMatch(.*)* 捕获所有未匹配路径，Vue Router 3 用 path: '*'。","b":[{"type":"p","text":"路由没匹配上时，用户访问不存在的路径，得有个兜底页面，404 页面就是干这个用的。Vue Router 里配起来很简单，关键在于顺序和通配符路由。"},{"type":"p","text":"定义一个 catch-all 路由，路径写成 /* 或 /404 ，然后把它放到路由数组的最后。因为 Vue Router 是从上往下匹配的，只要前面的都没中，就会落到这个兜底路由上。"},{"type":"code","text":"const routes = [\n  { path: '/', component: Home },\n  { path: '/about', component: About },\n  // 其他正常路由...\n  { path: '/:pathMatch(.*)*', component: NotFound }\n]"},{"type":"p","text":"这里用了动态参数 pathMatch 捕获整个路径段，传给组件还能展示用户想找的地址。NotFound 组件里可以提示“页面走丢了”，加个返回首页的按钮。"},{"type":"p","text":"1）必须放最后，不然会拦截所有路由"},{"type":"p","text":"2）path: '/*' 写法在某些版本不推荐，官方建议用 /:pathMatch(.*)*"},{"type":"p","text":"3）服务端要配合返回 404 状态码，单页应用前端路由只是体验优化"},{"type":"p","text":"如果项目有 SSR，比如 Nuxt.js，还得在服务端配置对应的 404 响应，不然搜索引擎看不到真正的 404 状态。"}],"r":["","window.onerror 捕获的是运行时错误，管不了路由匹配。","Vue Router 不会自动生成 404 页面。","通配路由放最前面会拦截所有路径，其他路由永远匹配不到。"]},{"id":43,"t":"你了解 Vue 中的过滤器吗？它有哪些应用场景？","c":"Vue","o":["用于对组件的 props 做类型校验","用于全局拦截 HTTP 请求","用于拦截路由跳转，做登录校验","文本格式化，如日期、金额，不改原数据"],"a":3,"w":"过滤器只做展示层的数据格式化（日期、金额、单位），不改变源数据。Vue 3 已移除过滤器，改用计算属性或方法。","b":[{"type":"p","text":"Vue 的过滤器本质上是一个函数，用来对模板中的文本进行格式化处理。它只能用在双大括号插值和 v-bind 表达式中，接收一个值作为输入，返回处理后的结果。"},{"type":"p","text":"1）定义方式支持局部和全局两种。全局过滤器通过 Vue.filter('formatName', fn) 注册，组件内直接使用；局部则在组件选项里定义 filters 对象。"},{"type":"p","text":"2）常见应用场景比如时间戳转日期、数字添加千分位、金额补上单位“元”、字符串截取显示省略号等。这类操作不改变原始数据，只影响视图展示。"},{"type":"p","text":"3）但要注意，从 Vue 3 开始过滤器已经被移除，官方推荐用方法调用或计算属性替代。因为过滤器逻辑隐含在模板中，调试和复用都不如函数直观。"},{"type":"p","text":"代码示例如下："},{"type":"code","text":"// 全局注册\nVue.filter('currency', function (value) {\n  if (!value) return ''"},{"type":"p","text":"return (value / 100).toFixed(2) + '元'"},{"type":"code","text":"})"},{"type":"p","text":"模板中使用：{{ price | currency }} 。这种方式写起来确实简洁，但团队项目里容易积累一堆难以追踪的“黑盒”处理函数。"},{"type":"p","text":"其实更推荐把格式化逻辑放在计算属性或组合式函数（composable）里，结构清晰也方便测试。尤其在复杂业务场景下，可维护性比少写几行代码重要得多。"},{"type":"p","text":"所以总结一句话：能用计算属性或方法的地方，就别依赖过滤器，尤其是新项目。"}],"r":["props 类型校验由 props 的 type 和 validator 负责。","请求拦截是 axios 拦截器的活。","路由拦截是导航守卫的活。",""]},{"id":44,"t":"Vue Router 中如何获取路由传递过来的参数？","c":"Vue","o":["query 用 $route.query，params 用 $route.params","只能通过 props 传递，路由对象上读不到任何参数","params 只能通过 URL 的 hash 部分传递，query 走路径","全部通过 $route.data 统一获取，query 和 params 都挂在上面"],"a":0,"w":"query 拼在 URL 的 ? 后面，用 $route.query 取；params 对应动态路径段（/user/:id），用 $route.params 取。刷新后 params 需要路由配置才能保留。","b":[{"type":"p","text":"路由参数的获取方式主要看参数类型，Vue Router 支持三种：params 、query 和路由组件的 props 。"},{"type":"p","text":"1）动态路径参数用 params ，比如 /user/:id ，在组件内通过 this.$route.params.id 拿。注意刷新页面时 params 不会丢失，因为它是路径的一部分。"},{"type":"p","text":"2）查询参数走 query ，像 /search?keyword=vue ，取值是 this.$route.query.keyword 。这种适合可选、非必填的参数，传参灵活但不会影响路由匹配。"},{"type":"p","text":"3）推荐把路由参数转为组件 props 传入，解耦更清晰。需要在路由配置里开启 props: true ，组件就能直接用"},{"type":"p","text":"props 接收，测试和复用都方便。"},{"type":"code","text":"// 路由配置\n{\n  path: '/user/:id',\n  component: User,\n  props: true\n}\n// 组件\nexport default {\n  props: ['id'],\n  mounted() {"},{"type":"p","text":"console.log(this.id) // 直接用，不用再从 $route 拿"},{"type":"code","text":"  }\n}"},{"type":"p","text":"别忘了 params 只能用 name 跳转才能保留，用 path 的话会丢掉。query 就没这限制，用 path 或 name都行。"}],"r":["","props 是一种解耦写法，但参数本身仍然来自路由对象。","hash 是 # 后面的片段，与 params 无关。","$route 上没有 data 这个字段。"]},{"id":45,"t":"Vue 的 v-cloak 和 v-pre 指令有什么作用？","c":"Vue","o":["v-cloak 用于跳过编译，v-pre 用于防止闪烁","v-cloak 防闪烁，v-pre 跳过编译原样输出","v-pre 用于缓存组件实例","两者都用于阻止组件渲染"],"a":1,"w":"v-cloak 在编译完成前隐藏未编译的模板，需要配合 CSS 的 [v-cloak]{display:none} 才生效；v-pre 直接跳过编译、原样输出，适合展示 mustache 语法本身。","b":[{"type":"p","text":"Vue 在首次渲染时，如果模板里有 Mustache 语法，比如 {{ message }}，浏览器会先看到这些原始标签，等 Vue 实例挂载完成后才会替换。这就可能造成一瞬间的“内容闪烁”。"},{"type":"p","text":"v-cloak 就是干这个的。你只要在元素上写上 v-cloak，Vue 初始化完之前，这个属性一直挂着。你可以配合 CSS 把带v-cloak 的元素先隐藏掉，等 Vue 接管后自动消失。"},{"type":"code","text":"[v-cloak] {\n  display: none;\n}"},{"type":"p","text":"这样页面加载时就不会看到乱七八糟的 {{}} 了，体验更顺。"},{"type":"p","text":"另一个是 v-pre，它的作用是跳过这个节点和它的子节点的编译过程。说白了，就是告诉 Vue：这块你别管，我不需要响应式更新。适合用在纯展示的静态内容上，比如文档页面里大段的代码示例，能减少不必要的解析开销，提升一点性能。"},{"type":"p","text":"1）v-cloak 配合 CSS 解决首次渲染的闪烁问题"},{"type":"p","text":"2）v-pre 跳过编译，用于静态内容提升性能"},{"type":"p","text":"这两个都不是高频指令，但在特定场景下能帮你把细节处理得更干净。"}],"r":["说反了：防闪烁的是 v-cloak，跳过编译的是 v-pre。","","缓存组件实例是 keep-alive 的职责。","两者都不阻止渲染，一个延迟显示，一个原样输出。"]},{"id":46,"t":"什么是 Vue 中的 slot？它有什么作用？","c":"Vue","o":["让父组件向子组件指定位置插入内容","用于替代 props 向子组件传数据","用于定义组件的私有样式","用于在父子组件之间传递事件"],"a":0,"w":"插槽是内容分发机制：父组件把模板片段塞进子组件预留的位置。默认插槽、具名插槽解决“放哪儿”，作用域插槽还能把子组件内部数据暴露给父组件。","b":[{"type":"p","text":"Vue 里的 slot 其实就是组件的内容分发机制。你写一个组件时，不可能把所有内容都固定死，总得留点地方让父组件来决定放啥。"},{"type":"p","text":"比如你封装了一个卡片组件 <Card> ，标题、内容、底部操作区都想让使用者自己定义。这时候就用 slot，它相当于在组件模板里开了几个“插槽口”，等着别人把内容塞进来。"},{"type":"p","text":"默认情况下，父组件传入的额外内容会直接被丢进默认插槽。如果你想更灵活，可以用具名插槽。比如在 Card 组件里："},{"type":"code","text":"<template>\n  <div class=\"card\">\n    <header><slot name=\"header\"><\/slot><\/header>\n    <main><slot><\/slot><\/main>\n    <footer><slot name=\"footer\"><\/slot><\/footer>\n  <\/div>\n<\/template>"},{"type":"p","text":"父组件就可以这样用："},{"type":"code","text":"<Card>"},{"type":"p","text":"<template #header>这里是标题<\/template><p>这是主体内容<\/p>"},{"type":"code","text":"  <template #footer>"},{"type":"p","text":"<button>取消<\/button><button>确定<\/button>"},{"type":"code","text":"  <\/template>\n<\/Card>"},{"type":"p","text":"注意这里的 #header 就是 v-slot:header 的缩写。作用域插槽还能把子组件的数据传给父组件，让父组件根据这些数据来渲染内容。比如列表组件把 item 数据通过 slot props 抛出去，外面就能自定义每一项长啥样。"},{"type":"p","text":"整个过程压根不经过 prop 传递，而是模板层面的内容注入，特别适合做高可定制的 UI 组件库，像 Element Plus 这些都是靠 slot 实现灵活布局的。"}],"r":["","插槽传的是模板片段，props 传的是数据，两者互补而不是替代。","组件的私有样式靠 scoped，与插槽无关。","父子通信靠 $emit 和自定义事件，插槽不是干这个的。"]},{"id":47,"t":"常见的 Webpack Loader 有哪些？","c":"工程化","o":["babel-loader、css-loader、file-loader 等","entry、output、module、plugins 等配置项","HtmlWebpackPlugin、MiniCssExtractPlugin 等插件","hot、inline、historyApiFallback 等 devServer 选项"],"a":0,"w":"loader 负责把单个模块转换成 Webpack 能处理的形态（babel-loader 转 JS、css-loader 解析 @import、file-loader 输出文件）；插件负责构建流程上的宏观操作。","b":[{"type":"p","text":"处理 Webpack 的 loader 其实就是用来转换不同类型的文件，让它们能被打包进最终产物。loader 的执行顺序是从下往上、从右往左，这点得记牢。"},{"type":"p","text":"1）babel-loader"},{"type":"p","text":"把 ES6+ 代码转成浏览器兼容的 ES5，配合 @babel/preset-env 基本是标配。React 项目里也靠它处理 JSX。"},{"type":"p","text":"2）ts-loader 或 swc-loader"},{"type":"p","text":"TypeScript 项目用 ts-loader 调用 tsc 编译；追求速度可以换 swc-loader，基于 Rust，编译快很多。"},{"type":"p","text":"3）css-loader 和 style-loader css-loader 解析 @import 和 url()，让 CSS 支持模块化；style-loader 把 CSS 插入到页面 style 标签里。开发环境常用。"},{"type":"p","text":"4）sass-loader / less-loader分别处理 .scss 和 .less 文件，需要配合 css-loader 使用。比如 sass-loader 把 SCSS 编译成 CSS，再交给 css-loader处理。"},{"type":"p","text":"5）file-loader 和 url-loader（已逐步被 Asset Modules 替代）file-loader 把文件输出到指定目录并返回路径；url-loader 可以设置 limit，小文件直接转成 Data URL 内联。现在Webpack 5 推荐用 asset/resource 或 asset/inline。"},{"type":"p","text":"6）raw-loader"},{"type":"p","text":"直接把文件内容读成字符串，比如你要加载一个模板文件。"},{"type":"p","text":"7）eslint-loader（现在多用 eslint-webpack-plugin）以前在构建时做 lint 检查，现在更推荐用插件方式，避免影响编译性能。"},{"type":"p","text":"Webpack 5 开始原生支持 Asset Modules，像 asset/module、asset/resource 这些，基本能把 file-loader、url-loader 干掉，配置更简洁。"}],"r":["","entry/output/module/plugins 是配置字段，不是 loader。","HtmlWebpackPlugin、MiniCssExtractPlugin 是插件，不是 loader。","devServer 的选项属于开发服务器配置。"]},{"id":48,"t":"如何使用 webpack-dev-server 监控文件编译？","c":"工程化","o":["需要额外安装 nodemon 才能监听","只能借助浏览器插件实现自动刷新","必须手动执行 webpack --watch，dev-server 不支持监听","启动 devServer，默认监听文件变化并自动重编译刷新"],"a":3,"w":"启动 devServer 后，它内部用 chokidar 监听文件，改动后自动重新编译，再通过 websocket 通知浏览器刷新或热更新，不需要额外装 nodemon。","b":[{"type":"p","text":"webpack-dev-server 能自动监听文件变化并触发重新编译，核心靠的是 watch mode 和内置的 dev server 机制。"},{"type":"p","text":"它启动时会开启文件系统监听器（基于 chokidar 这个库），监控项目中所有参与构建的文件。一旦你改了源码，比如保存了一个 .js 或 .vue 文件，它立马感知到变化，触发增量编译，把更新后的资源推送到内存里。"},{"type":"p","text":"重点是，这些编译结果压根不经过磁盘，直接写进内存。这就是为什么它快——读写都在内存完成，通过 memory-fs 替换了默认的 fs 模块。"},{"type":"p","text":"开发服务器用 express 起一个服务，路由请求都指向内存中的资源。配合 hot module replacement(HMR) ，还能做到局部热更新，不用整页刷新。"},{"type":"p","text":"配置上很简单，在 webpack.config.js 里加："},{"type":"code","text":"devServer: {\n  static: './dist',"},{"type":"p","text":"watchFiles: ['src/**/*'], // 明确指定要监听的路径hot: true, // 启用 HMR"},{"type":"code","text":"}"},{"type":"p","text":"1）确保 mode 是 development"},{"type":"p","text":"2）装好 webpack-dev-server 包，一般通过 npx webpack serve 启动"},{"type":"p","text":"3）如果监听没反应，检查是否被 node_modules 干扰，或 watchOptions.ignored 是否误拦了文件"}],"r":["nodemon 是给 Node 服务端重启进程用的，和前端编译无关。","自动刷新由 dev-server 自己完成，不依赖浏览器插件。","dev-server 默认就会监听，不需要手动跑 --watch。",""]},{"id":49,"t":"Webpack 中，常见的图片处理加载器有哪些？","c":"工程化","o":["thread-loader、cache-loader","style-loader、css-loader、sass-loader","babel-loader、ts-loader、eslint-loader","url-loader、file-loader、image-webpack-loader"],"a":3,"w":"处理图片常用 url-loader（小图转 base64）、file-loader（输出文件）、image-webpack-loader（压缩）；Webpack 5 内置 asset modules 后，前两者可被 asset/inline、asset/resource 取代。","b":[{"type":"p","text":"处理图片这类静态资源，Webpack 本身不直接认识，得靠专门的 loader 去解析和转换。常见的图片处理方案一般会组合使用几个 loader，各司其职。"},{"type":"p","text":"1）file-loader"},{"type":"p","text":"能把图片文件原封不动地拷贝到输出目录，然后返回一个可引用的 URL 路径。适合大多数图片，尤其是大图或者不想做额外处理的资源。现在虽然被内置的 asset/resource 模式替代，但原理一致。"},{"type":"p","text":"2）url-loader"},{"type":"p","text":"它其实是 file-loader 的增强版，可以设置一个 limit 阈值。小于这个大小的图片会自动转成 Data URL（base64），减少 HTTP 请求。比如小图标这种，3kb 以下的转成 base64 内联进 JS，省一次网络请求。超过 limit 的还是会回退到输出文件，这时候通常会配合 file-loader 一起用。"},{"type":"p","text":"3）现代 Webpack 5 推荐用内置的 Asset Modules，不用额外装包。通过配置 type: 'asset' 就能实现 url-loader + file-loader 的功能。你只需要写："},{"type":"code","text":"{\n  test: /\\.(png|jpg|gif|svg)$/,\n  type: 'asset',\n  parser: {\n    dataUrlCondition: {\n      maxSize: 8 * 1024 // 8kb\n    }\n  }\n}"},{"type":"p","text":"这样小于 8kb 的自动内联，大的就单独输出文件。"},{"type":"p","text":"实际项目里，像 Vue CLI、Create React App 都是这么配的。再加上 image-webpack-loader 还能压缩图片体积，不过构建会变慢，得权衡。"}],"r":["thread-loader、cache-loader 是构建性能优化用的，不处理图片。","style/css/sass-loader 处理的是样式。","babel/ts/eslint-loader 处理的是 JS/TS 代码。",""]},{"id":50,"t":"什么是 Webpack？它有什么作用？","c":"工程化","o":["模块打包工具，分析依赖后输出可运行产物","一个包管理器，用于安装依赖","一个 CSS 预处理器","一个前端框架，提供组件化和响应式能力"],"a":0,"w":"Webpack 是模块打包工具：从入口出发分析依赖图，用 loader 转换各类资源，用 plugin 干预构建流程，最终输出浏览器能运行的产物。它本身不提供框架能力。","b":[{"type":"p","text":"Webpack 是个前端资源构建工具，本质是个模块打包器。它把项目里各种静态资源——JS、CSS、图片、字体都当成“模块”，通过依赖关系把它们打包成少数几个甚至一个文件，让浏览器能高效加载。"},{"type":"p","text":"1）它从一个入口文件开始，递归地构建出整个应用的依赖图谱。比如你写 import './style.css' 或"},{"type":"p","text":"require('lodash') ，Webpack 都能分析到这些依赖。"},{"type":"p","text":"2）有了依赖图，它就调用对应的 loader 处理不同类型的文件。比如 babel-loader 把 ES6+ 代码转成兼容性更好的 ES5，css-loader 解析 CSS 里的 @import 和 url() ，再配合 style-loader 把样式插入页面。"},{"type":"p","text":"3）最后通过 plugin 做更复杂的操作，比如 HtmlWebpackPlugin 自动生成引入 bundle 的 HTML 文件，"},{"type":"p","text":"MiniCssExtractPlugin 把 CSS 提取成单独文件。"},{"type":"p","text":"举个简单配置例子："},{"type":"code","text":"module.exports = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n    path: __dirname + '/dist'\n  },\n  module: {\n    rules: [\n      { test: /\\.js$/, use: 'babel-loader' },\n      { test: /\\.css$/, use: ['style-loader', 'css-loader'] }\n    ]\n  }\n};"},{"type":"p","text":"像 Vue CLI、React Create App 背后都用了 Webpack，只是做了封装。它适合中大型项目，小项目可能觉得配置太重。说白了，它的核心价值就是把现代开发用的模块化、新语法，变成浏览器能跑的代码。"}],"r":["","安装依赖是 npm/yarn/pnpm 的职责。","CSS 预处理器是 Sass/Less/Stylus。","组件化和响应式是 React/Vue 这类框架提供的。"]},{"id":51,"t":"如何在 Node.js 中创建一个简单的 HTTP 服务器？","c":"Node.js","o":["http.createServer(...).listen(port)","必须用 express.listen() 才能创建，原生 http 不支持","必须借助 Nginx 反向代理才能启动","用 new Server() 并手动监听底层 socket"],"a":0,"w":"Node 原生 http 模块就能起服务：http.createServer 接收请求回调，listen 监听端口。Express 只是对它的封装，Nginx 是可选的反向代理，不是启动前提。","b":[{"type":"p","text":"Node.js 自带 http 模块，不用装第三方库就能起一个 HTTP 服务。你只需要引入模块，调用 createServer ，传个回调处理请求就行。"},{"type":"p","text":"这个回调接收两个对象：req 是 IncomingMessage，能读到请求的 URL、方法、头信息；res 是ServerResponse，用来写响应头、写数据、结束响应。"},{"type":"p","text":"创建完服务器后，得绑定端口才能对外服务，用 listen 方法指定端口号，比如 3000，再加个回调确认服务已经起来。"},{"type":"code","text":"const http = require('http');\nconst server = http.createServer((req, res) => {\n  res.writeHead(200, { 'Content-Type': 'text/plain' });\n  res.end('Hello from Node.js\\n');\n});\nserver.listen(3000, () => {\n  console.log('Server running on port 3000');\n});"},{"type":"p","text":"这种原生方式适合学原理或者写个简单接口测试工具。真要开发 Web 应用，一般会用 Express 或 Koa，它们封装了路由、中间件这些常用功能，开发效率高得多。"},{"type":"p","text":"如果你只是想快速验证一个 API 调用或 mock 数据，这种方式几行代码就搞定，压根不经过框架，轻量又直接。"}],"r":["","Express 底层就是 http.createServer，原生完全可以。","Nginx 是可选的反向代理层，本地起服务不需要它。","http 模块没有导出一个可以直接 new 的 Server 类。"]},{"id":52,"t":"Node.js 中，同步和异步代码有什么区别？","c":"Node.js","o":["异步代码会在新线程里执行所有 JS 逻辑","同步代码一定比异步代码执行得慢","同步阻塞后续代码，异步交给事件循环","Node 中所有 I/O 操作都是同步的"],"a":2,"w":"同步代码会占住主线程，后面的代码必须等它跑完；异步把耗时操作交给事件循环或线程池，主线程继续往下走，完成后回调。JS 逻辑本身始终在主线程执行。","b":[{"type":"p","text":"同步和异步的区别，关键看代码执行时会不会阻塞主线程。"},{"type":"p","text":"1）同步代码是“等结果”的模式。比如读文件用 fs.readFileSync ，程序会停在这行，直到文件读完才继续。这期间什么都干不了，CPU 空转也得等。适合启动阶段的配置加载这种一次性、小量操作。"},{"type":"code","text":"const fs = require('fs');"},{"type":"p","text":"const data = fs.readFileSync('./config.json'); // 卡这儿了console.log('不会立刻执行');"},{"type":"p","text":"2）异步代码不卡主线程。像 fs.readFile 传个回调，Node.js 把任务扔给底层线程池或操作系统，自己马上往下走。等数据 ready 了，事件循环再把回调推入调用栈执行。大多数 I/O 操作都这么干，比如网络请求、数据库查询。"},{"type":"code","text":"fs.readFile('./config.json', (err, data) => {"},{"type":"p","text":"console.log('数据到了才执行这里');"},{"type":"code","text":"});"},{"type":"p","text":"console.log('这行先打印');"},{"type":"p","text":"Node.js 能用单线程扛住高并发，靠的就是异步非阻塞。所有网络操作默认异步，底层通过 epoll（Linux）或kqueue（macOS）监听事件，压根不经过轮询。"},{"type":"p","text":"但异步也有代价。回调嵌套深了就是“回调地狱”，虽然现在有 async/await 解决。另外，CPU 密集任务不管同步异步都会卡住事件循环，这种场景得上 worker_threads 。"}],"r":["异步回调仍然在主线程执行，只是被推迟了。","同步通常更快，只是会阻塞，快慢不是这里的区别。","","Node 的大部分 I/O 都是异步的，这是它高并发的基础。"]},{"id":53,
