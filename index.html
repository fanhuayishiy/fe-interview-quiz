"t":"什么是 npm？如何使用它来管理项目的依赖？","c":"Node.js","o":["Node 的包管理器，用 install 管理依赖","一个前端构建工具，负责把模块打包成产物","一个浏览器端的模块加载规范和运行时","只能安装全局包，不能安装项目本地依赖"],"a":0,"w":"npm 是 Node 的包管理器：npm init 建项目、npm install 装依赖、npm run 跑脚本，依赖记录在 package.json，精确版本锁在 package-lock.json。","b":[{"type":"p","text":"npm 是 Node.js 的包管理工具，帮你下载、安装和管理项目用到的第三方库。每个项目根目录下的 package.json 文件记录了依赖清单，就像个购物清单。"},{"type":"p","text":"1）初始化项目时，运行 npm init 会引导生成 package.json，里面存着项目名、版本、依赖列表等信息。你装的库越多，这个文件就越长。"},{"type":"p","text":"2）装依赖分两种，开发用的比如打包工具写在 devDependencies，生产环境必须的比如框架写在 dependencies。执行 npm install lodash 会自动加到 dependencies 里，并且创建或更新 package-lock.json 锁定版本号。"},{"type":"p","text":"3）package-lock.json 很关键，它保证所有人安装的依赖树完全一致，避免“在我机器上能跑”的问题。提交代码时一定要带上它。"},{"type":"p","text":"4）平时开发基本就几个命令：npm install 装所有依赖，npm install --save-dev webpack 加一个开发依赖，npm update 升级小版本。别手动改 node_modules，全靠命令操作。"},{"type":"p","text":"卸载也简单，npm uninstall axios 就行。要是遇到依赖冲突，可以试试 npx 临时运行某个版本，不污染项目。"}],"r":["","打包是 Webpack/Vite 的活，npm 只负责依赖管理。","浏览器端的模块规范是 ESM，npm 是包管理工具。","npm 既支持本地依赖，也支持 -g 全局安装。"]},{"id":54,"t":"Node.js 中的回调函数是什么？请举例说明","c":"Node.js","o":["只能由浏览器自动调用的函数","回调函数必须返回 Promise","一种特殊的同步函数，不会产生嵌套","函数作为参数传入，在适当时机被调用"],"a":3,"w":"回调就是把函数当参数传给另一个函数，由对方在合适时机调用，比如 fs.readFile(path, (err, data) => {})。层层嵌套会形成回调地狱，于是有了 Promise 和 async/await。","b":[{"type":"p","text":"Node.js 的异步操作基本都靠回调函数来处理。它其实就是个被当作参数传给另一个函数的函数，等主任务干完了再调回来执行。"},{"type":"p","text":"比如读文件这种耗时操作，你不能让整个程序卡住等着，就得用回调。fs.readFile 就是典型例子："},{"type":"code","text":"const fs = require('fs');\nfs.readFile('/path/to/file.txt', 'utf8', (err, data) => {\n  if (err) {"},{"type":"p","text":"console.error('读取失败', err);"},{"type":"code","text":"    return;\n  }\n  console.log(data);\n});"},{"type":"p","text":"console.log('这行会先打印');"},{"type":"p","text":"你看，最后一行会先执行，文件内容后出来。这就是非阻塞 I/O 的体现，也是 Node 能扛住高并发的底子。"},{"type":"p","text":"但回调太多容易嵌套过深，形成“回调地狱”。比如连续读三个文件，一层套一层，代码就乱了。后来才有了 Promise和 async/await 来解决这问题。"},{"type":"p","text":"实际项目里，Express 处理路由也用回调："},{"type":"code","text":"app.get('/user/:id', (req, res) => {\n  User.findById(req.params.id, (err, user) => {\n    if (err) return res.status(500).send(err);\n    res.json(user);\n  });\n});"},{"type":"p","text":"这种写法在老版本 Node 或一些底层 API 中很常见，理解它是看懂 Node 异步模型的第一步。"}],"r":["Node 里大量使用回调，不是浏览器专属。","回调不要求返回 Promise，返回什么都不影响它被调用。","回调通常是异步的，嵌套多层正是回调地狱的来源。",""]},{"id":55,"t":"什么是 package.json 文件？它的作用是什么？","c":"Node.js","o":["项目清单：名称、版本、依赖、scripts","只能在发布 npm 包时使用，普通项目不需要","记录 node_modules 中每个文件的哈希值","用来配置 Webpack 的 loader"],"a":0,"w":"package.json 是项目清单：名称、版本、入口、scripts、dependencies/devDependencies 等。它描述项目本身，精确的依赖树由 package-lock.json 记录。","b":[{"type":"p","text":"package.json 是每个 Node.js 项目的根目录下都有的一个 JSON 格式配置文件，它记录了项目的基本信息和依赖管理规则。"},{"type":"p","text":"这个文件定义了项目名称、版本号、描述这些基础元数据，更重要的是它维护着 dependencies 和devDependencies 两个清单。前者是生产环境必须的包，比如 Express 或 Koa；后者是开发时用的工具，像TypeScript 编译器、ESLint 这类。npm 或 yarn 安装依赖时就靠读这个文件来拉取对应模块。"},{"type":"p","text":"它还能定义脚本命令。比如你经常跑 npm run build 或 npm start ，这些命令的实际执行逻辑就是在"},{"type":"p","text":"scripts 字段里配的。省去了记一长串 CLI 参数的麻烦。"},{"type":"p","text":"另外，锁文件如 package-lock.json 的生成也基于它，保证团队成员安装的依赖版本一致，避免“在我机器上能跑”的问题。"},{"type":"code","text":"{\n  \"name\": \"my-app\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"start\": \"node index.js\",\n    \"build\": \"tsc\"\n  },\n  \"dependencies\": {\n    \"express\": \"^4.18.0\"\n  },\n  \"devDependencies\": {\n    \"typescript\": \"^5.0.0\"\n  }\n}"},{"type":"p","text":"项目换人接手、CI/CD 自动化构建，全都靠这个文件快速还原工程上下文，少了它，整个项目就很难复现。"}],"r":["","任何 Node 项目都需要它，不只是发布 npm 包时。","记录文件哈希的是 package-lock.json。","Webpack 配置写在 webpack.config.js 里。"]},{"id":56,"t":"什么是 Node.js 全局对象？有哪些全局对象？","c":"Node.js","o":["document、window、localStorage","Node 没有全局对象","require、module 属于全局对象","global、process、console、Buffer 等"],"a":3,"w":"Node 的全局对象是 global（浏览器是 window），常用 global、process、console、Buffer、setTimeout，以及模块级的 __dirname、__filename。","b":[{"type":"p","text":"Node.js 里的全局对象跟浏览器环境不太一样，它没有 window，但有一套自己的全局变量和函数，你在任何文件里都能直接用，不用 require 或 import。"},{"type":"p","text":"global 是 Node.js 的全局命名空间对象，类似浏览器里的 window。你往 global 上挂的东西，整个应用都能访问，不过一般不推荐乱挂，容易造成污染。"},{"type":"p","text":"常见的全局对象和变量有这几个："},{"type":"p","text":"1）process 对象，拿进程信息、环境变量、执行路径全靠它。比如 process.env.NODE_ENV 判断环境，"},{"type":"p","text":"process.cwd() 拿当前工作目录，还能监听 process.on('uncaughtException', ...) 捕获未处理异常。"},{"type":"p","text":"2）console，打印日志用的，console.log 、console.error 这些，底层其实是 process.stdout 和 stderr 的封装。"},{"type":"p","text":"3）setTimeout、setInterval、clearTimeout 等定时器函数，和浏览器一致，事件循环里跑的。"},{"type":"p","text":"4）**__dirname** 和 __filename，这两个是模块级的，分别表示当前文件的所在目录和完整路径。比如你要读一个同级的 config.json，require('./config') 或 fs.readFileSync(path.join(__dirname,'config.json')) 。"},{"type":"p","text":"5）Buffer，处理二进制数据的核心类，比如读文件、网络传输都绕不开它。"},{"type":"p","text":"6）module 和 exports，实现 CommonJS 模块系统的基础，你写的 module.exports = xxx 就是它。"},{"type":"p","text":"7）还有一个特殊的 require，虽然是函数，但也是全局可用的，用来加载模块。"},{"type":"p","text":"这些全局对象让 Node.js 能脱离浏览器运行，直接对接系统资源和 I/O。但像 global 上挂变量这种事，最好别干，维护起来搞不定。"}],"r":["document、window、localStorage 是浏览器环境的对象。","Node 当然有全局对象，就是 global。","require 和 module 是 CommonJS 的模块级变量，不是全局对象。",""]},{"id":57,"t":"Node.js 中的 Buffer 对象是什么？它有什么作用？","c":"Node.js","o":["浏览器专有的二进制对象","一种可以动态扩容的普通数组","专门存储字符串的容器，只支持 utf-8","处理二进制数据的定长字节数组"],"a":3,"w":"Buffer 是 Node 处理二进制数据的定长字节数组，在 V8 堆外分配内存，常用于文件读写、网络传输、加密和编解码。长度固定，扩容要新建再拷贝。","b":[{"type":"p","text":"Node.js 的 Buffer 用来处理二进制数据，它就像一个固定长度的内存数组，专门在 V8 堆外分配空间。JavaScript 本身不擅长直接操作字节，但在处理文件读写、网络传输、加密解密这些场景时，你绕不开原始数据，Buffer 就是为此而生。"},{"type":"p","text":"比如用 fs.readFile 读取一张图片，返回的就是 Buffer，不是字符串。你可以把它转成 base64 或指定编码（如utf-8），但底层始终是字节流。创建方式常见有几种："},{"type":"code","text":"// 创建长度为10的空 Buffer\nconst buf = Buffer.alloc(10)\n// 从字符串创建\nconst buf2 = Buffer.from('hello')\n// 从数组初始化\nconst buf3 = Buffer.from([0x62, 0x75, 0x66])"},{"type":"p","text":"它支持 slice、copy、write 等操作，类似数组但长度不可变。一旦创建，大小就固定了，想扩容只能新建再拷贝。这点和普通数组不一样，别指望它动态伸缩。"},{"type":"p","text":"处理 TCP 流或拼接分段数据时特别容易出错。比如接收一个 JSON 包被拆成两段，你得先把 Buffer 攒起来，再统一转字符串解析。常见的做法是用 Buffer.concat() 合并多个片段："},{"type":"code","text":"Buffer.concat = (list, totalLength) => {\n  const buffer = Buffer.alloc(totalLength)\n  let offset = 0\n  for (const buf of list) {\n    buf.copy(buffer, offset)\n    offset += buf.length\n  }\n  return buffer\n}"},{"type":"p","text":"核心是二进制安全，不管内容是什么格式，Buffer 都能原样存取。这也是为什么它成了 Node.js I/O 操作的基石，所有流数据都靠它扛住。"}],"r":["Buffer 是 Node 的 API，浏览器里对应的是 ArrayBuffer/TypedArray。","Buffer 长度固定，不能像数组那样动态扩容。","Buffer 存的是字节，可以按 utf-8、base64 等编码与字符串互转。",""]},{"id":58,"t":"如何在 Node.js 中解析 JSON 数据？","c":"Node.js","o":["JSON.parse 解析，JSON.stringify 序列化","用 Object.assign 解析 JSON 字符串","Node 不支持 JSON 解析","只能用 eval 解析，JSON.parse 不通用"],"a":0,"w":"JSON.parse 把字符串解析成对象，JSON.stringify 把对象序列化成字符串。parse 会做严格语法校验，比 eval 安全；超大 JSON 要用流式解析，否则容易打满内存。","b":[{"type":"p","text":"Node.js 里处理 JSON 其实就两个核心场景：解析字符串和读取 JSON 文件。"},{"type":"p","text":"你拿到一个 JSON 格式的字符串，比如从 HTTP 请求体里收到的数据，直接用内置的 JSON.parse() 就行。这玩意儿是同步方法，解析成功返回 JS 对象，格式不对直接抛异常，记得包一层 try-catch。"},{"type":"code","text":"try {\n  const obj = JSON.parse('{\"name\": \"Alice\", \"age\": 30}');\n  console.log(obj.name); // Alice\n} catch (err) {"},{"type":"p","text":"console.error('JSON 格式错了', err);"},{"type":"code","text":"}"},{"type":"p","text":"另一种情况是从文件读 JSON，比如配置文件 config.json。这时候先用 fs 模块读内容，再 parse。"},{"type":"code","text":"const fs = require('fs');\ntry {\n  const data = fs.readFileSync('./config.json', 'utf8');\n  const config = JSON.parse(data);\n} catch (err) {"},{"type":"p","text":"console.error('读取或解析失败', err);"},{"type":"code","text":"}"},{"type":"p","text":"现在主流框架像 Express 都自带 json 中间件，请求过来自动帮你 parse 好，挂到 req.body 上，压根不用手动处理。"},{"type":"p","text":"要特别注意的是，大文件别用同步读。超过几十 MB 的 JSON 文件，得用流配合 JSON 流式解析库，比如"},{"type":"p","text":"JSONStream 或 stream-json ，不然内存直接爆掉。"},{"type":"p","text":"1）小数据用 JSON.parse() 2）文件读取配合 fs.readFileSync 3）大文件走流式解析"},{"type":"p","text":"整个过程其实没太多花哨的东西，关键就是别在错误的场景下搞不定数据量。"}],"r":["","Object.assign 只是合并对象，不能解析字符串。","Node 原生支持 JSON，这是内置对象。","eval 能执行任意代码，既不安全也比 JSON.parse 慢。"]},{"id":59,"t":"什么是 Node.js 中的模块加载机制？","c":"Node.js","o":["require 同步并缓存，ESM 静态异步加载","模块加载没有缓存机制","每次 require 都会重新执行一遍模块代码","Node 只支持 ESM，不支持 CommonJS"],"a":0,"w":"CommonJS 的 require 是运行时同步加载，首次加载后结果进 require.cache，再次 require 直接拿缓存；ESM 是静态结构、编译期确定依赖，支持 tree-shaking。","b":[{"type":"p","text":"Node.js 的模块加载机制核心在于 CommonJS 规范，它让每个文件都成为一个独立的模块，变量和函数不会污染全局作用域。"},{"type":"p","text":"模块第一次被 require 时，会同步执行整个文件，然后将结果缓存到 require.cache 中。下次再 require 同一个路径，直接返回缓存的 exports 对象，不会重复执行。这就保证了模块的单例特性。"},{"type":"p","text":"模块之间通过 module.exports 或 exports 暴露接口，用 require 引入。比如："},{"type":"code","text":"// math.js\nexports.add = (a, b) => a + b;\n// app.js\nconst { add } = require('./math');"},{"type":"p","text":"Node 在查找模块时有一套优先级：先看是不是核心模块（如 fs、path），再按路径尝试加载 node_modules 下的第三方包或本地文件。路径解析规则决定了 require('utils') 到底加载哪个文件。"},{"type":"p","text":"1）核心模块优先加载，性能高"},{"type":"p","text":"2）文件模块支持 .js、.json、.node 扩展名自动识别"},{"type":"p","text":"3）循环依赖会出现部分导出的情况，得小心处理"}],"r":["","模块加载有缓存，require.cache 就是缓存表。","第二次 require 直接读缓存，不会重复执行模块代码。","Node 同时支持 CommonJS 和 ESM，只是混用时有约束。"]},{"id":60,"t":"Node.js 中的 process 对象是什么？它有哪些常用属性？","c":"Node.js","o":["浏览器中的当前窗口对象，包含 location 等信息","只能读取环境变量，没有其他属性和方法","进程对象，含 argv、env、cwd、platform","是创建子进程的唯一方式，其余 API 都已废弃"],"a":2,"w":"process 是 Node 的全局进程对象：argv 拿命令行参数、env 读环境变量、cwd() 取当前目录、platform 判断系统，还有 nextTick、exit、memoryUsage 等能力。","b":[{"type":"p","text":"process 是 Node.js 提供的全局对象，不用引入就能直接用。它代表当前运行的进程，能访问环境信息、控制输入输出、处理信号等。"},{"type":"p","text":"1）process.env 存环境变量，比如 NODE_ENV 区分开发生产。配置服务常用这个做多环境切换。"},{"type":"p","text":"2）process.argv 是命令行传参数组。第一个是 node 路径，第二个是脚本路径，后面是自定义参数。写 CLI 工具时靠它拿用户输入。"},{"type":"code","text":"// node script.js --name=foo\nconsole.log(process.argv.slice(2)); // ['--name=foo']"},{"type":"p","text":"3）process.cwd() 返回当前工作目录，和 __dirname 不一样，它不依赖文件位置，适合动态找项目根路径。"},{"type":"p","text":"4）输入输出用 process.stdin 、stdout 、stderr 。它们是可读/可写流，可以监听数据事件或直接写内容。"},{"type":"p","text":"5）process.exit([code]) 退出进程。0 表成功，非 0 是错误码。正常流程不用手动调，Node 会自动退出。有异步任务没完想强行退出才用。"},{"type":"p","text":"6）process.on('uncaughtException', cb) 捕获未处理异常，防止进程崩溃。但状态可能已不一致，建议只用来打日志然后退出。"},{"type":"p","text":"7）process.pid 是进程 ID，监控或调试时有用，比如配合 kill -9 终止进程。"},{"type":"p","text":"这些属性让 Node.js 能脱离浏览器环境，和操作系统交互，实现命令行工具、服务部署、资源监控等功能。"}],"r":["location 属于浏览器的 window。","process 除了 env 还有大量属性和方法。","","创建子进程用的是 child_process 模块，process 只是入口。"]},{"id":61,"t":"Node.js 中的 require 和 import 有什么区别？","c":"Node.js","o":["两者完全等价，可以随意替换","require 运行时同步，import 静态可摇树","import 只能在浏览器使用，require 只能在 Node 使用","require 支持 tree-shaking，import 不支持"],"a":1,"w":"require 是 CommonJS 的运行时同步加载，可以写在 if 里动态执行；import 是 ESM 的静态声明，依赖在编译期就能确定，所以打包工具能做 tree-shaking。","b":[{"type":"p","text":"Node.js 里 require 和 import 看似都是加载模块，但背后机制完全不同。"},{"type":"p","text":"require 是 CommonJS 模块系统的产物，属于运行时加载。你可以在代码任何地方动态 require，比如 if 语句里。它返回的是被加载模块的 副本，也就是说模块内部变量变化后，引用方能感知到。典型用法："},{"type":"code","text":"const fs = require('fs');\nconst config = require('./config');"},{"type":"p","text":"import 属于 ES6 模块标准，在编译时就确定依赖关系，是静态解析。必须写在文件顶层作用域，不能动态加载（目前动态 import 已支持 import() 函数）。import 导入的是值的引用，原始模块导出变了，这边看到的也会变。语法更清晰："},{"type":"code","text":"import fs from 'fs';\nimport { readFile } from 'fs';"},{"type":"p","text":"两者不能混用在同一项目中，除非通过 Babel 或 TypeScript 编译转换。Node.js 从 12 版本开始原生支持 ES module，但需要把文件后缀改为 .mjs 或在 package.json 中设置 \"type\": \"module\" 。"},{"type":"p","text":"简单说，require 灵活但动态，import 规范且支持静态分析，更适合 tree-shaking 优化。现在新项目建议优先用import，尤其是配合前端生态时一致性更好。"}],"r":["两者加载时机、作用域和静态性都不同，不能随意替换。","","ESM 在 Node 里也支持（.mjs 或 type: module），不是浏览器专属。","说反了：能摇树的是 ESM 的 import。"]},{"id":62,"t":"Node.js 的 process.nextTick() 有什么作用？","c":"Node.js","o":["把回调放到下一轮事件循环的 timers 阶段","等同于 setTimeout(fn, 0)","当前操作结束后、下一阶段前执行，属微任务","用于延迟到 DOM 更新之后执行"],"a":2,"w":"nextTick 把回调放进微任务队列，在当前操作结束后、事件循环进入下一阶段之前执行，优先级比 Promise.then 还高。常用于修改数据后立刻拿到更新后的状态。","b":[{"type":"p","text":"process.nextTick() 的作用是把一个函数推迟到当前事件循环的下一个阶段之前执行，但它其实不会进入下一个阶段，而是在当前操作一结束、下一轮事件循环开始前立刻执行。"},{"type":"p","text":"你可以把它理解成一个“超短时”的异步任务调度器。比如你在 setTimeout 回调里调用了"},{"type":"p","text":"process.nextTick() ，那这个 nextTick 的回调会在本轮事件循环中、但所有同步代码跑完后立即执行，优先级比 setImmediate 和 setTimeout(fn, 0) 都高。"},{"type":"p","text":"1）它常用于保证某些逻辑在当前调用栈清空后马上运行，比如错误处理或状态切换"},{"type":"p","text":"2）在自定义事件触发时，用来延迟事件发射，确保对象初始化完成后再触发"},{"type":"p","text":"3）但它不能滥用，因为 nextTick 队列会优先于 I/O 等待、定时器等任务，过度使用会阻塞主线程的实际进展"},{"type":"code","text":"console.log('start');\nprocess.nextTick(() => {\n  console.log('nextTick');\n});\nconsole.log('end');\n// 输出顺序：\n// start\n// end\n// nextTick"},{"type":"p","text":"注意：Node.js 会把 process.nextTick() 的回调放进一个独立的微任务队列（microtask queue），并且这个队列在每个阶段切换前都会被清空。所以它比 Promise.then() 的微任务还激进一点，在某些老版本里甚至能造成 I/O 饿死。"}],"r":["timers 阶段是 setTimeout/setInterval 的地盘，nextTick 比它早得多。","setTimeout(fn, 0) 至少要等下一轮 timers 阶段，nextTick 更早。","","Node 里没有 DOM，这个描述属于浏览器的场景。"]},{"id":63,"t":"Node.js 中的定时器函数 setImmediate() 和 setTimeout() 有什么区别？","c":"Node.js","o":["setImmediate 会阻塞事件循环，setTimeout 不会","setImmediate 在 check，setTimeout 在 timers","setTimeout 一定先于 setImmediate 执行，与延迟无关","两者完全等价，只是名字不同，可以随意替换"],"a":1,"w":"setImmediate 在 check 阶段执行，setTimeout 在 timers 阶段执行。在 I/O 回调内部，setImmediate 总是先执行；在主模块里，两者顺序取决于进程启动耗时，不确定。","b":[{"type":"p","text":"Node.js 的事件循环里，setImmediate 和 setTimeout 虽然都用来延迟执行，但触发时机不一样，关键看它们在哪个阶段执行。"},{"type":"p","text":"1）setTimeout(fn, 0) 其实不是立即执行，它会被放进定时器阶段（Timers Phase）。即使你设了 0 毫秒，也得等这一轮事件循环走到定时器检查时才触发。如果当前正在执行同步代码，它就得排队。"},{"type":"p","text":"2）而 setImmediate(fn) 是注册到检查阶段（Check Phase），这个阶段紧随 I/O 回调之后。所以一般情况下，"},{"type":"p","text":"setImmediate 会在 setTimeout(fn, 0) 之后执行——但有个例外：在 I/O 回调内部注册时，setImmediate 总是优先于 setTimeout(fn, 0) 。"},{"type":"p","text":"举个例子："},{"type":"code","text":"setTimeout(() => console.log('timeout'), 0);\nsetImmediate(() => console.log('immediate'));"},{"type":"p","text":"输出顺序不确定，取决于当前事件循环的耗时。但如果是在 fs.readFile 的回调里："},{"type":"code","text":"fs.readFile(__filename, () => {\n  setTimeout(() => console.log('timeout'), 0);\n  setImmediate(() => console.log('immediate'));\n});"},{"type":"p","text":"这时 setImmediate 几乎总是先打印，因为 I/O 回调后直接进 Check Phase。"},{"type":"p","text":"简单记：不在 I/O 回调里，两者谁先谁后看运气；在 I/O 回调里，setImmediate 一定比 setTimeout(fn, 0)快。"}],"r":["两者都不会阻塞事件循环，它们只是把回调排队。","","在 I/O 回调里恰好相反，setImmediate 会先执行。","两者执行阶段不同，不能互换。"]},{"id":64,"t":"什么是 Node.js 中的事件发射器（EventEmitter）？它有什么作用？如何使用？","c":"Node.js","o":["浏览器 DOM 事件系统的别名","发布订阅：on 注册、emit 触发、off 移除","一个用于创建子进程的类","只能由 Node 内核使用，业务代码用不了"],"a":1,"w":"EventEmitter 是 Node 的事件发布订阅实现：on 注册监听、emit 触发、off 移除，Stream、http.Server 等大量模块都继承自它。","b":[{"type":"p","text":"Node.js 里的 EventEmitter 是事件驱动架构的基石，几乎所有核心模块都基于它。你可以把它看作一个“消息广播站”，允许对象监听和响应特定事件。"},{"type":"p","text":"它解决的是异步编程中回调嵌套过深的问题。比如文件读取完成、网络请求到达时，不需要层层传递回调，而是触发一个事件，让所有监听者自动执行。"},{"type":"p","text":"用法很简单，先引入 EventEmitter 类："},{"type":"code","text":"const EventEmitter = require('events');\nclass MyEmitter extends EventEmitter {}\nconst myEmitter = new MyEmitter();"},{"type":"p","text":"然后通过 on 绑定监听，emit 触发事件："},{"type":"code","text":"myEmitter.on('data', (info) => {"},{"type":"p","text":"console.log('收到数据:', info);"},{"type":"code","text":"});\nmyEmitter.emit('data', { value: 123 });"},{"type":"p","text":"事件可以传参，也支持只监听一次的 once 方法。移除监听用 removeListener ，避免内存泄漏。"},{"type":"p","text":"常见场景包括：自定义模块间通信、处理流数据（如 ReadableStream）、构建观察者模式组件。像 Express 中间件、WebSocket 通信底层都在用类似机制。"},{"type":"p","text":"注意别忘了错误事件。如果抛出未捕获的 'error' 且没有监听器，进程会直接退出。"}],"r":["浏览器的 DOM 事件是另一套机制，EventEmitter 是 Node 的。","","创建子进程用的是 child_process，不是 EventEmitter。","业务代码可以直接继承或 new EventEmitter 来用。"]},{"id":65,"t":"如何在 Node.js 中处理 HTTP 请求的路由？","c":"Node.js","o":["用 fs.readFile 读取路由文件即可实现","只能通过 Nginx 配置实现路由","按 req.url 和 method 匹配处理函数","Node 原生 http 自带完整的路由功能"],"a":2,"w":"Node 原生 http 只给你 req.url 和 req.method，路由要自己按路径匹配，或者用 Express/Koa 的路由中间件。Nginx 只是可选的反向代理层。","b":[{"type":"p","text":"Node.js 本身提供了 http 模块，可以监听端口接收请求，但路由解析得自己实现。你拿到 req 对象后，一般通过"},{"type":"p","text":"req.method 和 req.url 来判断该走哪个逻辑。"},{"type":"p","text":"1）手动解析的话，就是 if-else 或 switch 判断路径和方法，返回对应内容。这种方式适合学习原理，但工程上基本不会用，维护起来太麻烦。"},{"type":"p","text":"2）实际项目都用框架处理路由。Express 是最典型的例子，它用中间件机制和声明式语法让路由变得直观："},{"type":"code","text":"const express = require('express')\nconst app = express()\napp.get('/users', (req, res) => {\n  res.json({ users: [] })\n})\napp.post('/users', (req, res) => {\n  // 创建用户\n  res.status(201).send()\n})\napp.listen(3000)"},{"type":"p","text":"类似的还有 Koa、Fastify。Koa 更轻量，把控制权交给开发者，路由需要配合 koa-router；Fastify 强调高性能，自带路由和序列化优化。"},{"type":"p","text":"路由匹配支持动态参数："},{"type":"code","text":"app.get('/users/:id', (req, res) => {\n  const { id } = req.params\n  res.json({ id })\n})"},{"type":"p","text":"还能按文件夹结构自动注册路由，比如 Next.js 的 pages 目录就实现了约定优于配置的路由方案。"},{"type":"p","text":"整个过程其实就是一个“匹配-分发-处理”的流程，框架帮你把脏活累活干了。"}],"r":["读文件解决不了 URL 到处理函数的映射问题。","Nginx 可以按路径转发，但不是 Node 应用内路由的唯一方式。","","原生 http 没有路由功能，只提供请求对象。"]},{"id":66,"t":"什么是 Node.js 的事件循环机制？它是怎么实现的？","c":"Node.js","o":["每次循环只执行一个回调，然后重新开始","libuv 实现，分 timers、poll 等阶段","由 V8 直接实现，与 libuv 完全无关","只有一个队列，严格按先进先出的顺序执行"],"a":1,"w":"事件循环由 libuv 实现，分为 timers、pending callbacks、poll、check、close 等阶段，每个阶段执行完会清空微任务队列，再进入下一阶段。","b":[{"type":"p","text":"Node.js 的事件循环不是由它自己实现的，而是基于一个叫 libuv 的 C++ 库。你写的 JavaScript 代码是单线程执行的，但 libuv 在背后管理着多线程的异步任务，比如文件读写、网络请求、定时器这些。"},{"type":"p","text":"当你发起一个异步操作，比如 fs.readFile 或 setTimeout ，Node.js 会把这个任务交给 libuv，然后立即继续执行后面的代码，不会卡住。等操作系统完成了这个操作，libuv 就把对应的回调放进事件队列里。主线程空下来的时候，事件循环就开始检查队列，取出回调执行。"},{"type":"p","text":"整个过程其实是一轮一轮的循环，每轮循环分成几个阶段，比如："},{"type":"p","text":"1）定时器阶段：处理 setTimeout 和 setInterval"},{"type":"p","text":"2）I/O 回调：执行一些延迟的 I/O 事件回调"},{"type":"p","text":"3）Idle, prepare：内部使用"},{"type":"p","text":"4）轮询（poll）：这是核心，处理大部分 I/O 回调，也会在这里等待新的事件"},{"type":"p","text":"5）检测（check）：执行 setImmediate 的回调"},{"type":"p","text":"6）关闭事件：比如 socket.on('close')"},{"type":"p","text":"每个阶段执行完当前队列里的所有任务，或者达到上限后，就进入下一阶段。这样保证了高并发下也能有序响应。"},{"type":"p","text":"注意 process.nextTick 不属于上面任何一个阶段，它会在每个阶段切换前被清空，优先级最高，用多了容易阻塞正常流程。"}],"r":["每个阶段会执行完该阶段队列里的回调，不是只执行一个。","","V8 只负责执行 JS，事件循环和 I/O 轮询由 libuv 完成。","有多个阶段队列，还有微任务队列，不是单一 FIFO。"]},{"id":67,"t":"HTTP 1.0 和 2.0 有什么区别？","c":"网络","o":["多路复用、头部压缩、二进制分帧、服务端推送","2.0 把底层的 TCP 换成了 UDP","2.0 取消了 TLS 加密","1.0 就已经支持多路复用"],"a":0,"w":"HTTP/2 的核心改进是多路复用（一条连接并行多个请求）、头部压缩（HPACK）、二进制分帧和服务端推送；把 TCP 换成 UDP 是 HTTP/3 的事。","b":[{"type":"p","text":"HTTP/2 最大的变化是引入了二进制分帧层，这直接改掉了 HTTP/1.1 的“一请求一响应”、串行传输的老毛病。以前每个请求都要单独建 TCP 连接，或者走管道化但容易阻塞，现在一个连接就能并发处理多个请求，效率提升非常明显。"},{"type":"p","text":"1）头部压缩。HTTP/1.1 每次都传完整头，重复的 Cookie、User-Agent 这些字段特别浪费。HTTP/2 用 HPACK 算法压缩头部，相同字段只传差量，能省下 30% 到 50% 的头部流量。"},{"type":"p","text":"2）多路复用。这是最核心的体验提升。HTTP/1.1 队头阻塞的问题在 HTTP/2 里被解决了，多个请求和响应可以同时在一个 TCP 连接上通过独立的数据帧交错传输，谁也不等谁。"},{"type":"p","text":"3）服务器推送。这个功能允许服务端提前把客户端可能需要的资源推过去，比如页面要加载 main.css，服务端可以直接推，不用等浏览器解析 HTML 再发请求。不过实际用得不多，很多场景反而会增加负担。"},{"type":"p","text":"4）优先级机制。客户端可以给不同资源设置优先级，比如 JS、CSS 比图片更重要，服务端就可以按序发送，优化页面渲染体验。"},{"type":"p","text":"虽然有这些优势，但 HTTP/2 对网络环境要求更高。丢包严重时，因为所有数据都在一个 TCP 流里，一旦出错整个连接都会卡住。这也是后来 HTTP/3 改用 QUIC 协议的原因之一。"}],"r":["","换 UDP 是 HTTP/3（QUIC）做的事。","HTTP/2 通常跑在 TLS 之上，并没有取消加密。","HTTP/1.0 默认短连接，多路复用是 2.0 才有的。"]},{"id":68,"t":"HTTP 2.0 和 3.0 有什么区别？","c":"网络","o":["3.0 仍基于 TCP，只是优化了头部压缩","3.0 取消了多路复用","3.0 必须配合 WebSocket 使用","基于 QUIC（UDP），解决 TCP 队头阻塞"],"a":3,"w":"HTTP/3 基于 QUIC（跑在 UDP 上），在用户态实现可靠传输，丢包只影响单个流，解决了 TCP 层的队头阻塞；同时支持 0-RTT 握手和连接迁移。","b":[{"type":"p","text":"HTTP/2 的核心是多路复用，它把多个请求塞进同一个 TCP 连接里，并发传输。每个请求拆成帧，通过流（Stream）来区分，这样就避免了 HTTP/1.1 的队头阻塞问题。但底层还是 TCP，万一丢包，整个连接都得等重传，影响所有流。"},{"type":"p","text":"HTTP/3 直接改了传输层，用 QUIC 协议替换了 TCP。QUIC 跑在 UDP 上，自己实现可靠传输和拥塞控制。最关键的是，它把连接绑定到客户端的连接 ID，而不是 IP + 端口。切换网络时，比如从 Wi-Fi 切 4G，连接不会断，直接续传。而且 QUIC 的多路复用是在传输层做的，丢一个流不影响其他流，彻底解决了队头阻塞。"},{"type":"p","text":"实际应用中，Google 早就用 QUIC 撑起大部分流量，Cloudflare、Fastly 这些 CDN 厂商也全面支持 HTTP/3。国内阿里云、腾讯云也在逐步铺开。"},{"type":"p","text":"代码层面你看不到太多变化，因为 HTTP/3 是浏览器和服务器自动协商的。但服务端配置要注意，比如 Nginx 需要编译 BoringSSL 或 quiche 支持，监听 UDP 443 端口。"},{"type":"p","text":"简单说，HTTP/2 解决了应用层的并发问题，HTTP/3 连协议切换、移动网络切换这些场景都扛住了，更适应现代网络环境。"}],"r":["HTTP/3 恰恰放弃了 TCP，改用基于 UDP 的 QUIC。","多路复用在 3.0 里保留得更好，丢包也不会阻塞其他流。","WebSocket 是另一套协议，和 HTTP/3 没有绑定关系。",""]},{"id":69,"t":"HTTP 和 HTTPS 有什么区别？","c":"网络","o":["HTTPS 只是把端口从 80 改成 443，协议本身没变","HTTPS 无法防止中间人攻击","HTTP 与 TCP 之间加了 TLS，默认 443 端口","HTTPS 全程只用对称加密，不需要证书"],"a":2,"w":"HTTPS 在 HTTP 与 TCP 之间加了 TLS：用非对称加密协商出对称密钥，再用对称加密传数据，证书解决“这个公钥是谁的”这个信任问题。","b":[{"type":"p","text":"HTTP 和 HTTPS 的本质区别在于安全性，HTTPS 不是新的协议，而是 HTTP 跑在 SSL/TLS 之上。"},{"type":"p","text":"1）通信内容加密"},{"type":"p","text":"HTTP 明文传输，中间人能直接看到请求和响应内容。HTTPS 在 TCP 握手后、HTTP 通信前，先通过 SSL/TLS 协议协商密钥，后续数据都用对称加密传输。比如浏览器访问支付宝，账号密码要是走 HTTP，网络里的路由器都能看见。"},{"type":"p","text":"2）身份认证"},{"type":"p","text":"HTTPS 需要证书来证明“你真的是你”。服务端把数字证书发给客户端，客户端通过 CA（比如 Let's Encrypt、DigiCert）验证证书合法性。没有这一步，钓鱼网站随便仿个淘宝页面就搞定了。"},{"type":"p","text":"3）防篡改"},{"type":"p","text":"TLS 会对数据做完整性校验，用 MAC（消息认证码）机制。哪怕中间有人改了一个字节，接收方解密时就会发现校验失败，直接断开。"},{"type":"p","text":"性能上，HTTPS 多了握手过程，首次建立连接要多花 1-2 个 RTT。但现代 TLS 1.3 已优化到 1-RTT 甚至 0-RTT，加上CDN 普遍支持，实际差距很小。主流站点像 Google、淘宝、微信支付全默认 HTTPS。"},{"type":"p","text":"代码层面，Java 里用 HttpsURLConnection 替代 HttpURLConnection ，关键是要信任的证书库。Netty 或Spring WebFlux 中配置 SSLContext 即可启用。"},{"type":"p","text":"现在没有理由再用纯 HTTP，搜索引擎也优先收录 HTTPS 站点。小项目可以用 Nginx + 免费证书快速上 HTTPS。"}],"r":["端口只是表象，真正的差别是多了一层 TLS。","TLS 的证书校验正是用来防中间人的。","","协商阶段用非对称加密，传输阶段用对称加密，缺一不可。"]},{"id":70,"t":"TCP 的粘包和拆包能说说吗？","c":"网络","o":["TCP 保证每次 send 都对应一次 recv，不存在粘包","只能通过关闭连接来解决","TCP 是字节流无边界，需要应用层拆包","粘包只发生在 UDP 中"],"a":2,"w":"TCP 是字节流，没有消息边界：发送方连续写多次，接收方可能一次读到；一次写入也可能被拆成多段。解决要靠应用层协议，比如长度前缀、分隔符或固定长度。","b":[{"type":"p","text":"TCP 本身没有“包”的概念，它传输的是字节流。所谓粘包和拆包，其实是应用层读取数据时，没按预期边界处理导致的。"},{"type":"p","text":"发送方连续发两条消息，接收方可能一次性收到两条（粘包），也可能一条被分成两次读到（拆包）。根本原因是 TCP不保证收发消息的次数对等，只保证字节顺序正确。"},{"type":"p","text":"常见场景比如用 Netty 做通信框架，如果没加 编解码器 处理消息边界，就会出问题。解决方案得在协议层面定好规则："},{"type":"p","text":"1）固定消息长度，不够补零"},{"type":"p","text":"2）用特殊分隔符，比如换行符或特殊字符"},{"type":"p","text":"3）头+体格式，头部存实际数据长度"},{"type":"p","text":"最常用的是第三种，像 Dubbo、RocketMQ 内部都用 LengthFieldBasedFrameDecoder 来解。"},{"type":"p","text":"举个例子，你发了两个 100 字节的消息，TCP 可能合并成一个 200 字节的包发过去，也可能因为 MTU 拆成 150 +50。接收端必须靠协议解析才能还原原始消息边界。"},{"type":"p","text":"不处理粘包拆包，服务间通信基本搞不定。尤其做 RPC 或网关，编解码这步压根不经过业务代码，全靠框架提前配好。"}],"r":["TCP 不保证 send 与 recv 一一对应，这正是粘包产生的原因。","关闭连接只能让数据断开，不能解决边界问题。","","UDP 是数据报，本身有边界，粘包是 TCP 特有的现象。"]},{"id":71,"t":"为什么 TCP 挥手需要有 TIME_WAIT 状态?","c":"网络","o":["保证最后 ACK 到达，让旧报文消散","这是服务端 bug 导致的异常状态","因为主动关闭方必须占用端口 2 小时不能复用","为了等待对方重传丢失的数据"],"a":0,"w":"TIME_WAIT 等 2MSL 有两个作用：一是保证最后一个 ACK 能到达对方（丢了还能重发），二是让本连接的残留报文在网络中消散，不影响复用同一四元组的新连接。","b":[{"type":"p","text":"TCP 四次挥手中，主动关闭连接的一方会进入 TIME_WAIT 状态，这个状态的存在不是设计缺陷，而是为了解决两个关键问题。"},{"type":"p","text":"1）确保最后一个 ACK 能被对方收到。如果这个 ACK 丢了，被动关闭方会重传 FIN，此时如果主动方已经彻底关闭，就无法响应，导致对方不能正常释放连接。留一个 TIME_WAIT 时间（一般是 2MSL），就是为了能重发这个 ACK。"},{"type":"p","text":"2）防止旧连接的残留数据包干扰新连接。TCP 协议用四元组（源IP、源端口、目的IP、目的端口）标识一个连接。如果连接快速复用端口，网络中延迟的老数据包可能会被误认为是新连接的数据。等待 2MSL 能让所有老数据在网络中自然消失。"},{"type":"p","text":"MSL 是报文最大生存时间，一般取 30 秒到 2 分钟不等，所以 TIME_WAIT 状态最长可能持续 4 分钟。虽然它保障了可靠性，但在高并发短连接场景下，比如 Web 服务器大量请求，容易出现端口耗尽的问题。这时候可以通过开启"},{"type":"p","text":"SO_REUSEADDR 选项，允许处于 TIME_WAIT 的 socket 被复用，缓解这个问题。"},{"type":"p","text":"对于客户端来说，频繁建立短连接要特别注意 TIME_WAIT 的累积；服务端通常不会成为主动关闭方，受影响较小。Nginx、Tomcat 这类服务在调优时都会关注这个状态的数量。"}],"r":["","TIME_WAIT 是协议设计的正常状态，不是 bug。","2MSL 通常只有几十秒，而且目的不是“占着端口”，是等报文消散。","等重传靠的是发送方的重传定时器，不是 TIME_WAIT 的职责。"]},{"id":72,"t":"TCP 滑动窗口的作用是什么？","c":"网络","o":["用于选择数据包的路由路径","限制发送方每次只能发一个报文","用于对传输的数据加密","窗口内可连续发送，提高吞吐并做流控"],"a":3,"w":"滑动窗口让发送方在窗口范围内连续发送多个报文，不必发一个等一个 ACK，从而提高吞吐；窗口大小由接收方通告，也就顺带实现了流量控制。","b":[{"type":"p","text":"滑动窗口的核心是解决可靠传输下的效率问题。TCP 要保证不丢包、不乱序，但如果每发一个包就等 ACK 再发下一个，延迟会把吞吐压垮。滑动窗口就是让发送方不用等确认，可以连续把多个数据包扔出去，相当于“批量发货”。"},{"type":"p","text":"接收方有个缓冲区，能存还没被应用读走的数据。这个缓冲区大小就是接收窗口（rwnd），它告诉发送方自己还能收多少。发送方根据这个值维护自己的发送窗口，已发未确认的包不能删，但可以继续发新包，直到窗口填满。"},{"type":"p","text":"1）窗口左边界是最早发出去还没确认的包"},{"type":"p","text":"2）右边界是还能发的最大序号"},{"type":"p","text":"3）收到 ACK 后左边界右移，窗口“滑动”"},{"type":"p","text":"如果接收方处理慢，缓冲区满了，就会把窗口设为 0，发送方暂停。等应用读走数据空出空间，接收方再发个“窗口更新”报文恢复传输。"},{"type":"p","text":"网络拥塞时，光看接收方窗口不够，还得考虑链路承载能力。所以有拥塞窗口（cwnd），和 rwnd 取小值作为实际可用窗口。慢启动、拥塞避免这些机制就是在动态调整 cwnd。"}],"r":["路由选择是网络层的事。","恰恰相反，滑动窗口就是为了突破“发一个等一个”的限制。","加密由 TLS 等上层协议负责。",""]},{"id":73,"t":"OSI 七层模型是什么？","c":"网络","o":["应用层、表示层、传输层、网络层、物理层","应用层、传输层、网络层、网络接口层","物理层、网络层、传输层、应用层","物理、数据链路、网络、传输、会话、表示、应用"],"a":3,"w":"OSI 七层自下而上是：物理、数据链路、网络、传输、会话、表示、应用。TCP/IP 四层则是把上三层合并成应用层、下两层合并成网络接口层。","b":[{"type":"p","text":"OSI 七层模型是网络通信的参考框架，把数据从一台设备传到另一台的过程拆成了七个层次，每一层各司其职，下层为上层服务。"},{"type":"p","text":"1）物理层负责最底层的信号传输，比如网线、光纤这些介质上传输的高低电平，就是0和1的物理表示。"},{"type":"p","text":"2）数据链路层管的是相邻设备之间的数据帧传输，像以太网（Ethernet）就在这层，交换机也是工作在这里，通过MAC地址寻址。"},{"type":"p","text":"3）网络层负责跨网络的路径选择，IP协议就在这一层，路由器根据IP地址转发数据包。"},{"type":"p","text":"4）传输层保证端到端的数据可靠或高效传输，TCP和UDP是典型代表。TCP提供连接管理、重传、流量控制，而UDP不搞这些，直接发。"},{"type":"p","text":"5）会话层控制会话的建立、管理和终止，比如RPC调用或者数据库连接的会话保持。"},{"type":"p","text":"6）表示层处理数据格式转换，比如加密解密、压缩解压、字符编码转换，让不同系统的数据能互相理解。"},{"type":"p","text":"7）应用层直接面向用户程序，HTTP、FTP、DNS这些协议都在这层，你写的Web服务基本都跑在这一层之上。"},{"type":"p","text":"实际互联网大多用的是TCP/IP四层模型，把前四层合并成“网络接口层”，会话层和表示层也常被并入应用层，但OSI模型在教学和标准化中还是很有指导意义。"}],"r":["少了会话层和表示层，顺序也不完整。","这是 TCP/IP 四层模型，不是 OSI。","这是四层，不是七层。",""]},{"id":74,"t":"Cookie、Session、Token 之间有什么区别？","c":"网络","o":["三者都存储在服务端，客户端只保存一个 id","Session 存储在浏览器的 localStorage 中","Token 必须配合 Session 才能完成鉴权","Cookie 在客户端，Session 在服务端，Token 自包含"],"a":3,"w":"Cookie 是客户端的存储载体，Session 是服务端保存的状态（用 sessionId 关联），Token 是把用户信息签名后交给客户端自包含保存的凭证。","b":[{"type":"p","text":"这三个东西说白了都是为了解决 HTTP 无状态的问题，但思路完全不同。"},{"type":"p","text":"Cookie 是浏览器端的一小块文本，服务器通过 Set-Cookie 响应头下发，浏览器自动带上 Cookie 请求头回传。它就存在客户端，能被 JS 读写（除非 HttpOnly），所以有 XSS 风险。一般用来存 session id 或用户偏好。"},{"type":"p","text":"Session 是服务器端的存储机制。用户登录后，服务端生成一个 session 对象，用唯一 sessionId 当 key 存在内存或Redis 里。sessionId 通常通过 Cookie 传给浏览器。下次请求带着这个 id，服务端就能查到状态。它的状态是集中管理的，登出可以直接销毁，但扩容麻烦，得搞 session 共享。"},{"type":"p","text":"Token，尤其是 JWT，是无状态的方案。用户登录成功，服务器签发一个 Token，里面包含了用户信息和签名。客户端自己存，每次请求放 Header 里。服务器不存任何状态，每次靠验签解析数据。扩展性好，适合分布式，但 Token一旦签发没法主动作废，除非加黑名单或者控制有效期很短。"},{"type":"p","text":"1）Cookie 存在客户端，可以持久化 2）Session 存在服务端，依赖 Cookie 传 id 3）Token 完全自包含，服务端无状态"},{"type":"p","text":"JWT 长这样：header.payload.signature ，用点分割三段 Base64"},{"type":"p","text":"要不要共享 Session，决定了你选哪种。单体系统用 Session 最省事，微服务基本都上 Token。"}],"r":["Session 在服务端，Cookie 和 Token 在客户端。","Session 数据在服务端，浏览器只保存 sessionId（通常放在 Cookie 里）。","JWT 这类 Token 本身就是自包含凭证，不需要服务端 Session。",""]},{"id":75,"t":"什么是代理模式？一般用在什么场景？","c":"设计模式","o":["让一个类的实例在运行期改变自己的类","定义一系列算法并使其可以互相替换","为其他对象提供代理以控制访问","保证一个类只有一个实例"],"a":2,"w":"代理模式给目标对象加一层“门卫”：调用方访问代理，代理决定是否转发、何时创建、要不要缓存。懒加载、权限校验、请求缓存都是它的应用。","b":[{"type":"p","text":"代理模式本质是为对象提供一个代理，用来控制对原对象的访问。你调用的是代理类，它帮你把请求转发给目标对象，中间可以加逻辑。"},{"type":"p","text":"1）最常见的就是 Spring 的 AOP，比如你加个 @Transactional 注解，Spring 就会通过代理在方法前后开启和提交事务。实际调用的不是你的原始 bean，而是生成的代理对象。"},{"type":"p","text":"2）远程调用也能用代理，像 Dubbo 里的接口注入，看着是本地调用，其实是代理帮你做了网络通信、序列化这些脏活累活。"},{"type":"p","text":"3）还有懒加载，比如 Hibernate 关联对象没查出来前是个代理，真正 get 时才去数据库捞数据，避免一次性加载太多。"},{"type":"p","text":"代码上分静态代理和动态代理。静态代理手写一个类实现相同接口，动态代理可以用 JDK 原生的 Proxy +"},{"type":"p","text":"InvocationHandler ，或者 CGLIB 字节码增强。"},{"type":"p","text":"注意别滥用。如果只是简单转发没意义，反而增加复杂度。重点是“在不修改目标的前提下增强行为”，这是它的价值所在。像日志记录、性能监控、限流降级，都是典型场景。"}],"r":["运行期改变自身行为是状态模式。","算法可互换是策略模式。","","唯一实例是单例模式。"]},{"id":76,"t":"谈谈你了解的最常见的几种设计模式，说说他们的应用场景","c":"设计模式","o":["只有单例和工厂两种","设计模式只适用于 Java，前端用不到","观察者模式主要用于创建对象","单例、工厂、观察者、策略、代理、装饰器"],"a":3,"w":"前端高频的设计模式：单例（全局 store）、工厂（创建组件/实例）、观察者（事件订阅）、策略（表单校验规则）、代理（ES6 Proxy、图片懒加载）、装饰器（HOC）。","b":[{"type":"p","text":"工厂模式解决对象创建的复杂性问题。当系统需要根据条件生成不同类型的对象时，比如解析不同格式文件（XML、JSON），用工厂就能把创建逻辑集中管理，调用方不用关心具体类名。"},{"type":"p","text":"1）简单工厂：写一个静态方法，传个参数返回对应实例，适合产品种类少的情况"},{"type":"p","text":"2）工厂方法：每个子类对应一个工厂类，符合开闭原则，新增类型不影响原有代码"},{"type":"p","text":"3）抽象工厂：生产一整套相关的产品族，比如 MySQL 和 Oracle 的 DAO 实现分别由不同的工厂批量产出"},{"type":"p","text":"单例模式保证一个类只有一个实例。常见的做法是私有构造器 + 静态变量 + 公共静态访问方法。注意线程安全问题，推荐使用枚举实现，既防反射攻击又能防止序列化破坏单例。"},{"type":"code","text":"public enum Singleton {\n    INSTANCE;\n    public void doSomething() { /*...*/ }\n}"},{"type":"p","text":"观察者模式定义了一对多的依赖关系，主题变化时通知所有观察者自动更新。典型场景是事件驱动系统，比如 Spring的 ApplicationEvent 机制，监听 ContextRefreshedEvent 做初始化动作。"},{"type":"p","text":"代理模式在不改变原始类接口的前提下增强功能。静态代理手动写，动态代理可以用 JDK 原生（基于接口）或 CGLIB（基于继承）。Spring AOP 默认用 JDK 动态代理，除非目标类没有接口才退化到 CGLIB。"},{"type":"p","text":"模板方法模式把算法骨架固定在父类，把可变步骤延迟到子类实现。像 Java 中的 AbstractExecutorService.submit()就是模板，真正执行交给具体线程池策略。"},{"type":"p","text":"这几个模式在框架里到处都是，MyBatis 用工厂造 SqlSession，Spring 大量使用代理和观察者，理解它们等于看懂了框架的筋骨。"}],"r":["常见模式远不止这两种，前端里观察者、策略用得更多。","设计模式与语言无关，前端同样大量使用。","观察者解决的是状态变化的通知，不是对象创建。",""]},{"id":77,"t":"什么是 HTML 语义化？","c":"HTML","o":["在标签上写满注释说明用途","用 table 来布局整个页面","把所有元素都换成 div，减少样式冲突","用恰当标签表达结构，利于 SEO 和无障碍"],"a":3,"w":"语义化是用恰当的标签表达内容结构：header/nav/main/article/footer 各司其职。好处是 SEO 更友好、读屏软件能理解、代码也更好维护。","b":[{"type":"p","text":"HTML 语义化指的是使用具有明确含义的标签来构建页面结构，而不是用一堆 div 堆出来。每个标签都代表特定内容类型，比如 article 表示独立文章，nav 用于导航区块，footer 放页脚信息。"},{"type":"p","text":"浏览器和辅助设备能更好理解页面结构，搜索引擎也能更准确抓取内容。像屏幕阅读器靠这些标签帮助视障用户快速定位，如果全用 div，那整个页面就跟天书一样。"},{"type":"p","text":"对开发者来说，代码可读性也强得多。看到 main 就知道是主体内容，看到 aside 就明白是侧边栏，维护起来省心不少。"},{"type":"p","text":"常见的语义化标签有 header 、section 、article 、figure 、figcaption 、time 等。比如写一篇博客，用 article 包裹标题和内容，里面再用 header 放标题，footer 标发布时间，结构清晰。"},{"type":"p","text":"1）避免滥用 div 和 span 2）根据内容意图选标签，不只看默认样式 3）配合 ARIA 属性增强复杂组件的语义表达"}],"r":["注释不会让机器理解结构，语义化靠的是标签本身。","table 只该用来展示表格数据，拿它布局是倒退。","div 汤能实现视觉效果，但丢失了结构语义。",""]},{"id":78,"t":"Canvas 和 SVG 有什么区别？","c":"浏览器","o":["Canvas 是矢量图，SVG 是位图","Canvas 是位图，SVG 是矢量 DOM，可缩放","SVG 不能绑定事件，Canvas 可以","Canvas 缩放后不会模糊"],"a":1,"w":"Canvas 是位图，靠 JS 逐帧绘制，适合大量图形和游戏，但放大会模糊；SVG 是矢量 DOM，每个图形都是节点，可被 CSS/JS 操作，缩放不失真。","b":[{"type":"p","text":"Canvas 和 SVG 都是前端绘图技术，但设计思路完全不同。"},{"type":"p","text":"Canvas 是基于位图的即时模式渲染。你拿到一个画布，用 JavaScript 一个像素一个像素去画，画完就不管了。浏览器不记录你画了什么，改个颜色得重绘整片区域。适合高频率绘制的场景，比如游戏、实时视频处理、数据可视化大屏，像 ECharts 在大量数据点时就会切到 Canvas 模式。"},{"type":"p","text":"SVG 是基于矢量的保留模式渲染。它本质是 DOM 结构，每个图形都是一个 XML 元素，比如 <circle> 、"},{"type":"p","text":"<rect> 。你可以给它们绑定事件、做 CSS 动画，浏览器会记住每个对象的状态。缩放不失真，特别适合图标、流程图、交互式图表这类需要精细操作的场景。"},{"type":"p","text":"性能上，Canvas 在画几千个元素时依然流畅，而 SVG 的 DOM 节点多了之后，内存和重排开销会明显上升。反过来，SVG 对小规模、高交互的内容更轻量，不需要手动管理重绘逻辑。"},{"type":"p","text":"1）Canvas 控制的是像素，适合密集绘制"},{"type":"p","text":"2）SVG 控制的是对象，适合结构化图形"},{"type":"p","text":"3）Canvas 无法通过 DOM 获取图形，SVG 可以"},{"type":"p","text":"选哪个，关键看是不是要“记住”图形本身。要记，上 SVG；要快，上 Canvas。"}],"r":["说反了：Canvas 是位图，SVG 是矢量。","","SVG 的每个图形都是 DOM 节点，可以直接绑定事件；Canvas 只能靠坐标判断。","Canvas 放大后会模糊，这是位图的固有限制。"]},{"id":79,"t":"如何计算 CSS 的优先级？","c":"CSS","o":["行内 > ID > 类 > 标签，同权重后定义优先","标签 > 类 > ID > 行内","继承来的样式优先级高于直接选中","后定义的样式永远优先，与选择器权重无关"],"a":0,"w":"权重按（行内、ID、类/属性/伪类、标签/伪元素）四元组比较，同权重时后定义的覆盖先定义的；!important 优先级最高。继承来的样式优先级最低。","b":[{"type":"p","text":"CSS 优先级决定样式冲突时哪个规则生效，它不是简单的“后覆盖前”，而是一套权重计算机制。"},{"type":"p","text":"浏览器给选择器的每一部分打分，最终按总分定胜负。这套评分体系由四个层级构成，可以想象成四位数的千、百、十、个位："},{"type":"p","text":"1）内联样式（如 style=\"...\"）算 1000 分"},{"type":"p","text":"2）一个 ID 选择器算 100 分"},{"type":"p","text":"3）一个类、伪类或属性选择器算 10 分"},{"type":"p","text":"4）一个元素或伪元素算 1 分"},{"type":"p","text":"比如 #header .nav:hover 就是 100 + 10 + 10 = 120 分，而 div#sidebar ul li.active 是 100 + 1 + 1 + 10= 112 分，前者胜出。"},{"type":"p","text":"!important 声明直接无视所有规则，谁加了它谁赢，但别滥用，维护起来会很痛苦。"},{"type":"p","text":"继承的样式没有优先级分数，天生最弱。遇到相同优先级时，才看源码顺序，后面的覆盖前面的。"},{"type":"p","text":"实际开发中，别靠堆选择器提高权重，容易失控。用 BEM 这类命名规范，让结构清晰，权重自然就不会飙高。"}],"r":["","顺序完全反了。","继承的样式优先级最低，打不过任何直接选中的规则。","只有权重相同时才比先后，权重不同时后定义也没用。"]},{"id":80,"t":"CSS 中可继承与不可继承属性有哪些？","c":"CSS","o":["color 不可继承，margin 和 padding 可以继承","只有文本相关属性不可继承，其余都能继承","所有 CSS 属性都可以继承，只是优先级不同","font、color 继承，margin、border 不继承"],"a":3,"w":"文字类属性一般会继承（font、color、line-height、text-align），盒模型和布局类不继承（margin、padding、border、background、宽高）。需要时可以用 inherit 强制继承。","b":[{"type":"p","text":"大部分 CSS 属性默认不会继承，只有少数特定属性会从父元素传给子元素。能不能继承，得看属性本身的特性，不是所有样式都能“一脉相承”。"},{"type":"p","text":"1）可继承的属性通常跟文本内容呈现有关。比如 color 、font-size 、font-family 、line-height 、"},{"type":"p","text":"text-align 、visibility 这些，子元素不设置时就用父元素的值。像 inherit 关键字也能强制让某个属性继承。"},{"type":"p","text":"2）不可继承的属性基本是布局和盒模型相关的。比如 display 、width 、height 、padding 、margin 、"},{"type":"p","text":"border 、position 、top/left 这些，子元素压根不认父元素的这些设置，必须自己定义。"},{"type":"p","text":"3）有些属性看着像能继承，其实不能。比如 background-color 不会传给子元素，哪怕文字颜色继承了，背景也不会跟着来。这点在调试样式时容易搞混。"},{"type":"p","text":"4）CSS 的 all 属性可以一键控制所有属性的继承行为，配合 inherit 、initial 、unset 能快速重置或继承整套样式。"},{"type":"p","text":"实际开发中，像 text-align 给 body 一设，全局文本就居中了，这就是利用了可继承性。而布局属性每个组件都得自己写，不然页面早就乱套了。"}],"r":["color 恰恰可继承、margin/padding 恰恰不可继承，说反了。","不可继承的主要是盒模型和布局属性，不只是文本类。","并非所有属性都继承，盒模型属性就不继承。",""]},{"id":81,"t":"CSS 中 display 属性的值及其作用","c":"CSS","o":["display 只影响子元素，不影响元素自身","block、inline、flex、grid、none 等","display: none 的元素仍然占据原有的空间","display 只能取 block 和 none 两个值"],"a":1,"w":"display 决定元素的显示类型：block 独占一行、inline 不独占、inline-block 兼具两者、flex/grid 是布局容器、none 直接从渲染树移除（不占位）。","b":[{"type":"p","text":"display 属性决定元素的布局方式，直接改变它会切换元素的显示形态，比如把行内元素变成块级，或者开启弹性布局。"},{"type":"p","text":"1）block 像 div、p 这种默认就是块级元素，独占一行，可以设置宽高。span 默认是行内，加了 display: block 也能变成块。"},{"type":"p","text":"2）inline 如 span、a，不换行，宽高由内容撑开，没法直接设 width/height。换成 inline-block 就能设尺寸，同时保持在一行，像按钮组常用这个。"},{"type":"p","text":"3）flex 是现代布局的核心，父容器设 display: flex，子元素自动横向排列，支持对齐、分布、伸缩。几乎所有前端项目都会用到，比如 Ant Design 的布局组件底层就靠它。"},{"type":"p","text":"4）grid 适合二维布局，能同时控制行和列，比 float 或定位灵活多了。复杂仪表盘、后台管理页用 grid 更容易对齐。"},{"type":"p","text":"5）none 最狠，元素直接从文档流消失，不占空间，visibility: hidden 还占位，它彻底隐藏。经常配合 JS 切换显隐。"},{"type":"p","text":"6）其他像 table 相关的值，现在用得少，但处理表格样式时还能派上用场。"},{"type":"p","text":"别乱用 block 和 inline 转换，语义化优先。flex 和 grid 解决大部分布局问题，优先掌握。"}],"r":["display 描述的就是元素自身的显示方式。","","display:none 的元素不生成盒子，完全不占空间。","取值远不止两个，flex、grid、inline-block 都是常用的。"]},{"id":82,"t":"说说你对 CSS Sprites 的理解","c":"CSS","o":["把图片转成 base64 内联进 CSS 文件里，减少请求数","用 CSS 实现图片懒加载的一种技术方案，减少首屏请求","一种矢量图标的实现方案，任意缩放都不会失真","多图合成一张，用 background-position 定位"],"a":3,"w":"CSS Sprites 把多张小图拼成一张大图，用 background-position 定位取用，目的是减少 HTTP 请求数。缺点是维护麻烦、难以按需加载，HTTP/2 普及后收益变小。","b":[{"type":"p","text":"CSS Sprites 是前端优化里一个很实用的技术，主要用来减少页面加载时的 HTTP 请求数量。早期网页中图标、按钮这些小图特别多，每个都单独请求，开销很大。CSS Sprites 的做法是把多个小图合并成一张大图，然后通过 CSS 的"},{"type":"p","text":"background-position 来控制显示哪一部分。"},{"type":"p","text":"1）原理上就是“切图定位”。比如你有 5 个图标，原本要发 5 次请求，现在合成一张图，只用一次请求全搞定。页面加载更快，服务器压力也小了。"},{"type":"p","text":"2）使用场景集中在静态资源优化，尤其是图标密集型页面。像淘宝、京东的老版后台系统就大量用了这个技术，导航栏、操作按钮全都打包装在一张 sprite 图里。"},{"type":"p","text":"3）写法上核心是 background 和 position 配合："},{"type":"code","text":".icon-home {\n  width: 20px;\n  height: 20px;\n  background: url(sprites.png) no-repeat -20px -40px;\n}"},{"type":"p","text":"这表示从大图 sprites.png 的 x=-20px, y=-40px 处取一块 20x20 的区域显示。"},{"type":"p","text":"现在虽然 HTTP/2 和雪碧图工具链成熟了，但它的思想还在延续。Webpack 这类构建工具会自动帮你生成 sprite 图，开发者不用手动拼。不过对于现代应用，更多用 icon font 或 SVG Symbol 替代，维护更方便。"},{"type":"p","text":"要不要用得看项目阶段。老项目做性能优化，加个 sprite 能明显降请求数；新项目直接上 SVG 更灵活。"}],"r":["base64 内联是另一种减请求手段，不是雪碧图。","懒加载是加载时机优化，与雪碧图无关。","矢量图标对应的是 iconfont 或 SVG symbol。",""]},{"id":83,"t":"CSS 优化和提高性能的方法有哪些？","c":"性能优化","o":["把所有样式都写成行内样式以减少请求","尽量使用通配符选择器来简化代码","降低选择器层级、避免昂贵属性动画","大量使用 !important 来提升优先级"],"a":2,"w":"CSS 性能主要花在样式计算和渲染上：减少选择器层级、避免对 width/height/top 等属性做动画、合并压缩文件、按需加载非关键 CSS。","b":[{"type":"p","text":"减少 CSS 文件体积和提升渲染效率，关键是从加载、解析、应用三个环节入手。现代浏览器渲染页面时，CSS 是阻塞渲染的资源，文件过大或规则过重都会拖慢首屏速度。"},{"type":"p","text":"1）优先使用轻量化的选择器。避免嵌套过深的 div ul li a 这类选择器，浏览器从右往左匹配，层级越深性能越差。用 BEM 命名规范的类名，比如 .menu__item--active ，既能保证唯一性又快。"},{"type":"p","text":"2）删除无用 CSS 代码。项目迭代中很多样式不再使用，可以用 Puppeteer 或 Playwright 配合 Chrome DevTools 的coverage 工具扫描，结合 PurgeCSS 在构建时清除冗余规则。一个真实项目曾因此从 300KB 干掉到 80KB。"},{"type":"p","text":"3）关键 CSS 内联，非关键部分异步加载。把首屏必须的样式直接塞进 <style> 标签，其余用 rel=\"preload\"异步加载，避免阻塞页面渲染。Next.js 默认就做了这层优化。"},{"type":"p","text":"4）少用昂贵属性。box-shadow 、border-radius 、filter 这些会触发图层提升和合成，过度使用导致内存占用上升。动画场景更推荐用 transform 和 opacity ，这两个属性由合成线程处理，不压主线程。"},{"type":"p","text":"5）利用 CSS 自定义属性（变量）做动态切换，但别在大量元素上频繁修改变量，会引起全量重排。如果主题切换涉及成千上万节点，反而不如预生成两套 class 来得干脆。"}],"r":["行内样式无法缓存，还会让样式散落各处，反而更难维护。","通配符会让浏览器对每个元素都做匹配，是典型的性能陷阱。","","!important 会让权重计算更复杂，属于代码坏味道，不是优化手段。"]},{"id":84,"t":"如何检测 CSS 动画的 FPS 值？","c":"性能优化","o":["只能靠肉眼观察是否卡顿","读取 CSS 的 animation-fps 属性","用 console.time 记录一次动画的总耗时","DevTools 的 Performance 面板或 rAF 统计"],"a":3,"w":"测 FPS 有两个常用办法：DevTools 的 Performance/Rendering 面板看帧率和掉帧；或用 requestAnimationFrame 统计每秒回调次数，低于 60 就说明有掉帧。","b":[{"type":"p","text":"这个问题其实问的是怎么观测前端动画的流畅度，尤其是 CSS 动画在运行时的真实表现。FPS（每秒帧数）是衡量流畅性的关键指标，理想是 60 FPS，对应每帧约 16.7ms。"},{"type":"p","text":"浏览器本身不直接暴露“当前 CSS 动画的 FPS”这样的 API，但你可以通过 requestAnimationFrame 来间接测量。它的触发频率就是页面渲染的帧率，无论这个渲染是由 CSS 动画、JS 动画还是滚动触发的。"},{"type":"p","text":"基本思路是：在一段时间内统计 rAF 的调用次数。比如记录 1 秒内执行了多少次，就是当前的 FPS。"},{"type":"code","text":"let frameCount = 0;\nlet lastTime = performance.now();\nfunction measureFPS() {\n  const now = performance.now();\n  frameCount++;\n  if (now - lastTime >= 1000) {\n    console.log('FPS:', frameCount);\n    frameCount = 0;\n    lastTime = now;\n  }\n  requestAnimationFrame(measureFPS);\n}\nrequestAnimationFrame(measureFPS);"},{"type":"p","text":"这段代码会持续输出近 1 秒内的平均 FPS。注意它测的是整个页面的渲染帧率，不是某个单独的 CSS 动画。如果你页面有多个动画或滚动，都会影响结果。"},{"type":"p","text":"更精细的做法可以用 performance.mark 和 Chrome DevTools 的 Performance 面板，录制一段操作，直接看帧率曲线和具体哪一帧卡了。这是实际调试中更靠谱的方式。"},{"type":"p","text":"另外像 Lighthouse 或使用 Paint Timing API 可以辅助分析长期性能趋势，但实时检测还得靠 rAF 打点。"}],"r":["肉眼只能定性判断卡不卡，拿不到具体数值。","CSS 里没有 animation-fps 这个属性。","console.time 测的是一段代码的总耗时，不是帧率。",""]},{"id":85,"t":"TypeScript 有哪些常用类型？","c":"TypeScript","o":["TypeScript 中没有 any 这种类型","interface 属于基础数据类型，可以直接赋值","boolean、string、number、never 等","只有 string、number、boolean 三种基础类型"],"a":2,"w":"TS 常用类型包括 boolean、number、string、数组、元组、enum、any、unknown、void、never、object 等；unknown 是 any 的安全版本，使用前必须先收窄类型。","b":[{"type":"p","text":"TypeScript 的类型系统是它最大的价值所在，不是为了写类型而写，而是让代码更安全、IDE 更智能。"},{"type":"p","text":"基础类型像 string 、number 、boolean 这些和 JavaScript 一样，但必须声明。比如："},{"type":"code","text":"let name: string = \"zhangsan\";\nlet age: number = 25;"},{"type":"p","text":"联合类型很常用，表示一个值可以是多种类型之一。比如函数参数可能是字符串或数字："},{"type":"code","text":"function printId(id: string | number) {\n  console.log(id.toString());\n}"},{"type":"p","text":"字面量类型配合联合类型能约束取值范围。比如只能是特定字符串："},{"type":"code","text":"type Direction = \"left\" | \"right\" | \"up\" | \"down\";"},{"type":"p","text":"const dir: Direction = \"left\"; // 只能是这四个之一"},{"type":"p","text":"对象用 interface 或 type 定义结构。一般推荐 interface ，因为支持声明合并："},{"type":"code","text":"interface User {\n  id: number;\n  name: string;"},{"type":"p","text":"age?: number; // 可选"},{"type":"code","text":"}"},{"type":"p","text":"数组有两种写法：number[] 或 Array<number> ，前者更常见。"},{"type":"p","text":"函数类型要定义参数和返回值："},{"type":"code","text":"function greet(name: string): string {\n  return \"Hello \" + name;\n}"},{"type":"p","text":"any 是个双刃剑，任何类型都能赋值给它，但它会关闭类型检查。项目里尽量避免，可以用 unknown 替代，它需要做类型断言才能使用。"},{"type":"p","text":"元组 tuple 适合固定长度和类型的数组："},{"type":"code","text":"let rgb: [number, number, number] = [255, 0, 0];"},{"type":"p","text":"枚举 enum 在需要命名常量时挺方便："},{"type":"code","text":"enum Color { Red, Green, Blue }"},{"type":"p","text":"实际项目中，结合泛型和工具类型（如 Partial<T> 、Pick<T, K> ）能让类型复用性更高。"}],"r":["TS 有 any，只是不推荐滥用。","interface 是类型声明方式，不是基础数据类型。","","除了 string/number/boolean，还有数组、元组、枚举、never 等。"]},{"id":86,"t":"什么是 TypeScript 的对象类型？怎么定义对象类型？","c":"TypeScript","o":["对象类型必须用 any 声明，否则无法编译","TypeScript 根本不支持描述对象类型","只能用 class 来定义对象类型，其他方式无效","用 interface 或 type 描述属性与可选性"],"a":3,"w":"对象类型用 interface 或 type 描述：属性名、类型、可选性（?）、只读（readonly）都能声明。interface 适合可扩展的契约，type 还能定义联合、交叉、映射类型。","b":[{"type":"p","text":"TypeScript 的对象类型用来描述一个对象的结构，包括它有哪些属性、方法，以及它们的类型。定义对象类型主要靠两种方式：接口（interface）和类型别名（type）。"},{"type":"p","text":"1）用 interface 定义对象类型"},{"type":"p","text":"适合描述实例结构，支持继承扩展，是面向对象风格的首选。"},{"type":"code","text":"interface User {\n  id: number;\n  name: string;"},{"type":"p","text":"isActive?: boolean; // 可选属性"},{"type":"code","text":"}"},{"type":"p","text":"2）用 type 定义对象类型"},{"type":"p","text":"更灵活，能配合联合、交叉等类型操作，适合复杂组合场景。"},{"type":"code","text":"type Point = {\n  x: number;\n  y: number;\n};"},{"type":"p","text":"两者在大多数场景下表现一致，但 interface 能被自动合并（声明合并），适合库开发；type 一旦定义就不能再修改，更适合封装内部逻辑。"},{"type":"p","text":"方法和索引签名也可以直接写进去："},{"type":"code","text":"interface Dictionary {\n  [key: string]: string;\n  getName(): string;\n}"},{"type":"p","text":"一般来说，团队项目优先用 interface ，需要做类型编程时再上 type 。多数情况下你压根不需要纠结，用"},{"type":"p","text":"interface 就够了，干净又直观。"}],"r":["any 会放弃类型检查，恰恰是应该避免的写法。","TS 的核心能力就是描述对象结构。","class 只是其中一种方式，interface 和 type 更常用于描述数据结构。",""]},{"id":87,"t":"ES6 箭头函数和普通函数有什么区别？","c":"JavaScript","o":["两者除了写法不同，行为完全一致","箭头函数有 prototype，可以被继承","没有自己的 this，不能 new，也没有 prototype","箭头函数有自己的 this，并且可以 new"],"a":2,"w":"箭头函数没有自己的 this、arguments 和 prototype，也不能 new；它的 this 在定义时就绑定到外层作用域，所以特别适合做回调。","b":[{"type":"p","text":"箭头函数和普通函数最明显的区别在 this 的绑定方式。普通函数的 this 是动态绑定的，运行时根据调用方式决定，比如作为对象方法调用时指向该对象，直接调用时在非严格模式下指向全局对象。而箭头函数没有自己的"},{"type":"p","text":"this ，它会捕获定义时所在上下文的 this 值，相当于把这个值“继承”了下来。"},{"type":"p","text":"由于没有自己的 this ，箭头函数也压根不经过 new.target 、arguments 、super 这些机制。比如在箭头函数里访问 arguments ，其实拿到的是外层函数的 arguments ，如果外层也是箭头函数，那就往上找，直到有为止。所以写递归或者需要 arguments 的场景，基本不能用箭头函数。"},{"type":"p","text":"构造调用也行不通。你没法用 new 调用箭头函数，引擎直接抛错。所以它不适合用来做工厂函数或者需要实例化的场景。"},{"type":"p","text":"语法上箭头函数更简洁，单表达式不用写 return ，适合写在数组方法里，比如 map 或 filter 中作为回调。"},{"type":"p","text":"1）普通函数可以作为构造器，箭头函数不行"},{"type":"p","text":"2）箭头函数不绑定 this 、arguments"},{"type":"p","text":"3）箭头函数不能用作生成器函数，yield 在其中受限"}],"r":["两者在 this、arguments、能否 new 上差别很大。","箭头函数没有 prototype，这也是它不能 new 的原因。","","箭头函数的 this 来自外层，而且不能 new。"]},{"id":88,"t":"ES6 箭头函数能当构造函数吗？","c":"JavaScript","o":["可以，只是 this 的指向与普通函数不同而已","可以，但必须用 call 或 apply 手动指定 this","可以，先 bind 一次拿到新函数就能 new","不能，没有 prototype 和 [[Construct]]"],"a":3,"w":"new 的过程需要 prototype 来设置实例的原型链，还需要内部的 [[Construct]] 方法。箭头函数两者都没有，所以用 new 调用会直接抛 TypeError。","b":[{"type":"p","text":"箭头函数不能当构造函数用，调用 new 会直接抛错。"},{"type":"p","text":"原因在于它的设计机制。普通函数有 [[Construct]] 内部方法，执行 new 时会创建实例、绑定 this 、调用函数体。箭头函数压根没有这个方法，也没有自己的 this，它捕获的是词法作用域中的 this 值。当你试图用 new调用时，引擎发现缺少构造能力，直接 throw TypeError。"},{"type":"p","text":"实际场景里，比如你用类风格写组件，constructor 必须是传统函数："},{"type":"code","text":"const Fn = () => {};\nnew Fn(); // TypeError: Fn is not a constructor"},{"type":"p","text":"换成 function 就行得通："},{"type":"code","text":"function Person(name) {\n  this.name = name;\n}"},{"type":"p","text":"new Person('Tom'); // 正常创建实例"},{"type":"p","text":"1）想做构造行为，必须用 function 或 class"},{"type":"p","text":"2）箭头函数适合写纯回调，比如数组操作里的 map、filter 处理函数"},{"type":"p","text":"3）不要在需要动态 this 的地方用它，比如事件监听、定时器中如果要访问实例属性就得小心"},{"type":"p","text":"简单说，箭头函数把 this 固化在定义时的作用域，没法被运行时的 new 动态改写，这就和构造函数的根本需求冲突了。"}],"r":["不能 new 和 this 指向无关，是缺少构造能力。","call/apply 只是改变 this，不会让函数获得构造能力。","bind 返回的新函数仍然没有 prototype，依然不能 new。",""]},{"id":89,"t":"ES6 有哪些新特性？","c":"JavaScript","o":["ES6 引入了 TypeScript 的类型系统","只有 let 和 const 两个新特性","主要是新增了 jQuery 式的选择器 API","let/const、箭头函数、解构、Promise、模块化"],"a":3,"w":"ES6（ES2015）是一次大版本升级：let/const、箭头函数、解构、模板字符串、class、Promise、模块化、Set/Map、Symbol、生成器、默认参数等。","b":[{"type":"p","text":"别死记硬背那十几条，面试官想听的是你用过的、理解的。ES6 真正改变开发方式的核心就那么几个。"},{"type":"p","text":"let/const 替代 var 是第一步。块级作用域解决了闭包里 i 变成 5 的经典问题，const 定义的对象属性还能改，但引用不能变。"},{"type":"p","text":"箭头函数 => 不只是写法短，它不绑定 this，谁调用就指向谁的外层上下文，写回调时特别省心。不过 arguments 拿不到，得用 rest 参数 ...args。"},{"type":"p","text":"解构赋值 让取对象和数组的值变得优雅。const { name, age } = user 一行搞定，交换变量 [a, b] = [b,a] 也不用临时变量了。"},{"type":"p","text":"模板字符串用反引号，换行直接写，变量用 ${} 插进去，拼接 URL 或生成 HTML 片段清爽多了。"},{"type":"p","text":"Promise 解决回调地狱，.then .catch 链式调用，错误能被后续 catch 捕获。虽然现在都用 async/await，但底层还是Promise。"},{"type":"p","text":"Class 只是语法糖，本质还是原型继承，但代码组织更清晰。extends 实现继承，super 调父类方法。"},{"type":"p","text":"模块化 export 和 import 支持静态分析，webpack、vite 都靠它做打包。CommonJS 是运行时加载，ESM 是编译时。"},{"type":"p","text":"Set 去重数组 [...new Set(arr)] ，Map 允许任意类型当键，比 obj[key] 更灵活。"}],"r":["类型系统是 TypeScript 加的，不属于 ES6。","let/const 只是其中很小一部分。","选择器 API 是 DOM 标准，不是 ES6 的语言特性。",""]},{"id":90,"t":"说说你对 fetch 的理解，它有哪些优点和不足？","c":"JavaScript","o":["fetch 遇到 404 会自动 reject","fetch 无法发送 POST 请求","fetch 默认会携带跨域请求的 cookie","基于 Promise，但 4xx/5xx 不会 reject"],"a":3,"w":"fetch 基于 Promise，写法比 XHR 简洁；但它只在网络错误时 reject，404/500 需要自己判断 response.ok；默认不带跨域 cookie，也不支持上传进度和取消（要 AbortController）。","b":[{"type":"p","text":"fetch 是浏览器原生提供的网络请求 API，用来替代老旧的 XMLHttpRequest。它基于 Promise，用起来更符合现代 JS的异步编程习惯。"},{"type":"p","text":"1）语法简洁直观，链式调用清晰"},{"type":"code","text":"fetch('/api/data')\n  .then(res => res.json())\n  .then(data => console.log(data))"},{"type":"p","text":"2）天然支持流式处理，响应体是 ReadableStream，可以边接收边处理，对大文件或实时数据很友好"},{"type":"p","text":"3）和 Service Worker、Cache API 天然配合得好，在 PWA 场景里特别顺手，比如用在 Workbox 里做请求拦截和缓存"},{"type":"p","text":"但 fetch 也有硬伤："},{"type":"p","text":"默认不带 cookie，跨域时得手动加 credentials: 'include' ，这点比不过 axios 这类库的默认行为。超时控制也得自己搞，原生不支持 timeout，只能靠 AbortController 手动实现。"},{"type":"p","text":"错误处理有点坑，只有网络失败才算 reject，HTTP 404 或 500 依然走 then，得手动判断 response.ok 。"},{"type":"p","text":"再就是兼容性，IE 全系不支持，老项目得配 polyfill。"},{"type":"p","text":"如果用在 Node.js，得等较新版本（v18+）才原生支持，之前都得靠 node-fetch 这种第三方库撑着。"}],"r":["fetch 对 4xx/5xx 不会 reject，只是 response.ok 为 false。","fetch 完全支持 POST，传 method 和 body 即可。","跨域默认不带 cookie，需要显式设置 credentials: 'include'。",""]},{"id":91,"t":"JavaScript 中 Object.keys 的返回值是无序的吗？","c":"JavaScript","o":["索引键升序，字符串键按插入顺序","返回顺序与 for...in 完全一致，且包含 Symbol 键","完全随机，每次调用结果都不同","严格按字母顺序排列"],"a":0,"w":"ES 规范规定了属性顺序：整数索引键按升序排在最前，字符串键按插入顺序，Symbol 键不参与 Object.keys。所以不是“无序”，但也不该依赖它做业务排序。","b":[{"type":"p","text":"JavaScript 中 Object.keys 的返回值顺序其实是确定的，不是无序的。从 ES2015 开始，规范明确约定了属性的枚举顺序。"},{"type":"p","text":"1）首先返回所有数字索引键，按数值升序排列。比如 obj[0] 、obj[1] 这种，会排在前面。 2）然后是字符串键，按对象定义时的写入顺序排列。 3）最后是Symbol 键，这部分不会被 Object.keys 包含，因为它只返回字符串键。"},{"type":"p","text":"也就是说，如果你这样写："},{"type":"code","text":"const obj = { 2: 'two', 1: 'one', a: 'apple', 0: 'zero' };\n// 写入顺序是 2, 1, a, 0"},{"type":"p","text":"调用 Object.keys(obj) 得到的是 ['0', '1', '2', 'a'] 。注意，数字键被提到了前面，并按数字排序，而不是写入顺序。"},{"type":"p","text":"这个行为在主流引擎（V8、SpiderMonkey 等）中都是一致的，所以你可以依赖这个顺序。但要注意，如果对象的key 全是字符串且没有数字风格的 key，那顺序就是插入顺序。"},{"type":"p","text":"所以别再听说“对象遍历无序”就照搬，ES2015 之后这事儿早就规范了。只要不是乱删乱增导致隐藏类变化，顺序都是可预期的。"}],"r":["","Object.keys 不返回 Symbol 键，顺序规则也和 for...in 不完全一样。","顺序是确定的，同样代码每次结果一致。","既不按字母序，也不按字典序，而是索引升序加插入顺序。"]},{"id":92,"t":"JavaScript 的 BigInt 和 Number 类型有什么区别？","c":"JavaScript","o":["BigInt 可以表示小数","任意精度整数，不能与 Number 混算","BigInt 与 Number 可以直接相加","Number 的最大安全整数是 2^53"],"a":1,"w":"BigInt 表示任意精度的整数，字面量加 n，不能表示小数，也不能和 Number 直接混算（要显式转换），更不能用于 Math 方法。它解决的正是超过 2^53-1 后整数精度丢失的问题。","b":[{"type":"p","text":"JavaScript 的 Number 类型基于 IEEE 754 标准，是双精度浮点数，能表示的整数范围被限制在 -(2^53 - 1) 到 2^53 -1 之间。超过这个范围，精度就会丢失，比如 9007199254740992 + 1 === 9007199254740992 这种反直觉的结果就出现了。"},{"type":"p","text":"BigInt 是 ES2020 引入的原始类型，专门用来表示任意大的整数。只要内存够，你可以写一个几千位的数字，后面加个 n 就行，比如 123456789012345678901234567890n 。它和 Number 完全不兼容，不能混用运算，1 +1n 直接抛 TypeError。"},{"type":"p","text":"使用场景上，Number 处理常规数值计算完全没问题，但涉及到高精度金融计算、大整数 ID（比如 Twitter Snowflake ID）、密码学运算时，就得用 BigInt。Node.js 里的 crypto 模块某些 API 就依赖 BigInt。"},{"type":"p","text":"代码上注意："},{"type":"code","text":"const a = 100n;"},{"type":"p","text":"const b = BigInt(100); // 两种创建方式"},{"type":"code","text":"a === b; // true\n// 不能和 Number 混算\n// 1 + 1n; // TypeError!"},{"type":"p","text":"还有一个坑：BigInt 不能被 JSON.stringify() 直接序列化，会报错。需要配合 replacer 函数转成字符串，后端接收时再解析。"}],"r":["BigInt 只能表示整数，小数仍要用 Number。","","混算会抛 TypeError，必须先转换类型。","最大安全整数是 2^53-1，不是 2^53，差一个数就会丢精度。"]},{"id":93,"t":"什么是 JavaScript 的尾调用？使用尾调用有什么好处？","c":"JavaScript","o":["尾调用会让函数自动变成异步执行","指函数末尾必须 return 一个值","指函数递归调用自身，与调用位置无关","最后一步调用另一函数，可复用栈帧"],"a":3,"w":"尾调用指函数的最后一步是调用另一个函数并直接返回其结果。引擎可以复用当前栈帧而不是新开一个，从而避免深递归爆栈——但需要严格模式和引擎支持。","b":[{"type":"p","text":"尾调用指的是函数最后一个动作是调用另一个函数的场景，比如 function A() { return B(); } 。这时候 A的调用帧就没必要保留了，因为它的执行结果完全由 B 决定。"},{"type":"p","text":"关键点在于尾调用优化（TCO）。如果语言或引擎支持，它会把当前栈帧直接替换成下一个函数的栈帧，而不是压入新帧。这样一来，调用栈不会无限增长，哪怕递归几千次也不会爆栈。"},{"type":"p","text":"举个例子，普通递归算阶乘："},{"type":"code","text":"function factorial(n) {\n  if (n <= 1) return 1;"},{"type":"p","text":"return n * factorial(n - 1); // 不是尾调用，还要做乘法"},{"type":"code","text":"}"},{"type":"p","text":"改成尾递归："},{"type":"code","text":"function factorial(n, acc = 1) {\n  if (n <= 1) return acc;"},{"type":"p","text":"return factorial(n - 1, n * acc); // 尾调用，结果直接是下一次调用"},{"type":"code","text":"}"},{"type":"p","text":"理论上这个版本可以无限执行下去而不增加调用栈深度。"},{"type":"p","text":"但现实有点骨感。ES6 规范确实要求实现 TCO，可主流引擎基本没落地。V8（Chrome/Node.js）早期试过，后来因为调试困难和性能权衡给回退了。所以现在写代码别指望靠这个扛住深层递归。"}],"r":["尾调用与异步无关，是否异步取决于被调用的函数。","“末尾 return 一个值”不等于尾调用，必须是调用函数。","尾调用不要求递归，递归只是最常见的应用场景。",""]},{"id":94,"t":"let、const 和 var 的区别是什么？","c":"JavaScript","o":["const 声明的对象，其内部属性也不能修改","var 函数作用域，let/const 块级且有 TDZ","三者都是块级作用域","let 声明的变量会提升并初始化为 undefined"],"a":1,"w":"var 有变量提升、作用域是函数级；let/const 是块级作用域，且存在暂时性死区（声明前访问会报错）。const 约束的是绑定不可重新赋值，对象内部属性仍可修改。","b":[{"type":"p","text":"var 有变量提升，声明会被提到作用域顶部，初始化不提升，所以 var 变量是 undefined 而不是报错。它只有函数作用域，没有块级作用域，比如在 if 块里声明，外部也能访问。"},{"type":"p","text":"let 和 const 是 ES6 引入的，支持块级作用域，只在当前代码块内有效。let 允许重新赋值，const 声明后必须初始化且不能重新赋值，适用于常量或对象引用不变的场景。"},{"type":"p","text":"1）var 声明的变量可以重复定义，let/const 不行，同一作用域重复声明会直接报错"},{"type":"p","text":"2）let/const 存在暂时性死区，从进入作用域到声明前都不能访问，哪怕语法上看起来在前面也不行"},{"type":"p","text":"3）for 循环中用 let 声明计数器，每次迭代都会创建新的绑定，避免闭包问题；var 则共享同一个变量"},{"type":"p","text":"const 定义的对象，属性还是可以修改的，因为 const 保证的是引用地址不变。如果想彻底冻结，得用 Object.freeze()"},{"type":"code","text":"function example() {\n  console.log(a); // undefined\n  var a = 1;\n  // console.log(b); // 报错：Cannot access 'b' before initialization\n  let b = 2;\n}"},{"type":"p","text":"总的来说，现代开发基本不用 var，let 和 const 配合使用更安全，优先用 const，需要改值再用 let。"}],"r":["const 只保证绑定不变，对象属性照样能改，要冻结得用 Object.freeze。","","var 是函数作用域，只有 let/const 才是块级。","let 会提升但不初始化，声明前访问会抛 ReferenceError。"]},{"id":95,"t":"说说你对 JS 作用域的理解？","c":"JavaScript","o":["块级作用域在 ES5 中就已经存在","JS 采用动态作用域，调用时才确定变量归属","JS 只有全局作用域一种","全局、函数、块级作用域，词法确定"],"a":3,"w":"JS 采用词法作用域：变量的可见范围在代码书写时就确定了，与调用位置无关。作用域分全局、函数、块级三种，闭包就是内层函数持有外层词法环境。","b":[{"type":"p","text":"JavaScript 作用域其实就是变量和函数的可访问范围，决定了代码中不同位置能“看到”哪些变量。"},{"type":"p","text":"函数执行时会创建自己的执行上下文，内部声明的变量外部一般访问不到。比如一个函数里用 var 声明的变量，函数外就搞不定。但函数内部可以访问外层的变量，这就形成了作用域链。查找变量是从当前作用域一层层往外找，直到全局作用域为止。"},{"type":"p","text":"块级作用域在 ES6 才真正支持。以前 var 没有块级作用域，if 或 for 里的变量会泄露到外层。现在用 let和 const 声明的变量，只在 {} 内有效，避免了变量提升带来的问题。变量提升其实是指声明会被提到作用域顶部，但赋值还在原地。"},{"type":"p","text":"闭包是作用域的一个典型应用。函数返回内部函数，内部函数保留对外层变量的引用，即使外层函数已经执行完毕，那些变量依然存在，不会被回收。"},{"type":"code","text":"function outer() {\n    let count = 0;\n    return function inner() {\n        count++;\n        return count;\n    };\n}\nconst counter = outer();\ncounter(); // 1\ncounter(); // 2"},{"type":"p","text":"这里的 inner 函数就形成了闭包，它能记住 outer 的 count 变量。"}],"r":["块级作用域是 ES6 的 let/const 才有的。","JS 是词法作用域，不是动态作用域。","除了全局，还有函数作用域和块级作用域。",""]},{"id":96,"t":"JavaScript 有哪些数据类型？它们的区别是什么？","c":"JavaScript","o":["只有 5 种原始类型，其余都是对象","null 属于引用类型，其余都是原始类型","7 种原始类型加 object 引用类型","数组和函数属于原始类型，其余是对象"],"a":2,"w":"JS 有 7 种原始类型：undefined、null、boolean、number、string、symbol、bigint，其余都是 object（含数组、函数、日期等）。原始类型按值存储、不可变。","b":[{"type":"p","text":"JavaScript 的数据类型分两大类，原始类型和对象。"},{"type":"p","text":"1）原始类型有 7 种：string 、number 、boolean 、null 、undefined 、symbol 、bigint 。它们的特点是不可变，值直接存在栈内存里。比如你改一个字符串，其实是生成了个新字符串，原字符串没变。"},{"type":"p","text":"2）对象（包括数组、函数、日期等）是引用类型，存储在堆内存里，变量存的是指向它的地址。两个对象即使内容一样，也不相等，因为地址不同。"},{"type":"code","text":"const a = { x: 1 };\nconst b = { x: 1 };"},{"type":"p","text":"console.log(a === b); // false，地址不一样"},{"type":"p","text":"3）null 和 undefined 都表示“空”，但用法不同。undefined 是变量声明了但没赋值，或者函数没返回值时的默认值。null 是你主动表示一个“空对象指针”，常用于清空对象引用。"},{"type":"p","text":"4）typeof 能判断大部分类型，但有个经典坑：typeof null 返回 'object' ，这是历史遗留 bug。所以判断"},{"type":"p","text":"null 得用全等 === null 。"},{"type":"p","text":"5）symbol 是唯一值，适合做对象属性名防冲突。bigint 用来表示超大整数，普通 number 在超过 2^53 -1 后会丢失精度。"},{"type":"code","text":"const id = Symbol('id');\nconst user = { [id]: 123 };"},{"type":"p","text":"简单说，原始类型看值，对象看引用。传参或赋值时，原始类型传的是副本，对象传的是指针，一改就全局跟着变。"}],"r":["原始类型有 7 种，不是 5 种。","null 是原始类型，typeof 返回 object 是历史 bug。","","数组和函数都是对象，属于引用类型。"]},{"id":97,"t":"JavaScript 中 null 和 undefined 的区别是什么？","c":"JavaScript","o":["undefined 是关键字，null 是普通变量","null == undefined 的结果是 false","两者完全等价，可以互换使用","undefined 未赋值，null 主动置空"],"a":3,"w":"undefined 表示“声明了但没赋值”，null 表示“主动置空”。typeof undefined 是 'undefined'，typeof null 是 'object'；null == undefined 为 true，但 null === undefined 为 false。","b":[{"type":"p","text":"JavaScript 里 null 和 undefined 都表示“空”，但语义和使用场景不一样。"},{"type":"p","text":"undefined 指一个变量声明了但没赋值，或者对象属性不存在，函数没有返回值时的默认状态。比如 let a;console.log(a) 输出 undefined，系统自动给的“还没定义”的意思。"},{"type":"p","text":"null 是开发者主动赋的一个值，表示“这里故意设为空”。它是一个特殊的对象值，typeof 判断会出 bug 返回\"object\"，这是历史遗留问题，但实际类型是空指针标志。"},{"type":"p","text":"1）变量未初始化 → undefined"},{"type":"p","text":"2）对象属性缺失 → undefined"},{"type":"p","text":"3）函数无 return → 默认返回 undefined"},{"type":"p","text":"4）主动清空引用 → 用 null"},{"type":"p","text":"类型判断时要注意："},{"type":"code","text":"typeof undefined     // \"undefined\""},{"type":"p","text":"typeof null // \"object\" （坑！）"},{"type":"code","text":"null === undefined   // false"},{"type":"p","text":"null == undefined // true （宽松相等会认为都是空）"},{"type":"p","text":"所以判断是否真为空值，推荐用全等："},{"type":"p","text":"if (value === null) { ... } // 只匹配 null if (value == null) { ... } // 匹配 null 或 undefined，常用于空值合并场景"},{"type":"p","text":"JSON 序列化时，undefined 会被忽略，而 null 会保留："},{"type":"code","text":"JSON.stringify({ a: undefined, b: null }) // '{\"b\":null}'"},{"type":"p","text":"总结：undefined 是“系统觉得你还没填”，null 是“我明确告诉你这是空”。日常做类型校验、参数默认处理时得区分清楚，避免误判。"}],"r":["两者都是字面量，不存在“普通变量”一说。","null == undefined 的结果是 true，正因为如此才要用 === 区分。","两者语义不同，默认值、序列化、typeof 结果都不一样。",""]},{"id":98,"t":"typeof 和 instanceof 有什么区别？","c":"JavaScript","o":["typeof 可以准确判断数组和 null","instanceof 可以判断所有原始类型","typeof 判原始类型，instanceof 沿原型链","两者完全等价，任何场景都能互相替代"],"a":2,"w":"typeof 返回字符串，适合判断原始类型，但数组和 null 都会返回 'object'；instanceof 沿原型链判断引用类型，跨 iframe 会失效。","b":[{"type":"p","text":"typeof 和 instanceof 解决的是不同类型判断的问题，但它们的视角完全不同。"},{"type":"p","text":"typeof 关注的是原始类型和函数。它能准确识别 string 、number 、boolean 、undefined 、symbol 、bigint 和 function 。但对对象来说，除了函数外，所有对象都返回 \"object\" ，包括数组和null。没错，typeof null 是 \"object\" ，这是历史遗留 bug。"},{"type":"code","text":"typeof 42            // \"number\"\ntypeof 'hi'          // \"string\"\ntypeof []            // \"object\"\ntypeof null          // \"object\"\ntypeof function(){}  // \"function\""},{"type":"p","text":"instanceof 则是基于原型链做判断，看一个对象是否是某个构造函数的实例。它用在自定义对象类型、数组、日期等特别有用。它的底层逻辑是检查右操作数的 prototype 是否出现在左操作数的原型链上。"},{"type":"code","text":"[1, 2] instanceof Array      // true\nnew Date() instanceof Date   // true\n{} instanceof Object         // true"},{"type":"p","text":"跨窗口或 iframe 场景下，instanceof 可能失效，因为不同全局环境下的构造函数不共享原型链。这种时候可以用"},{"type":"p","text":"Object.prototype.toString.call() 来兜底。"},{"type":"code","text":"Object.prototype.toString.call([1, 2]) // \"[object Array]\""},{"type":"p","text":"总的来说，typeof 适合判断基础类型，instanceof 适合判断复杂对象的继承关系。"}],"r":["数组和 null 用 typeof 都得到 'object'，判断不出来。","instanceof 只对引用类型有效，1 instanceof Number 是 false。","","两者适用范围完全不同，不能互相替代。"]},{"id":99,"t":"为什么 JavaScript 中 0.1 + 0.2 !== 0.3，如何让其相等？","c":"JavaScript","o":["这是 JS 特有的问题，其他语言不存在","这是浏览器的 bug，换个浏览器就正常了","二进制无法精确表示，用 EPSILON 或整数","把结果四舍五入到两位小数，就能保证所有浮点运算都精确"],"a":2,"w":"IEEE 754 双精度浮点用二进制表示小数，0.1 和 0.2 都是无限循环小数，存储时已被截断，相加自然不等于 0.3。判断相等要用 Number.EPSILON，金额计算建议转成整数或使用 decimal 库。","b":[{"type":"p","text":"这个问题本质上是浮点数计算的精度问题，根源在 IEEE 754 标准。"},{"type":"p","text":"JavaScript 所有数字都用双精度浮点数（64位）表示，小数部分通过二进制科学计数法存储。但像 0.1 和 0.2 这种十进制小数，在二进制里是无限循环的，比如 0.1 的二进制是 0.0001100110011... ，存的时候只能截断，这就带来了舍入误差。所以 0.1 + 0.2 实际算出来是 0.30000000000000004 ，和 0.3 不相等。"},{"type":"p","text":"要让它们“相等”，不能直接用 === 判断，得引入误差容忍机制。"},{"type":"p","text":"最常见做法是比较两数差值是否在一个极小范围内："},{"type":"code","text":"function isEqual(a, b) {\n  return Math.abs(a - b) < Number.EPSILON;\n}\nisEqual(0.1 + 0.2, 0.3); // true"},{"type":"p","text":"Number.EPSILON 是 JS 中最小可表示的差值，大约是 2.22e-16 ，适合做这种浮点数安全比较。"},{"type":"p","text":"还有一种方式是转成整数运算，比如处理金额时统一用“分”为单位："},{"type":"code","text":"0.1 * 100 + 0.2 * 100 === 0.3 * 100; // 10 + 20 === 30 → true"},{"type":"p","text":"金融计算推荐这种方式，避免任何浮点风险。"},{"type":"p","text":"1）别用 == 或 === 直接比浮点数"},{"type":"p","text":"2）优先用 Math.abs(a - b) < Number.EPSILON"},{"type":"p","text":"3）关键场景如金额，全程用整数运算"},{"type":"p","text":"这类问题在 Java 的 float 、double 里也存在，解决方案类似。"}],"r":["所有遵循 IEEE 754 的语言都有这个问题，不是 JS 独有。","这是浮点标准的行为，换浏览器一样。","","四舍五入只能掩盖显示问题，连续运算后误差仍会累积。"]},{"id":100,"t":"为什么 React 使用虚拟 DOM 来提高性能？","c":"React","o":["虚拟 DOM 可以完全避免重排和重绘","虚拟 DOM 一定比真实 DOM 更快，所以任何场景都该用","用 JS 对象描述 UI，diff 后批量更新 DOM","虚拟 DOM 直接操作浏览器的渲染引擎"],"a":2,"w":"虚拟 DOM 用 JS 对象描述 UI，先在内存里 diff 出最小变更，再批量更新真实 DOM，减少昂贵的 DOM 操作。它的价值是“可预测的批量更新加跨平台渲染”，单次操作其实比直接改 DOM 慢。","b":[{"type":"p","text":"直接操作真实 DOM 成本很高，哪怕只是改个文本，浏览器都要触发重排重绘。React 的设计思路是用 虚拟 DOM 这个轻量级的 JavaScript 对象树来描述 UI 结构，把频繁的 DOM 操作变成内存中的计算。"},{"type":"p","text":"1）当状态变化时，React 会生成新的虚拟 DOM 树，然后和上一次的树做对比，这个过程叫 diffing。它不会立刻更新页面，而是先在内存里算出最小变更集。"},{"type":"p","text":"2）React 的 diff 算法有策略优化，比如只比较同层级节点、用 key 来追踪列表项的移动。这样就能快速定位哪些组件需要更新，避免全量比对。"},{"type":"p","text":"3）最后，React 把计算出来的差异批量更新到真实 DOM 上，尽量减少昂贵的 DOM API 调用，也减少了浏览器 layout和 paint 的次数。"},{"type":"p","text":"举个例子，像 Ant Design 这种复杂组件库，如果每个按钮点击都直接操作 DOM，页面很容易卡顿。但通过虚拟DOM，React 能把一堆更新合并成一次提交，体验就顺滑多了。"},{"type":"p","text":"代码上看，其实就是 JSX 编译成 React.createElement 调用，构建出 vnode 树："},{"type":"code","text":"// 你写的 JSX\n<div className=\"count\">{count}<\/div>\n// 实际生成的是这种对象结构\n{ type: 'div', props: { className: 'count' }, children: [count] }"},{"type":"p","text":"说白了，虚拟 DOM 是用 JS 计算换 DOM 操作，把脏活累活放在内存里干完，再一次性提交结果。"}],"r":["虚拟 DOM 不能避免重排重绘，只是把多次操作合并成更少的批次。","单次更新时虚拟 DOM 反而更慢，优势在批量与跨平台。","","虚拟 DOM 是 JS 层的抽象，最终仍要通过 DOM API 操作渲染引擎。"]},{"id":101,"t":"Redux 如何实现多个组件之间的通信？多个组件使用相同状态时如何进行管理？","c":"React","o":["共享状态提升到 store，dispatch 改、订阅读","Redux 只能管理单个组件内部的状态","用 localStorage 存状态并定时轮询","通过 props 逐层透传实现任意组件通信"],"a":0,"w":"Redux 把共享状态收敛到唯一 store：组件 dispatch action，reducer 计算出新 state，其他组件通过 connect/useSelector 订阅变化。跨层级通信不再需要一层层传 props。","b":[{"type":"p","text":"Redux 的本质是把组件之间需要共享的状态抽出来，放到一个全局唯一的 store 里。组件不再直接互相传值，而是都去订阅这个 store，或者 dispatch action 去修改它。"},{"type":"p","text":"状态更新流程很清晰：组件触发 action → store 调用 reducer 计算新状态 → 所有订阅者拿到最新 state 并更新视图。整个过程是单向数据流，调试时能清晰追踪每一次变化。"},{"type":"p","text":"多个组件用同一状态时，只要它们都 connect 到 store，或者用 useSelector 拿同一个字段，自然就同步了。比如用户登录信息，Header、Sidebar、Setting 页面都能实时读取。"},{"type":"p","text":"状态设计建议按功能域拆分，比如 user、order、cart 各自独立，通过 combineReducers 组装。避免把所有数据揉在一个 reducer 里，否则维护起来会很乱。"},{"type":"code","text":"// 核心模式：connect 或 hooks 订阅 store\nfunction UserInfo() {\n  const user = useSelector(state => state.user);\n  return <div>{user.name}<\/div>;\n}\n// 触发更新\ndispatch({ type: 'USER_LOGIN', payload: { name: 'Tom' } });"},{"type":"p","text":"组件间通信其实压根不需要直接联系。A 组件 dispatch 登录 action，B 组件因为订阅了 user 状态，自动刷新。中间完全解耦。"}],"r":["","Redux 恰恰是为跨组件共享状态设计的。","localStorage 不是响应式的，轮询既慢又浪费。","逐层透传能实现，但层级深时代码难维护，也不是 Redux 的做法。"]},{"id":102,"t":"在 React 的 JSX 中，属性是否可以被覆盖？覆盖的原则是什么？","c":"React","o":["可以，后写的属性覆盖先写的","只有 className 可以被覆盖","以第一个出现的属性为准","不可以，重复属性会直接报错"],"a":0,"w":"JSX 编译后是对象字面量，重复的属性名后者覆盖前者。所以 <Comp {...props} title=\"x\" /> 里 title 一定生效，而 <Comp title=\"x\" {...props} /> 可能被 props 里的 title 覆盖。","b":[{"type":"p","text":"JSX 中的属性传递其实和普通 JavaScript 对象赋值很像，但又有点特殊，尤其是在组件调用时。"},{"type":"p","text":"1）属性可以被覆盖，规则是后面传的值会覆盖前面的。比如你在一个组件上写了两次 className ，后面的会生效。React 在合并 props 时是从前往后叠的，就像 Object.assign 那样。"},{"type":"p","text":"2）但要注意 children 的处理。如果你在标签内部写内容，它会被当作 children ，并且会覆盖通过"},{"type":"p","text":"props.children 显式传入的值。例如："},{"type":"p","text":"<Component children=\"旧值\">新值<\/Component>"},{"type":"p","text":"最终拿到的 children 是“新值”。"},{"type":"p","text":"3）对于事件处理器或自定义 prop，同样遵循后出现的覆盖先出现的。这在高阶组件或使用 spread 操作符时特别容易踩坑："},{"type":"code","text":"const props = { onClick: handler1 };\n<Component onClick={handler2} {...props} />"},{"type":"p","text":"这里 onClick 最终是 handler1 ，因为展开在后面，把前面的 handler2 覆盖了。"},{"type":"p","text":"所以传属性的时候顺序很重要，尤其是混用 {...spread} 和静态属性时。一般建议静态属性写在 spread 后面，才能确保它们生效。"}],"r":["","任何属性都可以被覆盖，不限于 className。","以最后一个为准，不是第一个。","重复属性不会报错，只是后者覆盖前者。"]},{"id":103,"t":"在 React Router 的 history 模式中，push 和 replace 方法有什么区别？","c":"React","o":["push 不新增历史记录，replace 会新增","push 新增历史记录，replace 替换当前记录","replace 会强制刷新整个页面","两者完全等价，没有区别"],"a":1,"w":"push 会往历史栈里新增一条记录，用户点后退能回到上一页；replace 替换当前记录，不新增历史。登录成功后的跳转通常用 replace，避免后退又回到登录页。","b":[{"type":"p","text":"push 和 replace 都是编程式导航的方法，但它们对浏览器历史栈的操作完全不同。"},{"type":"p","text":"1）当你调用 push ，比如 history.push('/home') ，浏览器会在历史栈里新增一条记录。用户点击返回按钮时，可以回到上一个页面。这是最常见的跳转方式，适用于绝大多数场景，比如从列表页点进详情页。"},{"type":"p","text":"2）而 replace ，比如 history.replace('/login') ，它会用新路径替换掉当前的历史记录，不会新增条目。最典型的用例是登录后重定向，你不想让用户点“返回”又回到登录页，再点一次“返回”才回到之前页面，那样体"},{"type":"p","text":"验很奇怪。"},{"type":"p","text":"代码上看就是："},{"type":"code","text":"// 新增一条历史记录\nhistory.push('/dashboard');\n// 替换当前这条，不留痕迹\nhistory.replace('/welcome');"},{"type":"p","text":"举个实际场景：用户访问了一个需要登录的页面，被重定向到登录页，登录成功后跳转回原页面。这时候登录页的记录就应该用 replace 清掉，不然用户返回会重新触发登录逻辑。"},{"type":"p","text":"整个过程其实就看你想不想让用户能“回来”。想回来就用 push，不想留后路就 replace。"}],"r":["说反了：新增记录的是 push。","","两者都只改 history，不会刷新页面。","区别很实际：是否新增历史记录，直接影响后退行为。"]},{"id":104,"t":"在 Vue 自定义事件中，父组件如何接收子组件传递的多个参数？","c":"Vue","o":["$emit 传多个参数，父组件按顺序接收","父组件通过 $route.params 获取","只能传一个参数，多参数必须手动包成对象","必须借助 Vuex 才能传递"],"a":0,"w":"子组件 $emit('change', a, b) 可以带任意多个参数，父组件用 @change=\"handler\" 监听，handler 会按顺序收到这些参数。","b":[{"type":"p","text":"子组件通过 emit 触发事件时，可以传递多个参数，父组件在监听事件时直接接收这些参数。"},{"type":"p","text":"Vue 的自定义事件机制允许你在调用 emit 时附带任意数量的参数，这些参数会原封不动地传给父组件的事件处理器。你不需要封装成对象，也不需要额外处理。"},{"type":"p","text":"比如子组件中这样触发："},{"type":"code","text":"// ChildComponent.vue"},{"type":"p","text":"this.$emit('submit', '用户名', 18, { role: 'admin' })"},{"type":"p","text":"父组件模板里直接解包："},{"type":"code","text":"<ChildComponent @submit=\"handleSubmit\" />"},{"type":"p","text":"对应的 handleSubmit 方法接收到的就是 emit 的所有参数："},{"type":"code","text":"methods: {\n  handleSubmit(name, age, extra) {"},{"type":"p","text":"console.log(name, age, extra) // '用户名' 18 { role: 'admin' }"},{"type":"code","text":"  }\n}"},{"type":"p","text":"注意这里的参数顺序必须和 emit 调用时保持一致。如果参数太多建议传对象，但不是强制要求。"},{"type":"p","text":"这种设计让父子通信非常灵活，你可以根据场景选择扁平参数还是聚合对象。一般参数少于 3 个直接传，多了就合并成一个数据对象，便于维护。"}],"r":["","$route.params 是路由参数，和组件自定义事件无关。","可以传任意多个参数，包成对象只是可读性更好的一种选择。","Vuex 是全局状态管理，父子通信不需要它。"]},{"id":105,"t":"如何监听 Vuex 数据的变化？","c":"Vue","o":["Vuex 不支持任何监听方式","只能用 setInterval 轮询","只能通过 localStorage 的 storage 事件监听","watch 监听 state，或 store.subscribe"],"a":3,"w":"组件内用 watch 监听 state 或 getters（或用 computed 响应式读取）；需要全局副作用时用 store.subscribe 监听 mutation，比如做日志、持久化。","b":[{"type":"p","text":"Vuex 本身基于 Vue 的响应式系统，所以监听数据变化的核心思路是“用 Vue 的方式去监听 Vuex 中的状态”。"},{"type":"p","text":"1）最直接的方法是在组件里用 watch 监听通过 mapState 或 this.$store.state 拿到的 state。只要状态变，回调就会触发。"},{"type":"code","text":"watch: {\n  'someState'(newVal) {"},{"type":"p","text":"console.log('变了', newVal)"},{"type":"code","text":"  }\n}"},{"type":"p","text":"2）如果想跨组件或在模块内部做副作用处理，用 Vuex 的订阅机制更合适。store.subscribe 能拿到每次mutation 的类型和 payload，适合埋点、日志这类场景。"},{"type":"code","text":"store.subscribe((mutation, state) => {\n  if (mutation.type === 'UPDATE_USER') {\n    // 做点事\n  }\n})"},{"type":"p","text":"3）如果是异步操作或需要监听计算后的状态，用 store.watch 。它类似组件里的 watch ，但作用在 store 实例上。"},{"type":"code","text":"store.watch(\n  state => state.user.profile,\n  profile => {\n    // profile 变了\n  }\n)"},{"type":"p","text":"注意，别滥用 subscribe 去处理业务逻辑，容易让数据流变混乱。复杂状态依赖建议用 getter + 组件内响应式依赖来自动更新。"},{"type":"p","text":"简单说，你要的是“反应”，不是“监听”。大多数时候，模板里绑定 getter 或 computed 就够了，Vue 会自动追踪依赖。"}],"r":["Vuex 支持多种监听方式。","轮询既浪费性能又拿不到变化时机。","storage 事件只在同源的其他标签页触发，监听不到本页的 Vuex 变化。",""]},{"id":106,"t":"什么是 Vuex 的模块化 module？有哪些应用场景？","c":"Vue","o":["用于定义前端路由表，按模块组织页面","按业务域拆分 state、mutations、actions","module 会让 state 全局共享，无法做命名空间隔离","用于把组件拆成多个文件，便于分工维护"],"a":1,"w":"module 把 store 按业务域拆开，每个模块有自己的 state、mutations、actions、getters。开启 namespaced 后，模块内的 action/mutation 会加上模块前缀，避免命名冲突。","b":[{"type":"p","text":"Vuex 的 module 其实就是为了解决单一状态树在大型应用中变得臃肿的问题。当项目越来越大，所有 state、mutation、action 都挤在同一个 store 里，维护起来就特别费劲。module 允许你把 store 拆成一个个独立的模块，每个模块拥有自己的 state、getters、mutations 和 actions。"},{"type":"p","text":"1）模块内部可以自包含，结构更清晰。比如用户模块管理登录态，购物车模块管商品列表，彼此不干扰。"},{"type":"p","text":"2）命名空间是关键。默认情况下，模块里的 mutation 和 action 依然注册在全局，容易冲突。通过设置"},{"type":"p","text":"namespaced: true ，就能让模块内的方法和状态隔离，调用时需要带上路径前缀，像store.dispatch('user/login') 这样。"},{"type":"p","text":"3）应用场景很明确。中大型单页应用基本都得用，尤其是页面功能划分明显、团队多人协作开发时。举个例子，用Vue 开发后台管理系统，权限、路由、用户信息、订单状态各自独立成模块，后期扩展和测试都方便。"},{"type":"p","text":"代码上长这样："},{"type":"code","text":"const user = {\n  namespaced: true,\n  state: { name: '' },\n  mutations: {\n    SET_NAME(state, name) {\n      state.name = name\n    }\n  }\n}"},{"type":"p","text":"调用就得用 this.$store.commit('user/SET_NAME', 'jack') ，路径必须写全。"}],"r":["路由表由 router 配置，和 Vuex module 无关。","","开启 namespaced 就能做命名空间隔离，这正是 module 的常用配置。","拆组件是组件化，不是状态管理的模块化。"]},{"id":107,"t":"如何在 Vue 3 中使用 defineAsyncComponent 实现异步组件加载？","c":"Vue","o":["会把组件强制打包进主 bundle，无法单独分包","用于定义并注册同步组件，写法与普通组件一致","只能用于路由组件，普通组件无法异步加载","传 import() 工厂函数，按需加载并配 loading"],"a":3,"w":"defineAsyncComponent 接收一个返回 import() 的工厂函数，组件在真正渲染时才加载，可以配置 loadingComponent、errorComponent、delay 和 timeout。配合打包工具会自动分包。","b":[{"type":"p","text":"组件懒加载在 Vue 3 里靠 defineAsyncComponent 来搞，它让你把组件包装成一个异步函数，等真正用到的时候才去加载。这种模式对路由级组件特别有用，能显著减少首屏体积。"},{"type":"p","text":"写法上，传给它的函数必须返回一个 Promise，通常结合动态导入 import() 使用。比如："},{"type":"code","text":"import { defineAsyncComponent } from 'vue'\nconst AsyncComp = defineAsyncComponent(() =>\n  import('./components/HeavyComponent.vue')\n)"},{"type":"p","text":"你还可以处理加载失败和 loading 状态。直接传配置对象进去，加 loadingComponent 、errorComponent ，甚至设置延迟时间防闪烁："},{"type":"code","text":"const AsyncComp = defineAsyncComponent({\n  loader: () => import('./components/HeavyComponent.vue'),\n  loadingComponent: Loading,\n  errorComponent: ErrorFallback,"},{"type":"p","text":"delay: 200 // 200ms 后才显示 loading"},{"type":"code","text":"})"},{"type":"p","text":"实际场景中，配合 Vue Router 做路由懒加载最常见。路由配置直接写 component: () => import('...') 其实是语法糖，底层就是 defineAsyncComponent 在工作。"},{"type":"p","text":"注意别滥用。小组件没必要异步加载，网络请求的开销可能比代码本身还重。一般建议用于超过 10kb 的组件，或者有复杂依赖的页面级组件。"}],"r":["动态 import 会单独分包，不会进主 bundle。","它定义的正是异步组件，不是同步注册。","普通组件也能用，不限于路由组件。",""]},{"id":108,"t":"Vue 如何缓存当前组件？缓存后如何更新？","c":"Vue","o":["keep-alive 会自动刷新被缓存组件的数据，无需手动处理","用 keep-alive 包裹，include/exclude 控制","keep-alive 只能缓存路由组件，普通组件无效","组件被缓存后就再也无法更新，只能刷新页面"],"a":1,"w":"keep-alive 缓存的是组件实例，表单内容、滚动位置都会保留；用 include/exclude 控制缓存范围，用 activated/deactivated 感知进入和离开。需要强制刷新时改 key 或调用重新加载逻辑。","b":[{"type":"p","text":"<keep-alive> 是 Vue 里的内置组件，用来缓存动态切换的组件实例，避免重复渲染和销毁。它不会每次都重新创建组件，而是把用过的组件丢进内存里存着，下次再进来直接从缓存拿，性能更好。"},{"type":"p","text":"被 <keep-alive> 包裹的组件在第一次加载时会触发 created 和 mounted ，之后切走不会触发"},{"type":"p","text":"beforeDestroy 和 destroyed ，而是进入缓存。再次激活时只会触发 activated 钩子，切出时触发deactivated。"},{"type":"p","text":"想更新缓存里的组件数据，不能靠重新 mounted ，得在 activated 里做逻辑判断。比如你有个列表页，用户从详情页返回，这时候应该刷新列表。就在 activated 里加个时间戳对比或者标记位，决定是否调接口。"},{"type":"code","text":"activated() {\n  if (this.needRefresh) {\n    this.fetchData()\n    this.needRefresh = false\n  }\n}"},{"type":"p","text":"还可以通过 include 和 exclude 控制哪些组件要被缓存，支持字符串或正则。比如只缓存名称为 List 的组件："},{"type":"code","text":"<keep-alive include=\"List\">\n  <component :is=\"view\" />\n<\/keep-alive>"},{"type":"p","text":"缓存的组件实例会保存当前所有状态，包括 data、DOM、滚动位置等。Vue 内部用一个 LRU 缓存机制管理，最多缓存 10 个组件，超出就干掉最久没用的。"}],"r":["keep-alive 不会自动刷新，它恰恰是保留状态。","","普通组件也能缓存，不限于路由组件。","缓存后仍可通过改 key、调接口等方式更新。"]},{"id":109,"t":"为什么 Vuex 的 mutation 中不能做异步操作？","c":"Vue","o":["必须同步，devtools 才能记录状态快照","异步代码写在 mutation 中会直接报错","mutation 只能修改 getters","mutation 不支持接收参数"],"a":0,"w":"mutation 必须是同步函数，devtools 才能记录每次修改前后的状态快照。异步逻辑放在 action 里，action 完成后再 commit 对应的 mutation。","b":[{"type":"p","text":"Vuex 的 mutation 设计初衷是同步事务，这是为了保证状态变化的可追踪性。"},{"type":"p","text":"1）每次 mutation 都会记录一条“快照”，开发者工具能回放状态变化。如果在 mutation 里做异步操作，比如setTimeout 或 API 请求，那这个变化就脱离了同步执行流，工具压根不知道啥时候真正改了状态，调试直接失效。"},{"type":"p","text":"2）mutation 被设计成纯函数：输入是 state 和 payload，输出是新 state。异步操作会引入副作用，破坏这种确定性。你没法保证两次同样的 mutation 会产生相同的结果，尤其是在并发提交时，状态可能乱掉。"},{"type":"p","text":"3）Vue 的响应式系统依赖同步更新链路。如果 mutation 异步改 state，Vue 的依赖收集和视图更新机制可能搞不定时机，导致渲染延迟或不一致。"},{"type":"p","text":"正确的做法是把异步逻辑放在 action 里处理。action 可以包含任意异步操作，处理完后再通过 commit 同步调用mutation 来修改 state。"},{"type":"code","text":"// 正确示例\nactions: {\n  async fetchData({ commit }) {\n    const res = await api.get('/data')"},{"type":"p","text":"commit('SET_DATA', res.data) // 异步完成后同步提交"},{"type":"code","text":"  }\n}"},{"type":"p","text":"这样分工明确：action 管流程和异步，mutation 只干同步改状态这一件脏活累活。整个状态机始终处于可控、可预测的状态。"}],"r":["","写异步代码不会报错，只是 devtools 的时间线会失真。","mutation 改的是 state，getters 是派生数据，不该被直接改。","mutation 可以接收 payload 参数，第二个参数就是。"]},{"id":110,"t":"如何使用 Vue 手写一个过滤器？","c":"Vue","o":["函数接收值返回结果，用 | 调用","过滤器只能处理数字类型","过滤器必须用 class 定义","Vue 3 中过滤器被完整保留"],"a":0,"w":"过滤器就是一个函数：接收值、返回格式化后的结果，在插值或 v-bind 中用 | 调用。可以注册为全局（Vue.filter）或局部（filters 选项）。Vue 3 已移除，建议用计算属性或方法。","b":[{"type":"p","text":"Vue 2 中的过滤器是个挺实用的小功能，适合做文本格式化这类纯展示的转换。它不会修改原始数据，只影响模板里的显示结果。"},{"type":"p","text":"定义方式分两种，全局和局部。全局过滤器在任何组件里都能用，一般在入口文件里注册。"},{"type":"code","text":"// 全局注册一个时间格式化过滤器\nVue.filter('formatDate', function(value) {\n  if (!value) return ''\n  const date = new Date(value)\n  return date.getFullYear() + '-' +\n         (date.getMonth() + 1).toString().padStart(2, '0') + '-' +\n         date.getDate().toString().padStart(2, '0')\n})"},{"type":"p","text":"局部过滤器写在组件内部，用 filters 选项："},{"type":"code","text":"export default {\n  filters: {\n    currency(value) {\n      return '¥' + value.toFixed(2)\n    }\n  }\n}"},{"type":"p","text":"模板里这么用："},{"type":"code","text":"<template>\n  <div>\n    {{ timestamp | formatDate }}\n    {{ price | currency }}\n  <\/div>\n<\/template>"},{"type":"p","text":"其实从 Vue 3 开始官方已经移除了过滤器，推荐用方法调用或计算属性替代。比如上面的功能完全可以用 computed或者封装成函数直接调用，逻辑更清晰，调试也方便。"},{"type":"p","text":"要是在 Vue 3 项目里还想搞类似效果，建议用组合式函数："},{"type":"code","text":"const useFilters = () => {\n  const currency = (val) => `¥${val.toFixed(2)}`\n  const formatDate = (val) => new Date(val).toISOString().slice(0, 10)\n  return { currency, formatDate }\n}"},{"type":"p","text":"然后在 setup 里解构使用，既灵活又类型友好。"}],"r":["","过滤器可以处理字符串、日期、数组等任意类型。","过滤器是普通函数，用 class 定义没有意义。","Vue 3 已移除过滤器，这是本题的关键变化。"]},{"id":111,"t":"Vuex 状态管理存在什么缺点？","c":"Vue","o":["模板代码多、TS 支持弱、模块嵌套复杂","完全不支持异步操作，只能同步修改状态","状态无法被组件读取，只能通过 props 传递","无法管理全局状态，只能管理组件内部状态"],"a":0,"w":"Vuex 的槽点主要是：模板代码多（state/mutation/action 一套写下来）、TS 类型推导弱、模块嵌套深时命名空间复杂。这也是 Pinia 出现的原因。","b":[{"type":"p","text":"Vuex 作为 Vue 2 生态中的状态管理方案，用起来确实顺手，但随着项目变大，问题也慢慢暴露出来。"},{"type":"p","text":"最大的问题是模块耦合太重。你定义的 mutation、action、getter 全都挂在同一个 store 实例上，时间一长，store 文件动辄上千行。虽然支持 module 分割，但模块间通信还得靠 commit 或 dispatch，代码跳转麻烦，调试也不直观。"},{"type":"p","text":"另一个头疼点是类型支持弱。在 TypeScript 项目里，Vuex 对 action 的 payload、mutation 的参数这些都没法做精确推导，写的时候全靠猜，重构时容易搞不定类型报错。"},{"type":"p","text":"还有就是异步流程难以追踪。dispatch 一个 action，它可能触发多个 mutation，中间还夹着异步请求，Vue Devtools 能看记录，但流程分支一多，就跟丢了似的。不像 Redux 那样纯函数 + 中间件结构清晰。"},{"type":"p","text":"最后是测试成本高。因为很多逻辑依赖 $store 实例，单元测试得 mock 整个 store，setup 成本高，跑得也慢。"},{"type":"p","text":"现在 Vue 3 项目基本都转向 Pinia 了，API 更简洁，天然 TS 友好，模块之间还能互相调用，没有 mutations 冗余层，开发体验提升明显。"},{"type":"p","text":"说白了，Vuex 适合中等复杂度项目，真要大规模协作开发，还是 Pinia 更轻便可控。"}],"r":["","Vuex 通过 action 支持异步，这是它的基本能力。","组件可以通过 mapState/useStore 读取状态。","管理全局状态正是 Vuex 的定位。"]},{"id":112,"t":"Vuex 和 localStorage 的区别是什么？","c":"Vue","o":["Vuex 的数据会自动写入 localStorage 做持久化","localStorage 在页面刷新后会自动清空","两者都是响应式的，改一个另一个会自动更新","Vuex 内存态响应式，localStorage 持久但非响应式"],"a":3,"w":"Vuex 存在内存里，响应式、可追踪，但刷新即丢；localStorage 能持久化，但读写是同步的、不是响应式的，需要手动同步。常见做法是用插件把需要的字段持久化。","b":[{"type":"p","text":"Vuex 是 Vue 应用的状态管理容器，主要解决组件间状态共享和响应式更新的问题。它把状态集中起来管理，任何组件修改 store 里的数据，其他用到这个数据的组件会自动刷新视图。"},{"type":"p","text":"localStorage 是浏览器提供的持久化存储 API，存进去的数据除非手动清除，否则页面刷新、关闭再打开都还在。但它压根不经过 Vue 的响应式系统，你改了 localStorage，页面上的数据不会自动变。"},{"type":"p","text":"1）Vuex 的状态默认是运行时的，页面一刷新，store 里的数据就没了。适合临时共享数据，比如用户登录信息在多个组件里要用到。"},{"type":"p","text":"2）localStorage 适合存一些需要长期保留的配置类数据，比如用户的主题偏好、上次访问时间。但你要自己写逻辑去同步到组件 data 或 Vuex 中，才能触发视图更新。"},{"type":"p","text":"3）实际项目里经常组合用：登录后把 token 存 localStorage，防止刷新丢失；同时用 Vuex 维护当前登录状态 user 和isLogin，保证响应式更新。"},{"type":"p","text":"代码上很简单："},{"type":"code","text":"// 存\nlocalStorage.setItem('token', 'abc123')\nthis.$store.commit('setToken', 'abc123')\n// 取\nconst token = localStorage.getItem('token')"},{"type":"p","text":"想持久化又想要响应式，可以用 vuex-persistedstate 插件，它自动把 Vuex 状态备份到 localStorage，刷新后恢复。"}],"r":["Vuex 不会自动写入 localStorage，要装持久化插件或自己订阅。","localStorage 刷新后依然存在，清空的是 Vuex。","localStorage 不是响应式的，改了页面不会自动更新。",""]},{"id":113,"t":"Vue 首页白屏可能是什么问题引起的？如何解决？","c":"性能优化","o":["资源加载失败、路由或接口报错、兼容问题","白屏一定是服务器宕机导致的","白屏无法排查，只能重装依赖","白屏只可能是 CSS 没有加载"],"a":0,"w":"Vue 首页白屏常见原因：资源加载失败（404 或 CDN 挂了）、入口 JS 报错、路由模式或接口异常、浏览器兼容问题。排查顺序是先看 Network 再看 Console，最后看根节点是否挂载成功。","b":[{"type":"p","text":"首页白屏在 Vue 项目里其实挺常见的，问题通常出在资源加载、路由配置或服务端渲染环节。"},{"type":"p","text":"1）静态资源路径错误是最容易被忽略的。比如打包后 index.html 引用的 JS/CSS 路径是"},{"type":"p","text":"/static/js/app.js ，但服务器没放在根目录下，资源 404，页面自然空白。解决办法是检查 publicPath 配置，开发环境用 / ，部署到子目录就得改成 ./ 或对应前缀。"},{"type":"p","text":"2）路由模式配置不当也会导致白屏。用了 history 模式但服务端没做 fallback，用户直接访问 /user/123 时，服务器找不到对应 HTML 文件返回 404。Nginx 要配一条规则，所有前端路由都指向 index.html 。"},{"type":"p","text":"3）第三方依赖加载失败或者入口文件有未捕获异常，JS 执行中断，页面也挂了。打开控制台看有没有报错，尤其是chunkLoadError，可能是动态导入的模块路径不对或者 CDN 失效。"},{"type":"p","text":"4）如果是 SSR 项目，服务端渲染出错或者 hydration 不匹配，客户端和服务器生成的 DOM 对不上，Vue 会直接丢弃服务端内容重新渲染，体验上就是白屏一下再出来。确保组件在服务端可运行，别调浏览器 API。"},{"type":"p","text":"代码示例注意加 try-catch："},{"type":"code","text":"// main.js\napp.mount('#app').catch(err => {\n  console.error('App failed to mount', err)\n})"},{"type":"p","text":"常见于 Vue CLI 和 Vite 项目，构建后要验证资源路径和服务端路由兜底是否生效。"}],"r":["","服务器宕机只是众多原因之一，更多是资源或 JS 报错。","白屏完全可以排查，Network 和 Console 就能定位大部分问题。","CSS 没加载通常只是样式丢失，不会导致整页空白。"]},{"id":114,"t":"Vue 3 性能提升主要体现在哪些方面？","c":"Vue","o":["主要靠增大打包体积来换取速度","主要是把虚拟 DOM 换成了真实 DOM","主要是移除了响应式系统","Proxy 响应式、编译优化、更小体积"],"a":3,"w":"Vue 3 用 Proxy 重写响应式，解决了 Vue 2 无法监听新增属性和数组下标的问题；编译期做静态提升和 Patch Flag，diff 时只比对动态节点；加上 tree-shaking 友好，运行时体积更小。","b":[{"type":"p","text":"Vue 3 的性能提升不是靠单一技术，而是从编译到运行时的一整套优化组合拳。"},{"type":"p","text":"编译期优化：静态提升与补丁标记模板编译时，Vue 3 能自动分析出哪些节点是静态的，不会发生变化。这些节点在首次渲染后就被静态提升，后续更新直接复用，不进虚拟 DOM diff。同时，动态节点会打上精确的补丁标记（如 TEXT、PROPS），运行时只比对真正可能变化的部分，减少冗余比较。"},{"type":"p","text":"响应式系统重写：基于 Proxy Vue 2 用 Object.defineProperty 劫持属性，需要递归遍历对象才能监听深层变化，性能差且无法监听新增属性。Vue 3 改用 Proxy，代理整个对象，天然支持动态属性监听，还实现了懒劫持——只有被访问的嵌套属性才会做响应式处理，初始开销更低。"},{"type":"p","text":"更轻量的虚拟 DOM Vue 3 的 vnode 结构更紧凑，关键字段做了扁平化设计。配合编译期的优化信息，diff 过程能跳过大量子树，命中率更高。比如一个带 v-once 的节点，直接跳过比对。"},{"type":"p","text":"Tree-shaking 支持按需引入成为默认实践。如果你没用 v-model 或过渡动画，相关代码根本不会被打包进去。最终包体积比 Vue 2 小40% 左右，加载更快。"},{"type":"code","text":"// 编译器生成的渲染函数，静态节点被缓存\nconst render = () => {\n  pushStaticNode(staticVNode, 1)\n  return h('div', { id: 'app' }, context.msg)\n}"}],"r":["Vue 3 的产物比 Vue 2 更小，不是靠体积换速度。","Vue 3 仍然使用虚拟 DOM，只是 diff 更精准。","响应式不仅没移除，还换成了更强的 Proxy 实现。",""]},{"id":115,"t":"Pinia 与 Vuex 状态管理有什么区别？","c":"Vue","o":["Vuex 对 TypeScript 的支持优于 Pinia","Pinia 全局只能有一个 store","无 mutation，actions 同步异步都行，TS 更好","Pinia 必须通过 mutation 修改状态"],"a":2,"w":"Pinia 去掉了 mutation，actions 里同步异步都能写；天生支持 TypeScript 类型推导；可以有多个独立 store，不需要嵌套 module。是 Vue 3 官方推荐的状态管理方案。","b":[{"type":"p","text":"Pinia 最早是作为 Vue 3 的状态库设计的，后来也支持 Vue 2，它其实代表了 Vue 状态管理的一种现代化演进。"},{"type":"p","text":"1）API 设计更直观。Pinia 用 defineStore 定义 store，直接暴露 action、state 和 getters，不需要 mutations。Vuex 中 mutation 必须是同步的，action 处理异步，这种分离在实际开发中显得冗余，Pinia 直接把 action 做成统一入口。"},{"type":"p","text":"2）类型推导更友好。TypeScript 下，Pinia 几乎不需要手动声明类型，store 的类型自动 inferred，配合 IDE 能力强。Vuex 虽然也能用 TS，但需要写很多辅助代码来维持类型安全。"},{"type":"p","text":"3）模块组织更自然。Vuex 通过 modules 拆分，但命名空间容易混乱。Pinia 的每个 store 天然是独立的，按需引入，类似微应用的思路，适合大项目拆分。"},{"type":"p","text":"4）运行时轻量。Pinia 核心代码不到 3KB，没有多余抽象。Vuex 在 Vue 3 项目里反而显得重，尤其是 Composition API 普及后，它的 Options 风格显得格格不入。"},{"type":"p","text":"代码上对比："},{"type":"code","text":"// Pinia\nexport const useUserStore = defineStore('user', {\n  state: () => ({ name: 'Alice', age: 20 }),\n  actions: {\n    async fetch() { /*...*/ }\n  }\n})\n// Vuex\nconst userModule = {\n  state: () => ({ name: 'Alice' }),\n  mutations: { setName(s, n) { s.name = n } },\n  actions: { async fetch(ctx) { /*...*/ } }\n}"},{"type":"p","text":"项目里如果用 Vue 3 + TS，基本可以直接上 Pinia。老项目维护才可能继续碰 Vuex。"}],"r":["恰恰相反，Pinia 的 TS 支持明显更好。","Pinia 支持定义多个 store，按业务拆分更自然。","","Pinia 没有 mutation，直接改 state 或写 action 即可。"]},{"id":116,"t":"Vue 3 的设计目标是什么？在设计过程中做了哪些优化？","c":"Vue","o":["主要目标是继续支持 IE11","主要目标是替换掉 Webpack","完全兼容 Vue2 的所有 API 且不做任何改动","更小、更快、更好的 TS 支持与逻辑复用"],"a":3,"w":"Vue 3 的设计目标是更小、更快、更好的 TypeScript 支持和更强的逻辑复用能力：monorepo 分层、组合式 API、Proxy 响应式、编译期优化。代价是不再支持 IE11。","b":[{"type":"p","text":"Vue 3 的目标不是简单地加新功能，而是让整个框架在复杂应用下更可控、更高效。它想解决 Vue 2 在大型项目中暴露的问题，比如打包体积不可控、运行时性能瓶颈、TypeScript 支持弱，还有内部模块耦合太紧。"},{"type":"p","text":"响应式系统彻底重写，用 Proxy 替代了 Object.defineProperty 。这不只是为了监听 delete 或数组下标变化，关键是能实现按需追踪依赖。以前改一个属性，所有相关 watcher 都可能重新走一遍，现在精确到具体字段，细粒度控制明显提升。"},{"type":"p","text":"通过 createApp 返回一个上下文对象，把全局配置和应用实例解耦。你可以在同一个页面里跑多个独立的 Vue 应用了，互不干扰。这对微前端场景特别有用，比如 qiankun 里嵌套多个 Vue 子应用，各自维护自己的状态和插件体系。"},{"type":"p","text":"编译阶段做了静态提升和预字符串化。像那些永远不变的标签、属性，编译器直接提到渲染函数外面缓存住，运行时不再重复创建 VNode。静态树还会被序列化成字符串，diff 的时候直接跳过整棵子树，这种优化在长列表、复杂表单里效果很明显。"},{"type":"p","text":"Composition API 是另一个重点。它不是替代 Options API，而是为了解决逻辑复用问题。以前靠 mixins 容易命名冲突、依赖关系混乱，现在用 setup 函数配合 ref 、reactive ，可以把一块功能相关的响应式数据、方法、副作用封装在一起，类似 React Hooks 的思路，但更贴合 Vue 的响应式机制。"}],"r":["Vue 3 明确放弃了对 IE11 的支持。","构建工具是另一回事，Vue 3 和 Webpack/Vite 都能配合。","Vue 3 有破坏性变更（如过滤器移除、$listeners 合并），并非完全兼容。",""]},{"id":117,"t":"如何解决 Vue 初始化页面闪动的问题？","c":"性能优化","o":["用 v-pre 可以彻底解决闪动","只能通过不断刷新页面来解决","v-cloak 配合 CSS 隐藏未编译模板","闪动是浏览器固有行为，无法优化"],"a":2,"w":"闪动的本质是模板编译完成前，页面上短暂出现了 {{ }} 原始语法。用 v-cloak 配合 CSS 隐藏未编译内容，或用 v-text/v-html 渲染，都能避免。","b":[{"type":"p","text":"页面刚加载时，Vue 还没完成挂载，这时候用户可能会看到未编译的双大括号语法，比如 {{ message }} ，这就是所谓的“闪动”问题。根本原因是 HTML 先于 Vue 实例渲染被浏览器解析了。"},{"type":"p","text":"解决思路很直接：在 Vue 启动前，先不让这些模板内容露出来。最常用的方案是用 v-cloak 指令配合 CSS。"},{"type":"code","text":"[v-cloak] {\n  display: none;\n}"},{"type":"p","text":"然后在模板根元素加上这个指令："},{"type":"code","text":"<div id=\"app\" v-cloak>\n  {{ message }}\n<\/div>"},{"type":"p","text":"Vue 编译完成后会自动移除 v-cloak ，元素就正常显示了。整个过程用户看不到中间状态。"},{"type":"p","text":"另一种方式是提前隐藏根容器，等 mounted 钩子触发后再显示。适合需要更精细控制的场景，比如配合骨架屏。"},{"type":"code","text":"new Vue({\n  el: '#app',\n  mounted() {\n    document.getElementById('app').style.display = 'block'\n  }\n})"},{"type":"p","text":"但注意，如果项目用了 SSR，比如 Nuxt.js，服务端直出的是最终 HTML，压根不经过客户端编译，自然也不会闪。所以 SSR 本身就能规避这个问题。"},{"type":"p","text":"1）静态资源加载慢导致的白屏不是 v-cloak 能解决的，得靠懒加载、预加载、骨架屏这些手段。 2）v-cloak只对首次渲染有效，组件异步加载的闪动得用 keep-alive 或者路由级别的 loading 处理。 3）现代项目用构建工具打包后，一般 JS 加载完才挂载实例，闪动已经很少见了，真遇到优先查网络和初始化逻辑。"}],"r":["v-pre 是跳过编译，反而会让 {{ }} 一直显示。","刷新解决不了编译时序问题。","","这是可以优化的，v-cloak 就是标准方案。"]},{"id":118,"t":"Vuex 的 state、getter、mutation、action、module 分别有什么作用？","c":"Vue","o":["state 存数据，mutation 处理异步，action 做同步修改","module 用于定义全局变量","state 存数据，mutation 同步改，action 异步","getter 用于修改状态"],"a":2,"w":"state 存数据，getter 是派生状态（类似计算属性），mutation 是唯一同步修改 state 的入口，action 处理异步后提交 mutation，module 用来按业务拆分。","b":[{"type":"p","text":"Vuex 是 Vue 的状态管理库，适合中大型应用统一管理共享状态。它的设计借鉴了 Flux 和 Redux 的思想，但更贴合Vue 的响应式机制。"},{"type":"p","text":"state 存放应用的全局数据，所有组件都能读取它。你可以把它看作一个集中式的 data 选项，比如用户信息、购物车列表这类跨组件需要访问的数据就放这里。"},{"type":"p","text":"getter 类似于 Vue 的计算属性，用来从 state 中派生出一些值，比如对列表过滤、统计总数。它支持缓存，只有依赖的 state 变化时才会重新计算。"},{"type":"p","text":"mutation 是唯一能修改 state 的地方，必须是同步函数。每个 mutation 有一个字符串类型的 type，比如'INCREMENT'，通过 commit('INCREMENT') 触发。这种约定让状态变更可追踪，方便调试。"},{"type":"p","text":"action 不直接改 state，而是提交 mutation，可以包含异步操作，比如调用 API 后再 commit。通过"},{"type":"p","text":"dispatch('fetchData') 触发，适合处理副作用。"},{"type":"p","text":"module 用来分割 store，当项目变大时，可以把 store 拆成多个 module，每个 module 拥有自己的 state、getter、mutation 和 action，避免单个 store 过于臃肿。比如用户模块、订单模块各有一个子模块。"},{"type":"p","text":"整个流程就是：组件触发 action，action 提交 mutation，mutation 修改 state，state 更新驱动视图刷新。这个单向数据流让状态变化更可控。"}],"r":["说反了：mutation 同步、action 异步。","module 是模块拆分，不是定义全局变量。","","getter 只读，不负责修改状态。"]},{"id":119,"t":"如何在前端实现一个实时自动补全搜索框？","c":"场景设计","o":["防抖请求并取消旧请求，避免竞态","每输入一个字符就立即发一次请求，不需要处理竞态","用 setInterval 定时轮询接口","必须使用 WebSocke
